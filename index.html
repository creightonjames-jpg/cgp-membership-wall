  background: var(--input); border-left: 3px solid var(--danger);
  border-radius: 6px; font-size: 12px; color: var(--cream);
}

.vt-drop .tf__row { margin-top: 8px; }

/* ------------------------------------------------------------ club picker */
.vt-search { margin: 0 0 14px; }
.vt-search .tf__in { font-size: 16px; }   /* 16px or iOS zooms the page on focus */

.vt-group {
  margin: 14px 0 8px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--mute);
}

.vt-group:first-child { margin-top: 0; }

.vt-clublist { display: flex; flex-direction: column; gap: 8px; }

/* Same warm chrome as the pills, shaped as a full width row because 31 names
   in a wrapped pill cloud is a wall of text on a phone. */
.vt-club {
  width: 100%; text-align: left;
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 10px;
  padding: 11px 13px; color: var(--cream);
  font-family: inherit; font-size: 15px; cursor: pointer;
}

.vt-club:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.vt-club__n { flex: 1 1 auto; min-width: 0; }
.vt-club__have { flex: 0 0 auto; font-size: 12px; color: var(--gold); }

.vt-chosen {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin: 0 0 16px;
}

.vt-chosen__n { flex: 1 1 auto; margin: 0; font-size: clamp(20px, 6vw, 26px); }

/* -------------------------------------------------------------- zoom view */
/* Fixed overlay, not an inner scroll container, so the no-fixed-height rule is
   intact. The stage does not scroll at all: touch-action none hands every
   gesture to the pinch handler instead of to the browser. */
.vt-zoom {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(10, 9, 12, 0.95);
  display: flex; flex-direction: column;
  overscroll-behavior: none;
}

.vt-zoom__bar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r))
           10px calc(12px + var(--safe-l));
  background: rgba(23, 22, 26, 0.94);
  border-bottom: 1px solid var(--warm-edge);
}

.vt-zoom__t {
  flex: 1 1 140px; min-width: 0; margin: 0;
  font-size: 13px; color: var(--dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.vt-zoom__bar a.btn {
  display: inline-flex; align-items: center; text-decoration: none;
}

.vt-zoom__stage {
  flex: 1 1 auto; min-height: 0;
  overflow: hidden;
  display: grid; place-items: center;
  padding: 10px;
  touch-action: none;
}

.vt-zoom__inner { width: min(94vw, 960px); }

.vt-zoom__inner .vt-svg svg, .vt-zoom__inner img {
  display: block; width: 100%; height: auto;
  border-radius: 8px; background: var(--riser);
}

.vt-zoom__foot {
  flex: 0 0 auto; margin: 0;
  padding: 8px calc(12px + var(--safe-r)) calc(10px + var(--safe-b))
           calc(12px + var(--safe-l));
  font-size: 11px; color: var(--mute); text-align: center;
}

/* ==========================================================================
   THE VAULT ON A LAPTOP
   Jim reviews on a laptop, so the section nav becomes a real rail rather than a
   swipe strip with no touchscreen behind it. minmax(0,1fr) on the body column,
   or a 380px wide SVG at width:100% blows the grid out.
   ========================================================================== */
@media (min-width: 700px) {
  .vt {
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr);
    gap: 24px; align-items: start;
  }

  .vt-nav__scroll {
    flex-direction: column; gap: 7px;
    overflow-x: visible; margin: 0; padding: 0;
  }

  .vt-nav .tab {
    width: 100%; justify-content: flex-start;
    white-space: normal; text-align: left;
    border-radius: 10px; font-size: 13px;
  }

  .vt-cards { gap: 20px; }
  figure.vt-card { padding: 18px; }
  .vt-locked { padding: 34px 24px; }
}

/* ==========================================================================
   T1.4 SOUNDCHECK
   Q and A. Every selector is .sc- prefixed so it cannot collide with another
   tab's work. No new motif and no thirteenth palette token: the cards are the
   T0.4 ticket stub with the tear-off as the upvote button, and every colour
   here is mixed from the twelve through the same --warm-fill, --warm-edge and
   --gold-rule dials the tab bar uses.
   ========================================================================== */

/* --------------------------------------------------------- ask panel */
.sc-ask { padding: 15px 16px; margin: 0 0 18px; }

.sc-ask__h { margin: 0 0 5px; font-size: clamp(18px, 5.2vw, 22px); }
.sc-ask__p { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
.sc-ask__note { margin: 10px 0 0; font-size: 12px; color: var(--mute); }
.sc-ask__ok { margin: 10px 0 0; font-size: 13px; color: var(--gold); }
.sc-ask__err { margin: 10px 0 0; font-size: 13px; color: var(--danger); }

/* Name and club sit side by side on anything wider than a small phone and
   stack below it, without a media query. */
.sc-two { display: flex; flex-wrap: wrap; gap: 8px; }
.sc-two > .tf__l { flex: 1 1 150px; min-width: 0; }

.sc-body { min-height: 96px; line-height: 1.45; resize: vertical; }
.sc-count { margin: 5px 0 0; font-size: 11px; color: var(--mute); text-align: right; }

/* Native select chrome is left alone so each platform draws its own caret.
   The option list is forced dark, because some Androids render inherited
   cream on a white system menu. */
.sc-select { padding-right: 10px; }
.sc-select option { background: var(--riser); color: var(--cream); }

/* ------------------------------------------------------------- pills */
/* Same warm chrome language as the tab bar and the day pills, one notch
   quieter, because the tab bar stays the loudest control on the page. */
.sc-rows { display: flex; flex-direction: column; gap: 9px; margin: 0 0 14px; }

.sc-pills {
  display: flex; flex-wrap: wrap; gap: 7px;
  align-items: center;
}

.sc-pills__k {
  flex: 0 0 auto;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--mute);
  margin-right: 2px;
}

.sc-pill {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 7px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 999px; padding: 7px 13px;
  color: var(--cream); font-family: inherit; font-size: 13px; font-weight: 500;
  white-space: nowrap; cursor: pointer;
  transition: background-image 120ms ease, border-color 120ms ease;
}

.sc-pill:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.sc-pill[aria-pressed="true"] {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  font-weight: 600;
  box-shadow: 0 0 0 1px rgba(217,169,76,0.22), 0 3px 12px rgba(200,16,46,0.34);
}

/* Gold badge with dark text, same call as the tab bar count: a scarlet badge
   on a now scarlet selected pill would be invisible. */
.sc-pill__n {
  background: var(--gold); color: #2A1408;
  border-radius: 999px; min-width: 18px; padding: 0 5px;
  font-size: 11px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums;
}

.sc-tally { margin: 0 0 14px; font-size: 12px; color: var(--mute); }

/* -------------------------------------------------------- crew strip */
/* Same treatment as .enc__crew, so crew tools read the same on every tab. */
.sc-crew {
  margin: 0 0 16px; padding: 12px 13px;
  background: var(--input); border-left: 3px solid var(--scarlet);
  border-radius: 6px;
}

/* ------------------------------------------------------ question cards */
.sc-list { display: flex; flex-direction: column; gap: 16px; }

.sc-card { --ticket-stub-w: 68px; }

/* Pinned rides the top and says so with a gold ring rather than a second
   border colour fighting the ticket. */
.ticket.sc-card--pin {
  border-color: var(--gold-rule);
  box-shadow: 0 0 0 1px rgba(217,169,76,0.20);
}

.ticket.sc-card--pin .ticket__stub { border-right-color: var(--gold-rule); }

/* Tighter than the default stub, because the whole tear-off is a button. */
.sc-stub { padding: 9px 7px; }

.sc-vote {
  width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 4px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 8px;
  color: var(--cream); font-family: inherit; cursor: pointer;
}

.sc-vote:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.sc-vote__i { font-size: 13px; line-height: 1; }
.sc-vote__n { font-size: 17px; font-weight: 700; line-height: 1; }

/* Cast. Scarlet and locked. */
.sc-vote.is-cast {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  cursor: default;
}

.sc-vote:disabled { cursor: default; }
.sc-vote:disabled:not(.is-cast) { opacity: 0.55; }
.sc-vote:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.sc-q { margin: 0; font-size: 16px; line-height: 1.42; overflow-wrap: anywhere; }

.sc-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin: 10px 0 0; font-size: 12px; color: var(--dim);
}

.sc-who { color: var(--cream); font-weight: 600; }
.sc-time { color: var(--mute); }

.sc-tag {
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 2px 9px; font-size: 11px; color: var(--gold);
}

.sc-flag {
  border: 1px solid var(--gold-rule); border-radius: 999px;
  padding: 2px 9px; font-size: 11px; font-weight: 600; color: var(--gold);
}

.sc-admin { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }

/* ==========================================================================
   DISPLAY MODE. The projector variant.
   The only place a viewport locked height is allowed, per CLAUDE.md. This is
   what the regional team keeps open on a second screen, so type is sized to be
   read from the back of a ballroom and the list walks itself.
   ========================================================================== */

.sc-dhead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; }

.sc-dcount {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: clamp(14px, 1.6vw, 22px); color: var(--gold);
}

.sc-dsub {
  margin: 4px 0 18px;
  font-size: clamp(14px, 1.4vw, 20px); color: var(--dim);
}

.sc-dempty { margin: 0; font-size: clamp(20px, 2.2vw, 32px); color: var(--dim); }

/* Height comes in as --sc-h, measured against the real viewport in JS, so the
   wall fills the screen exactly once and the page itself never scrolls. */
.sc-wall {
  position: relative;
  height: var(--sc-h, 70svh);
  overflow: hidden;
}

.sc-wall__copy {
  display: flex; flex-direction: column; gap: 22px;
  padding-bottom: 22px;   /* held identical in both copies, so -50% is seamless */
}

.sc-wall__track {
  animation-name: sc-roll;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  /* duration is set inline from the measured height, at a fixed px per second */
}

/* Content fits the screen. No duplicate, no motion, no fade. */
.sc-wall--still { height: auto; }
.sc-wall--still .sc-wall__track { animation: none; }

/* Reading one question while the wall moves. Not an input control. */
.sc-wall:hover .sc-wall__track { animation-play-state: paused; }

/* A card cut off at the bottom edge should read as more to come. */
.sc-wall:not(.sc-wall--still)::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0; height: 74px;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(23,22,26,0) 0%, var(--stage) 92%);
}

@keyframes sc-roll {
  from { transform: translateY(0); }
  to   { transform: translateY(-50%); }   /* content is duplicated once */
}

/* The projector is a laptop or a screen, but Display Mode is a header button
   and somebody will press it on a phone. At 380px a 128px stub is a third of
   the screen given to a vote count, so it starts narrow and widens with the
   viewport. */
.sc-big { --ticket-stub-w: 92px; }

.sc-big .ticket__body { padding: 16px 18px; }

.sc-bignum {
  font-family: var(--font-display);
  font-size: clamp(34px, 4vw, 62px); line-height: 1; color: var(--gold);
}

.sc-biglab {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: clamp(10px, 1vw, 14px); letter-spacing: 0.16em; color: var(--dim);
}

.sc-bigq {
  margin: 0; font-weight: 600;
  font-size: clamp(22px, 2.6vw, 40px); line-height: 1.24;
  overflow-wrap: anywhere;
}

.sc-bigmeta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
  margin: 12px 0 0; font-size: clamp(13px, 1.2vw, 20px); color: var(--dim);
}

.sc-bigtag {
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 3px 12px; color: var(--gold);
  font-size: clamp(12px, 1.1vw, 18px);
}

/* A wall that walks up the screen on its own is exactly the thing to switch
   off for anyone who asked for less motion. Killing the animation alone would
   clip the list inside a locked height, so the height goes with it and the
   page scrolls by hand instead. */
@media (prefers-reduced-motion: reduce) {
  .sc-wall { height: auto; }
  .sc-wall__track { animation: none; }
  .sc-wall__copy[aria-hidden="true"] { display: none; }
  .sc-wall:not(.sc-wall--still)::after { display: none; }
}

/* ------------------------------------------------------ desktop and laptop */
/* Jim reviews on a laptop. The reading column is already capped by .sheet, so
   this is only about the cards not looking like stretched phone cards. */
@media (min-width: 700px) {
  .sc-card { --ticket-stub-w: 80px; }
  .sc-q { font-size: 17px; }
  .sc-ask { padding: 18px 20px; }
  .sc-vote__n { font-size: 19px; }

  /* Room for the vote number to be the second thing you read from the back of
     the room, after the question itself. */
  .sc-big { --ticket-stub-w: 128px; }
  .sc-big .ticket__body { padding: 20px 24px; }
}

/* ==========================================================================
   T1.5 LINER NOTES
   The takeaways board. No new motifs and no new palette token. Cards are
   .glow-card, chips are mixed from the same warm dials as the tab bar, the
   filter pills are the .daypill from T1.1, and the form is the .tf pattern
   the Encore tenure form already uses.
   ========================================================================== */

/* ------------------------------------------------------------ post panel */
.ln-post { padding: 16px 16px 18px; margin: 0 0 18px; }

.ln-post__h { margin: 0 0 5px; font-size: clamp(18px, 5.4vw, 22px); }

.ln-post__note { margin: 0; font-size: 13px; color: var(--dim); }

/* The tag the post will carry. Read only, because the date decides it. */
.ln-post__tagline {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 12px 0 0;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--dim);
}

/* Name and club side by side as soon as there is room for them. */
.ln-two { display: flex; flex-wrap: wrap; gap: 0 9px; }
.ln-two > .tf__l { flex: 1 1 150px; min-width: 0; }

.ln-ta { min-height: 104px; resize: vertical; line-height: 1.45; }

.ln-post__go { margin-top: 12px; }

.ln-left { margin: 6px 0 0; font-size: 11px; color: var(--mute); text-align: right; }
.ln-left--low { color: var(--gold); }

.ln-said { margin: 11px 0 0; font-size: 13px; color: var(--gold); }
.ln-said--bad { color: var(--danger); }

.ln-off { margin: 11px 0 0; font-size: 13px; color: var(--dim); }

/* --------------------------------------------------------- export panel */
/* Crew only. Reuses .adminbar so it reads as chrome rather than content. */
.ln-tools { margin: 0 0 18px; }
.ln-tools__row { margin-top: 11px; }

/* ---------------------------------------------------------------- board */
.ln-tally {
  margin: 0 0 12px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--dim);
}

.ln-list { display: flex; flex-direction: column; gap: 14px; }

.ln-card { padding: 14px 16px 15px; }

/* Pinned. The border eats 2px, so the padding gives it back and the text on a
   pinned card lines up with the text on every other card. */
.ln-card--pin { border-left: 3px solid var(--scarlet); padding-left: 14px; }

.ln-card__top {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 0 9px;
}

/* Day tag. Same warm chip as .soon, gold text, one notch quieter than a pill. */
.ln-tag {
  display: inline-flex; align-items: center;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 3px 9px; color: var(--gold);
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em;
}

/* Pinned chip. Scarlet gradient with a gold hairline, the same poster move as
   ON AIR, standing still. Nothing on this tab needs to throb. */
.ln-pin {
  display: inline-flex; align-items: center;
  background-image: var(--grad-primary);
  border: 1px solid var(--gold-rule); border-radius: 999px;
  padding: 3px 10px; color: var(--cream);
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em;
}

.ln-when { margin-left: auto; font-size: 12px; color: var(--mute); }

/* pre-wrap keeps the line breaks somebody typed. overflow-wrap stops one long
   unbroken string pushing the card past the viewport. */
.ln-text {
  margin: 0; font-size: 16px; line-height: 1.45;
  white-space: pre-wrap; overflow-wrap: anywhere;
}

.ln-who { margin: 9px 0 0; font-size: 13px; color: var(--dim); }
.ln-who--none { color: var(--mute); }

.ln-admin { margin-top: 11px; }

/* --------------------------------------------------- projector behaviour */
/* Display Mode is a global toggle, so this tab can land on a projector whether
   or not it asked to. Inputs and crew controls go, the words get bigger. */
body.display-mode .ln-post,
body.display-mode .ln-tools,
body.display-mode .ln-admin,
body.display-mode .ln-tally { display: none; }

body.display-mode .ln-list { gap: 20px; }
body.display-mode .ln-card { padding: 20px 24px 22px; }
body.display-mode .ln-card--pin { padding-left: 22px; }
body.display-mode .ln-text { font-size: clamp(22px, 3vw, 34px); line-height: 1.32; }
body.display-mode .ln-who { font-size: 17px; margin-top: 12px; }
body.display-mode .ln-when { font-size: 15px; }

@media (min-width: 700px) {
  .ln-post { padding: 18px 20px 20px; }
  .ln-card { padding: 16px 20px 18px; }
  .ln-card--pin { padding-left: 18px; }
  .ln-text { font-size: 17px; }
}

/* ==========================================================================
   T1.3 THE BAND. Spec 3.2.
   The roster grid, the search field, the filter pills, and the one-person
   view. No new motifs: the FIRST TOUR badge is T0.4's .pick, the card texture
   is .grille, the one-person panel is .glow-card, the filter pills are the
   same .dayrow and .daypill The Setlist uses, the count badge is .tab__badge,
   and the field and button patterns are .tf__in and .btn. Everything below is
   layout, prefixed .bnd- so it cannot collide with another tab's work.
   ========================================================================== */

/* ------------------------------------------------------- the count line */
.bnd-count { margin: 0 0 14px; font-size: 15px; color: var(--cream); }
.bnd-count__n { color: var(--gold); font-weight: 700; }

/* ------------------------------------------------------------- search */
.bnd-find { margin: 0 0 14px; }
.bnd-find .tf__l { margin-bottom: 6px; }
.bnd-find__row { display: flex; gap: 8px; align-items: stretch; }
/* min-width:0 so a long placeholder cannot push the row wider than the phone. */
.bnd-find__row .tf__in { flex: 1 1 auto; min-width: 0; }
.bnd-find__row .btn { flex: 0 0 auto; }

/* Safari draws its own clear and cancel affordances on a search input. Both
   fight the field chrome, and the Clear button next to it does the same job on
   every platform rather than on one. */
.bnd-find__row .tf__in::-webkit-search-decoration,
.bnd-find__row .tf__in::-webkit-search-cancel-button { -webkit-appearance: none; }

.bnd-pills { margin-bottom: 14px; }
.bnd-note { margin: 0 0 14px; font-size: 12px; color: var(--mute); }

/* T3.1. Club and region are selects rather than pills. 29 clubs is about
   1400px of pills, which is four swipes on a 380px phone to reach Wynstone, and
   a native select hands the list to the phone's own picker. That picker scrolls
   itself, so nothing in the page needs a scroll container to hold it, which is
   the rule in CLAUDE.md. Appearance is left alone on purpose: the platform
   draws its own caret and there is no thirteenth colour to invent for one. */
.bnd-picks {
  display: grid; grid-template-columns: 1fr; gap: 10px; margin: 0 0 14px;
}
.bnd-picks .tf__l { margin: 0; min-width: 0; }
.bnd-picks select.tf__in { max-width: 100%; }

/* Firebase is unreachable, so the crew's corrections are not on this phone. */
.bnd-stale {
  margin: 0 0 14px; padding: 10px 12px;
  background: var(--riser); border: 1px solid var(--gold-rule);
  border-radius: 8px; color: var(--dim); font-size: 13px;
}

@media (min-width: 700px) {
  .bnd-picks { grid-template-columns: 1fr 1fr; gap: 14px; }
}

/* --------------------------------------------------------------- grid */
/* auto-fill rather than a fixed column count, so the grid reflows on its own
   from a 380px phone up to the reading column with no breakpoint doing the
   work. 138px still holds two columns at 320px, which is the narrowest phone
   that will be in the room. */
.bnd-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
  gap: 10px;
}

/* ------------------------------------------------------- club groups */
/* Lisa asked for club order rather than alphabetical, so the grid is broken
   into one section per club with a heading. No new motif: Anton in caps like
   every other heading, and the same gold count badge the tab bar and the filter
   pills already use.

   Not sticky and no scroll container. Twenty seven headings down a phone is a
   long page and that is correct, because the club select is the shortcut for
   anybody who does not want to scroll.

   The rule sits under the heading rather than around it, so a two line club
   name on a 320px screen still reads as one label. */
.bnd-group { margin: 0 0 6px; }
.bnd-group + .bnd-group { margin-top: 22px; }

.bnd-group__h {
  display: flex; align-items: baseline; gap: 8px;
  margin: 0 0 10px; padding-bottom: 6px;
  font-size: 16px; line-height: 1.15; letter-spacing: 0.02em;
  color: var(--cream);
  border-bottom: 1px solid var(--gold-rule);
}

.bnd-group__n { min-width: 0; overflow-wrap: break-word; }

/* The whole card is the toggle, so it is a button. Everything inside it is a
   span for the same reason The Setlist's ticket is: a button may not hold a p
   or a div.
   The flex column is not decoration. A grid item stretches to the tallest card
   in its row, and a stretched button centres its own contents vertically, so
   the shorter cards floated their headshot 18px down the card and the row
   stopped lining up. An explicit column pins everything to the top. */
.bnd-card {
  display: flex; flex-direction: column; align-items: stretch;
  justify-content: flex-start;
  width: 100%; margin: 0; padding: 0 0 12px;
  font: inherit; color: inherit; text-align: left;
  background: var(--riser);
  border: 1px solid var(--edge); border-radius: 12px;
  -webkit-appearance: none; appearance: none;
  cursor: pointer;
}

.bnd-card:active { border-color: var(--warm-edge); }
.bnd-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.bnd-card__b { display: block; padding: 10px 12px 0; min-width: 0; }

.bnd-card__n {
  display: block; font-size: 14px; font-weight: 600; line-height: 1.25;
  overflow-wrap: break-word;
}

/* Club sits brighter than title. The club is how people find each other. */
.bnd-card__t {
  display: block; margin-top: 3px; font-size: 12px; line-height: 1.3;
  color: var(--mute); overflow-wrap: break-word;
}

.bnd-card__c {
  display: block; margin-top: 3px; font-size: 12px; line-height: 1.3;
  color: var(--dim); overflow-wrap: break-word;
}

/* ---------------------------------------------------------- the headshot */
/* No overflow:hidden here. It would clip the pick badge. The radius lives on
   the image itself instead, the same reasoning as the notches on .ticket. */
.bnd-shot { display: block; position: relative; flex: 0 0 auto; }

.bnd-shot__img {
  display: block; width: 100%; aspect-ratio: 1;
  object-fit: cover; border: 0;
  border-radius: 11px 11px 0 0;
  background: var(--input);
}

/* Stands in for a missing headshot. A roster entry with no photo is a real
   case, and today every record in the file is one, so this is built to look
   deliberate rather than broken: initials on the amp grille, no icon, no
   apology. It also catches a photo path that 404s, which is the same hole. */
.bnd-shot__init { display: grid; place-items: center; }

.bnd-shot__ini {
  font-size: clamp(24px, 8vw, 38px); line-height: 1;
  color: var(--mute); letter-spacing: 0.04em;
}

/* FIRST TOUR. The middle of the three pick sizes in motifs.html, 52px with 9px
   text, which is the one that still reads in a grid cell. Bottom left, because
   a 400x400 headshot puts a shoulder there and a face in the middle. */
.bnd-pick {
  position: absolute; left: 6px; bottom: 6px;
  width: 52px; z-index: 2;
  filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.60));
}

.bnd-pick .pick__text { font-size: 9px; }

/* ------------------------------------------------------------ one person */
/* The larger view replaces the grid instead of floating over it. No overlay,
   no fixed height, nothing that traps scroll, and it reflows at every width
   for free. Leaving it puts you back where you were in the grid. */
.bnd-back { margin: 0 0 14px; }
.bnd-detail__card { padding: 16px; }
.bnd-detail__grid { display: flex; flex-direction: column; gap: 14px; }
.bnd-detail__shot { width: 100%; max-width: 170px; }
.bnd-detail__b { min-width: 0; }
.bnd-detail__n { margin: 0 0 12px; font-size: clamp(24px, 7.4vw, 34px); }

/* .set-dl is The Setlist's label and value grid, reused as is. Bigger type
   here, because the whole point of this view is the full title and the full
   club name. .set-dl dt sets its own size, so only the values grow. */
.bnd-dl { font-size: 15px; }

.bnd-detail__first { margin: 12px 0 0; font-size: 13px; color: var(--gold); }

.bnd-shot--big .bnd-shot__img { border-radius: 12px; }
.bnd-shot--big .bnd-pick { width: 62px; left: 8px; bottom: 8px; }
.bnd-shot--big .bnd-pick .pick__text { font-size: 10px; }

@media (min-width: 700px) {
  /* Wider cells inside the 780px reading column. Five 148px columns read as a
     contact sheet, four 176px ones read as a lineup. */
  .bnd-grid { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
  .bnd-card__n { font-size: 15px; }
  .bnd-group + .bnd-group { margin-top: 28px; }
  .bnd-group__h { font-size: 19px; }

  .bnd-detail__card { padding: 20px; }
  .bnd-detail__grid { flex-direction: row; align-items: flex-start; gap: 22px; }
  .bnd-detail__shot { flex: 0 0 200px; max-width: 200px; }
  .bnd-detail__b { flex: 1 1 auto; }
}
/* ==========================================================================
   T2.4 CROWD VOTE
   Poll cards, option buttons, result bars, a drag-to-order list, and a word
   cloud. No new motifs and no thirteenth palette token: bars and cloud words
   are mixed from the same twelve tokens and the same warm-fill dials the tab
   bar uses.

   Two dials live on .cv-card, --cv-bar-min and --cv-cloud-base. Display Mode
   retunes those two and every bar, every option button and every word in the
   cloud follows, so the projector view is one override rather than a second
   set of rules.
   ========================================================================== */

.cv-list { display: flex; flex-direction: column; gap: 16px; }

.cv-card {
  padding: 15px 16px 16px;
  --cv-bar-min: 44px;      /* touch target floor for a bar or an option */
  --cv-cloud-base: 16px;   /* the cloud sizes itself in em against this */
}

/* A poll nobody has put on air yet. Dashed, the same way The Setlist marks a
   card the agenda has not filled in. Crew only, so the room never sees it. */
.cv-card--staged { border-style: dashed; }

.cv-head {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin: 0 0 9px;
}

.cv-kicker {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--dim);
}

.cv-flag {
  display: inline-flex; align-items: center; gap: 6px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; font-weight: 600; color: var(--dim);
}

.cv-flag--staged { color: var(--gold); border-color: var(--gold-rule); }

.cv-q { margin: 0 0 13px; font-size: clamp(19px, 5.6vw, 25px); }

/* ------------------------------------------------------- option buttons */
/* Full width, one per row, at the flier's warm chrome. A tapped option turns
   into the scarlet gradient with a gold rule, which is the same lit-pill move
   the tab bar and the day pills already make. */
.cv-opts { display: flex; flex-direction: column; gap: 9px; }

.cv-opt {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  min-height: var(--cv-bar-min);
  padding: 13px 15px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 10px;
  color: var(--cream); font-family: inherit; font-size: 15px; font-weight: 500;
  cursor: pointer;
}

.cv-opt:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.cv-opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* Same row, no longer a control. Used once a knowledge check is locked in and
   the split is still under wraps. */
.cv-opt--flat { cursor: default; }

.cv-opt--mine {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  font-weight: 600;
}

.cv-opt__tick { flex: 0 0 auto; color: var(--gold); font-size: 15px; line-height: 1; }
.cv-opt__t { min-width: 0; overflow-wrap: anywhere; }

/* ---------------------------------------------------------- result bars */
.cv-res { display: flex; flex-direction: column; gap: 9px; }

.cv-bar {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  min-height: var(--cv-bar-min);
  padding: 10px 13px;
  background: var(--input);
  border: 1px solid var(--edge); border-radius: 10px;
}

.cv-bar__fill {
  position: absolute; left: 0; top: 0; bottom: 0; z-index: 0;
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
  border-right: 1px solid var(--warm-edge);
  transition: width 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
}

.cv-bar__lab, .cv-bar__n { position: relative; z-index: 1; }

.cv-bar__lab {
  flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere;
  display: flex; align-items: baseline; gap: 7px;
  font-size: 15px;
}

.cv-bar__n { flex: 0 0 auto; font-size: 13px; color: var(--dim); }
.cv-bar__mark { flex: 0 0 auto; color: var(--gold); font-size: 13px; line-height: 1.3; }

/* The bar this device voted for. Scarlet fill, gold rule, checkmark. */
.cv-bar--mine { border-color: var(--gold); }
.cv-bar--mine .cv-bar__fill {
  background-image: var(--grad-primary);
  border-right-color: var(--gold);
}
.cv-bar--mine .cv-bar__lab { font-weight: 600; }

/* The right answer on a closed knowledge check. */
.cv-bar--right { box-shadow: inset 0 0 0 1px var(--gold-rule); border-color: var(--gold); }

/* A bar growing from 0 to 74% is the one animation in here worth switching off
   for anyone who asked for less motion. It still reads standing still. */
@media (prefers-reduced-motion: reduce) {
  .cv-bar__fill { transition: none; }
}

/* ------------------------------------------------------------- ranking */
.cv-rank {
  list-style: none; margin: 0 0 12px; padding: 0;
  display: flex; flex-direction: column; gap: 9px;
}

.cv-rank--dragging { -webkit-user-select: none; user-select: none; }

.cv-rank__row {
  display: flex; align-items: center; gap: 9px;
  min-height: var(--cv-bar-min);
  padding: 8px 9px 8px 12px;
  background: var(--input);
  border: 1px solid var(--warm-edge); border-radius: 10px;
}

/* The row under the finger. Lifts off the stack and follows the drag, while
   the list reorders underneath it. */
.cv-rank__row.is-lifted {
  position: relative; z-index: 2;
  transform: translateY(var(--cv-dy, 0px));
  border-color: var(--gold);
  box-shadow: 0 8px 20px rgba(10, 9, 12, 0.55);
}

.cv-rank__pos {
  flex: 0 0 auto; width: 22px; text-align: center;
  font-family: var(--font-display); font-size: 17px; color: var(--gold);
}

.cv-rank__t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.cv-rank__ctl { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; }

/* touch-action: none is the whole reason drag works on a phone. Without it the
   browser claims the gesture as a scroll and the row never moves. */
.cv-grip {
  flex: 0 0 auto;
  width: 38px; min-height: 38px; padding: 0;
  display: grid; place-items: center;
  background: transparent;
  border: 1px solid var(--edge); border-radius: 8px;
  color: var(--dim); font-size: 15px; line-height: 1;
  cursor: grab; touch-action: none;
}

.cv-grip:active { cursor: grabbing; color: var(--cream); border-color: var(--warm-edge); }
.cv-grip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Up and down, for anyone who does not get on with dragging. */
.cv-nudge { width: 34px; min-height: 34px; padding: 0; font-size: 12px; }

/* ---------------------------------------------------------- word cloud */
/* Every word sizes itself in em against --cv-cloud-base, so the projector gets
   the whole cloud bigger from one variable. Anton, all caps, because a cloud of
   single words is a poster and this is the one place that reads as one. */
.cv-cloud {
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 5px 14px; margin: 12px 0 0; padding: 2px 0;
  font-size: var(--cv-cloud-base);
}

.cv-word {
  font-family: var(--font-display); text-transform: uppercase;
  line-height: 1.04; letter-spacing: 0.01em; color: var(--dim);
}

.cv-word--warm { color: var(--cream); }
.cv-word--hot  { color: var(--gold); }

.cv-word--mine {
  text-decoration: underline;
  text-decoration-color: var(--scarlet);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}

.cv-word__n {
  font-family: var(--font-body); font-size: 0.4em; font-weight: 600;
  color: var(--mute); margin-left: 4px; vertical-align: super;
}

/* ------------------------------------------------------- notes and foot */
.cv-foot {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 13px 0 0; font-size: 13px; color: var(--dim);
}

.cv-count { color: var(--cream); font-weight: 600; }

.cv-note { margin: 11px 0 0; font-size: 13px; color: var(--dim); }
.cv-note strong { color: var(--cream); }
.cv-err { margin: 9px 0 0; font-size: 13px; color: var(--danger); }

/* The correct versus incorrect line on a closed knowledge check. */
.cv-score { margin: 13px 0 0; font-size: 15px; }

.cv-score__k {
  display: block; margin-bottom: 3px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.cv-score__n { font-weight: 600; color: var(--cream); }

/* ---------------------------------------------------------------- crew */
/* Same treatment as the Encore crew block: --input with a scarlet left border,
   so "this is a control panel, not content" reads the same in both tabs. */
.cv-crew {
  margin: 13px 0 0; padding: 12px 13px;
  background: var(--input);
  border-left: 3px solid var(--scarlet); border-radius: 6px;
}

.cv-crew__k {
  margin: 0 0 9px;
  font-family: var(--font-display); font-size: 10px;
  letter-spacing: 0.14em; color: var(--scarlet);
}

.cv-crew .cv-res { margin-top: 9px; }
.cv-crew .tf__row { margin-top: 11px; }

.cv-new { margin: 0 0 18px; padding: 15px 16px; }
.cv-new__h { margin: 0 0 4px; font-size: clamp(18px, 5vw, 22px); }
.cv-new__hint { margin: 0; font-size: 12px; color: var(--mute); }
.cv-ta { min-height: 96px; resize: vertical; line-height: 1.4; }

/* The starter library out of data/polls.json. */
.cv-libl {
  list-style: none; margin: 11px 0 0; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
}

.cv-lib {
  display: block; width: 100%; text-align: left;
  padding: 10px 12px;
  background: var(--riser);
  border: 1px solid var(--edge); border-radius: 9px;
  color: var(--cream); font-family: inherit; font-size: 14px; cursor: pointer;
}

.cv-lib:active { border-color: var(--warm-edge); }

.cv-lib__k {
  display: block; margin-bottom: 3px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

/* ------------------------------------------------------- display mode */
/* The projector view. Two dials and three type sizes. Crew controls go away
   entirely: Display Mode is the room's screen, and a knowledge check's right
   answer sits in the crew block. */
body.display-mode .cv-card { --cv-bar-min: 58px; --cv-cloud-base: 30px; }
body.display-mode .cv-q { font-size: clamp(28px, 4.6vw, 48px); }
body.display-mode .cv-opt,
body.display-mode .cv-bar__lab,
body.display-mode .cv-rank__t { font-size: 20px; }
body.display-mode .cv-bar__n { font-size: 17px; }
body.display-mode .cv-foot { font-size: 16px; }
body.display-mode .cv-score { font-size: 22px; }
body.display-mode .cv-crew,
body.display-mode .cv-new { display: none; }

/* ------------------------------------------------------------- desktop */
@media (min-width: 700px) {
  .cv-card { padding: 18px 20px 20px; --cv-bar-min: 48px; }
  .cv-q { font-size: clamp(23px, 2.6vw, 28px); }
  .cv-opt, .cv-bar__lab, .cv-rank__t { font-size: 16px; }
  .cv-new { padding: 18px 20px; }
}
/* ==========================================================================
   T2.5 THE PIT
   No new motifs. The upload panel is glow-card plus grille, the fields are the
   tf pattern, every button is .btn, and the club filter reuses .dayrow and
   .daypill from The Setlist so the two tabs read as one wall. Everything below
   is layout and chrome mixed from the same dials the tab bar uses, so the
   palette is still twelve tokens.
   ========================================================================== */

/* --------------------------------------------------------- upload panel */
.pit-panel { padding: 15px 16px 17px; margin: 0 0 18px; }
.pit-panel__h { margin: 0 0 12px; font-size: clamp(17px, 4.8vw, 21px); }
.pit-hint { margin: 13px 0 0; font-size: 12px; color: var(--mute); }

/* The picker is a label wrapping a file input, because a label is the one
   control that opens the picker on every phone that will be in the room. The
   input is stretched over the label at zero opacity, so the tap lands on the
   input itself rather than relying on a scripted click. */
.pit-pick {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer;
}

.pit-pick.is-off { opacity: 0.55; cursor: default; }

.pit-pick__in {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  opacity: 0; cursor: pointer;
}

.pit-pick:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }

/* --------------------------------------------------------- staged photo */
/* Compressed, sized, and shown before it goes anywhere. The size line is how
   anybody checks the 4MB claim without opening dev tools. */
.pit-stage { margin: 13px 0 0; }

.pit-stage__img {
  display: block; width: 100%; max-width: 280px;
  height: auto; max-height: 220px; object-fit: contain;
  background: var(--input);
  border: 1px solid var(--edge); border-radius: 8px;
}

.pit-stage__meta { margin: 9px 0 11px; font-size: 12px; color: var(--dim); }

.pit-msg { margin: 12px 0 0; font-size: 13px; color: var(--gold); }
.pit-msg--bad { color: var(--danger); }
.pit-note { margin: 0 0 12px; font-size: 12px; color: var(--dim); }

/* ---------------------------------------------------------------- grid */
/* Square thumbnails, newest first, caption and attribution under each one.
   auto-fill rather than a fixed count, so 380px gets two columns and the
   reading column on a laptop gets four. No fixed heights anywhere, the grid
   flows with the page. */
.pit-grid {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}

.pit-cell { min-width: 0; }

.pit-shot { position: relative; }

/* The square is the button. The like button sits over it as a sibling, because
   a button cannot hold another button. */
.pit-shot__hit {
  display: block; width: 100%; aspect-ratio: 1; padding: 0;
  background: var(--input);
  border: 1px solid var(--edge); border-radius: 10px;
  overflow: hidden; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}

.pit-shot__hit:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.pit-shot__img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* Lit state is the scarlet gradient with a gold ring, the same two states the
   tab bar and the day pills use. */
.pit-like {
  display: inline-flex; align-items: center; gap: 6px;
  background-color: rgba(23, 22, 26, 0.74);
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 7px 12px;
  color: var(--dim); font-family: inherit; font-size: 13px;
  cursor: pointer;
}

.pit-shot .pit-like { position: absolute; right: 7px; bottom: 7px; }

.pit-like.is-on {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  color: var(--cream);
}

.pit-like__h { font-size: 14px; line-height: 1; color: var(--dim); }
.pit-like.is-on .pit-like__h { color: var(--cream); }
.pit-like__n { font-size: 12px; font-weight: 600; min-width: 1ch; }
.pit-like:disabled { cursor: default; opacity: 0.55; }

.pit-cap { margin: 8px 0 0; font-size: 13px; overflow-wrap: anywhere; }
.pit-by { margin: 3px 0 0; font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.pit-by__t { color: var(--mute); }

.pit-more { margin: 18px 0 0; }

/* ------------------------------------------------------------ lightbox */
/* This overlay deliberately does NOT lock the page. Nothing sets body
   overflow, nothing calls preventDefault on a touch, and there is no
   overscroll-behavior. It carries its own overflow-y for the one case that
   would otherwise clip, a tall photo plus a long caption on a short screen,
   and margin auto on the inner panel centres it without the top being cut off
   the way justify-content would. Closing it leaves the grid exactly where it
   was. "Does not trap scroll" is an acceptance criterion, not a preference. */
.pit-box {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  background: rgba(10, 9, 12, 0.93);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(12px + var(--safe-t)) calc(12px + var(--safe-r))
           calc(22px + var(--safe-b)) calc(12px + var(--safe-l));
}

.pit-box__inner { margin: auto; width: 100%; max-width: 560px; }

.pit-box__bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 0 10px;
}

.pit-box__spacer { flex: 1 1 auto; }

.pit-box__img {
  display: block; width: 100%; height: auto;
  max-height: 62vh;
  max-height: 62svh;
  object-fit: contain;
  background: var(--input);
  border: 1px solid var(--edge); border-radius: 10px;
}

.pit-box__meta { margin: 13px 0 0; }
.pit-box .pit-like { padding: 11px 17px; font-size: 15px; }
.pit-box__cap { margin: 11px 0 0; font-size: 15px; overflow-wrap: anywhere; }
.pit-box__by { margin: 5px 0 0; font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }

/* ------------------------------------------------ comments on a photo */
/* Inside the lightbox only. Sits under the caption, above nothing, so the form is
   the last thing a thumb reaches. */
.pit-cm { margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid var(--edge); }

.pit-cm__k {
  margin: 0 0 8px; font-size: 12px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--gold);
}

.pit-cm__none, .pit-cm__off { margin: 0 0 10px; font-size: 13px; color: var(--mute); }

.pit-cm__l { list-style: none; margin: 0 0 12px; padding: 0;
             display: flex; flex-direction: column; gap: 10px; }

.pit-cm__i { padding: 9px 11px; background: var(--input);
             border: 1px solid var(--edge); border-radius: 9px; }

.pit-cm__t { margin: 0; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }

.pit-cm__by { margin: 4px 0 0; font-size: 12px; color: var(--dim); }

.pit-cm__kill {
  margin-left: 8px; padding: 0; border: 0; background: none;
  color: var(--danger); font: inherit; font-size: 12px;
  text-decoration: underline; cursor: pointer;
}

.pit-cm__f { display: flex; flex-direction: column; gap: 8px; }
.pit-cm__count { margin: 0; font-size: 11px; color: var(--mute); text-align: right; }

.pit-by__cm { color: var(--gold); }


@media (min-width: 700px) {
  .pit-grid { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; }
  .pit-stage__img { max-width: 340px; max-height: 260px; }
  .pit-box__inner { max-width: 620px; }
  .pit-box__img { max-height: 70vh; max-height: 70svh; }
}
/* ==========================================================================
   T2.6 THE CARES CUP, T2.7 ENCORE PARTS TWO TO FOUR, T2.8 VAULT DROPS
   No new motifs and no thirteenth palette token. The leaderboard is the ticket
   stub from T0.4 with the position in the stub. The award card is the vinyl
   label from T0.4. Medals are motif dials mixed from the twelve, the same way
   --warm-fill is: gold is the token, silver is cream knocked back, and bronze
   is gold ink on an oxblood ground, which is what bronze actually is.
   ========================================================================== */

/* ------------------------------------------------- T2.6 fundraising total */
/* Top of the tab, biggest number on the screen. This is the point of the
   tournament and it does not sit under the joke. */
.cares-fund { padding: 17px 16px 19px; margin: 0 0 18px; text-align: center; }

.cares-fund__k {
  display: block; margin: 0 0 7px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 11px; letter-spacing: 0.16em; color: var(--gold);
}

.cares-fund__n {
  margin: 0; color: var(--gold);
  font-size: clamp(38px, 13vw, 62px); line-height: 0.94;
}

.cares-fund__sub { margin: 9px 0 0; font-size: 13px; color: var(--dim); }
.cares-fund__fine { margin: 7px 0 0; font-size: 11px; color: var(--mute); }

.cares-fund__bar {
  margin: 13px auto 0; max-width: 320px; height: 8px;
  background: var(--input); border: 1px solid var(--edge);
  border-radius: 999px; overflow: hidden;
}

.cares-fund__fill { height: 100%; background-image: var(--grad-primary); }

/* --------------------------------------------------------- T2.6 the board */
.cares-board {
  /* Medal dials. Not palette tokens. Mixed from --gold, --cream and --oxblood
     exactly as --warm-fill is mixed, so tokens.html still tells the truth. */
  --cares-m1-ink:  var(--gold);
  --cares-m1-fill: rgba(217, 169, 76, 0.16);
  --cares-m2-ink:  rgba(247, 243, 234, 0.88);
  --cares-m2-fill: rgba(247, 243, 234, 0.07);
  --cares-m3-ink:  rgba(217, 169, 76, 0.62);
  --cares-m3-fill: rgba(138, 14, 31, 0.34);
}

.cares-list { display: flex; flex-direction: column; gap: 15px; }
.cares-row { --ticket-stub-w: 62px; }

/* Poster art sits behind the card under a scrim, so a bright poster cannot eat
   the score. Off by default, and a missing file leaves the solid card. */
.cares-row .ticket > * { position: relative; z-index: 1; }

.cares-art {
  position: absolute; inset: 0; z-index: 0;
  border-radius: 10px; pointer-events: none;
  background-image:
    linear-gradient(rgba(23, 22, 26, 0.60), rgba(23, 22, 26, 0.60)),
    var(--cares-art, none);
  background-size: cover; background-position: center; background-repeat: no-repeat;
}

.cares-pos { font-family: var(--font-display); font-size: 22px; line-height: 1; }
.cares-pos__t { font-size: 15px; }

.cares-pos__l {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 9px; letter-spacing: 0.14em; color: var(--mute);
}

.cares-row--m1 .ticket { border-color: var(--cares-m1-ink); }
.cares-row--m1 .ticket__stub {
  border-right-color: var(--cares-m1-ink);
  background-image: linear-gradient(var(--cares-m1-fill), var(--cares-m1-fill));
}
.cares-row--m1 .cares-pos { color: var(--cares-m1-ink); }

.cares-row--m2 .ticket { border-color: var(--cares-m2-ink); }
.cares-row--m2 .ticket__stub {
  border-right-color: var(--cares-m2-ink);
  background-image: linear-gradient(var(--cares-m2-fill), var(--cares-m2-fill));
}
.cares-row--m2 .cares-pos { color: var(--cares-m2-ink); }

.cares-row--m3 .ticket { border-color: var(--cares-m3-ink); }
.cares-row--m3 .ticket__stub {
  border-right-color: var(--cares-m3-ink);
  background-image: linear-gradient(var(--cares-m3-fill), var(--cares-m3-fill));
}
.cares-row--m3 .cares-pos { color: var(--cares-m3-ink); }

.cares-grid {
  display: flex; gap: 12px; align-items: flex-start;
  justify-content: space-between; flex-wrap: wrap;
}

.cares-grid__l { flex: 1 1 150px; min-width: 0; }
.cares-name { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; }
.cares-players { margin: 5px 0 0; font-size: 13px; color: var(--dim); }

.cares-figs { flex: 0 0 auto; display: flex; gap: 18px; }
.cares-fig { text-align: right; }
.cares-fig__n { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1; }

.cares-fig__l {
  display: block; margin-top: 4px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--dim);
}

/* Waiting on a card. Dashed, like the T1.1 placeholder ticket. */
.cares-row--waiting .ticket { border-style: dashed; }
.cares-row--waiting .ticket__stub { border-right-style: dashed; }
.cares-row--waiting .cares-fig__n { color: var(--mute); }

.cares-h {
  margin: 22px 0 10px; padding-bottom: 6px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 11px; letter-spacing: 0.16em; color: var(--gold);
  border-bottom: 1px solid var(--gold-rule);
}

.cares-state { margin: 0 0 16px; display: flex; flex-wrap: wrap; gap: 8px; }

.cares-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 3px 11px; font-size: 11px; font-weight: 600; color: var(--gold);
}

.cares-pill--final { border-color: var(--gold); }

/* ----------------------------------------------------------- T2.6 crew */
/* Same language as .set-detail and .enc__crew: input ground, scarlet spine. */
.cares-crew {
  margin: 0 0 18px; padding: 13px 14px;
  background: var(--input); border-left: 3px solid var(--scarlet);
  border-radius: 6px;
}

.cares-crew__k {
  margin: 15px 0 7px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.cares-crew__k:first-child { margin-top: 0; }
.cares-crew__note { margin: 8px 0 0; font-size: 12px; color: var(--dim); }

.cares-admin {
  margin: 10px 0 0 12px; padding: 11px 13px;
  background: var(--input); border-left: 3px solid var(--scarlet);
  border-radius: 6px;
}

.cares-entry { display: flex; flex-wrap: wrap; gap: 9px; align-items: flex-end; }
.cares-entry .tf__l { margin: 0; flex: 0 0 92px; }
.cares-entry .tf__in { padding: 9px 10px; }
.cares-err { margin: 8px 0 0; font-size: 12px; color: var(--danger); }
.cares-rowbtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }

/* ================================================= T2.7 award winners */
/* The vinyl label from T0.4 carries the photo. Alfa Slab One on the award name
   only, which is the ration CLAUDE.md allows. */
.en2-award { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }

.en2-award + .en2-award {
  margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--edge);
}

.en2-award__b { min-width: 0; }
.en2-award__aw { margin: 0; font-size: clamp(15px, 4.3vw, 18px); color: var(--gold); line-height: 1.25; }
.en2-award__n { margin: 7px 0 0; font-size: clamp(19px, 6vw, 25px); }
.en2-award__c { margin: 5px 0 0; font-size: 13px; color: var(--dim); }
.en2-award__cit { margin: 9px 0 0; font-size: 14px; }

/* ==================================================== T2.7 hall of fame */
.en2-hof { display: flex; gap: 13px; align-items: flex-start; }

.en2-hof + .en2-hof {
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--edge);
}

.en2-hof__ph {
  flex: 0 0 auto; width: 62px; height: 62px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--gold); background: var(--input);
}

.en2-hof__b { flex: 1 1 auto; min-width: 0; }
.en2-hof__n { margin: 0; font-size: 17px; font-weight: 600; }
.en2-hof__m { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
.en2-hof__cit { margin: 8px 0 0; font-size: 14px; }

/* ====================================================== T2.7 top videos */
/* Embeds only. No video file has any business in this repo. */
.en2-vid + .en2-vid {
  margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--edge);
}

.en2-vid__t { margin: 0 0 9px; font-size: 16px; font-weight: 600; }

.en2-frame {
  position: relative; width: 100%; aspect-ratio: 16 / 9;
  background: #0C0B0E; border: 1px solid var(--edge);
  border-radius: 10px; overflow: hidden;
}

.en2-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.en2-vid__note { margin: 9px 0 0; font-size: 13px; color: var(--dim); }
.en2-vid__bad { margin: 9px 0 0; font-size: 13px; color: var(--danger); }

/* ------------------------------------------------- T2.7 photo field */

const TABS = [

  { key: "band",       icon: "\u{1F3B8}", name: "The Band",       phase: "pre" },
  { key: "backstage",  icon: "\u{1F39F}", name: "Backstage Pass", phase: "pre" },
  { key: "soundcheck", icon: "\u{1F399}", name: "Soundcheck",     phase: "pre" },
  { key: "vault",      icon: "\u{1F512}", name: "The Vault",      phase: "pre" },
  /* Liner Notes was the tenth tab until Aug 13 2026. Jim merged it into
     Soundcheck, so it is a pill in that tab now, not a tab of its own. Nine
     tabs. Its Firebase node, takeaways/, is untouched and so is its data. */
  { key: "vote",       icon: "\u{1F4CA}", name: "Crowd Vote",     phase: "during" },
  { key: "pit",        icon: "\u{1F4F7}", name: "The Pit",        phase: "during" },
  { key: "cares",      icon: "\u{1F3C6}", name: "The Cares Cup",  phase: "during" },
  { key: "encore",     icon: "⭐",         name: "Encore",         phase: "post" }
];

const TAB_BY_KEY = {};
TABS.forEach(function (t) { TAB_BY_KEY[t.key] = t; });

/* ------------------------------------------------------------- helpers */

function readLS(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}

function writeLS(key, value) {
  try { window.localStorage.setItem(key, value); } catch (e) { /* private mode */ }
}

/* Crew unlock lives in SESSION storage, not local. T1.6 says the unlocked state
   persists for the session, and session storage is exactly that: it survives a
   reload, and it dies when the tab closes. Local storage would leave the panel
   open on that phone indefinitely, which is the wrong default for a control that
   can wipe every node. Same mm26_ prefix so Clear This Device still finds it. */
function readSS(key) {
  try { return window.sessionStorage.getItem(key); } catch (e) { return null; }
}

function writeSS(key, value) {
  try { window.sessionStorage.setItem(key, value); } catch (e) { /* private mode */ }
}

function dropSS(key) {
  try { window.sessionStorage.removeItem(key); } catch (e) { /* private mode */ }
}

/* Splits a millisecond span into whole days, hours, minutes, seconds. */
function breakdown(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return {
    days:    Math.floor(s / 86400),
    hours:   Math.floor((s % 86400) / 3600),
    minutes: Math.floor((s % 3600) / 60),
    seconds: s % 60
  };
}

function pad(n) { return n < 10 ? "0" + n : String(n); }

function readJSON(key) {
  const raw = readLS(key);
  if (!raw) return {};
  try {
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (e) {
    return {};
  }
}

function writeJSON(key, value) {
  try { writeLS(key, JSON.stringify(value)); } catch (e) { /* nothing to do */ }
}

/* ------------------------------------------------------- links out */

/* Strip a printed number down to a dialable one. The flier prints three
   different formats and none of them dial. */
function telHref(printed) {
  const digits = String(printed || "").replace(/\D/g, "");
  if (!digits) return null;
  return "tel:+1" + (digits.length === 11 && digits[0] === "1" ? digits.slice(1) : digits);
}

function mailHref(address) { return address ? "mailto:" + address : null; }

/* Apple platforms hand maps.apple.com straight to Maps. Android hands the
   Google search URL straight to the Maps app. Sending one link to both gets a
   web page on one of them, so the platform decides. */
const IS_APPLE = /iPhone|iPad|iPod|Macintosh/.test(
  (window.navigator && window.navigator.userAgent) || ""
);

function mapHref(query) {
  if (!query) return null;
  const q = encodeURIComponent(query);
  return IS_APPLE
    ? "https://maps.apple.com/?q=" + q
    : "https://www.google.com/maps/search/?api=1&query=" + q;
}

/* The whole address if there is one, the venue name if there is not. */
function venueMapQuery(v) {
  if (!v) return null;
  return v.addr ? v.name + ", " + v.addr : v.name;
}

/* ------------------------------------------------------- eastern clock */
/* The meeting is in Ohio and attendees fly in from several time zones, so every
   label the wall prints is Eastern regardless of where the phone thinks it is.
   Intl does the DST work rather than an offset constant. */
const ET = "America/New_York";

function etParts(ms) {
  try {
    const f = new Intl.DateTimeFormat("en-US", {
      timeZone: ET, hour: "numeric", minute: "2-digit", hour12: true
    });
    const out = { hhmm: "", ap: "" };
    f.formatToParts(ms).forEach((p) => {
      if (p.type === "hour") out.hhmm = p.value;
      if (p.type === "minute") out.hhmm += ":" + p.value;
      if (p.type === "dayPeriod") out.ap = p.value.toUpperCase();
    });
    return out;
  } catch (e) {
    const d = new Date(ms);
    return { hhmm: d.getHours() + ":" + pad(d.getMinutes()), ap: "" };
  }
}

/* Calendar date in Eastern, as YYYY-MM-DD, so it can be compared to the date
   strings in agenda.json without any timezone arithmetic. */
function etDate(ms) {
  try {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: ET, year: "numeric", month: "2-digit", day: "2-digit"
    }).format(ms);
  } catch (e) {
    const d = new Date(ms);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
}

/* mm:ss for a countdown under an hour, h:mm:ss over one. */
function clock(ms) {
  const t = breakdown(ms);
  const h = t.days * 24 + t.hours;
  return h > 0
    ? h + ":" + pad(t.minutes) + ":" + pad(t.seconds)
    : t.minutes + ":" + pad(t.seconds);
}

/* ------------------------------------------------------- firebase boot */
/* One place to fail. If Firebase cannot start, the shell still renders and
   says so, rather than throwing a white screen at a full ballroom. */
function bootFirebase() {
  try {
    if (!window.firebase || !firebase.database) {
      return { ok: false, reason: "The Firebase library did not load." };
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    return { ok: true, db: firebase.database() };
  } catch (err) {
    return { ok: false, reason: (err && err.message) || String(err) };
  }
}

const FB = bootFirebase();

/* Device clocks drift and attendees fly in from several time zones, so the
   wall never trusts the device clock on its own. Firebase publishes the
   offset between this device and the server at .info/serverTimeOffset.
   T2.3 reuses this for the Vault drops, where getting it wrong means content
   lands on the wrong morning. */
/* Test hook, not a feature. `?clock=2026-08-26T09:15:00-04:00` makes this one
   device believe it is that moment, and the belief flows through the same
   corrected clock every timed thing on the wall already reads. That is how ON
   AIR, the dimming, the 30 minute countdown, and the Vault drops at T2.3 get
   tested on the live URL without touching a machine clock. It changes nothing
   for anyone who does not pass the parameter, and any device using it says so
   on screen so nobody is fooled by a card that is lying about the time. */
const SIM_CLOCK = (function () {
  try {
    const raw = new URLSearchParams(window.location.search).get("clock");
    if (!raw) return null;
    const at = Date.parse(raw);
    return isNaN(at) ? null : at;
  } catch (e) { return null; }
})();

/* The corrected clock is anchored to a MONOTONIC source, not to Date.now().
   This matters and it is not theoretical. The earlier version returned
   Date.now() + offset, where offset is a delta captured once at sync. Change the
   device clock after that and the jump carried straight through, so the Vault
   lock state followed the tampered clock until Firebase happened to re-sync.
   performance.now() does not move when the wall clock does, so once there is a
   server anchor the lock cannot be moved by touching the device clock.
   Re-anchors on every offset the server sends, so a genuine re-sync still wins.
   Do not reintroduce Date.now() as the ticking base. See ROADMAP T2.3. */
function useServerNow() {
  const anchorFor = (server) => ({ server: server, mono: performance.now() });

  const anchor = useRef(SIM_CLOCK !== null ? anchorFor(SIM_CLOCK) : null);
  const [synced, setSynced] = useState(SIM_CLOCK !== null);
  const [offset, setOffset] = useState(0);
  const [now, setNow] = useState(
    () => (anchor.current ? anchor.current.server : Date.now())
  );

  const read = () => {
    const a = anchor.current;
    if (!a) return Date.now();          /* no anchor yet, best available */
    return a.server + (performance.now() - a.mono);
  };

  useEffect(() => {
    if (!FB.ok || SIM_CLOCK !== null) return;
    const ref = FB.db.ref(".info/serverTimeOffset");
    const handler = (snap) => {
      const off = snap.val() || 0;
      anchor.current = anchorFor(Date.now() + off);
      setOffset(off);
      setSynced(true);
      setNow(read());                   /* do not wait a tick to correct */
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    const id = window.setInterval(() => setNow(read()), 1000);
    return () => window.clearInterval(id);
  }, []);

  return { now, offset, synced, simulated: SIM_CLOCK !== null };
}

/* Marquee announcements. Admin posts them in T1.6. Until then this is a
   live slot that stays out of the way when there is nothing to say. */
function useAnnouncement() {
  const [item, setItem] = useState(null);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("announcements");
    const handler = (snap) => {
      const all = snap.val() || {};
      const live = Object.keys(all)
        .map((id) => Object.assign({ id: id }, all[id]))
        .filter((a) => a && a.on && a.text)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
      setItem(live.length ? live[0] : null);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return item;
}

/* The flier's masthead: band strip with the scarlet title bar under it. `tall`
   is the welcome hero treatment. Everything else gets the compact strip. */

/* `returning` is true when somebody taps the QR button in the header to pull
   this screen back up. They have already entered, so the button underneath
   sends them back rather than pretending to admit them again. */
function Welcome({ onEnter, now, returning }) {
  return (
    <div className="welcome">
      <Masthead tall />
      <div className="welcome__body">
        {/* Two wrappers so a wide screen can put the QR beside the text
            instead of below the fold. Stacked on a phone. */}
