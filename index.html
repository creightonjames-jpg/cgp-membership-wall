/* ==========================================================================
   T2.7, PART ONE. ENCORE, TENURE RECOGNITION ONLY.
   Award Winners, Hall of Fame, and Top Videos are still stubs and T2.7 stays
   open. Tenure is built early and on its own because the Tenure Awards are
   Wednesday at 8:20 AM, two days before the Thursday awards show, so it has to
   be able to go live without dragging the other three with it.

   The content is confidential until it is read out on stage. That has one hard
   consequence: while the section is locked and the viewer is not admin, the
   wall does not fetch the entries at all. The listener is never attached. A
   render guard would not be enough, because the data would already be sitting
   in the page for anyone who opened dev tools.

   Every name in here is a placeholder. The real list is handled outside this
   repo, which is public.
   ========================================================================== */

/* ==========================================================================
   WEATHER, one line per day. Columbus, Ohio, August 25 to 28.

   Firebase, at weather/{dayKey}, not the repo. It changes right up to the morning
   of, and the person who updates it is standing in a ballroom with a phone, so it
   has to be editable from the crew panel rather than by a commit. That is the same
   rule the rest of the wall follows: fixed before the meeting lives in the repo,
   anything that moves during it lives in Firebase.

   NOTHING HERE IS A FORECAST. Jim asked me to fill it with a best guess, so the seed
   values are Columbus climate normals for late August, and every seeded day carries
   `estimate: true`, which prints "Seasonal average, not a forecast" under the
   numbers. Crew clear that flag by saving a real one. Inventing numbers is fine.
   Inventing numbers that LOOK like a forecast is not, when 119 people are deciding
   whether to bring a jacket.
   ========================================================================== */

const WX_CONDS = [
  { key: "sun",     label: "Sunny",          glyph: "☀️" },
  { key: "partly",  label: "Partly cloudy",  glyph: "⛅" },
  { key: "cloud",   label: "Cloudy",         glyph: "☁️" },
  { key: "rain",    label: "Rain",           glyph: "\u{1F327}️" },
  { key: "storm",   label: "Storms",         glyph: "⛈️" },
  { key: "hot",     label: "Hot and humid",  glyph: "\u{1F321}️" },
  { key: "wind",    label: "Windy",          glyph: "\u{1F32C}️" }
];

function wxCond(key) {
  return WX_CONDS.filter((c) => c.key === key)[0] || WX_CONDS[1];
}

/* The default lives here in the repo rather than being written into Firebase once.
   Two reasons. It survives a Firebase wipe, so the days are never blank. And there
   is exactly one copy of it, so nobody has to work out where a number came from.
   Firebase wins wherever a crew record exists.

   Jim, Aug 17 2026: a real Columbus forecast, supplied by him, replaces the climate
   normals that were here. So `estimate` is false and the "seasonal average" line is
   gone. `asOf` is stamped instead, because this was pulled eight days out and an
   eight day forecast will move. Whoever refreshes it on the Sunday before gets a
   fresh stamp from the crew form automatically. */
const WX_SEED = {
  tue: { hi: "80", lo: "62", pop: "22", cond: "partly", note: "Warm for the range and the shotgun.", asOf: "Aug 17" },
  wed: { hi: "81", lo: "65", pop: "24", cond: "partly", note: "", asOf: "Aug 17" },
  thu: { hi: "81", lo: "64", pop: "24", cond: "partly", note: "", asOf: "Aug 17" },
  fri: { hi: "79", lo: "61", pop: "21", cond: "partly", note: "Good flying weather.", asOf: "Aug 17" }
};

function useWeather() {
  const [live, setLive] = useState(null);
  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("weather");
    const handler = (snap) => setLive(snap.val() || {});
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);
  /* Merge per day, not per field. A crew record replaces the guess outright, so a
     saved day cannot end up wearing half of my estimate. */
  const out = {};
  Object.keys(WX_SEED).forEach((k) => { out[k] = WX_SEED[k]; });
  if (live) Object.keys(live).forEach((k) => { if (live[k]) out[k] = live[k]; });
  return out;
}

function wxWrite(dayKey, body) {
  if (!FB.ok) return Promise.resolve();
  return FB.db.ref("weather/" + dayKey).update(body);
}

/* One day's line. Renders nothing at all when there is no record, so a day nobody
   has filled in is silent rather than showing an empty widget. */
/* "Updated Aug 17". A crew save stamps `ts` from the server, the repo default
   carries a plain `asOf` string. Either way the room can see how old the numbers
   are, which matters for a forecast pulled days before the meeting. */
function wxAsOf(w) {
  if (w && typeof w.ts === "number") return lnEtFormat(w.ts, { month: "short", day: "numeric" });
  if (w && w.asOf) return String(w.asOf);
  return "";
}

function WeatherLine({ w }) {
  if (!w || (!w.hi && !w.lo && !w.cond && !w.note)) return null;
  const c = wxCond(w.cond);
  const asOf = wxAsOf(w);
  return (
    <div className="wx">
      <span className="wx__g" aria-hidden="true">{c.glyph}</span>
      <span className="wx__t">
        <span className="wx__temps">
          {w.hi ? <span className="wx__hi t-data">{w.hi}&deg;</span> : null}
          {w.lo ? <span className="wx__lo t-data">{w.lo}&deg;</span> : null}
          <span className="wx__c">{c.label}</span>
          {w.pop ? (
            <span className="wx__pop t-data">
              <span aria-hidden="true">{"\u{1F4A7}"}</span>
              <span className="sr-only">Chance of rain </span>{w.pop}%
            </span>
          ) : null}
        </span>
        {w.note ? <span className="wx__n">{w.note}</span> : null}
        {w.estimate ? (
          <span className="wx__est">Seasonal average, not a forecast.</span>
        ) : asOf ? (
          <span className="wx__est">Forecast as of {asOf}.</span>
        ) : null}
      </span>
    </div>
  );
}

/* Crew editor, inline under the day header where they are already looking. Two
   numbers, a condition and an optional line. Saving clears the estimate flag,
   because a human has now put a real number in. */
function WeatherEdit({ dayKey, w }) {
  const [hi, setHi] = useState(String((w && w.hi) || ""));
  const [lo, setLo] = useState(String((w && w.lo) || ""));
  const [pop, setPop] = useState(String((w && w.pop) || ""));
  const [cond, setCond] = useState(String((w && w.cond) || "partly"));
  const [note, setNote] = useState(String((w && w.note) || ""));
  const [busy, setBusy] = useState(false);
  const [said, setSaid] = useState("");

  /* Re-seed the fields when the crew switch day pills, or Wednesday's editor would
     keep showing Tuesday's numbers. */
  useEffect(() => {
    setHi(String((w && w.hi) || ""));
    setLo(String((w && w.lo) || ""));
    setPop(String((w && w.pop) || ""));
    setCond(String((w && w.cond) || "partly"));
    setNote(String((w && w.note) || ""));
    setSaid("");
  }, [dayKey]);

  const save = (e) => {
    e.preventDefault();
    setBusy(true);
    /* The server stamps it, not the phone. Crew are at the venue so their own clock
       is probably right, but every other timestamp on the wall comes from the server
       and this one has no reason to be the exception. */
    wxWrite(dayKey, {
      hi: hi.replace(/\D/g, "").slice(0, 3),
      lo: lo.replace(/\D/g, "").slice(0, 3),
      pop: pop.replace(/\D/g, "").slice(0, 3),
      cond: cond,
      note: note.replace(/\s+/g, " ").trim().slice(0, 90),
      estimate: false,
      asOf: null,
      ts: scServerStamp()
    }).then(() => setSaid("Saved.")).catch(() => setSaid("Did not save."))
      .then(() => setBusy(false));
  };

  return (
    <form className="wx-ed" onSubmit={save}>
      <p className="wx-ed__k">Weather for this day</p>
      <div className="tf__row">
        <label className="tf__l" style={{ flex: "0 0 74px", margin: 0 }}>
          <span>High</span>
          <input className="tf__in t-data" value={hi} inputMode="numeric"
                 placeholder="80" onChange={(e) => setHi(e.target.value)} />
        </label>
        <label className="tf__l" style={{ flex: "0 0 74px", margin: 0 }}>
          <span>Low</span>
          <input className="tf__in t-data" value={lo} inputMode="numeric"
                 placeholder="62" onChange={(e) => setLo(e.target.value)} />
        </label>
        <label className="tf__l" style={{ flex: "0 0 84px", margin: 0 }}>
          <span>Rain %</span>
          <input className="tf__in t-data" value={pop} inputMode="numeric"
                 placeholder="22" onChange={(e) => setPop(e.target.value)} />
        </label>
      </div>
      {/* Sky gets its own row. Sharing one with the two temperatures squeezed it
          narrow enough to clip "Partly cloudy" at 390px. */}
      <label className="tf__l">
        <span>Sky</span>
        <select className="tf__in" value={cond} onChange={(e) => setCond(e.target.value)}>
          {WX_CONDS.map((c) => (
            <option key={c.key} value={c.key}>{c.glyph + " " + c.label}</option>
          ))}
        </select>
      </label>
      <label className="tf__l">
        <span>One line, optional</span>
        <input className="tf__in" value={note} maxLength={90}
               placeholder="Showers clearing by the shotgun."
               onChange={(e) => setNote(e.target.value)} />
      </label>
      <div className="tf__row" style={{ marginTop: 8 }}>
        <button type="submit" className="btn btn--go" disabled={busy}>
          {busy ? "Saving" : "Save the weather"}
        </button>
        {said ? <span className="wx-ed__said">{said}</span> : null}
      </div>
    </form>
  );
}

/* Tenure opens on the clock rather than on somebody remembering to flip a switch
   during the Opening Cowbell.

   MOVED TO THURSDAY, and this needs Jim's confirmation.

   He asked for 9:00 AM on Wednesday August 26, and at the time that was right: the
   Wednesday 8:20 session was called "Welcome and Tenure Awards Presentation", so 9:00
   was shortly after the awards were read out. Carol's Aug 13 update moved the Tenure
   Awards Presentation to THURSDAY 8:45, inside that day's Opening Cowbell, and took
   them off Wednesday entirely.

   Leaving the unlock on Wednesday would publish the eight names a full day before
   they are announced, which is the one thing Lisa asked us not to do. So it follows
   the presentation: 9:15 AM Thursday, when the Cowbell block ends and Playlist 3
   starts, which is the same "just after it is read out" position 9:00 held on the old
   Wednesday schedule.

   Erring later, never earlier. If Jim wants a different moment it is this one line,
   and the crew override still opens it early on the day regardless. */
const TENURE_UNLOCK_AT = Date.parse("2026-08-27T09:15:00-04:00");

/* The unlock flag is a bare boolean, so it is safe to listen to always: reading it
   reveals nothing, and the NAMES are gated separately in useTenureEntries.

   THREE STATES, not two, and the node already supported them without a migration:

     absent or null   follow the clock. This is where it sits today
     true             crew forced it open early
     false            crew forced it shut

   So the existing crew button still works and still wins in both directions, which
   is the same rule the Vault drops follow. A section that will not open because a
   phone cannot reach the server is a worse failure in front of a room than one that
   opens on the phone's own clock, so trust comes from useVaultClock, which grants it
   after a grace period rather than waiting forever. */
function useTenureUnlocked(now) {
  const [raw, setRaw] = useState(null);
  const [ready, setReady] = useState(!FB.ok);
  const clock = useVaultClock();

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("encore/tenure/unlocked");
    const handler = (snap) => { setRaw(snap.val()); setReady(true); };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  const mode = raw === true ? "open" : raw === false ? "shut" : "scheduled";
  const unlocked = mode === "open" ? true
    : mode === "shut" ? false
    : (clock.trusted && typeof now === "number" && now >= TENURE_UNLOCK_AT);

  return { unlocked, ready, mode, at: TENURE_UNLOCK_AT, clock: clock };
}

/* `enabled` gates the read, not the render. Called with false, this never
   touches encore/tenure/entries. */
function useTenureEntries(enabled) {
  const [entries, setEntries] = useState([]);

  useEffect(() => {
    if (!FB.ok || !enabled) {
      setEntries([]);
      return;
    }
    const ref = FB.db.ref("encore/tenure/entries");
    const handler = (snap) => {
      const all = snap.val() || {};
      setEntries(Object.keys(all).map((id) => Object.assign({ id: id }, all[id])));
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, [enabled]);

  return entries;
}

/* Milestones sort by the number in them, SHORTEST tenure first, so the list builds
   to the longest service rather than opening with it. Anything without a number
   falls to the end.

   This was longest-first until Aug 13, on my own guess about the running order. Jim's
   actual list has the 5 year awards above the 10 year ones, which is his document and
   beats my guess. Flip the sign here if the stage order ever changes. */
function milestoneRank(label) {
  const m = String(label || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : 1e6;
}

function groupByMilestone(entries) {
  const groups = {};
  entries.forEach((e) => {
    const key = (e.milestone || "Unsorted").trim() || "Unsorted";
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  return Object.keys(groups)
    .sort((a, b) => {
      const d = milestoneRank(a) - milestoneRank(b);
      return d !== 0 ? d : a.localeCompare(b);
    })
    .map((k) => ({
      milestone: k,
      people: groups[k].slice().sort((a, b) =>
        String(a.name || "").localeCompare(String(b.name || "")))
    }));
}

const BLANK_ENTRY = { milestone: "", name: "", club: "", years: "", photo: "" };

/* Two fields and a button by default. Anything else is behind a disclosure,
   because this gets typed on a phone while somebody is walking to the stage.

/* The flag is a bare boolean, so listening to it always is free and leaks
   nothing. */
function useEncoreFlag(section) {
  const [unlocked, setUnlocked] = useState(false);
  const [ready, setReady] = useState(!FB.ok);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("encore/" + section + "/unlocked");
    const handler = (snap) => { setUnlocked(snap.val() === true); setReady(true); };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, [section]);

  return { unlocked, ready };
}

/* `enabled` gates the read. Called with false this never touches the entries
   path. Do not turn this into a render guard. */
function useEncoreEntries(section, enabled) {
  const [entries, setEntries] = useState([]);

  useEffect(() => {
    if (!FB.ok || !enabled) {
      setEntries([]);
      return;
    }
    const ref = FB.db.ref("encore/" + section + "/entries");
    const handler = (snap) => {
      const all = snap.val() || {};
      setEntries(Object.keys(all).map((id) => Object.assign({ id: id }, all[id])));
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, [section, enabled]);

  return entries;
}

function setEncoreFlag(section, next) {
  if (!FB.ok) return;
  FB.db.ref("encore/" + section + "/unlocked").set(next === true);
}

function saveEncoreEntry(section, id, clean, done) {

  const payload = id ? clean : Object.assign({}, clean, { ts: wallStamp() });
  ref.update(payload).then(() => { if (done) done(); }).catch(() => { if (done) done(); });
}

function removeEncoreEntry(section, id) {

/* Camera and library both, per CLAUDE.md, because camera only was a real
   limitation on the prior build. 640px long edge at JPEG 0.74 lands around
   40KB, which is the right weight for a photo that renders inside a 96px vinyl
   label and gets typed in from a phone in the room. */
function encShrinkPhoto(file, cb) {
  if (!file) { cb(null); return; }
  const reader = new FileReader();
  reader.onerror = function () { cb(null); };
  reader.onload = function () {
    const img = new Image();
    img.onerror = function () { cb(null); };
    img.onload = function () {
      const max = 640;
      const scale = Math.min(1, max / Math.max(img.width || max, img.height || max));
      const w = Math.max(1, Math.round((img.width || max) * scale));
      const h = Math.max(1, Math.round((img.height || max) * scale));
      const cv = document.createElement("canvas");
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      try {
        cb(cv.toDataURL("image/jpeg", 0.74));
      } catch (e) {
        cb(null);
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function EncorePhotoField({ value, onChange }) {
  const [working, setWorking] = useState(false);
  const [typed, setTyped] = useState(false);

  function take(e) {

    e.target.value = "";

  return (

        <label className="tf__l">

  );
}

/* Embeds only. A video file has no business in this repo: GitHub Pages is not
   a CDN. Takes a watch link, a share link, a shorts link, a youtu.be link or a
   Vimeo link, and turns it into the embed URL. Anything else gets said out
   loud rather than rendered as a broken frame. */
function encEmbed(raw) {
  const url = String(raw || "").trim();
  if (!url) return null;

  let m = url.match(
    /(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/
  );
  if (m) return { kind: "YouTube", src: "https://www.youtube-nocookie.com/embed/" + m[1] };

  m = url.match(/vimeo\.com\/(?:video\/)?(\d{6,})/);
  if (m) return { kind: "Vimeo", src: "https://player.vimeo.com/video/" + m[1] };

  return null;
}

/* ==========================================================================
   T2.8 ADMIN PANEL V2. VAULT DROPS.
   Spec 4.1 calls this the single most important control during the meeting, and
   ROADMAP T2.8 says it has to be two taps from the gear because it gets used
   under time pressure. So it is the first block in the crew panel and it is
   never behind a disclosure: tap the gear, tap the drop.

   Six gated sections in one board. The two Vault drops run on the clock with a
   three way override. The four Encore sections are manual only: the awards show
   decides when an envelope is open, and an auto reveal on a schedule would
   spoil a winner if the show ran early. The planned time is printed, and the
   panel says out loud when it has passed.

   Every time comparison here reads the server corrected `now` from
   useServerNow. Nothing calls Date.now().
   ========================================================================== */

const VAULT_DROPS = [
  {
    key: "scenarios", title: "Core Fundamental Scenarios",
    at: Date.parse("2026-08-26T09:30:00-04:00"),
    when: "Wednesday 9:30 AM Eastern"
  },
  {
    key: "personas", title: "Invitation Source Personas",
    at: Date.parse("2026-08-27T10:30:00-04:00"),
    when: "Thursday 10:30 AM Eastern"
  }
];

/* T2.8 reads the same node T2.3 already writes: settings/vaultDrops/{key},
   holding { mode, unlockAt, ts } where mode is "scheduled", "open" or "shut".
   This spec was drafted against settings/drops/{key} as a bare "auto" string.
   That would have been a second, competing source of truth for the single most
   important control in the build, so the four seam functions below were pointed
   at the shipped shape instead, per this spec's own Edit 5. "auto" is
   "scheduled" here. Nothing else in the block changed. */
function useDropOverrides() {
  const [modes, setModes] = useState({});

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("settings/vaultDrops");
    const handler = (snap) => setModes(snap.val() || {});
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return modes;
}

/* The node is an object, and a bare string typed straight into the Firebase
   console is also accepted, exactly as vaultDropState does it. Anything
   unrecognised reads as scheduled, which keeps the clock in force rather than
   letting a bad value open a section. */
function dropMode(modes, key) {
  const node = modes && modes[key];
  let m = null;
  if (typeof node === "string") m = node;
  else if (node && typeof node === "object" && typeof node.mode === "string") m = node.mode;
  if (m === "auto") m = "scheduled";
  return m === "open" || m === "shut" ? m : "scheduled";
}

/* A test unlockAt set from the Vault tab has to move this panel too, or the two
   would disagree about when a section opens. */
function dropAt(modes, key, fallback) {
  const node = modes && modes[key];
  if (node && typeof node === "object" && typeof node.unlockAt === "number"
      && isFinite(node.unlockAt)) {
    return node.unlockAt;
  }
  return fallback;
}

/* The one function the Vault tab and this panel must agree on. `now` is the
   server corrected clock, never the device clock. */
function dropOpen(drop, mode, now, at) {
  if (mode === "open") return true;
  if (mode === "shut") return false;
  const when = typeof at === "number" ? at : drop.at;
  return typeof now === "number" && now >= when;
}

/* update, not set, so a test unlockAt and the server ts written by the Vault
   tab survive a mode change made from here. */
function setDropMode(key, mode) {
  if (!FB.ok) return;
  const body = { mode: mode };
  try {
    if (window.firebase && firebase.database && firebase.database.ServerValue) {
      body.ts = firebase.database.ServerValue.TIMESTAMP;
    }
  } catch (e) { /* leave ts alone */ }
  FB.db.ref("settings/vaultDrops/" + key).update(body);
}

/* clock() collapses days into hours, which is exactly right for a five minute
   wait and unreadable two weeks out, where it prints 349:29:47. Days first
   until the last day. */
function dropLeft(ms) {
  const t = breakdown(ms);
  if (t.days > 0) return t.days + (t.days === 1 ? " day " : " days ") + t.hours + "h";
  return clock(ms);
}

function VdropRow({ title, when, pill, note, buttons }) {
  return (
    <div className="vdrop-row">
      <div className="vdrop-row__top">
        <span className="vdrop-row__n">{title}</span>
        {pill}
      </div>
      <p className="vdrop-row__when">{when}</p>
      {note ? <p className="vdrop-row__when">{note}</p> : null}
      <div className="vdrop-row__btns">{buttons}</div>
    </div>
  );
}

/* Renamed from VaultDropRow. T2.3 already shipped a VaultDropRow inside the
   Vault tab that takes a different set of props entirely, and two function
   declarations with one name means the second silently wins. This is the
   crew panel row, so it says so. */
function AdminVaultDropRow({ drop, mode, now, at }) {
  /* `at` is the effective unlock time: the scheduled one, or a test time the
     Vault tab has written. Both this panel and the tab have to read the same
     one or they will disagree about when a section opens. */
  const when = typeof at === "number" ? at : drop.at;
  const isTest = when !== drop.at;
  const open = dropOpen(drop, mode, now, when);
  const waiting = mode === "scheduled" && !open;
  const left = when - now;

  const pill = open ? (
    <span className="vdrop-pill vdrop-pill--open">Open to the room</span>
  ) : mode === "shut" ? (
    <span className="vdrop-pill vdrop-pill--held">Held shut</span>
  ) : (
    <span className="vdrop-pill">Locked</span>
  );

  const note = mode === "open"
    ? "Forced open by crew. The clock is not deciding this one."
    : mode === "shut"
      ? "Held shut by crew. It will stay shut past its time until you put it back on the clock."
      : waiting
        ? (isTest ? "TEST TIME in force, not the real schedule. " : "On the clock. ")
          + dropLeft(left) + " to go."
        : isTest
          ? "Opened on a TEST TIME, not the real schedule."
          : "Opened on the clock.";

  return (
    <VdropRow
      title={drop.title}
      when={"Scheduled " + drop.when}
      note={note}
      pill={mode === "open" ? <span className="vdrop-pill vdrop-pill--forced">Forced open</span> : pill}
      buttons={
        <React.Fragment>
          {!open ? (
            <button className="btn btn--go" onClick={() => setDropMode(drop.key, "open")}>
              Unlock now
            </button>
          ) : (
            <button className="btn btn--kill" onClick={() => setDropMode(drop.key, "shut")}>
              Re-lock
            </button>
          )}
          {mode !== "scheduled" ? (
            <button className="btn btn--quiet" onClick={() => setDropMode(drop.key, "scheduled")}>
              Back on the clock
            </button>
          ) : null}
        </React.Fragment>
      }
    />
  );
}

function EncoreDropRow({ meta, now }) {
  const { unlocked } = useEncoreFlag(meta.key);
  const late = !unlocked && typeof now === "number" && now > meta.planned;

  return (
    <VdropRow
      title={meta.title}
      when={"Planned " + meta.plannedLabel}
      note={
        unlocked
          ? "Live on every phone."
          : late
            ? "Still locked, and the planned time has passed."
            : "Locked. Crew can see the content, the room cannot."
      }
      pill={
        unlocked
          ? <span className="vdrop-pill vdrop-pill--open">Live</span>
          : <span className="vdrop-pill">Locked</span>
      }
      buttons={
        unlocked ? (
          <button className="btn btn--kill" onClick={() => setEncoreFlag(meta.key, false)}>
            Lock it again
          </button>
        ) : (
          <button className="btn btn--go" onClick={() => setEncoreFlag(meta.key, true)}>
            Publish now
          </button>
        )
      }
    />
  );
}

/* Everything T2.8 adds to the v1 panel, in one component, so the integrator
   drops it in as the first child of the panel body and nothing else moves.
   `onGoTab` is optional: without it the jump buttons are hidden and the rest
   still works. */
function AdminV2({ isAdmin, now, onGoTab }) {
  const modes = useDropOverrides();
  if (!isAdmin) return null;

  return (

        Everything on the wall that opens on a cue. Unlock early if a session

        ))}

      {onGoTab ? (

/* ==========================================================================
   T1.6 ADMIN PANEL, v1. Spec 4.1.
   Marquee, Tab Visibility, Reset by Section, Clear This Device, Reset
   Everything. The PIN gate is T0.5 and is not rebuilt here. Vault Drops is
   spec 4.1 too, and it lands at T2.8 with the drop engine it controls.

   Tab visibility is the one that matters during the meeting. It lives at
   settings/tabs/{key} as a bare boolean and reaches every phone through the
   same listener pattern the rest of the wall uses. A tab with no stored value
   falls back to its phase, so the six pre tabs are on and the four during and
   post tabs are off. That makes the T4.4 launch state the default rather than
   something anybody has to remember to set.

   Nothing here writes a real person's name, a club, or a figure. Award and
   tenure winners are typed in at the event.
   ========================================================================== */

/* One switch per tab, ten tabs. `map` is whatever settings/tabs holds, which is
   null until the first snapshot arrives and may be missing keys forever.
   Missing is a supported state, not an error. */
function isTabOn(map, tab) {
  if (map && typeof map[tab.key] === "boolean") return map[tab.key];
  return tab.phase === "pre";
}

/* A map of ten booleans is a few dozen bytes, so one listener on the parent is
   cheaper than ten and it keeps every device in step. */
function useTabVisibility() {
  const [map, setMap] = useState(null);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("settings/tabs");
    const handler = (snap) => setMap(snap.val() || {});
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return map;
}

/* 8:20 on a Wednesday morning is the wrong time to flip ten switches. */
const PRE_TABS = ["setlist", "band", "backstage", "soundcheck", "vault"];

const TAB_PRESETS = [
  {
    key: "pre",
    label: "Pre-meeting",
    on: PRE_TABS,
    note: "The six tabs the room gets before Tuesday."
  },
  {
    key: "wed",
    label: "Wednesday",
    on: PRE_TABS.concat(["vote", "pit", "cares"]),
    note: "Adds Crowd Vote, The Pit, and The Cares Cup."
  },
  {
    key: "thu",
    label: "Thursday night",
    on: TABS.map((t) => t.key),
    note: "Adds Encore. Everything is open."
  }
];

/* Presets write all ten keys, on and off both. Half absent and half set is how
   you end up unable to tell what the room is looking at. */
function presetMap(on) {
  const map = {};
  TABS.forEach((t) => { map[t.key] = on.indexOf(t.key) !== -1; });
  return map;
}

/* One wipe per node. The label is what Jim reads, the node is what gets
   emptied, and the confirmation prompt says both. */
const RESET_NODES = [
  { node: "announcements", label: "Marquee",             note: "Every announcement, live or not." },
  { node: "questions",     label: "Soundcheck",          note: "Every question and its votes." },
  { node: "polls",         label: "Crowd Vote",          note: "Every poll, its options, and its counts." },
  { node: "takeaways",     label: "Liner Notes",         note: "Every takeaway." },
  { node: "photos",        label: "The Pit",             note: "Every uploaded photo." },
  { node: "reactions",     label: "Setlist reactions",   note: "Every session reaction counter." },
  { node: "caresCup",      label: "The Cares Cup",       note: "Teams, scores, and the fundraising total." },
  { node: "encore",        label: "Encore",              note: "Awards, Hall of Fame, videos, tenure, and their unlock flags." }
];

/* Enumerated out of storage, never typed into the source. A hardcoded list goes
   stale the first time anybody adds a feature, and then Clear This Device
   quietly leaves a key behind. */
/* Both stores. The crew unlock lives in session storage, and a Clear This Device
   that silently skipped it would leave the panel open on a device you just told
   the room was wiped. */
function mm26Stores() {
  return [window.localStorage, window.sessionStorage];
}

function mm26Keys() {
  const found = [];
  mm26Stores().forEach((store) => {
    try {
      for (let i = 0; i < store.length; i++) {
        const k = store.key(i);
        if (k && k.indexOf("mm26_") === 0 && found.indexOf(k) === -1) found.push(k);
      }
    } catch (e) { /* private mode */ }
  });
  return found.sort();
}

/* Enumerate first, then delete. Removing while walking the index shifts
   everything after it and skips keys. */
function clearMm26Keys() {
  const keys = mm26Keys();
  keys.forEach((k) => {
    mm26Stores().forEach((store) => {
      try { store.removeItem(k); } catch (e) { /* nothing to do */ }
    });
  });
  return keys;
}

/* Everything the panel prints is Eastern, same rule as the rest of the wall. */
function apEtStamp(ms) {
  if (!ms) return "no timestamp";
  try {
    return new Date(ms).toLocaleString("en-US", {
      timeZone: ET, weekday: "short", hour: "numeric", minute: "2-digit"
    });
  } catch (e) {
    return String(ms);
  }
}

function ApSection({ id, title, lede, danger, children }) {
  return (
    <section
      className={"ap-sec glow-card grille" + (danger ? " ap-nuke" : "")}
      aria-labelledby={id}
    >
      <h3
        className={"ap-sec__h t-display" + (danger ? " ap-nuke__h" : "")}
        id={id}
      >
        {title}
      </h3>
      {lede ? <p className="ap-sec__p">{lede}</p> : null}
      {children}
    </section>
  );
}

function ApState({ on, onLabel, offLabel }) {
  return (
    <span className={"ap-state " + (on ? "ap-state--on" : "ap-state--off")}>
      {on ? onLabel : offLabel}
    </span>
  );
}

/* ------------------------------------------------------------- 1. marquee */

/* The attendee side reads the same node through useAnnouncement and shows the
   newest item with on === true. This one wants all of them, newest first, so
   yesterday's line can go back up without being retyped. */
function useAdminAnnouncements() {
  const [items, setItems] = useState([]);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("announcements");
    const handler = (snap) => {
      const all = snap.val() || {};
      setItems(
        Object.keys(all)
          .map((id) => Object.assign({ id: id }, all[id]))
          .sort((a, b) => (b.ts || 0) - (a.ts || 0))
      );
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return items;
}

/* `now` is the server corrected clock. A phone running fast would otherwise
   stamp a banner into the future and pin it to the top of the list for the rest
   of the week. */
function ApMarquee({ now }) {
  const items = useAdminAnnouncements();
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);

  /* Whatever attendees are actually looking at: newest item with on true. */
  const live = items.filter((a) => a.on)[0] || null;
  const liveId = live ? live.id : null;

  /* One banner at a time. The attendee side only ever shows the newest one, so
     leaving three switched on would put three rows in this panel and only one
     of them would be telling the truth. */
  const post = useCallback((e) => {
    e.preventDefault();
    const clean = text.trim();
    if (!clean || !FB.ok || busy) return;
    setBusy(true);
    const off = {};
    items.forEach((a) => { if (a.on) off[a.id + "/on"] = false; });
    const root = FB.db.ref("announcements");
    const first = Object.keys(off).length ? root.update(off) : Promise.resolve();
    first
      .then(() => root.push({ text: clean, on: true, ts: now }))
      .then(() => { setText(""); setBusy(false); })
      .catch(() => setBusy(false));
  }, [text, items, now, busy]);

  /* Putting one back up bumps its timestamp, because newest wins on the
     attendee side and a five hour old banner would lose to nothing. */
  function toggle(a) {
    if (!FB.ok) return;
    if (a.on) {
      FB.db.ref("announcements/" + a.id + "/on").set(false);
      return;
    }
    const patch = {};
    items.forEach((x) => { if (x.on && x.id !== a.id) patch[x.id + "/on"] = false; });
    patch[a.id + "/on"] = true;
    patch[a.id + "/ts"] = now;
    FB.db.ref("announcements").update(patch);
  }

  function drop(a) {
    if (!FB.ok) return;
    if (!window.confirm("Delete this announcement for good?\n\n" + a.text)) return;
    FB.db.ref("announcements/" + a.id).remove();
  }

  return (
    <ApSection
      id="ap-marquee"
      title="Marquee"
      lede="One line across the top of every tab. An attendee can dismiss it on their own phone. Taking it down here takes it off all of them."
    >
      <form className="tf" onSubmit={post}>
        <label className="tf__l">
          <span>What it says</span>
          <input
            className="tf__in"
            value={text}
            maxLength={140}
            placeholder="Say it in one line."
            onChange={(e) => setText(e.target.value)}
          />
        </label>
        <div className="tf__row">
          <button
            type="submit"
            className="btn btn--go"
            disabled={busy || !FB.ok || !text.trim()}
          >
            Put it on the wall
          </button>
        </div>
      </form>

      {!items.length ? (
        <p className="ap-sec__note">
          Nothing posted. The strip stays out of the way until there is something
          to say.
        </p>
      ) : (
        <ul className="ap-anns">
          {items.map((a) => (
            <li className="ap-ann" key={a.id}>
              <p className="ap-ann__t">{a.text}</p>
              <p className="ap-ann__m">
                <ApState
                  on={a.id === liveId}
                  onLabel="On the wall"
                  offLabel={a.on ? "On, but covered" : "Off"}
                />
                <span>{apEtStamp(a.ts)} Eastern</span>
              </p>
              <div className="tf__row">
                <button
                  className="btn btn--tiny"
                  onClick={() => toggle(a)}
                  disabled={!FB.ok}
                >
                  {a.on ? "Take it down" : "Put it back up"}
                </button>
                <button
                  className="btn btn--tiny btn--kill"
                  onClick={() => drop(a)}
                  disabled={!FB.ok}
                >
                  Delete
                </button>
              </div>
            </li>
          ))}
        </ul>
      )}
    </ApSection>
  );
}

/* ------------------------------------------------------ 2. tab visibility */

function ApTabs({ vis }) {
  const [said, setSaid] = useState("");
  const onCount = TABS.filter((t) => isTabOn(vis, t)).length;

  function one(tab, next) {
    if (!FB.ok) return;
    FB.db.ref("settings/tabs/" + tab.key).set(next);
    setSaid(
      next
        ? tab.name + " is on. It is in the room's tab bar now."
        : tab.name + " is off. It is gone from the room's tab bar, padlocked in yours."
    );
  }

  /* Forward through the week is one tap. Only a step backwards asks, because
     the only way a preset can hurt is by taking something away mid-meeting. */
  function applyPreset(p) {
    if (!FB.ok) return;
    const map = presetMap(p.on);
    const hides = TABS.filter((t) => isTabOn(vis, t) && !map[t.key]);
    if (hides.length) {
      const names = hides.map((t) => t.name).join(", ");
      if (!window.confirm("This takes " + names + " away from the room. Go ahead?")) return;
    }
    FB.db.ref("settings/tabs").set(map);
    setSaid(p.label + " is set. " + p.on.length + " on, " + (TABS.length - p.on.length) + " off.");
  }

  return (
    <ApSection
      id="ap-tabs"
      title="Tab visibility"
      lede="A hidden tab is gone from the room's tab bar, not greyed out. You keep all ten, with a gold padlock on the ones nobody else can see."
    >
      <div className="tf__row">
        {TAB_PRESETS.map((p) => (
          <button
            key={p.key}
            className="btn"
            onClick={() => applyPreset(p)}
            disabled={!FB.ok}
            title={p.note}
          >
            {p.label}
          </button>
        ))}
      </div>

      <div className="ap-tabs">
        {TABS.map((t) => {
          const on = isTabOn(vis, t);
          return (
            <div className="ap-tab" key={t.key}>
              <span className="ap-tab__icon" aria-hidden="true">{t.icon}</span>
              <span className="ap-tab__n">{t.name}</span>
              <ApState on={on} onLabel="On" offLabel="Hidden" />
              <button
                className={"btn btn--tiny" + (on ? "" : " btn--go")}
                onClick={() => one(t, !on)}
                disabled={!FB.ok}
                aria-label={(on ? "Hide " : "Show ") + t.name}
              >
                {on ? "Hide" : "Show"}
              </button>
            </div>
          );
        })}
      </div>

      <p className="ap-sec__note">
        The room sees {onCount} of {TABS.length}. A switch lands on every phone in
        about two seconds. Anyone sitting on a tab you turn off gets moved to the
        first one that is still open.
      </p>

      {said ? <p className="ap-said">{said}</p> : null}
    </ApSection>
  );
}

/* ----------------------------------------------------- 3. reset by section */

function ApResets() {
  const [state, setState] = useState({});

  function mark(node, value) {
    setState((prev) => Object.assign({}, prev, { [node]: value }));
  }

  function wipe(r) {
    if (!FB.ok) return;
    const ask = 'Wipe the "' + r.node + '" node? ' + r.note
      + " Nothing else is touched. This cannot be undone.";
    if (!window.confirm(ask)) return;
    mark(r.node, "working");
    FB.db.ref(r.node).remove()
      .then(() => mark(r.node, "clear"))
      .catch(() => mark(r.node, "failed"));
  }

  return (
    <ApSection
      id="ap-resets"
      title="Reset by section"
      lede="One wipe per Firebase node. Each button names the node before it empties it, and it empties nothing else."
    >
      <div className="ap-nodes">
        {RESET_NODES.map((r) => (
          <div className="ap-node" key={r.node}>
            <div className="ap-node__v">
              <p className="ap-node__n">{r.label}</p>
              <p className="ap-node__p">
                <span className="ap-node__path">{r.node}</span> {r.note}
              </p>
            </div>
            <div className="ap-node__b">
              {state[r.node] === "working" ? (
                <ApState on={false} onLabel="" offLabel="Working" />
              ) : null}
              {state[r.node] === "clear" ? (
                <ApState on={true} onLabel="Emptied" offLabel="" />
              ) : null}
              {state[r.node] === "failed" ? (
                <ApState on={false} onLabel="" offLabel="Refused" />
              ) : null}
              <button
                className="btn btn--tiny btn--kill"
                onClick={() => wipe(r)}
                disabled={!FB.ok}
              >
                Wipe
              </button>
            </div>
          </div>
        ))}
      </div>
    </ApSection>
  );
}

/* ----------------------------------------------------- 4. clear this device */

function ApDevice() {
  const [keys, setKeys] = useState(() => mm26Keys());
  const [said, setSaid] = useState("");

  function clear() {
    const found = mm26Keys();
    setKeys(found);
    if (!found.length) {
      setSaid("Nothing to clear. This device is holding no mm26_ keys.");
      return;
    }
    const ask = "Clear " + found.length + " key" + (found.length === 1 ? "" : "s")
      + " on this device?\n\n" + found.join("\n")
      + "\n\nShared data is untouched. The page reloads and the crew panel locks.";
    if (!window.confirm(ask)) return;
    const cleared = clearMm26Keys();
    setKeys([]);
    setSaid("Cleared " + cleared.length + ". Reloading as a fresh attendee.");
    /* Reload, because mm26_entered is gone but React still believes you are
       through the welcome screen, and testing the attendee experience is the
       entire point of this button. */
    window.setTimeout(() => window.location.reload(), 700);
  }

  return (
    <ApSection
      id="ap-device"
      title="Clear this device"
      lede="Wipes the mm26_ keys in this browser and nothing else. Shared data stays put, so you can walk the wall as an attendee without spending anybody's vote."
    >
      {keys.length ? (
        <ul className="ap-keys">
          {keys.map((k) => <li className="ap-key t-data" key={k}>{k}</li>)}
        </ul>
      ) : (
        <p className="ap-sec__note">No mm26_ keys on this device right now.</p>
      )}

      <div className="tf__row" style={{ marginTop: "12px" }}>
        <button className="btn btn--kill" onClick={clear}>Clear this device</button>
        <button className="btn btn--quiet" onClick={() => setKeys(mm26Keys())}>
          Check again
        </button>
      </div>

      <p className="ap-sec__note">
        Keys are read out of storage, not off a list in the source, so this is
        whatever is really there. You come back to the welcome screen and the PIN
        gets you back in here.
      </p>

      {said ? <p className="ap-said">{said}</p> : null}
    </ApSection>
  );
}

/* ------------------------------------------------------ 5. reset everything */

/* Two deliberate actions, not two identical taps. Arm it, type the word, fire.
   A double tap on the same button is a thing a thumb does by accident. */
function ApNuke() {
  const [armed, setArmed] = useState(false);
  const [word, setWord] = useState("");
  const [said, setSaid] = useState("");
  const [busy, setBusy] = useState(false);

  const ok = word.trim().toUpperCase() === "WIPE";

  function fire() {
    if (!ok || busy) return;
    setBusy(true);
    setSaid("Working.");
    const jobs = FB.ok ? RESET_NODES.map((r) => FB.db.ref(r.node).remove()) : [];
    Promise.all(jobs)
      .then(() => {
        const cleared = clearMm26Keys();
        setSaid(
          FB.ok
            ? "All " + RESET_NODES.length + " nodes emptied and " + cleared.length
              + " local keys cleared. Reloading."
            : "Live updates are off, so nothing on the server changed. Cleared "
              + cleared.length + " local keys. Reloading."
        );
        window.setTimeout(() => window.location.reload(), 1200);
      })
      .catch((err) => {
        setBusy(false);
        setSaid("Firebase refused part of that. " + ((err && err.message) || String(err)));
      });
  }

  return (
    <ApSection
      id="ap-nuke"
      title="Reset everything"
      danger
      lede="Empties all eight Firebase nodes and every mm26_ key on this device. Tab visibility survives, so the launch state does not have to be set twice. Roster edits survive too, because a name somebody fixed in August is not test data. This is the one you run the day before the meeting."
    >
      {!armed ? (
        <div className="tf__row" style={{ marginTop: "13px" }}>
          <button className="btn btn--kill" onClick={() => setArmed(true)}>
            Reset everything
          </button>
        </div>
      ) : (
        <div className="ap-arm">
          <p className="ap-arm__p">
            Every question, poll, takeaway, photo, reaction, score, Encore entry,
            and announcement goes. Type WIPE to arm it.
          </p>
          <label className="tf__l">
            <span>Type WIPE</span>
            <input
              className="tf__in t-data"
              value={word}
              autoComplete="off"
              placeholder="WIPE"
              onChange={(e) => setWord(e.target.value)}
            />
          </label>
          <div className="tf__row">
            <button
              className="btn btn--kill"
              onClick={fire}
              disabled={!ok || busy}
            >
              Wipe it all
            </button>
            <button
              className="btn btn--quiet"
              onClick={() => { setArmed(false); setWord(""); }}
              disabled={busy}
            >
              Back out
            </button>
          </div>
        </div>
      )}

      {said ? <p className="ap-said">{said}</p> : null}
    </ApSection>
  );
}

/* ========================================================================== */
/* T3.1 6. ROSTER                                                             */
/*                                                                            */
/* The client asked for two things: a way to fix names and clubs, and a way to */
/* add somebody. Both write to roster/{slug} in Firebase and both reach The    */
/* Band on every phone in about two seconds.                                   */
/*                                                                            */
/* 124 of the 147 names came off a filename, so the list is sorted by what     */
/* needs attention rather than alphabetically: flagged first, then anybody     */
/* with no club, then the rest. The counter at the top is the progress bar.    */
/*                                                                            */
/* One row opens at a time. 147 open forms is 147 forms, and CLAUDE.md rules   */
/* out putting them in a box with its own scrollbar, so the page flows and the */
/* list pages out in batches instead.                                          */
/* ========================================================================== */

/* Headshots in assets/attendees are 400x400 squares, centre cropped, per
   tools/process-assets.sh. Somebody added from this panel has no file in the
   repo, so their headshot rides on the record as base64 and it is made to the
   same shape by the same compressor The Pit uses. Cap is well under The Pit's,
   because a 400px square is a quarter of the pixels of an 800px photo and a
   roster record is read by every phone that opens The Band. */
const RST_SHOT = {
  edges: [400, 340, 300],
  qualities: [0.78, 0.68, 0.58, 0.48],
  maxB64: 90000,
  square: true
};

/* The real club list. data/graphs.json is generated from the membership graph
   workbook and carries 29 display names. Union it with whatever clubs are
   already on the merged roster, so a club typed in here suggests itself the
   next time. No club name is written into this file, and a failed fetch just
   leaves the combo suggesting the roster's own clubs. */
function useKnownClubs(people) {
  const [fromFile, setFromFile] = useState([]);

  useEffect(() => {
    let live = true;
    fetch("data/graphs.json", { cache: "no-cache" })
      .then((res) => (res.ok ? res.json() : null))
      .then((data) => {
        if (!live || !data) return;
        setFromFile(((data.clubs) || []).map((c) => rstClean(c && c.name)).filter(Boolean));
      })
      .catch(() => { /* nothing to do, the roster's own clubs still suggest */ });
    return () => { live = false; };
  }, []);

  return useMemo(() => {
    const seen = {};
    const out = [];
    fromFile.concat(people.map((p) => p.club)).forEach((raw) => {
      const v = rstClean(raw);
      const k = v.toLowerCase();
      if (!v || seen[k]) return;
      seen[k] = 1;
      out.push(v);
    });
    return out.sort((a, b) => a.localeCompare(b));
  }, [fromFile, people]);
}

/* Flagged, then no club, then everybody else. Alphabetical inside each band. */
function rstRank(p) {
  if (p.needsReview) return 0;
  if (!p.club) return 1;
  return 2;
}

function rstQueue(a, b) {
  const d = rstRank(a) - rstRank(b);
  return d !== 0 ? d : a.name.localeCompare(b.name);
}

/* 42px thumbnail, or the same initials tile The Band falls back to. An empty
   photo string makes no request, which is the whole reason the base file holds
   "" rather than a path that might not resolve. See ROADMAP T1.3. */
function ApRosterThumb({ person }) {
  if (!person.photo) {
    return (
      <span className="rst-thumb rst-thumb--init grille" aria-hidden="true">
        <span className="rst-thumb__i t-display">{bandInitials(person.name)}</span>
      </span>
    );
  }
  return <img className="rst-thumb" src={person.photo} alt="" loading="lazy" decoding="async" />;
}

/* One text field, plus what the base file says when the crew has changed it and
   the one button that puts the file's value back. */
function ApRosterField({ id, field, value, onValue, base, changed, onRevert, list, hint }) {
  return (
    <label className="tf__l" htmlFor={id}>
      <span>{RST_LABEL[field]}</span>
      <input
        id={id}
        className="tf__in"
        value={value}
        maxLength={60}
        autoComplete="off"
        list={list || undefined}
        onChange={(e) => onValue(e.target.value)}
      />
      {changed ? (
        <span className="rst-was">
          File says {base ? '"' + base + '"' : "nothing"}.
          <button type="button" className="btn btn--tiny rst-was__b" onClick={onRevert}>
            Put it back
          </button>
        </span>
      ) : null}
      {hint ? <span className="rst-was">{hint}</span> : null}
    </label>
  );
}

function ApRosterEdit({ person, base, clubsId, onDone }) {
  const added = person.added;
  const [form, setForm] = useState(() => ({
    name: person.name, title: person.title, club: person.club, region: person.region
  }));
  const [newbie, setNewbie] = useState(person.newbie);
  const [shot, setShot] = useState(null);      /* a staged upload            */
  const [dropShot, setDropShot] = useState(false); /* put the file's back    */
  const [working, setWorking] = useState(false);
  const [busy, setBusy] = useState(false);
  const [bad, setBad] = useState("");

  const set = (f) => (v) => setForm((prev) => Object.assign({}, prev, { [f]: v }));
  const was = (f) => rstClean(base[f]);
  const changed = (f) => person.changed.indexOf(f) !== -1;

  /* Put the field in the open form back at the same time as the record. The
     form holds its own copy so a half-typed name is not thrown away by every
     snapshot, and without this line the input kept the reverted value and the
     next Save quietly put it back. */
  const revert = (f) => () => {
    setForm((prev) => Object.assign({}, prev, { [f]: was(f) }));
    rstRevert(person.slug, f);
  };

  const pick = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setBad("");
    setShot(null);
    setDropShot(false);
    setWorking(true);
    pitCompress(file, RST_SHOT)
      .then((out) => { setShot(out); setWorking(false); })
      .catch((err) => {
        setBad((err && err.message) || "That photo did not go through.");
        setWorking(false);
      });
  }, []);

  function save() {
    if (!FB.ok || busy) return;
    const clean = rstClean(form.name);
    if (!clean) { setBad("A name, at least. The rest can wait."); return; }
    setBusy(true);
    setBad("");

    const patch = {};
    RST_TEXT.forEach((f) => {
      const v = rstClean(form[f]);
      /* An added person's record IS the truth, so an empty field is stored as
         empty. A base person's record is an override, so a value matching the
         file, or an emptied field, drops the override and the file's value
         comes back. That is the same field-by-field promise the merge makes. */
      if (added) patch[f] = v;
      else patch[f] = (v && v !== was(f)) ? v : null;
    });

    if (added) patch.newbie = newbie;
    else patch.newbie = newbie !== (base.newbie === true) ? newbie : null;

    if (shot) patch.photo = shot.data;
    else if (dropShot) patch.photo = null;

    /* Somebody looked at this record, which is what the counter is counting. */
    if (person.needsReview) patch.reviewed = true;

    rstSave(person.slug, patch)
      .then(() => { setBusy(false); onDone(); })
      .catch((err) => {
        setBusy(false);
        setBad("That did not save. " + ((err && err.message) || String(err)));
      });
  }

  /* Nothing typed, nothing to fix. Clears the flag and moves on, which is what
     most of the 124 will need. */
  function looksRight() {
    if (!FB.ok || busy) return;
    setBusy(true);
    rstSave(person.slug, { reviewed: true })
      .then(() => { setBusy(false); onDone(); })
      .catch(() => { setBusy(false); setBad("That did not save. Try it again."); });
  }

  function hide(next) {
    if (!FB.ok) return;
    if (next && !window.confirm("Take " + person.name + " off the wall?\n\nThe record stays in here and you can put them back.")) return;
    rstSave(person.slug, { hidden: next ? true : null }).catch(() => setBad("That did not save."));
  }

  function remove() {
    if (!FB.ok) return;
    if (!window.confirm("Delete " + person.name + " for good?\n\nThis one was added here, so there is no file to fall back on.")) return;
    setBusy(true);
    rstDrop(person.slug)
      .then(() => { setBusy(false); onDone(); })
      .catch(() => { setBusy(false); setBad("That did not delete. Try it again."); });
  }

  const shotSrc = shot ? shot.data : (dropShot ? rstClean(base.photo) : person.photo);

  return (
    <div className="rst-edit">
      <div className="rst-grid">
        <ApRosterField
          id={"rst-name-" + person.slug} field="name"
          value={form.name} onValue={set("name")}
          base={was("name")} changed={changed("name")}
          onRevert={revert("name")}
        />
        <ApRosterField
          id={"rst-title-" + person.slug} field="title"
          value={form.title} onValue={set("title")}
          base={was("title")} changed={changed("title")}
          onRevert={revert("title")}
        />
        <ApRosterField
          id={"rst-club-" + person.slug} field="club"
          value={form.club} onValue={set("club")}
          base={was("club")} changed={changed("club")}
          onRevert={revert("club")}
          list={clubsId}
          hint="Pick one off the list or type a new one."
        />
        <ApRosterField
          id={"rst-region-" + person.slug} field="region"
          value={form.region} onValue={set("region")}
          base={was("region")} changed={changed("region")}
          onRevert={revert("region")}
        />
      </div>

      <div className="rst-toggle">
        <span className="rst-toggle__l">First tour</span>
        <ApState on={newbie} onLabel="Yes" offLabel="No" />
        <button type="button" className="btn btn--tiny" onClick={() => setNewbie(!newbie)}>
          {newbie ? "Not their first" : "Mark first tour"}
        </button>
        {changed("newbie") ? (
          <button
            type="button"
            className="btn btn--tiny"
            onClick={() => { rstRevert(person.slug, "newbie"); setNewbie(base.newbie === true); }}
          >
            Put it back
          </button>
        ) : null}
      </div>

      <div className="rst-shot">
        {shotSrc ? (
          <img className="rst-shot__img" src={shotSrc} alt="" />
        ) : (
          <span className="rst-shot__img rst-thumb--init grille" aria-hidden="true">
            <span className="rst-thumb__i t-display">{bandInitials(form.name)}</span>
          </span>
        )}
        <div className="rst-shot__b">
          {working ? <p className="rst-hint">Squeezing it down.</p> : (
            <div className="tf__row">
              <PitPicker label="Take Photo" glyph={"\u{1F4F7}"} capture onFile={pick} disabled={!FB.ok} />
              <PitPicker label="Choose from Library" glyph={"\u{1F5BC}"} onFile={pick} disabled={!FB.ok} />
            </div>
          )}
          {shot ? (
            <p className="rst-hint t-data">
              {pitBytes(shot.inBytes)} in. {pitBytes(shot.outBytes)} out. {shot.w} by {shot.h}.
              Not saved until you save.
            </p>
          ) : null}
          {!added && changed("photo") && !shot ? (
            <div className="tf__row" style={{ marginTop: "8px" }}>
              <button
                type="button"
                className="btn btn--tiny"
                onClick={() => setDropShot(!dropShot)}
              >
                {dropShot ? "Keep the uploaded one" : "Use the file's headshot"}
              </button>
            </div>
          ) : null}
        </div>
      </div>

      <div className="tf__row">
        <button className="btn btn--go" onClick={save} disabled={busy || working || !FB.ok}>
          {busy ? "Saving" : "Save"}
        </button>
        {person.needsReview ? (
          <button className="btn" onClick={looksRight} disabled={busy || !FB.ok}>
            Looks right
          </button>
        ) : null}
        <button className="btn btn--quiet" onClick={onDone} disabled={busy}>
          Close
        </button>
      </div>

      <div className="tf__row" style={{ marginTop: "8px" }}>
        {added ? (
          <button className="btn btn--tiny btn--kill" onClick={remove} disabled={busy || !FB.ok}>
            Delete
          </button>
        ) : (
          <button
            className={"btn btn--tiny" + (person.hidden ? "" : " btn--kill")}
            onClick={() => hide(!person.hidden)}
            disabled={!FB.ok}
          >
            {person.hidden ? "Put back on the wall" : "Take off the wall"}
          </button>
        )}
      </div>

      <p className="rst-hint">
        {added
          ? "This one only exists in Firebase, so deleting it deletes it."
          : "Emptying a field puts the file's value back. A base record cannot be deleted from a browser, so it comes off the wall instead."}
      </p>

      {bad ? <p className="rst-bad">{bad}</p> : null}
    </div>
  );
}

function ApRosterRow({ person, base, open, onOpen, clubsId }) {
  return (
    <li className="rst-row">
      <div className="rst-row__top">
        <ApRosterThumb person={person} />
        <div className="rst-row__v">
          <p className="rst-row__n">{person.name}</p>
          <p className="rst-row__c">

/* Slug is generated from the name and a collision is refused, not resolved.
   Overwriting somebody else's record because two people share a name is worse
   than making whoever is typing add a middle initial. */
function ApRosterAdd({ taken, clubsId, onAdded }) {
  const [on, setOn] = useState(false);
  const [form, setForm] = useState({ name: "", title: "", club: "", region: "" });
  const [newbie, setNewbie] = useState(false);
  const [shot, setShot] = useState(null);
  const [working, setWorking] = useState(false);
  const [busy, setBusy] = useState(false);
  const [bad, setBad] = useState("");
  const [said, setSaid] = useState("");

  const set = (f) => (v) => setForm((prev) => Object.assign({}, prev, { [f]: v }));
  const slug = rstSlug(form.name);
  const clash = !!slug && taken.indexOf(slug) !== -1;

  const pick = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setBad("");
    setShot(null);
    setWorking(true);
    pitCompress(file, RST_SHOT)
      .then((out) => { setShot(out); setWorking(false); })
      .catch((err) => {
        setBad((err && err.message) || "That photo did not go through.");
        setWorking(false);
      });
  }, []);

  function reset() {
    setForm({ name: "", title: "", club: "", region: "" });
    setNewbie(false);
    setShot(null);
    setBad("");
  }

  function add() {
    if (!FB.ok || busy) return;
    if (!slug) { setBad("A name, at least. The rest can wait."); return; }
    if (clash) { setBad("There is already a " + slug + " on the roster. Add an initial and try again."); return; }
    setBusy(true);
    setBad("");
    setSaid("");
    const rec = {
      name: rstClean(form.name),
      title: rstClean(form.title),
      club: rstClean(form.club),
      region: rstClean(form.region),
      newbie: newbie,
      photo: shot ? shot.data : "",
      added: true,
      reviewed: true
    };
    /* set, not update, because this slug is new and the record is the whole
       truth about them. Everywhere else in here uses update for a reason. */
    FB.db.ref(RST_NODE + "/" + slug).set(rec)
      .then(() => {
        setBusy(false);
        setSaid(rec.name + " is on the wall.");
        reset();
        /* Close the form on the way out. The confirmation lives on the closed
           state, so leaving the form open said nothing at all and the crew had
           to go looking in the list to find out whether it worked. */
        setOn(false);
        if (onAdded) onAdded();
      })
      .catch((err) => {
        setBusy(false);
        setBad("That did not save. " + ((err && err.message) || String(err)));
      });
  }

  if (!on) {
    return (
      <div className="tf__row" style={{ marginTop: "13px" }}>
        <button className="btn" onClick={() => { setOn(true); setSaid(""); }}>
          Add somebody
        </button>
        {said ? <p className="ap-said" style={{ marginTop: 0 }}>{said}</p> : null}
      </div>
    );
  }

  return (
    <div className="rst-add">
      <p className="rst-add__h t-display">Add somebody</p>
      <div className="rst-grid">
        <label className="tf__l" htmlFor="rst-add-name">
          <span>Name</span>
          <input
            id="rst-add-name" className="tf__in" value={form.name} maxLength={60}
            autoComplete="off" placeholder="First Last"
            onChange={(e) => set("name")(e.target.value)}
          />
          {slug ? (
            <span className={"rst-was" + (clash ? " rst-was--bad" : "")}>
              {clash
                ? "Taken. " + slug + " is already somebody."
                : "Files under " + slug + "."}
            </span>
          ) : null}
        </label>
        <label className="tf__l" htmlFor="rst-add-title">
          <span>Title</span>
          <input
            id="rst-add-title" className="tf__in" value={form.title} maxLength={60}
            autoComplete="off" onChange={(e) => set("title")(e.target.value)}
          />
        </label>
        <label className="tf__l" htmlFor="rst-add-club">
          <span>Club</span>
          <input
            id="rst-add-club" className="tf__in" value={form.club} maxLength={60}
            autoComplete="off" list={clubsId}
            onChange={(e) => set("club")(e.target.value)}
          />
          <span className="rst-was">Pick one off the list or type a new one.</span>
        </label>
        <label className="tf__l" htmlFor="rst-add-region">
          <span>Region</span>
          <input
            id="rst-add-region" className="tf__in" value={form.region} maxLength={60}
            autoComplete="off" onChange={(e) => set("region")(e.target.value)}
          />
        </label>
      </div>

      <div className="rst-toggle">
        <span className="rst-toggle__l">First tour</span>
        <ApState on={newbie} onLabel="Yes" offLabel="No" />
        <button type="button" className="btn btn--tiny" onClick={() => setNewbie(!newbie)}>
          {newbie ? "Not their first" : "Mark first tour"}
        </button>
      </div>

      <div className="rst-shot">
        {shot ? (
          <img className="rst-shot__img" src={shot.data} alt="" />
        ) : (
          <span className="rst-shot__img rst-thumb--init grille" aria-hidden="true">
            <span className="rst-thumb__i t-display">{bandInitials(form.name)}</span>
          </span>
        )}
        <div className="rst-shot__b">
          {working ? <p className="rst-hint">Squeezing it down.</p> : (
            <div className="tf__row">
              <PitPicker label="Take Photo" glyph={"\u{1F4F7}"} capture onFile={pick} disabled={!FB.ok} />
              <PitPicker label="Choose from Library" glyph={"\u{1F5BC}"} onFile={pick} disabled={!FB.ok} />
            </div>
          )}
          {shot ? (
            <p className="rst-hint t-data">
              {pitBytes(shot.inBytes)} in. {pitBytes(shot.outBytes)} out. {shot.w} by {shot.h}.
            </p>
          ) : (
            <p className="rst-hint">No headshot is fine. They get an initials tile.</p>
          )}
        </div>
      </div>

      <div className="tf__row">
        <button className="btn btn--go" onClick={add} disabled={busy || working || clash || !slug || !FB.ok}>
          {busy ? "Adding" : "Add to the roster"}
        </button>
        <button className="btn btn--quiet" onClick={() => { setOn(false); reset(); }} disabled={busy}>
          Back out
        </button>
      </div>

      {bad ? <p className="rst-bad">{bad}</p> : null}
    </div>
  );
}

const RST_PAGE = 24;

function ApRoster() {
  const base = useRosterBase();
  const edits = useRosterEdits();
  const [query, setQuery] = useState("");
  const [openSlug, setOpenSlug] = useState(null);
  const [limit, setLimit] = useState(RST_PAGE);

  const people = useMemo(() => rstAll(base, edits).sort(rstQueue), [base, edits]);
  const clubs = useKnownClubs(people);

  const left = people.filter((p) => p.needsReview).length;
  const noClub = people.filter((p) => !p.needsReview && !p.club).length;
  const edited = people.filter((p) => p.changed.length).length;
  const addedN = people.filter((p) => p.added).length;

  const tokens = bandNorm(query).split(/\s+/).filter(Boolean);
  const shown = people.filter((p) => {
    if (!tokens.length) return true;
    const hay = bandNorm(p.name + " " + p.title + " " + p.club + " " + p.slug);
    for (let i = 0; i < tokens.length; i++) {
      if (hay.indexOf(tokens[i]) === -1) return false;
    }
    return true;
  });

  /* A search that narrows to four results should not still say "show more". */
  useEffect(() => { setLimit(RST_PAGE); }, [query]);

  const page = shown.slice(0, limit);

  return (
    <ApSection
      id="ap-roster"
      title="Roster"
      lede="Fix a name, set a club, add somebody who is not on here. Every save lands on The Band on every phone in about two seconds."
    >
      {base.status === "failed" ? (
        <p className="ap-warn">
          data/roster.json did not load. {base.reason} Nothing in here can be
          edited until it does.
        </p>
      ) : null}

      <p className="rst-count">
        <span className="rst-count__n t-data">{left}</span>
        {left === 1 ? " name still to check." : " names still to check."}
        {" "}
        <span className="rst-count__n t-data">{noClub}</span> more with no club.
        {" "}
        {edited === 0 ? "Nothing edited yet." : (
          <React.Fragment>
            <span className="rst-count__n t-data">{edited}</span>
            {edited === 1 ? " record edited" : " records edited"}
            {addedN ? ", " + addedN + " added." : "."}
          </React.Fragment>
        )}
      </p>

      <p className="ap-sec__note">
        Names came off the headshot filenames and none of them are verified. The
        flagged ones are at the top. Save what is right, and Looks Right clears
        the flag on the ones that already are.
      </p>

      <ApRosterAdd
        taken={people.map((p) => p.slug)}
        clubsId="rst-clubs"
        onAdded={() => setQuery("")}
      />

      {/* One list for every combo box on the page. The crew picks a club that
          already exists or types a new one, and no club name is hardcoded:
          this is data/graphs.json's 29 clubs unioned with whatever is on the
          roster right now. */}
      <datalist id="rst-clubs">
        {clubs.map((c) => <option key={c} value={c} />)}
      </datalist>

      <div className="rst-bar">
        <label className="tf__l" htmlFor="rst-q">
          <span>Find somebody</span>
          <input
            id="rst-q"
            className="tf__in"
            type="search"
            autoComplete="off"
            placeholder="Name, club, title, or slug"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </label>
        {query ? (
          <button className="btn btn--quiet" onClick={() => setQuery("")}>Clear</button>
        ) : null}
      </div>

      {!shown.length ? (
        <p className="ap-sec__note">Nobody by that name. Try fewer letters.</p>
      ) : (
        <ul className="rst-list">
          {page.map((p) => (
            <ApRosterRow
              key={p.slug}
              person={p}
              base={base.bySlug[p.slug] || {}}
              open={openSlug === p.slug}
              onOpen={setOpenSlug}
              clubsId="rst-clubs"
            />
          ))}
        </ul>
      )}

      {shown.length > page.length ? (
        <div className="tf__row" style={{ marginTop: "12px" }}>
          <button className="btn" onClick={() => setLimit(limit + RST_PAGE)}>
            Show {Math.min(RST_PAGE, shown.length - page.length)} more
          </button>
          <span className="rst-hint" style={{ margin: "0", alignSelf: "center" }}>
            {page.length} of {shown.length}.
          </span>
        </div>
      ) : null}
    </ApSection>
  );
}

/* Renders in the content flow, in place of the tab body, rather than as a fixed
   overlay. Five sections and ten switches in a fixed overlay needs an inner
   scroll container, and CLAUDE.md keeps those in Display Mode. */

    <div className="ap">
      <div className="ap__top">
        <div style={{ minWidth: 0 }}>
          <h2 className="ap__h t-display">Crew panel</h2>
          <p className="ap__lede">
            Most of this reaches every phone in the room. Tread accordingly.
          </p>
        </div>
        <button className="btn" onClick={onClose}>Back to the wall</button>
      </div>

      {displayMode ? (
        <p className="ap-warn">
          Display Mode is on, so this may be what the projector is showing.
          Switch it off before you work in here.
