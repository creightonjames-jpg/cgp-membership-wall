function TabBar({ tabs, vis, active, onPick, isAdmin }) {
  const scroller = useRef(null);

  /* Keep the selected pill in view. On a 380px screen most of the ten tabs
     sit off the right edge, so tapping one near the edge should not leave it
     half cut off. */
  useEffect(() => {
    const box = scroller.current;
    if (!box) return;
    const el = box.querySelector('[aria-selected="true"]');
    if (el && el.scrollIntoView) {
      el.scrollIntoView({ inline: "nearest", block: "nearest" });
    }
  }, [active]);

  return (
    <nav className="tabs" aria-label="Sections">
      <div className="tabs__scroll" ref={scroller} role="tablist">
        {tabs.map((tab) => (
          <button
            key={tab.key}
            role="tab"
            aria-selected={active === tab.key}
            className="tab"
            onClick={() => onPick(tab.key)}
          >
            <span className="tab__icon" aria-hidden="true">{tab.icon}</span>
            <span>{tab.name}</span>
            {/* T1.6. The padlock is the real visibility state now, not the
                phase. A hidden tab stays in the bar for crew so Jim can work in
                a tab the room cannot see. An attendee never reaches this line:
                a hidden tab is absent from `tabs` altogether. */}
            {isAdmin && !isTabOn(vis, tab) ? (
              <span className="tab__lock" title="Hidden from the room">
                {"\u{1F512}"}
              </span>
            ) : null}
          </button>
        ))}
      </div>
    </nav>
  );
}

function MarqueeSlot({ item, onDismiss }) {
  if (!item) return null;
  return (
    <div className="marquee-slot">
      <div className="marquee">
        <div className="marquee__track">
          <span className="marquee__item">{item.text}</span>
          <span className="marquee__item">{item.text}</span>
        </div>
      </div>
      <button className="marquee-x" onClick={onDismiss} aria-label="Dismiss announcement">
        {"✕"}
      </button>
    </div>
  );
}

function PinGate({ onPass, onClose }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  const input = useRef(null);

  useEffect(() => { if (input.current) input.current.focus(); }, []);

  function submit(e) {
    e.preventDefault();
    if (value === ADMIN_PIN) {
      onPass();
    } else {
      setError("That is not the PIN.");
      setValue("");
    }
  }

  return (
    <div className="pinwrap" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <form className="pin" onSubmit={submit}>
        <h2 className="pin__t t-display">Crew only</h2>
        <input
          ref={input}
          className="pin__in t-data"
          inputMode="numeric"
          autoComplete="off"
          maxLength={4}
          placeholder="0000"
          value={value}
          onChange={(e) => { setValue(e.target.value.replace(/\D/g, "")); setError(""); }}
        />
        {error ? <p className="pin__err">{error}</p> : null}
        <div className="pin__row">
          <button type="button" className="pin__btn pin__btn--ghost" onClick={onClose}>Back</button>
          <button type="submit" className="pin__btn">Unlock</button>
        </div>
      </form>
    </div>
  );
}

/* ==========================================================================
   T0.6 TAB SCAFFOLD.
   Ten components, one per tab, each its own boundary to build into. Phase 1
   and Phase 2 fill these independently, so they do not share a body.

   Empty state copy is written to the flier's register: short, dry, a little
   irreverent, never precious. These are the words an attendee reads before
   any content exists, so they are real copy and not filler.
   ========================================================================== */

const PHASE_LINE = {
  pre: "Live before the meeting",
  during: "Opens during the meeting",
  post: "Opens after the Awards Show"
};

function TabFrame({ tabKey, children }) {
  const tab = TAB_BY_KEY[tabKey];
  /* T1.6. The phase line says when a tab opens, so it has no job once the tab
     is open. Without this, Crowd Vote would read "Opens during the meeting"
     while the room was voting on it. Crew still see it on a padlocked tab,
     because there it is still true. */
  const vis = useTabVisibility();
  const showPhase = tab.phase === "pre" || !isTabOn(vis, tab);
  return (
    <section aria-labelledby={"head-" + tabKey}>
      <h2 className="tabhead t-display" id={"head-" + tabKey}>{tab.name}</h2>
      {showPhase ? <p className="tabhead__sub">{PHASE_LINE[tab.phase]}</p> : null}
      {children}
    </section>
  );
}

function Empty({ children }) {
  return <div className="stubnote"><p style={{ margin: 0 }}>{children}</p></div>;
}

/* Crew only. Keeps "T1.1" out of an attendee's hands by construction rather
   than by remembering to strip it later. */
function BuildNote({ isAdmin, task, children }) {
  if (!isAdmin) return null;
  return (
    <div className="buildnote">
      <p className="buildnote__tag">{task}</p>
      <p className="buildnote__body">{children}</p>
    </div>
  );
}

/* ==========================================================================
   T1.1 THE SETLIST. Spec 3.1.
   Four day pills, sessions as ticket stubs, ON AIR on the live one, completed
   ones dimmed and struck, a countdown inside 30 minutes, tap to expand, four
   reactions per session against Firebase.

   Every clock decision reads the server corrected `now` handed down from
   useServerNow. Nothing in here calls Date.now(). Attendees fly in from several
   time zones and a phone an hour out would otherwise put ON AIR on the wrong
   card in front of the whole room.
   ========================================================================== */

/* Four per session, counts at reactions/{eventKey}/{emoji}. One cast per emoji
   per session per device, held in mm26_reacted. Somebody determined can clear
   their own storage and cast again. That is fine. This is applause, not a
   ballot. */
/* Rock themed, per the client. The keys are names rather than the emoji glyph
   itself, so re-skinning these never orphans a count in Firebase. */
const REACTIONS = [
  { key: "rockon",  glyph: "\u{1F918}", label: "Rock on" },
  { key: "shred",   glyph: "\u{1F3B8}", label: "Shred" },
  { key: "micdrop", glyph: "\u{1F3A4}", label: "Mic drop" },
  { key: "heat",    glyph: "\u{1F525}", label: "Brought the heat" }
];

const HALF_HOUR = 30 * 60 * 1000;

function useAgenda() {
  const [state, setState] = useState({ status: "loading", data: null, reason: "" });

  useEffect(() => {
    let live = true;
    fetch("data/agenda.json", { cache: "no-cache" })
      .then((res) => {
        if (!res.ok) throw new Error("The file returned " + res.status + ".");
        return res.json();
      })
      .then((data) => { if (live) setState({ status: "ready", data: data, reason: "" }); })
      .catch((err) => {
        if (live) setState({ status: "failed", data: null, reason: (err && err.message) || String(err) });
      });
    return () => { live = false; };
  }, []);

  return state;
}

/* One listener for the whole reactions node. Four counters across a dozen
   sessions is a few hundred bytes, so this is cheaper than a listener per
   session and it keeps every count live with no reload. */
function useReactions() {
  const [counts, setCounts] = useState({});

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("reactions");
    const handler = (snap) => setCounts(snap.val() || {});
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return counts;
}

/* A transaction rather than a set, because two people tapping the same button
   in the same second must both be counted. */
function castReaction(eventKey, emoji) {
  if (!FB.ok) return;
  FB.db.ref("reactions/" + eventKey + "/" + emoji)
    .transaction((current) => (current || 0) + 1);
}

/* Where a session sits against the corrected clock.
   `open` kind has a start and no end, so it runs until the day is out. Every
   day of this meeting falls in EDT, which is UTC-4, so the day boundary is
   written out rather than computed. */
function sessionState(sess, day, now) {
  /* `aside` is pinned at a time but is not a session. The Stop n Go break
     station is available across the whole breakout block, so it neither goes
     ON AIR nor strikes itself out at 10:31. */
  if (sess.kind === "placeholder" || sess.kind === "allday" || sess.kind === "aside") {
    return { phase: "static" };
  }

  const start = sess.start ? Date.parse(sess.start) : NaN;
  if (isNaN(start)) return { phase: "static" };

  if (now < start) {
    const left = start - now;
    return { phase: "next", left: left, soon: left <= HALF_HOUR };
  }

  if (sess.kind === "instant") return { phase: "done" };

  const end = sess.end
    ? Date.parse(sess.end)
    : Date.parse(day.date + "T23:59:59-04:00");

  return now < end ? { phase: "live" } : { phase: "done" };
}

/* `newTab` is for links that are not http but should still leave the wall open,
   which in practice means a PDF. A phone that opens a 28 page booklet in the same
   tab has thrown the wall away, and getting back is a Back tap that people do not
   always find. The default is unchanged: only absolute http links open a new tab. */
function LinkChip({ href, glyph, children, newTab }) {
  if (!href) return null;
  const away = newTab || /^https?:/.test(href);
  return (
    <a
      className="linkchip"
      href={href}
      target={away ? "_blank" : undefined}
      rel={away ? "noopener noreferrer" : undefined}
    >
      <span className="linkchip__i" aria-hidden="true">{glyph}</span>
      <span>{children}</span>
    </a>
  );
}

/* Everything inside the ticket is a span, because the ticket itself is a
   button and a button may not hold a p or a div. Reactions and links sit
   outside it for the same reason. */
function SessionCard({ sess, day, now, counts, castMap, onCast, open, onToggle,
                       tenureEntries, tenureOpen, onGoTab, canGoTab, isAdmin }) {
  /* Set only if a declared graphic fails to load, which falls back to the place
     marker rather than leaving a broken frame on the card. */
  const [artBroken, setArtBroken] = useState(false);
  const st = sessionState(sess, day, now);
  const venue = sess.venue ? VENUES[sess.venue] : null;
  const clocked = !!sess.start;
  const at = clocked ? etParts(Date.parse(sess.start)) : null;
  const panelId = "sess-" + sess.key;
  const where = [venue ? venue.name : "", sess.room].filter(Boolean).join(", ");
  const mine = counts[sess.key] || {};

  /* The tenure link only counts as detail once the crew has unlocked it, so a
     locked card does not offer a dropdown that opens onto nothing. */
  /* Only on the card that carries the marker, and only once there is something to
     show. An unlocked node with no entries in it yet must not turn this card into a
     dropdown that opens onto an empty heading. */
  const tenureRows = (sess.tenureLink && tenureOpen && tenureEntries) ? tenureEntries : [];
  const showTenure = tenureRows.length > 0;

  /* A jump to another tab, when the session declares one and that tab is reachable. */
  const goTab = sess.goTab && canGoTab && canGoTab(sess.goTab.key) ? sess.goTab : null;

  /* Does this card have anything worth opening?
     Jim, Aug 13: if there is no detail, do not offer the dropdown at all. It used
     to be offered on every card and then apologise with "Nothing else on the
     agenda for this one."
     Venue, links and the open-ended note are in the test on purpose. They render
     inside the panel, so leaving them out would have hidden real content behind a
     dropdown that no longer existed. */
  const hasDetail = !!(sess.description || where || sess.presenter || sess.preread
    || (sess.items && sess.items.length)
    || venue
    || (sess.links && sess.links.length)
    || sess.kind === "open"
    || sess.graphic
    || goTab
    || showTenure);

  const badges = (
    <span className="set-row">
      {st.phase === "live" ? (
        <span className="onair">
          <span className="onair__dot" aria-hidden="true"></span>On Air
        </span>
      ) : null}
      {st.phase === "next" && st.soon ? (
        <span className="soon">
          Starts in <span className="t-data">{clock(st.left)}</span>
        </span>
      ) : null}
      {sess.subtitle ? <span className="set-kicker">{sess.subtitle}</span> : null}
    </span>
  );

  const showBadges = st.phase === "live" || (st.phase === "next" && st.soon) || sess.subtitle;

  const stub = clocked ? (
    <span className="ticket__stub">
      <span className="set-stub__t">{at.hhmm}</span>
      <span className="set-stub__m">{at.ap}</span>
    </span>
  ) : (
    <span className="ticket__stub">
      <span className="set-stub__lab">{sess.stubLabel}</span>
    </span>
  );

  const body = (
    <span className="ticket__body">
      {showBadges ? badges : null}
      <span className="set-title">
        {st.phase === "done" ? <span className="struck">{sess.title}</span> : sess.title}
      </span>
      {sess.presenter || where ? (
        <span className="set-meta">
          {[sess.presenter, where].filter(Boolean).join(" · ")}
        </span>
      ) : null}
      {hasDetail ? (
        <span className="set-more">{open ? "Close ▴" : "Detail ▾"}</span>
      ) : null}
    </span>
  );

  if (sess.kind === "placeholder") {
    return (
      <article className="set-card set-card--tba">
        <div className="ticket">
          {stub}
          <span className="ticket__body">
            <span className="set-row">
              <span className="set-kicker">Running order to come</span>
            </span>
            <span className="set-title">{sess.title}</span>
            <span className="set-meta">{sess.description}</span>
          </span>
        </div>
      </article>
    );
  }

  /* Nothing to open means no button and no dropdown. A plain div, so it is not
     announced as an interactive control that does nothing. */
  if (!hasDetail) {
    return (
      <article className={"set-card" + (st.phase === "done" ? " is-done" : "")}>
        <div className="ticket set-ticket set-ticket--flat">
          {stub}
          {body}
        </div>
        <div className="reacts">
          {REACTIONS.map((r) => {
            const n = mine[r.key] || 0;
            const cast = !!castMap[sess.key + ":" + r.key];
            return (
              <button
                key={r.key}
                className={"react" + (cast ? " is-cast" : "")}
                disabled={!FB.ok || cast}
                onClick={() => onCast(sess.key, r.key)}
                title={cast ? "Already counted" : r.label}
                data-label={cast ? "Already counted" : r.label}
              >
                <span aria-hidden="true">{r.glyph}</span>
                <span className="react__n t-data">{FB.ok ? n : "–"}</span>
                <span className="sr-only">{r.label}</span>
              </button>
            );
          })}
        </div>
      </article>
    );
  }

  return (
    <article className={"set-card" + (st.phase === "done" ? " is-done" : "")}>
      <button
        className="ticket set-ticket"
        aria-expanded={open}
        aria-controls={panelId}
        onClick={onToggle}
      >
        {stub}
        {body}
      </button>

      {open ? (
        <div className="set-detail" id={panelId}>
          {sess.description ? (
            <p className="set-detail__d">{sess.description}</p>
          ) : null}

          {/* Session artwork, or a reserved frame while it is still coming.

              `pending` drives this rather than a failed image load. Pointing an
              img at a file that is not there yet would 404 in every attendee's
              console, and a lazily loaded 404 fires no error event at all, so the
              card could not detect it anyway. That is the trap T1.3 documents and
              the reason cole.jpg once rendered as a blank square.

              The onError is a second line of defence for the opposite case: the
              file is declared present but has gone missing. loading is left eager
              on purpose so that error actually fires. */}
          {sess.graphic ? (
            <div className="set-art">
              {sess.graphic.pending || artBroken ? (
                <div className="set-art--pending">
                  <span className="set-art__k">Artwork to come</span>
                  <p className="set-art__p">
                    {sess.graphic.alt || "A graphic for this session"}.
                  </p>
                  {isAdmin ? (
                    <p className="set-art__path">{sess.graphic.file}</p>
                  ) : null}
                </div>
              ) : (
                <img
                  src={sess.graphic.file}
                  alt={sess.graphic.alt || ""}
                  onError={() => setArtBroken(true)}
                />
              )}
            </div>
          ) : null}

          {/* The seven Core Fundamentals breakouts sit under one session, so
              they are a list inside that session rather than seven cards that
              would each claim their own start time. */}
          {sess.items && sess.items.length ? (
            <div className="set-items">
              <p className="set-items__k">{sess.itemsLabel || "Includes"}</p>
              <ul className="set-items__l">
                {sess.items.map((it) => <li key={it}>{it}</li>)}
              </ul>
            </div>
          ) : null}

          {where || sess.presenter || sess.preread ? (
            <dl className="set-dl">
              {sess.presenter ? (
                <React.Fragment><dt>Who</dt><dd>{sess.presenter}</dd></React.Fragment>
              ) : null}
              {where ? (
                <React.Fragment><dt>Where</dt><dd>{where}</dd></React.Fragment>
              ) : null}
              {sess.preread ? (
                <React.Fragment>
                  <dt>Pre-read</dt>
                  <dd>
                    {/* A linkchip, not a bare anchor. Jim, Aug 13: the booklet link
                        was rendering purple, because it was the only plain <a> on
                        the whole wall and nothing styled it, so it got the browser's
                        default visited colour.

                        Plain scarlet text was the obvious fix and it is a bad one.
                        Measured against the card background it comes out at 2.8:1,
                        where readable body text wants 4.5:1. The chip is the
                        treatment every other link on the wall already uses: an
                        oxblood fill inside a scarlet edge, so it reads red, with
                        cream text at 14.9:1 on top. It is also a far bigger thing
                        to hit with a thumb. */}
                    <LinkChip href={sess.preread.url} glyph={"\u{1F4C4}"} newTab>
                      {sess.preread.label}
                    </LinkChip>
                  </dd>
                </React.Fragment>
              ) : null}
            </dl>
          ) : null}

          {/* The tenure list itself, on the card, once it is open. Same switch the
              Encore section uses, encore/tenure/unlocked, now on a 9:00 AM Wednesday
              schedule with the crew override still winning in both directions.

              Names only, no club and no photo, even though the entries carry both.
              Jim, Aug 12: "use names only for tenure." */}
          {showTenure ? (
            <div className="set-tenure">
              {groupByMilestone(tenureRows).map((g) => (
                <div className="set-tenure__g" key={g.milestone}>
                  <p className="set-tenure__k t-display">{g.milestone}</p>
                  <ul className="set-tenure__l">
                    {g.people.map((e) => <li key={e.id}>{e.name}</li>)}
                  </ul>
                </div>
              ))}
            </div>
          ) : null}

          {/* A jump to the tab that carries the rest of this session's detail. */}
          {goTab ? (
            <div className="tf__row">
              <button
                type="button"
                className="btn btn--tiny"
                onClick={() => onGoTab && onGoTab(goTab.key)}
              >
                {goTab.label || "Open the tab"}
              </button>
            </div>
          ) : null}

          {venue || (sess.links && sess.links.length) ? (
            <div className="chiprow">
              {venue ? (
                <LinkChip href={mapHref(venueMapQuery(venue))} glyph={"\u{1F4CD}"}>
                  {venue.name}
                </LinkChip>
              ) : null}
              {venue && venue.phone ? (
                <LinkChip href={telHref(venue.phone)} glyph={"\u{1F4DE}"}>
                  {venue.phone}
                </LinkChip>
              ) : null}
              {(sess.links || []).map((l) => (
                <LinkChip
                  key={l.kind + l.value}
                  href={l.kind === "mail" ? mailHref(l.value)
                      : l.kind === "tel" ? telHref(l.value)
                      : l.value}
                  glyph={l.kind === "mail" ? "✉" : l.kind === "tel" ? "\u{1F4DE}" : "\u{1F517}"}
                >
                  {l.label}
                </LinkChip>
              ))}
            </div>
          ) : null}

          {/* The endSource === "next" footnote used to print here, explaining that
              the end time is derived from the next item's start. Jim cut it on
              Aug 13: it appeared on most cards and told attendees nothing they
              needed. endSource is still honoured for the live badge, it just no
              longer narrates itself. */}

          {sess.kind === "open" ? (
            <p className="set-fine">No end time on the agenda. It runs until the night is done.</p>
          ) : null}
        </div>
      ) : null}

      <div className="reacts">
        {REACTIONS.map((r) => {
          const n = mine[r.key] || 0;
          const cast = !!castMap[sess.key + ":" + r.key];
          return (
            <button
              key={r.key}
              className={"react" + (cast ? " is-cast" : "")}
              disabled={!FB.ok || cast}
              onClick={() => onCast(sess.key, r.key)}
              title={cast ? "Already counted" : r.label}
              data-label={cast ? "Already counted" : r.label}
            >
              <span aria-hidden="true">{r.glyph}</span>
              <span className="react__n t-data">{FB.ok ? n : "–"}</span>
              <span className="sr-only">{r.label}</span>
            </button>
          );
        })}
      </div>
    </article>
  );
}

function SetlistTab({ isAdmin, now, onGoTab }) {
  const agenda = useAgenda();
  const counts = useReactions();

  /* One listener for the whole setlist, not one per card. Thirty seven cards
     each opening their own Firebase subscription for the same boolean would be
     thirty six wasted sockets. */
  const tenure = useTenureUnlocked(now);
  const weather = useWeather();

  /* THE NAMES ARE READ HERE, INLINE, and this used to be a link to Encore instead.
     Jim, Aug 13. The link was the wrong answer: Encore is a post-meeting tab and
     settings/tabs has encore:false, so at 9:00 on Wednesday morning the awards would
     have landed in a tab the room could not open, and the link hid itself for the
     same reason. Everyone is on The Setlist at 9:00 following the agenda, and that
     tab is always on. Encore stays the permanent home for afterwards.

     `enabled` is the whole confidentiality guard and it is not a render check. While
     tenure is locked and the viewer is not crew, the listener is never attached, so
     the names are not in the page at all. Anyone opening dev tools early finds
     nothing to find. */
  const tenureOpen = tenure.unlocked || isAdmin;
  const tenureEntries = useTenureEntries(tenureOpen);

  /* A session can point at another tab, `goTab` in agenda.json. Today that is the
     12:00 tournament pointing at The Cares Cup so people can find the teams.

     Gated on the target tab actually being reachable, which is the mistake the old
     tenure link made: settings/tabs has cares:false right now, so without this the
     button would offer attendees a tab that does not exist for them. Crew see every
     tab, so for them it is always live. */
  const vis = useTabVisibility();
  const canGoTab = useCallback((key) => {
    if (!key) return false;
    if (isAdmin) return true;
    const tab = TABS.filter((t) => t.key === key)[0];
    return !!tab && isTabOn(vis, tab);
  }, [isAdmin, vis]);
  const [castMap, setCastMap] = useState(() => readJSON(LS.reacted));
  const [dayKey, setDayKey] = useState(null);
  const [open, setOpen] = useState({});

  const days = (agenda.data && agenda.data.days) || [];
  const today = etDate(now);

  /* Land on today if the meeting is running, otherwise on the next day that
     has not happened yet. Runs once, when the file arrives. After that the
     pills belong to whoever is tapping them. */
  useEffect(() => {
    if (!days.length || dayKey) return;
    const onToday = days.filter((d) => d.date === today)[0];
    const ahead = days.filter((d) => d.date >= today)[0];
    setDayKey((onToday || ahead || days[0]).key);
  }, [agenda.status]);

  const onCast = useCallback((sessKey, emoji) => {
    const id = sessKey + ":" + emoji;
    /* Read storage rather than state, so a second tab on the same phone cannot
       double cast through a stale copy. */
    const held = readJSON(LS.reacted);
    if (held[id]) return;
    held[id] = 1;
    writeJSON(LS.reacted, held);
    setCastMap(held);
    castReaction(sessKey, emoji);
  }, []);

  const day = days.filter((d) => d.key === dayKey)[0] || days[0];

  return (
    <TabFrame tabKey="setlist">
      {agenda.status === "loading" ? (
        <Empty>Pulling the running order.</Empty>
      ) : null}

      {agenda.status === "failed" ? (
        <Empty>
          The running order did not load. {agenda.reason} Everything else on the
          wall still works.
        </Empty>
      ) : null}

      {day ? (
        <div>
          <div className="dayrow" role="tablist" aria-label="Days">
            {days.map((d) => (
              <button
                key={d.key}
                role="tab"
                className="daypill"
                aria-selected={d.key === dayKey}
                onClick={() => setDayKey(d.key)}
              >
                <span>
                  <span className="daypill__d t-display">{d.pillDate}</span>
                  <span className="daypill__n">{d.pill}</span>
                </span>
                {d.date === today ? (
                  <span className="daypill__dot" title="Today"></span>
                ) : null}
              </button>
            ))}
          </div>

          <div className="dayhead glow-card grille">
            <h3 className="dayhead__t t-display">{day.title}</h3>
            {day.note ? <p className="dayhead__note">{day.note}</p> : null}
            <WeatherLine w={weather ? weather[day.key] : null} />
            {isAdmin ? (
              <WeatherEdit dayKey={day.key} w={weather ? weather[day.key] : null} />
            ) : null}
            <div className="dayhead__attire">
              {day.attire.length ? (
                day.attire.map((a) => (
                  <div className="attire" key={a.k}>
                    <span className="attire__k">{a.k}</span>
                    <p className="attire__v">{a.v}</p>
                  </div>
                ))
              ) : (
                <div className="attire">
                  <span className="attire__k">Attire</span>
                  <p className="attire__v">Nothing specified for today.</p>
                </div>
              )}
            </div>
          </div>

          <div className="set-list">
            {day.sessions.map((sess) => (
              <SessionCard
                key={sess.key}
                sess={sess}
                day={day}
                now={now}
                counts={counts}
                castMap={castMap}
                onCast={onCast}
                open={!!open[sess.key]}
                tenureEntries={tenureEntries}
                tenureOpen={tenureOpen}
                onGoTab={onGoTab}
                canGoTab={canGoTab}
                isAdmin={isAdmin}
                onToggle={() => setOpen((prev) => {
                  const next = Object.assign({}, prev);
                  next[sess.key] = !prev[sess.key];
                  return next;
                })}
              />
            ))}
          </div>
        </div>
      ) : null}

      <BuildNote isAdmin={isAdmin} task="T1.1">
        Running order is the official agenda, which replaces the flier. Wednesday
        evening is three cards at the hotel: 6:00 cocktails, 6:30 dinner, 7:00 to
        9:00 karaoke and games. Lisa cancelled Smash Park on Aug 12 and that
        conflict is closed. No rooms, because the agenda names none. Append
        ?clock=2026-08-26T09:15:00-04:00 to any URL to test On Air, the dimming,
        and the 30 minute countdown.
      </BuildNote>
    </TabFrame>
  );
}

/* ==========================================================================
   T3.1 THE ROSTER, IN TWO LAYERS.

   `data/roster.json` is the base: 147 records, in the repo, fast, and it works
   with Firebase flat on its back. Firebase `roster/{slug}` is the override
   layer, written by the crew panel, and it merges on top of the base FIELD BY
   FIELD. That last part is the whole point. Fixing a spelling must not blank
   the club somebody typed ten minutes earlier, so a write only ever carries
   the fields that changed, and the merge only ever applies fields that are
   present and non-empty.

   A `roster/{slug}` with no counterpart in the base file is somebody the crew
   added at the meeting. Their headshot is not in the repo, because nothing in
   a browser can put a file there, so it rides on the record as compressed
   base64, the same way The Pit stores its photos.

   Base records cannot be deleted. You cannot take a line out of a static file
   from a phone. They carry `hidden: true` instead, which takes them off the
   wall and leaves them in the panel. Added records delete for real.

   `reviewed: true` clears the base file's `needsReview` flag. 124 of the 147
   names came off a filename and none of them are verified, so the panel counts
   down and the flag is how it knows what is left.

   Nothing in here invents a field. An empty title stays empty until a human
   types one.
   ========================================================================== */

const RST_NODE = "roster";

/* The four free text fields the crew edits. `newbie` is a boolean and `photo`
   is handled on its own, so neither belongs in this list. */
const RST_TEXT = ["name", "title", "club", "region"];

const RST_LABEL = {
  name: "Name", title: "Title", club: "Club", region: "Region",
  newbie: "First tour", photo: "Headshot"
};

/* Same rule as tools/process-assets.sh, ported line for line, because a slug
   built in the panel has to land on the same string the pipeline would have
   produced. Lowercase, hyphens, nothing else. "Last, First" flips. Accents
   fold to ASCII. */
function rstSlug(raw) {
  let s = String(raw == null ? "" : raw);
  const cut = s.indexOf(",");
  if (cut !== -1) s = s.slice(cut + 1) + " " + s.slice(0, cut);
  s = s.replace(/&/g, " and ");
  s = s.replace(/[\u2018\u2019\u02bc'`]/g, "");
  s = s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  /* Drop anything outside printable ASCII, the way iconv //IGNORE would. */
  s = s.replace(/[^\x20-\x7E]/g, "");
  return s.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+/, "").replace(/-+$/, "").toLowerCase();
}

function rstClean(s) { return String(s == null ? "" : s).trim(); }

/* The base file. One fetch, no listener. This is the layer that has to work
   when nothing else does, so nothing below waits on Firebase to render it. */
function useRosterBase() {
  const [state, setState] = useState({
    status: "loading", bySlug: {}, order: [], reason: ""
  });

  useEffect(() => {
    let live = true;
    fetch("data/roster.json", { cache: "no-cache" })
      .then((res) => {
        if (!res.ok) throw new Error("The file returned " + res.status + ".");
        return res.json();
      })
      .then((data) => {
        if (!live) return;
        /* A bare array or { attendees: [...] }. tools/process-assets.sh reads
           both shapes, so this reads both too. */
        const raw = Array.isArray(data) ? data : (data && data.attendees) || [];
        const bySlug = {};
        const order = [];
        raw.forEach((r, i) => {
          const rec = r || {};
          const slug = rstClean(rec.slug) || rstSlug(rstClean(rec.name)) || "row-" + i;
          /* First one wins. Two records on one slug is a file to fix, not
             something to silently overwrite here. */
          if (bySlug[slug]) return;
          bySlug[slug] = rec;
          order.push(slug);
        });
        setState({ status: "ready", bySlug: bySlug, order: order, reason: "" });
      })
      .catch((err) => {
        if (live) {
          setState({
            status: "failed", bySlug: {}, order: [],
            reason: (err && err.message) || String(err)
          });
        }
      });
    return () => { live = false; };
  }, []);

  return state;
}

/* The override layer. Starts as an empty map rather than null, so a Firebase
   that never answers reads as "no edits yet" and the base file renders on its
   own instead of behind a spinner nobody can clear. */
function useRosterEdits() {
  const [map, setMap] = useState({});

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref(RST_NODE);
    const handler = (snap) => setMap(snap.val() || {});
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return map;
}

/* THE MERGE. One person, base first, then every override field that is present
   and non-empty. A field the override does not carry is the base's field, which
   is what makes a name edit safe for a club and a club edit safe for a name.

   `changed` is only meaningful against a base record, so an added person gets
   an empty list rather than six fields marked as edits. */
function rstOne(slug, base, edit) {
  const b = base || null;
  const e = edit || null;
  const out = {
    slug: slug,
    name: "", title: "", club: "", region: "",
    newbie: false, photo: "",
    added: !b,
    hidden: false,
    reviewed: false,
    needsReview: false,
    changed: []
  };

  if (b) {
    out.name = rstClean(b.name);
    out.title = rstClean(b.title);
    out.club = rstClean(b.club);
    out.region = rstClean(b.region);
    out.newbie = b.newbie === true;
    out.photo = rstClean(b.photo);
    out.needsReview = b.needsReview === true;
  }

  if (e) {
    RST_TEXT.forEach((f) => {
      const v = rstClean(e[f]);
      if (!v) return;
      if (b && v !== out[f]) out.changed.push(f);
      out[f] = v;
    });
    if (typeof e.newbie === "boolean") {
      if (b && e.newbie !== out.newbie) out.changed.push("newbie");
      out.newbie = e.newbie;
    }
    const p = rstClean(e.photo);
    if (p) {
      if (b) out.changed.push("photo");
      out.photo = p;
    }
    out.hidden = e.hidden === true;
    out.reviewed = e.reviewed === true;
  }

  if (out.reviewed) out.needsReview = false;
  return out;
}

/* Everybody, merged, sorted by display name. Base records first in file order,
   then any slug that only exists in Firebase, which is somebody added. */
function rstAll(base, edits) {
  const out = [];
  base.order.forEach((slug) => out.push(rstOne(slug, base.bySlug[slug], edits[slug])));
  Object.keys(edits).forEach((slug) => {
    if (!base.bySlug[slug]) out.push(rstOne(slug, null, edits[slug]));
  });
  return out.sort((a, b) => a.name.localeCompare(b.name));
}

/* ------------------------------------------------------- roster writes */

/* `update` with nulls, never `set`. A null deletes that one field and leaves
   the rest of the record alone, which is the same field-by-field promise the
   merge makes on the way back out. `set` would replace the record and take
   somebody's club with it. */
function rstSave(slug, patch) {
  return FB.db.ref(RST_NODE + "/" + slug).update(patch);
}

/* Per-field revert. Drop the override and the base file's value comes back on
   its own, on every phone, because that is all the merge was ever doing. */
function rstRevert(slug, field) {
  return FB.db.ref(RST_NODE + "/" + slug + "/" + field).remove();
}

function rstDrop(slug) {
  return FB.db.ref(RST_NODE + "/" + slug).remove();
}

/* Firebase is reachable, or it is not. `.info/connected` is local to the SDK
   and flips within a second or two of the socket dropping, so it is the honest
   answer rather than a guess about the network. The grace period is there
   because every cold load is briefly disconnected, and a warning that flashes
   on load is a warning people learn to ignore. */
function useFbLive() {
  const [live, setLive] = useState(true);

  useEffect(() => {
    if (!FB.ok) { setLive(false); return; }
    let timer = null;
    const ref = FB.db.ref(".info/connected");
    const handler = (snap) => {
      if (snap.val() === true) {
        if (timer) { window.clearTimeout(timer); timer = null; }
        setLive(true);
      } else if (!timer) {
        timer = window.setTimeout(() => { timer = null; setLive(false); }, 5000);
      }
    };
    ref.on("value", handler);
    return () => {
      ref.off("value", handler);
      if (timer) window.clearTimeout(timer);
    };
  }, []);

  return live;
}

/* ==========================================================================
   T1.3 THE BAND. Spec 3.2.
   Search, filter pills, card grid, and a one-person view, over the merged
   roster above.

   Nothing in here reads a clock. BandTab is still handed `now` by App and
   ignores it on purpose: nothing in this tab is time sensitive, so there is
   nothing for useServerNow to gate.

   Nothing below knows a count or a region name. Every number and every pill
   comes off the merged roster, so a club typed into the crew panel turns up
   here as a filter with no code change.

   One club string is matched in code and only one: bandClubRank tests for a
   "Century Golf" prefix, so corporate staff sort FIRST, above Anthem, instead of
   between Canyon Oaks and Chenal. It is a prefix test rather than an exact name,
   so a fuller spelling still lands first. Corporate is also the only group with a
   hand set member order, BAND_CORPORATE_ORDER. Every other club renders in
   alphabetical order by name, because the whole roster is sorted by name as it
   loads and the club bags inherit that order.

   This comment used to claim other clubs kept the file's own order. That was wrong
   and it cost a wrong conclusion on Aug 17, when moving Natalie Bratcher to
   Balcones looked like it needed her record physically relocated. It did not.
   Position in data/roster.json has no effect on where anybody appears.
   ========================================================================== */

/* Fold accents and case, so a search for "jose" finds "José". macOS hands over
   decomposed names, which is the same trap tools/process-assets.sh hit with
   iconv, so this normalises both sides of the comparison. */
function bandNorm(s) {
  return String(s == null ? "" : s)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

/* Two letters for the tile that stands in for a missing headshot. First word
   and last word, so "Placeholder One" reads PO. */
function bandInitials(name) {
  const words = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "?";
  const last = words.length > 1 ? words[words.length - 1].charAt(0) : "";
  return (words[0].charAt(0) + last).toUpperCase();
}

/* One record, normalised once at load. `hay` is what the search reads, so a
   keystroke never re-normalises ninety names. */
function bandRecord(raw, i) {
  const r = raw || {};
  const name = String(r.name || "").trim();
  const title = String(r.title || "").trim();
  const club = String(r.club || "").trim();
  return {
    key: String(r.slug || "").trim() || "row-" + i,
    name: name,
    title: title,
    club: club,
    region: String(r.region || "").trim(),
    newbie: r.newbie === true,
    photo: String(r.photo || "").trim(),
    initials: bandInitials(name),
    hay: bandNorm(name + " " + title + " " + club)
  };
}

/* The base file plus the crew's edits, merged, ready for the grid. The base
   file drives `status`, so the tab renders 147 people the moment the file lands
   whether or not Firebase ever answers. `live` is only used to say out loud
   that edits are not syncing. */
function useRoster() {
  const base = useRosterBase();
  const edits = useRosterEdits();
  const live = useFbLive();

  const list = useMemo(() => {
    return rstAll(base, edits)
      .filter((p) => !p.hidden)
      .map(bandRecord)
      .filter((r) => r.name)
      .sort((a, b) => a.name.localeCompare(b.name));
  }, [base, edits]);

  return { status: base.status, reason: base.reason, list: list, live: live };
}

/* One entry per value actually on the merged roster, alphabetical, with a head
   count. A record with no club still shows under All and just never gets an
   entry of its own. A club typed into the crew panel appears here on its own,
   because this counts the merged list rather than reading a fixed table. */
function bandGroups(list, field) {
  const counts = {};
  list.forEach((r) => {
    if (r[field]) counts[r[field]] = (counts[r[field]] || 0) + 1;
  });
  return Object.keys(counts)
    .sort((a, b) => a.localeCompare(b))
    .map((name) => ({ name: name, n: counts[name] }));
}

/* Three independent filters, not one. Pills are All and Newbies. Club and
   region are selects, and they stack with Newbies rather than replacing it,
   because "first timers at Chenal" is a question somebody will actually ask
   and 29 clubs makes it hard to answer by eye. */
function bandKeeps(rec, tokens, f) {
  if (f.newbie && !rec.newbie) return false;
  if (f.club && rec.club !== f.club) return false;
  if (f.region && rec.region !== f.region) return false;
  /* Every word has to land somewhere in name, title, or club, so "north gm" and
     "placeholder one" both work and the order typed does not matter. */
  for (let i = 0; i < tokens.length; i++) {
    if (rec.hay.indexOf(tokens[i]) === -1) return false;
  }
  return true;
}

/* Century Golf corporate staff sort FIRST, above Anthem. Jim, Aug 13 2026. They
   sat last until then, on the reasoning that corporate is not a club.

   Read off the record rather than named here: any club value that starts
   "Century Golf" is corporate. That is the value the roster file carries today,
   and matching the prefix means "Century Golf Partners" lands in the same place
   if somebody spells it out in the crew panel.

   Rank 0 corporate, 1 clubs, 2 nobody with a club at all. Two groups in the same
   rank sort by club name, so the 26 clubs stay alphabetical under corporate. */
function bandClubRank(club) {
  if (!club) return 2;
  return /^century golf\b/i.test(club) ? 0 : 1;
}

/* Corporate is listed in an order Jim set by hand, not alphabetically. The first
   nine are seniority. From Amy Spittle down it runs alphabetically by first name,
   but the whole thing is written out rather than derived, because the rule is his
   to change and a derived rule would quietly reorder people the day somebody new
   arrives.

   Keyed by roster slug so a title or club edit in the crew panel cannot break it.
   Anyone at Century Golf who is NOT in this list sorts after everyone who is, by
   name, so a new hire appears at the bottom of corporate instead of vanishing.

   Look this up with record.KEY, not record.slug. bandRecord maps the roster's
   slug onto `key` and does not carry `slug` through, so reading `.slug` here
   returns undefined for everybody, every name falls into the unlisted branch, and
   the group silently comes out alphabetical. It looks like the order was ignored
   rather than like a bug, which is exactly how it got past me once already. */
const BAND_CORPORATE_ORDER = [
  "jim-hinckley",
  "doug-howe",
  "greg-adair",
  "james-hinckley",
  "mike-akeroyd",
  "jimmy-han",
  "john-martus",
  "carol-ruskowski",
  "bryan-stromme",
  "amy-spittle",
  "andrew-montemayor",
  "bruce-gerlander",
  "chris-may",
  "dawne-romine",
  "donny-darville",
  "gene-miller",
  "george-gdovin",
  "jeannette-walker",
  "jim-creighton",
  "jim-kern",
  "lisa-henrichsen",
  /* natalie-bratcher was here. Jim moved her to Balcones on Aug 17, so she is no
     longer sorted by this list. Her name coming out of it is the whole change. */
  "patrick-ryan",
  "todd-keefer",
  "tyler-busey",
  "yolanda-nuncio"
];

const BAND_CORPORATE_RANK = {};
BAND_CORPORATE_ORDER.forEach((s, i) => { BAND_CORPORATE_RANK[s] = i; });

/* Jim's order, applied to any list of corporate people.

   Shared because there are two render paths and they must agree. The grouped grid
   goes through bandByClub, and selecting a club in the select drops the headings
   and renders the filtered list flat, skipping bandByClub entirely. Sorting in
   only one of them meant Century Golf read in Jim's order under its heading and
   alphabetically the moment you filtered to it. */
function bandCorporateSort(people) {
  return people.slice().sort((a, b) => {
    const ra = BAND_CORPORATE_RANK[a.key];
    const rb = BAND_CORPORATE_RANK[b.key];
    const ha = ra === undefined ? 1 : 0;
    const hb = rb === undefined ? 1 : 0;
    /* Listed people first in Jim's order, then anyone unlisted by name. */
    if (ha !== hb) return ha - hb;
    if (ha) return String(a.name).localeCompare(String(b.name));
    return ra - rb;
  });
}

/* Lisa asked for club order instead of alphabetical, so the grid is grouped
   rather than sorted differently. People inside a group keep the roster's own
   name order, which is what makes a club heading scannable.

   Grouping only, no filtering. Whatever list arrives is the list that comes
   back out, so nobody can go missing between the filter and the heading. */
function bandByClub(list) {
  const bag = {};
  const order = [];
  list.forEach((r) => {
    const club = r.club || "";
    if (!bag[club]) { bag[club] = []; order.push(club); }
    bag[club].push(r);
  });

  return order
    .map((club) => {
      const rank = bandClubRank(club);
      /* Corporate only. Every club keeps the roster's own order, which is what
         makes a club heading scannable. */
      const people = rank === 0 ? bandCorporateSort(bag[club]) : bag[club];
      return {
        club: club,
        label: club || "No club on the roster",
        rank: rank,
        people: people
      };
    })
    .sort((a, b) => (a.rank - b.rank) || a.club.localeCompare(b.club));
}

function bandNothing(query, f) {
  if (query.trim()) return "Nobody by that name. Try fewer letters.";
  if (f.newbie && f.club) return "No first timers from " + f.club + ".";
  if (f.newbie) return "No first timers on this list.";
  if (f.club) return "Nobody from " + f.club + ".";
  return "Nobody in that region.";
}

/* "87 on the tour, 14 first timers". Both numbers come off the file. */
function BandCount({ total, newbies }) {
  return (
    <p className="bnd-count">
      <span className="bnd-count__n t-data">{total}</span> on the tour,{" "}
      {newbies === 0 ? "no first timers" : (
        <React.Fragment>
          <span className="bnd-count__n t-data">{newbies}</span>
          {newbies === 1 ? " first timer" : " first timers"}
        </React.Fragment>
      )}.
    </p>
  );
}

/* The headshot, or the tile that stands in for one. Shared by the grid cell and
   the one-person view, so a missing photo cannot look like two different kinds
   of hole. Spans throughout, because the grid cell is a button. */
function BandShot({ rec, broken, onBroken, big }) {
  const hasPhoto = !!rec.photo && !broken;
  return (
    <span className={"bnd-shot" + (big ? " bnd-shot--big" : "")}>
      {hasPhoto ? (
        <img
          className="bnd-shot__img"
          src={rec.photo}
          alt=""
          loading="lazy"
          decoding="async"
          onError={() => onBroken(rec.key)}
        />
      ) : (
        <span className="bnd-shot__img bnd-shot__init grille" aria-hidden="true">
          <span className="bnd-shot__ini t-display">{rec.initials}</span>
        </span>
      )}
      {rec.newbie ? (
        <span className="pick bnd-pick" aria-hidden="true">
          <span className="pick__text">First<br />Tour</span>
        </span>
      ) : null}
    </span>
  );
}

function BandCard({ rec, broken, onBroken, onOpen }) {
  return (
    <button type="button" className="bnd-card grille" onClick={() => onOpen(rec.key)}>
      <BandShot rec={rec} broken={broken} onBroken={onBroken} />
      <span className="bnd-card__b">
        <span className="bnd-card__n">{rec.name}</span>
        {rec.title ? <span className="bnd-card__t">{rec.title}</span> : null}
        {rec.club ? <span className="bnd-card__c">{rec.club}</span> : null}

function BandTab({ isAdmin }) {
  const roster = useRoster();
  const [query, setQuery] = useState("");
  const [newbieOnly, setNewbieOnly] = useState(false);
  const [club, setClub] = useState("");
  const [region, setRegion] = useState("");
  const [selected, setSelected] = useState(null);
  const [broken, setBroken] = useState({});
  const scrollBack = useRef(0);
  const backBtn = useRef(null);

  const list = roster.list;
  const total = list.length;
  const newbies = list.filter((r) => r.newbie).length;
  const clubs = useMemo(() => bandGroups(list, "club"), [list]);
  const regions = useMemo(() => bandGroups(list, "region"), [list]);
  const filter = { newbie: newbieOnly, club: club, region: region };
  const anyFilter = newbieOnly || !!club || !!region;
  const tokens = bandNorm(query).split(/\s+/).filter(Boolean);
  const shown = list.filter((r) => bandKeeps(r, tokens, filter));
  const person = selected ? list.filter((r) => r.key === selected)[0] || null : null;

  /* The club select already says which club you are looking at, and every
     heading would then be the same word. So the headings come off when a club
     filter is on and the grid goes flat. Newbies and search keep the headings,
     because both cut across clubs and the heading is the only thing telling you
     the two first timers you can see are not from the same place. */
  const grouped = !club;
  const groups = grouped ? bandByClub(shown) : [];

  /* The flat path, used when a club filter is on, has to honour the same order.
     Only corporate has a hand set order, so every other club is untouched. */
  const flat = grouped ? shown
    : (bandClubRank(club) === 0 ? bandCorporateSort(shown) : shown);

  /* A club that stops existing, because the crew corrected the last record that
     carried it, would otherwise leave the select pointing at nothing and the
     grid empty with no way to see why. Drop the filter instead. */
  useEffect(() => {
    if (club && !clubs.some((c) => c.name === club)) setClub("");
  }, [club, clubs]);

  useEffect(() => {
    if (region && !regions.some((g) => g.name === region)) setRegion("");
  }, [region, regions]);

  /* A photo path that 404s is the same hole as no photo at all, and today every
     path in the file is one, because assets/attendees is empty until T3.1. Both
     fall back to the initials tile. */
  const markBroken = useCallback((key) => {
    setBroken((prev) => {
      if (prev[key]) return prev;
      const next = Object.assign({}, prev);
      next[key] = 1;
      return next;
    });
  }, []);

  /* Captured on the tap rather than in the effect. By the time an effect runs
     the grid is already gone and the browser may have clamped the scroll
     position to the shorter page. */
  const openPerson = useCallback((key) => {
    scrollBack.current = window.pageYOffset || 0;
    setSelected(key);
  }, []);

  useEffect(() => {
    if (selected) {
      window.scrollTo(0, 0);
      const el = backBtn.current;
      if (el) {
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
      }
    } else if (scrollBack.current) {
      window.scrollTo(0, scrollBack.current);
      scrollBack.current = 0;
    }
  }, [selected]);

  useEffect(() => {
    if (!selected) return;
    const onKey = (e) => { if (e.key === "Escape") setSelected(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [selected]);

  return (

/* ==========================================================================
   T1.4 SOUNDCHECK. Spec 3.4.
   The Q and A. Carol asked whether this updates live for the regional team. It
   does: one Firebase listener on `questions`, so a question typed in the back
   row lands on the regional team's laptop in about a second with no reload.

   Every clock decision reads the server corrected `now` handed down from
   useServerNow, and `ts` is written by the server rather than by the phone, so
   a device an hour out cannot post a question stamped tomorrow.

   Display Mode reads the body class the header toggle already sets, so no
   wiring is needed in App to build the projector variant.
   ========================================================================== */

/* Exactly six, in this order, everywhere: the dropdown, the filter pills, and
   the CSV grouping. Presenters pull the questions for their session by
   category, so the list is fixed rather than free text. */
const SC_CATEGORIES = [
  "Membership Sales",
  "Retention",
  "Programming",
  "Pricing",
  "Operations",
  "Other"
];

const SC_MAX_TEXT = 500;
const SC_MAX_NAME = 60;
const SC_WALL_COUNT = 12;    /* top questions on the projector          */
const SC_WALL_SPEED = 26;    /* pixels per second the wall walks upward  */

/* The server stamps the time. The device clock is only a last resort if the
   Firebase library is not there at all, in which case nothing is syncing
   anyway. */
function scServerStamp() {
  try {
    return firebase.database.ServerValue.TIMESTAMP;
  } catch (e) {
    return Date.now();
  }
}

/* One listener for the whole node. Defensive on the way in: a hand edited
   record cannot crash the tab, and an unknown category reads as Other. */
function useScQuestions() {
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(!FB.ok);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("questions");
    const handler = (snap) => {
      const all = snap.val() || {};
      const list = [];
      Object.keys(all).forEach((id) => {
        const r = all[id];
        if (!r || typeof r.text !== "string" || !r.text) return;
        list.push({
          id: id,
          text: r.text,
          name: typeof r.name === "string" ? r.name : "",
          club: typeof r.club === "string" ? r.club : "",
          category: SC_CATEGORIES.indexOf(r.category) >= 0 ? r.category : "Other",
          anonymous: r.anonymous === true,
          votes: typeof r.votes === "number" ? r.votes : 0,
          answered: r.answered === true,
          pinned: r.pinned === true,
          ts: typeof r.ts === "number" ? r.ts : 0
        });
      });
      setItems(list);
      setReady(true);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return { items: items, ready: ready };
}

/* The header Display Mode toggle sets a class on body. Watching the class
   rather than taking a prop keeps App untouched, which matters because several
   tabs are being built at once. */
function useScDisplayMode() {
  const [on, setOn] = useState(
    () => document.body.classList.contains("display-mode")
  );

  useEffect(() => {
    const el = document.body;
    const read = () => setOn(el.classList.contains("display-mode"));
    read();
    if (!window.MutationObserver) return;
    const obs = new MutationObserver(read);
    obs.observe(el, { attributes: true, attributeFilter: ["class"] });
    return () => obs.disconnect();
  }, []);

  return on;
}

/* Relative against the corrected clock, never Date.now(). A negative span,
   which happens for a second when the local echo of a server timestamp lands
   slightly ahead, reads as "just now" rather than as a time in the future. */
function scRelTime(ts, now) {
  if (!ts) return "just now";
  const diff = now - ts;
  if (diff < 45000) return "just now";
  const m = Math.round(diff / 60000);
  if (m < 60) return m + " min ago";
  const h = Math.round(diff / 3600000);
  if (h < 24) return h + (h === 1 ? " hr ago" : " hr ago");
  const d = Math.round(diff / 86400000);
  return d + (d === 1 ? " day ago" : " days ago");
}

/* Answered sinks, pinned rises, then either votes or recency. Answered is
   tested before pinned on purpose: an answered question leaves the top of the
   wall even if somebody pinned it earlier. */
function scSort(list, mode) {
  return list.slice().sort((a, b) => {
    const aa = a.answered ? 1 : 0;
    const ba = b.answered ? 1 : 0;
    if (aa !== ba) return aa - ba;

    const ap = a.pinned ? 0 : 1;
    const bp = b.pinned ? 0 : 1;
    if (ap !== bp) return ap - bp;

    if (mode === "top" && a.votes !== b.votes) return b.votes - a.votes;
    return b.ts - a.ts;
  });
}

function scWho(q) {
  if (q.anonymous) return "Anonymous";
  return q.name || "Somebody in the room";
}

function scWhere(q) { return q.anonymous ? "" : q.club; }

/* ---------------------------------------------------------------- CSV */
/* Grouped by category, one header row, and it has to survive Excel. Every
   field is quoted, internal quotes are doubled, newlines are flattened to a
   space, lines end CRLF, and the file leads with a BOM so accented names do
   not arrive as mojibake. */
const SC_CSV_COLS = [
  "Category", "Votes", "Answered", "Pinned",
  "Question", "Name", "Club", "Anonymous", "Submitted (Eastern)"
];

function scCsvCell(value) {
  let s = value === null || value === undefined ? "" : String(value);
  s = s.replace(/\r\n|\r|\n/g, " ").trim();
  /* Excel evaluates a leading =, + or @ as a formula even inside quotes. A
     leading apostrophe stops that. Leading - is left alone, because a dash
     opening a sentence is a real thing people type and Excel lands it as
     text. */
  if (/^[=+@]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

/* 2026-08-25 14:03 Eastern. Excel parses that as a datetime without being
   asked. Intl does the DST work rather than a hardcoded offset. */
function scEtStamp(ms) {
  if (!ms) return "";
  try {
    const f = new Intl.DateTimeFormat("en-CA", {
      timeZone: ET, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    });
    const p = {};
    f.formatToParts(ms).forEach((x) => { p[x.type] = x.value; });
    const hh = p.hour === "24" ? "00" : p.hour;
    return p.year + "-" + p.month + "-" + p.day + " " + hh + ":" + p.minute;
  } catch (e) {
    return new Date(ms).toISOString().slice(0, 16).replace("T", " ");
  }
}

function scBuildCsv(list) {
  const rank = {};
  SC_CATEGORIES.forEach((c, i) => { rank[c] = i; });

  const rows = list.slice().sort((a, b) => {
    const d = (rank[a.category] || 0) - (rank[b.category] || 0);
    if (d !== 0) return d;
    if (a.votes !== b.votes) return b.votes - a.votes;
    return a.ts - b.ts;
  });

  const lines = [SC_CSV_COLS.map(scCsvCell).join(",")];

  rows.forEach((q) => {
    lines.push([
      q.category,
      q.votes,
      q.answered ? "Yes" : "No",
      q.pinned ? "Yes" : "No",
      q.text,
      q.anonymous ? "" : q.name,
      q.anonymous ? "" : q.club,
      q.anonymous ? "Yes" : "No",
      scEtStamp(q.ts)
    ].map(scCsvCell).join(","));
  });

  /* Escaped, not a literal byte-order mark, so this survives being copied
     out of a spec and pasted into a file. Excel needs it to read accents. */
  return "\uFEFF" + lines.join("\r\n") + "\r\n";
}

function scSaveCsv(text, filename) {
  try {
    const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) {
    return false;
  }
}

/* Name and club are optional and stay filled after a send, because one person
   usually asks more than one question. The body clears. Category defaults to
   nothing rather than to Membership Sales: a wrong tag is worse than an
   untagged question, so a blank selection is stored as Other. */
function ScAsk({ onPost, live }) {
  const [name, setName] = useState("");
  const [club, setClub] = useState("");
  const [category, setCategory] = useState("");
  const [anon, setAnon] = useState(false);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState("");
  const [err, setErr] = useState("");

  function submit(e) {
    e.preventDefault();
    const clean = {
      text: text.trim().slice(0, SC_MAX_TEXT),
      name: anon ? "" : name.trim().slice(0, SC_MAX_NAME),
      club: anon ? "" : club.trim().slice(0, SC_MAX_NAME),
      category: SC_CATEGORIES.indexOf(category) >= 0 ? category : "Other",
      anonymous: anon
    };

    if (!clean.text) {
      setOk("");
      setErr("Type a question first.");
      return;
    }

    setBusy(true);
    setErr("");
    setOk("");

    onPost(clean).then((sent) => {
      setBusy(false);
      if (sent) {
        setText("");
        setOk("That is on the wall. Everyone can see it now.");
      } else {
        setErr("That did not send. Try again in a second.");
      }
    });
  }

  return (
    <form className="sc-ask glow-card grille" onSubmit={submit}>
      <h3 className="sc-ask__h t-display">Ask Something</h3>
      <p className="sc-ask__p">
        Presenters read these. Short and specific beats long and polite.
      </p>

      <div className="tf">
        <div className="sc-two">
          <label className="tf__l">
            <span>Your name, optional</span>
            <input
              className="tf__in"
              value={name}
              maxLength={SC_MAX_NAME}
              disabled={anon}
              autoComplete="name"
              onChange={(e) => setName(e.target.value)}
            />
          </label>
          <label className="tf__l">
            <span>Your club, optional</span>
            <input
              className="tf__in"
              value={club}
              maxLength={SC_MAX_NAME}
              disabled={anon}
              onChange={(e) => setClub(e.target.value)}
            />
          </label>
        </div>

        <label className="tf__l">
          <span>Category</span>
          <select
            className="tf__in sc-select"
            value={category}
            onChange={(e) => setCategory(e.target.value)}
          >
            <option value="">Pick one</option>
            {SC_CATEGORIES.map((c) => (
              <option key={c} value={c}>{c}</option>
            ))}
          </select>
        </label>

        <div className="sc-pills" style={{ margin: "0 0 9px" }}>
          <button
            type="button"
            className="sc-pill"
            aria-pressed={anon}
            onClick={() => setAnon(!anon)}
          >
            {anon ? "\u{1F576} Anonymous" : "Ask anonymously"}
          </button>
        </div>

        <label className="tf__l">
          <span>Your question</span>
          <textarea
            className="tf__in sc-body"
            value={text}
            maxLength={SC_MAX_TEXT}
            placeholder="What do you actually want to know?"
            onChange={(e) => setText(e.target.value)}
          />
        </label>
        <p className="sc-count t-data">{text.length}/{SC_MAX_TEXT}</p>

        <div className="tf__row">
          <button type="submit" className="btn btn--go" disabled={busy || !live}>
            {busy ? "Sending" : "Send it in"}
          </button>
        </div>
      </div>

      {anon ? (
        <p className="sc-ask__note">Your name and club stay off it.</p>
      ) : null}
      {category === "" ? (
        <p className="sc-ask__note">No category picked, so it files under Other.</p>
      ) : null}
      {ok ? <p className="sc-ask__ok">{ok}</p> : null}
      {err ? <p className="sc-ask__err">{err}</p> : null}
    </form>
  );
}
