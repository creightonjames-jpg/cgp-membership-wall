<style id="wall-css">
/* ==========================================================================
   THE LIVE WALL. Design system.
   This block is the single source of truth. tokens.html and motifs.html read
   it straight out of this file rather than keeping a copy, so a proof sheet
   can never drift from what actually ships.
   ROADMAP T0.3 tokens, T0.4 motifs, T0.5 shell. Spec sections 2.1 to 2.3.
   ========================================================================== */

/* -------------------------------------------------------- T0.3 tokens */
:root {
  /* Palette. Twelve tokens, spec 2.1. */
  --stage:   #17161A;  /* page background, near black with a warm cast     */
  --riser:   #201E24;  /* card and panel background                        */
  --input:   #2A272E;  /* form fields, inactive pills                      */
  --scarlet: #C8102E;  /* primary accent, headers, active, primary buttons */
  --oxblood: #8A0E1F;  /* pressed and hover, deep borders, gradients       */
  --gold:    #D9A94C;  /* secondary accent, awards, trophies, posters      */
  --cream:   #F7F3EA;  /* body text                                       */
  --dim:     #A39B92;  /* secondary text, metadata                        */
  --mute:    #6E6862;  /* timestamps, disabled text, fine print           */
  --edge:    #332F38;  /* card borders, dividers                          */
  --danger:  #FF6B4A;  /* delete and destructive admin actions            */
  --glow:    rgba(200, 16, 46, 0.12); /* scarlet tint, hover and selected  */

  /* Type, spec 2.2. Alfa Slab One is rationed to awards and Encore cards.
     Anywhere else it reads as a novelty font. */
  --font-display: 'Anton', Impact, 'Haettenschweiler', sans-serif;
  --font-poster:  'Alfa Slab One', Georgia, serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* The two gradients that carry the stage feel, spec 2.1. */
  --grad-stage:   radial-gradient(62% 42% at 50% 20%, #2A1418 0%, var(--stage) 72%);
  --grad-primary: linear-gradient(180deg, var(--scarlet) 0%, var(--oxblood) 100%);

  /* Motif dials. Override per instance, not at the call site.
     These are not palette tokens. The palette is the twelve above and stays
     twelve, so tokens.html keeps telling the truth. Everything here is mixed
     from those twelve. */
  --ticket-stub-w: 84px;    /* width of the tear-off on a ticket stub card */
  --notch-bg: var(--stage); /* what shows through a ticket notch           */

  /* Chrome warmth. Oxblood laid over --input as a flat overlay rather than
     color-mix, which is not safe on every phone that will be in the room. */
  --warm-fill: rgba(138, 14, 31, 0.22);
  --warm-fill-strong: rgba(138, 14, 31, 0.40);
  --warm-edge: rgba(200, 16, 46, 0.38);
  --gold-rule: rgba(217, 169, 76, 0.42);

  /* Notch and home indicator. Zero on anything without a cutout. */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

/* ------------------------------------------------------------- baseline */
*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100svh;
  background: var(--stage);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font-family: inherit; }

/* Display faces are all caps and tight. Never italic. */
.t-display {
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  line-height: 0.94;
}

.t-poster { font-family: var(--font-poster); font-weight: 400; letter-spacing: 0.01em; }

/* Leaderboard scores and counts. Digits must not jitter as they update. */
.t-data { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0;
  margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   T0.4 MOTIF PRIMITIVES. Spec 2.3.
   Each one is a reusable class. No custom illustration, all CSS.
   ========================================================================== */

/* -------------------------------------------------- 1. ticket stub card */
/* Do not add overflow:hidden here. It would clip the notches. */
.ticket {
  position: relative;
  display: flex;
  align-items: stretch;
  background: var(--riser);
  border: 1px solid var(--edge);
  border-radius: 10px;
}

.ticket__stub {
  flex: 0 0 var(--ticket-stub-w);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  padding: 14px 8px;
  border-right: 2px dashed var(--edge);
  text-align: center;
}

.ticket__body {
  flex: 1 1 auto;
  min-width: 0;           /* lets long titles wrap instead of pushing wide */
  padding: 14px 16px;
}

.ticket::before, .ticket::after {
  content: '';
  position: absolute;
  left: var(--ticket-stub-w);
  width: 15px; height: 15px;
  background: var(--notch-bg);
  border-radius: 50%;
  transform: translateX(-50%);
}

.ticket::before { top: calc(-15px / 2 - 1px); }
.ticket::after  { bottom: calc(-15px / 2 - 1px); }

/* ------------------------------------------------- 2. guitar pick badge */
.pick {
  --pick-fill: var(--gold);
  display: grid; place-items: center;
  width: 68px; aspect-ratio: 1 / 0.96;
  background: var(--pick-fill);
  clip-path: polygon(
    15% 8%, 28% 2%, 50% 0%, 72% 2%, 85% 8%,
    95% 25%, 98% 42%,
    88% 68%, 68% 88%, 55% 98%, 50% 100%,
    45% 98%, 32% 88%, 12% 68%,
    2% 42%, 5% 25%
  );
}

.pick__text {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: 11px; line-height: 1;
  text-align: center; color: #2A1408;
  padding-bottom: 12%;      /* nudge off the tapered tip */
  letter-spacing: 0.02em;
}

/* ---------------------------------------------------- 3. amp grille texture */
.grille { position: relative; }
.grille > * { position: relative; z-index: 1; }

.grille::before {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none; border-radius: inherit;
  background-image:
    repeating-linear-gradient( 45deg, rgba(247,243,234,0.030) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(-45deg, rgba(247,243,234,0.030) 0 1px, transparent 1px 5px);
}

/* ------------------------------------------------------ 4. stage light glow */
.glow-stage {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background: var(--grad-stage);
}

.glow-card {
  position: relative;
  background:
    radial-gradient(80% 62% at 50% 0%, rgba(200,16,46,0.20) 0%, transparent 70%),
    var(--riser);
  border: 1px solid var(--edge);
  border-radius: 12px;
}

/* ------------------------------------------------------- 5. marquee strip */
.marquee {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--oxblood) 0%, #6B0A18 100%);
  border-radius: 6px;
  padding: 6px 0;
}

.marquee::before, .marquee::after {
  content: '';
  position: absolute; left: 0; right: 0; height: 7px;
  background-image: radial-gradient(circle, var(--gold) 0 1.6px, rgba(0,0,0,0.35) 2px);
  background-size: 13px 7px;
  background-repeat: repeat-x;
  background-position: center;
}

.marquee::before { top: 0; }
.marquee::after  { bottom: 0; }

.marquee__track {
  display: flex; width: max-content; padding: 5px 0;
  animation: marquee-slide 22s linear infinite;
}

.marquee__item {
  padding: 0 28px; white-space: nowrap;
  font-weight: 600; font-size: 14px; color: var(--cream);
}

@keyframes marquee-slide {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }   /* content is duplicated once */
}

/* A scrolling banner is exactly the thing that makes some people ill. */
@media (prefers-reduced-motion: reduce) {
  .marquee__track { animation: none; width: 100%; flex-wrap: wrap; }
  .marquee__item { white-space: normal; padding: 0 14px; }
  .marquee__item + .marquee__item { display: none; }  /* drop the duplicate */
}

/* ---------------------------------------------------------- 6. vinyl label */
.vinyl {
  position: relative; aspect-ratio: 1; width: 100%;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(247,243,234,0.055) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 50% 50%, var(--oxblood) 0 33%, #0C0B0E 33.5% 100%);
  display: grid; place-items: center;
}

.vinyl__photo {
  width: 56%; aspect-ratio: 1; border-radius: 50%;
  object-fit: cover; border: 3px solid var(--gold); background: var(--input);
}

/* ------------------------------------------------- 7. setlist strike-through */
.struck { position: relative; display: inline-block; }

.struck::after {
  content: '';
  position: absolute; left: -2%; right: -2%; top: 52%;
  height: 2px; background: var(--scarlet); border-radius: 2px;
  transform: rotate(-1.2deg);
}

.is-done { opacity: 0.55; }

/* ==========================================================================
   T0.5 APP SHELL
   ========================================================================== */

#root { position: relative; z-index: 1; }

/* --------------------------------------------------------- welcome hero */
.welcome {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

/* The band strip is full bleed at the top, so the welcome itself carries no
   padding. .welcome__body takes it instead. */
.welcome__body {
  flex: 1 1 auto;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 20px calc(20px + var(--safe-r))
           calc(36px + var(--safe-b)) calc(20px + var(--safe-l));
}

/* ---------------------------------------------------------- band strip */
/* The flier's own hero, four panels wide. Treated as a lit stage: the lights
   come up on each band member in turn, the picture dissolves into the page,
   and gold footlights run along the bottom lip.
   Aspect ratio matches the source exactly, so nothing is cropped. */
.band {
  position: relative;
  flex: 0 0 auto;
  width: 100%;
  margin-top: var(--safe-t);
  aspect-ratio: 786 / 404;
  overflow: hidden;
}

.band__img {
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 28%;   /* keeps the faces high in frame */
}

/* Knocks the bright whites back so cream text below stays the loudest thing
   on the screen, and pulls the picture into the scarlet palette. */
.band__grade {
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(125% 85% at 50% 0%, rgba(200,16,46,0.26) 0%, transparent 68%),
    linear-gradient(180deg,
      rgba(23,22,26,0.45) 0%,
      rgba(23,22,26,0.05) 24%,
      rgba(23,22,26,0.26) 50%,
      rgba(23,22,26,0.72) 78%,
      rgba(23,22,26,0.95) 92%,
      var(--stage) 100%);
}

/* Four shutters over four panels. Each lifts in turn, left to right. */
.band__lights {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  pointer-events: none;
}

/* Base state is transparent on purpose. If the animation never runs, on an old
   browser or with animations disabled, the failure shows the picture rather
   than hiding it behind four solid panels. `both` fill holds the shutter
   opaque through its delay and lands it back at transparent. */
.band__lights span {
  background: var(--stage);
  opacity: 0;
  animation: band-lights-up 700ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc(var(--i) * 180ms);
}

@keyframes band-lights-up {
  from { opacity: 1; }
  to   { opacity: 0; }
}

/* ------------------------------------------- ground illumination flares */
/* Light blooming up off the stage floor. OFF by default. Add .band--flares to
   the .band element to switch it on. Preview at flares.html before committing
   this to the welcome screen.
   Uses mix-blend-mode screen so the blooms read as light rather than as paint
   laid over the picture. Animates opacity and transform only, no filters, so
   it stays cheap on an older phone. */
.band__flares { display: none; }

/* Peak brightness lives on .band--flares, not on the inner container. Put it
   on the container and it shadows any override set alongside .band--flares,
   because the span resolves the variable from its nearest ancestor. */
.band--flares { --flare-max: 0.70; }

.band--flares .band__flares {
  display: block;
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 62%;
  overflow: hidden;
  pointer-events: none;
}

/* Low haze sitting on the floor, so the flares have something to sit in. */
.band--flares .band__flares::before {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 36%;
  background: linear-gradient(0deg, rgba(217,169,76,0.17) 0%, transparent 100%);
  mix-blend-mode: screen;
  animation: flare-haze 6.5s ease-in-out infinite alternate;
}

.band__flares span {
  position: absolute;
  bottom: -12%;
  left: var(--x);
  width: 42%;
  aspect-ratio: 1 / 1.25;
  transform: translateX(-50%);
  transform-origin: 50% 100%;
  mix-blend-mode: screen;
  background: radial-gradient(48% 50% at 50% 100%,
    rgba(217,169,76,0.62) 0%,
    rgba(226,116,58,0.34) 26%,
    rgba(200,16,46,0.26) 52%,
    transparent 76%);
  animation: flare-breathe var(--dur) ease-in-out var(--delay) infinite alternate;
}

/* Negative delays start each flare mid cycle, so they never pulse in unison. */
@keyframes flare-breathe {
  from {
    opacity: calc(var(--flare-max, 0.7) * 0.42);
    transform: translateX(-50%) scale(0.90, 0.86);
  }
  to {
    opacity: var(--flare-max, 0.7);
    transform: translateX(-50%) scale(1.06, 1.14);
  }
}

@keyframes flare-haze {
  from { opacity: 0.5; }
  to   { opacity: 1; }
}

/* Hold a lit state, lose the pulsing. */
@media (prefers-reduced-motion: reduce) {
  .band__flares span,
  .band--flares .band__flares::before { animation: none; }
  .band__flares span { opacity: calc(var(--flare-max, 0.7) * 0.72); }
}

/* ---------------------------------------------------------- stage pyro */
/* Gerb fountains at the front of the stage. Fine sparks crackling upward, plus
   a Roman candle ball that climbs, drifts, and dies. OFF unless .band--pyro.
   Transform and opacity only. Screen blend so sparks read as light. */
.band__pyro { display: none; }

.band--pyro .band__pyro {
  display: block;
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* Every timing lives here rather than in JS, so the welcome screen and
   flares.html both write plain markup and cannot drift apart. Three gerbs,
   seven sparks and one candle each. */
.band__pyro .gerb {
  position: absolute;
  bottom: 5%;
  left: var(--x);
  width: 0; height: 0;
  --gerb-offset: 0s;
}

.band__pyro .gerb:nth-child(1) { --x: 18%; --gerb-offset: 0s;   }
.band__pyro .gerb:nth-child(2) { --x: 50%; --gerb-offset: 0.7s; }
.band__pyro .gerb:nth-child(3) { --x: 82%; --gerb-offset: 1.3s; }

.band__pyro .spark,
.band__pyro .candle {
  position: absolute;
  left: 0; bottom: 0;
  border-radius: 50%;
  mix-blend-mode: screen;
  transform: translate(-50%, 0);
  /* Deliberately no will-change. Two dozen promoted layers is a real cost on
     an older phone, and transform and opacity are already fast paths. */
}

.band__pyro .spark {
  width: var(--size); height: var(--size);
  background: radial-gradient(circle,
    #FFF7E4 0 30%, var(--gold) 58%, rgba(226,116,58,0) 100%);
  animation: pyro-spark var(--dur) linear
             calc(var(--delay) - var(--gerb-offset)) infinite;
}

/* Scatter. Uneven on purpose, so no two sparks trace the same arc. */
.band__pyro .spark:nth-child(1) { --drift:  -9px; --rise: 52px; --dur: 1.55s; --delay: -0.20s; --size: 3px; }
.band__pyro .spark:nth-child(2) { --drift:   7px; --rise: 41px; --dur: 1.90s; --delay: -0.75s; --size: 2px; }
.band__pyro .spark:nth-child(3) { --drift:  -4px; --rise: 66px; --dur: 1.40s; --delay: -1.10s; --size: 2px; }
.band__pyro .spark:nth-child(4) { --drift:  11px; --rise: 48px; --dur: 2.05s; --delay: -0.45s; --size: 3px; }
.band__pyro .spark:nth-child(5) { --drift:  -7px; --rise: 58px; --dur: 1.70s; --delay: -1.55s; --size: 2px; }
.band__pyro .spark:nth-child(6) { --drift:   4px; --rise: 37px; --dur: 1.30s; --delay: -0.95s; --size: 4px; }
.band__pyro .spark:nth-child(7) { --drift: -11px; --rise: 62px; --dur: 2.20s; --delay: -1.35s; --size: 2px; }

/* One glow allowance, on three elements only. Cheap enough, and the candle
   needs to read as brighter than the crackle around it. */
.band__pyro .candle {
  width: 7px; height: 7px;
  --dur: 5.4s; --rise: 112px; --drift: 0px; --delay: 0s;
  background: radial-gradient(circle,
    #FFFDF6 0 34%, var(--gold) 62%, rgba(200,16,46,0) 100%);
  box-shadow: 0 0 10px 2px rgba(217,169,76,0.65);
  animation: pyro-candle var(--dur) cubic-bezier(0.18, 0.62, 0.36, 1)
             var(--delay) infinite;
}

/* Offset so the three candles fire in rotation, never together. */
.band__pyro .gerb:nth-child(1) .candle { --delay:  0.0s; --drift:  -9px; }
.band__pyro .gerb:nth-child(2) .candle { --delay: -1.8s; --drift:   0px; --rise: 128px; }
.band__pyro .gerb:nth-child(3) .candle { --delay: -3.6s; --drift:   9px; }

/* Up fast, apex, then drift and fall back a little as it burns out. */
@keyframes pyro-spark {
  0%   { transform: translate(-50%, 0) scale(1); opacity: 0; }
  10%  { opacity: 1; }
  62%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1)) scale(0.7); opacity: 0.9; }
  100% { transform: translate(calc(-50% + var(--drift) * 1.4),
                              calc(var(--rise) * -0.7)) scale(0.2); opacity: 0; }
}

/* The action sits in the first half of the timeline. The dead second half is
   what makes it read as a candle firing in rotation instead of a hose. */
@keyframes pyro-candle {
  0%   { transform: translate(-50%, 0) scale(0.45); opacity: 0; }
  4%   { transform: translate(-50%, -4px) scale(1); opacity: 1; }
  30%  { opacity: 0.95; }
  42%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1)) scale(0.8); opacity: 0.45; }
  50%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1.06)) scale(0.22); opacity: 0; }
  100% { opacity: 0; }
}

/* Pyro is motion and nothing else. Frozen sparks read as dust on the lens, so
   for anyone who asked for less motion it goes away entirely. */
@media (prefers-reduced-motion: reduce) {
  .band--pyro .band__pyro { display: none; }
}

/* Footlights along the stage lip. Same bulb values as the marquee, so the
   motif reads as one language rather than two. */
.band__lip {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 7px;
  pointer-events: none;
  background-image: radial-gradient(circle, var(--gold) 0 1.6px, rgba(0,0,0,0.45) 2px);
  background-size: 13px 7px;
  background-repeat: repeat-x;
  background-position: center;
  opacity: 0.85;
}

/* Lights snap on with no sequence for anyone who asked for less motion. */
@media (prefers-reduced-motion: reduce) {
  .band__lights span { animation: none; opacity: 0; }
}

.welcome__kicker {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--dim); margin: 0 0 14px;
}

.welcome__title { font-size: clamp(30px, 11vw, 52px); margin: 0; max-width: 15ch; }
.welcome__title .wall { color: var(--scarlet); display: block; }

.welcome__rule {
  height: 3px; width: 56px; margin: 20px 0;
  background: var(--grad-primary); border-radius: 2px;
}

.welcome__where { margin: 0; color: var(--dim); }

/* countdown */
.count { display: flex; gap: 8px; margin: 26px 0 4px; }

.count__cell {
  background: var(--riser); border: 1px solid var(--edge);
  border-radius: 8px; padding: 9px 12px; min-width: 62px;
}

.count__n {
  font-family: var(--font-display); font-size: 26px; line-height: 1;
  font-variant-numeric: tabular-nums;
}

.count__l {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute); margin-top: 4px;
}

.count__note { font-size: 11px; color: var(--mute); margin: 0; }
.count__live { color: var(--gold); font-weight: 600; }

/* QR. Dark modules on a cream card. Never inverted, plenty of scanners
   refuse a light on dark code. */
.qr {
  margin: 26px 0 0; background: var(--cream);
  border-radius: 10px; padding: 10px; width: 150px;
}

.qr img { display: block; width: 100%; height: auto; }
.qr__cap { font-size: 11px; color: var(--mute); margin: 8px 0 0; }

.enter {
  margin-top: 26px; width: 100%; max-width: 320px;
  border: 0; border-radius: 10px; padding: 16px;
  background: var(--grad-primary); color: var(--cream);
  font-size: 17px; font-weight: 600; cursor: pointer;
}

.enter:active { background: var(--oxblood); }

/* -------------------------------------------------------------- header */
.hdr {
  position: sticky; top: 0; z-index: 30;
  background: rgba(23,22,26,0.92);
  backdrop-filter: saturate(1.4) blur(8px);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--warm-edge);
  padding-top: var(--safe-t);
}

.hdr__row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));
}

.hdr__mark { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
.hdr__pick { width: 26px; flex: 0 0 26px; }
.hdr__pick .pick__text { font-size: 6px; }

/* Three buttons sit to the right now. The brand text gives way before they do. */
.hdr__name {
  font-size: 15px; line-height: 1; margin: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Gold, not mute grey. Small enough that it warms the header without
   spending gold on anything that matters. */
.hdr__sub {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold); margin: 3px 0 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.iconbtn {
  flex: 0 0 auto;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 9px; color: var(--cream);
  font-size: 16px; cursor: pointer; padding: 0;
}

.iconbtn:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.iconbtn--on {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  color: var(--cream);
}

/* ------------------------------------------------------------- tab bar */
/* Group asked for more red and gold, and the tab bar is where it earns its
   keep, because it is on screen on every tab all week. Red does the work.
   Gold is a hairline and a badge, so the Encore award cards keep their claim
   on it. */
.tabs {
  position: sticky; top: 0; z-index: 20;
  background: rgba(23,22,26,0.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 0;
}

/* Scarlet rule under the whole bar with a gold hairline sitting on it. Reads
   as a poster rule, and ties the bar to the footlights on the welcome hero. */
.tabs::after {
  content: '';
  display: block;
  height: 2px;
  background:
    linear-gradient(180deg, var(--gold-rule) 0 1px, transparent 1px),
    var(--grad-primary);
}

.tabs__scroll {
  display: flex; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 9px calc(12px + var(--safe-r)) 9px calc(12px + var(--safe-l));
}

.tabs__scroll::-webkit-scrollbar { display: none; }

/* Resting tab is warm, not grey. Oxblood over --input so it still recedes
   behind the selected one but stops looking like a system control. */
.tab {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 7px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 999px; padding: 8px 14px;
  color: var(--cream); font-size: 13px; font-weight: 500;
  white-space: nowrap; cursor: pointer;
  transition: background-image 120ms ease, border-color 120ms ease;
}

.tab:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

/* Selected tab is a lit scarlet pill with a gold ring. This is the poster
   move: gold rule on scarlet, straight off the Shank Showdown art. */
.tab[aria-selected="true"] {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  color: var(--cream);
  font-weight: 600;
  box-shadow: 0 0 0 1px rgba(217,169,76,0.22), 0 3px 12px rgba(200,16,46,0.34);
}

.tab__icon { font-size: 14px; line-height: 1; }

/* Gold badge, dark text. Scarlet on a now scarlet pill would vanish. */
.tab__badge {
  background: var(--gold); color: #2A1408;
  border-radius: 999px; min-width: 19px; padding: 1px 6px;
  font-size: 11px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums;
}

.tab__lock { color: var(--gold); font-size: 11px; }

/* ------------------------------------------------------------- content */
.sheet {
  padding: 14px calc(16px + var(--safe-r)) calc(48px + var(--safe-b))
           calc(16px + var(--safe-l));
}

.marquee-slot { margin-bottom: 16px; display: flex; align-items: stretch; gap: 8px; }
.marquee-slot .marquee { flex: 1 1 auto; min-width: 0; }

.marquee-x {
  flex: 0 0 auto; width: 34px;
  background: var(--input); border: 1px solid var(--edge);
  border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 14px;
}

.tabhead { margin: 0 0 4px; font-size: clamp(26px, 8vw, 34px); }
.tabhead__sub { color: var(--dim); font-size: 14px; margin: 0 0 18px; }

.stubnote {
  background: var(--riser); border: 1px dashed var(--edge);
  border-radius: 10px; padding: 18px 16px; color: var(--dim);
}

.stubnote code { color: var(--gold); font-size: 13px; }

/* Build notes are crew only. Nothing that says "T1.1" should ever reach an
   attendee, so it is gated on the PIN rather than on my memory. */
.buildnote {
  margin-top: 12px;
  background: var(--input); border-left: 3px solid var(--scarlet);
  border-radius: 6px; padding: 11px 13px;
}

.buildnote__tag {
  font-family: var(--font-display); font-size: 10px;
  letter-spacing: 0.14em; color: var(--scarlet); margin: 0 0 4px;
}

.buildnote__body { font-size: 13px; color: var(--dim); margin: 0; }

/* Display Mode. The only place a viewport locked height is allowed. */
body.display-mode .tabs,
body.display-mode .marquee-slot { display: none; }

body.display-mode .sheet { padding-top: 20px; }
body.display-mode .tabhead { font-size: clamp(34px, 6vw, 60px); }
body.display-mode .stubnote { font-size: 20px; }

/* -------------------------------------------------------------- admin */
.adminbar {
  background: var(--glow); border: 1px solid var(--scarlet);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
}

.adminbar__t { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
.adminbar__p { font-size: 12px; color: var(--dim); margin: 0; }

.pinwrap {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,9,12,0.86);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

.pin {
  background: var(--riser); border: 1px solid var(--edge);
  border-radius: 12px; padding: 20px; width: 100%; max-width: 320px;
}

.pin__t { margin: 0 0 12px; font-size: 20px; }

.pin__in {
  width: 100%; background: var(--input); border: 1px solid var(--edge);
  border-radius: 8px; padding: 13px; color: var(--cream);
  font-family: var(--font-body); font-size: 20px;
  letter-spacing: 0.4em; text-align: center;
}

.pin__err { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
.pin__row { display: flex; gap: 8px; margin-top: 14px; }

.pin__btn {
  flex: 1 1 0; border: 0; border-radius: 8px; padding: 13px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  background: var(--grad-primary); color: var(--cream);
}

.pin__btn--ghost { background: var(--input); color: var(--dim); }

/* -------------------------------------------------------------- offline */
.bootfail {
  margin: 0 0 16px; background: var(--riser);
  border: 1px solid var(--danger); border-radius: 10px;
  padding: 12px 14px; font-size: 13px; color: var(--cream);
}
</style>
</head>
<body>
<div class="glow-stage"></div>
<div id="root"></div>

<noscript>
  <div style="padding:28px;font-family:sans-serif;color:#F7F3EA">
    <h1>The Live Wall</h1>
    <p>This needs JavaScript switched on. Everything on the wall updates live.</p>
  </div>
</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/* ==========================================================================
   THE LIVE WALL. ROADMAP T0.5, app shell.
   Welcome hero, header, tab bar, marquee slot, ten tab stubs.
   Tab bodies land in T0.6. Admin panel lands in T1.6.
   ========================================================================== */

const { useState, useEffect, useRef, useCallback } = React;

/* -------------------------------------------------------------- config */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAZZfeJWyq7HVHlSEuucquCLHyXTmtrXco",
  authDomain: "cgp-membership-wall-2026.firebaseapp.com",
  databaseURL: "https://cgp-membership-wall-2026-default-rtdb.firebaseio.com",
  projectId: "cgp-membership-wall-2026",
  storageBucket: "cgp-membership-wall-2026.firebasestorage.app",
  messagingSenderId: "986050588933",
  appId: "1:986050588933:web:51e8ca448798c817ee076c"
};

/* The PIN is not a security boundary. It ships in readable client code and
   the database is open by design, so treat it as a guard against a stray tap.
   Real protection is that the URL only travels by QR code. */
const ADMIN_PIN = "2026";

/* Tuesday August 25 2026, 12:00 PM Eastern. EDT is UTC-4 in August.
   This is the first timed item on the flier, the Shank Showdown tee-off.
   ASSUMPTION worth one line of confirmation from Carol. If the countdown
   should run to hotel check-in or to Wednesday breakfast instead, change
   this one constant. */
const OPENS_AT = Date.parse("2026-08-25T12:00:00-04:00");

const LS = {
  entered: "mm26_entered"
};

/* Ten tabs, spec section 3. Themed names only, no plain English subtitles.
   `phase` is when the tab is meant to appear. T1.6 wires real visibility.
   Each key has a matching component in TAB_VIEWS further down. */
const TABS = [
  { key: "setlist",    icon: "\u{1F3A4}", name: "The Setlist",    phase: "pre" },
  { key: "band",       icon: "\u{1F3B8}", name: "The Band",       phase: "pre" },
  { key: "backstage",  icon: "\u{1F39F}", name: "Backstage Pass", phase: "pre" },
  { key: "soundcheck", icon: "\u{1F399}", name: "Soundcheck",     phase: "pre" },
  { key: "vault",      icon: "\u{1F512}", name: "The Vault",      phase: "pre" },
  { key: "liner",      icon: "\u{1F4DD}", name: "Liner Notes",    phase: "pre" },
  { key: "vote",       icon: "\u{1F4CA}", name: "Crowd Vote",     phase: "during" },
  { key: "pit",        icon: "\u{1F4F7}", name: "The Pit",        phase: "during" },
  { key: "cares",      icon: "\u{1F3C6}", name: "The Cares Cup",  phase: "during" },
  { key: "encore",     icon: "⭐",         name: "Encore",         phase: "post" }
];

const TAB_BY_KEY = {};
TABS.forEach(function (t) { TAB_BY_KEY[t.key] = t; });

/* ------------------------------------------------------------- helpers */

function readLS(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}

function writeLS(key, value) {
  try { window.localStorage.setItem(key, value); } catch (e) { /* private mode */ }
}

/* Splits a millisecond span into whole days, hours, minutes, seconds. */
function breakdown(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return {
    days:    Math.floor(s / 86400),
    hours:   Math.floor((s % 86400) / 3600),
    minutes: Math.floor((s % 3600) / 60),
    seconds: s % 60
  };
}

function pad(n) { return n < 10 ? "0" + n : String(n); }

/* ------------------------------------------------------- firebase boot */
/* One place to fail. If Firebase cannot start, the shell still renders and
   says so, rather than throwing a white screen at a full ballroom. */
function bootFirebase() {
  try {
    if (!window.firebase || !firebase.database) {
      return { ok: false, reason: "The Firebase library did not load." };
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    return { ok: true, db: firebase.database() };
  } catch (err) {
    return { ok: false, reason: (err && err.message) || String(err) };
  }
}

const FB = bootFirebase();

/* Device clocks drift and attendees fly in from several time zones, so the
   wall never trusts the device clock on its own. Firebase publishes the
   offset between this device and the server at .info/serverTimeOffset.
   T2.3 reuses this for the Vault drops, where getting it wrong means content
   lands on the wrong morning. */
function useServerNow() {
  const [offset, setOffset] = useState(0);
  const [synced, setSynced] = useState(false);
  const [now, setNow] = useState(() => Date.now());

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref(".info/serverTimeOffset");
    const handler = (snap) => {
      setOffset(snap.val() || 0);
      setSynced(true);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    const id = window.setInterval(() => setNow(Date.now()), 1000);
    return () => window.clearInterval(id);
  }, []);

  return { now: now + offset, offset, synced };
}

/* Marquee announcements. Admin posts them in T1.6. Until then this is a
   live slot that stays out of the way when there is nothing to say. */
function useAnnouncement() {
  const [item, setItem] = useState(null);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("announcements");
    const handler = (snap) => {
      const all = snap.val() || {};
      const live = Object.keys(all)
        .map((id) => Object.assign({ id: id }, all[id]))
        .filter((a) => a && a.on && a.text)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
      setItem(live.length ? live[0] : null);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return item;
}

/* ---------------------------------------------------------- components */

/* Reads as a QR code at 17px, which no emoji does, and it cannot collide with
   any of the tab icons. */
function QrGlyph() {
  return (
    <svg width="17" height="17" viewBox="0 0 17 17" aria-hidden="true" focusable="false">
      <g fill="currentColor">
        <path d="M0 0h7v7H0V0zm2 2v3h3V2H2z" />
        <path d="M10 0h7v7h-7V0zm2 2v3h3V2h-3z" />
        <path d="M0 10h7v7H0v-7zm2 2v3h3v-3H2z" />
        <rect x="9" y="9" width="2" height="2" />
        <rect x="13" y="9" width="2" height="2" />
        <rect x="11" y="11" width="2" height="2" />
        <rect x="15" y="11" width="2" height="2" />
        <rect x="9" y="13" width="2" height="2" />
        <rect x="13" y="13" width="2" height="2" />
        <rect x="15" y="15" width="2" height="2" />
      </g>
    </svg>
  );
}

function BrandMark() {
  return (
    <div className="hdr__mark">
      <div className="pick hdr__pick" aria-hidden="true">
        <span className="pick__text">MM<br />26</span>
      </div>
      <div style={{ minWidth: 0 }}>
        <p className="hdr__name t-display">The Live Wall</p>
        <p className="hdr__sub">Private Clubs 2026</p>
      </div>
    </div>
  );
}

/* `now` arrives already corrected against the server clock by useServerNow.
   The correction is not surfaced in the copy, it just always applies. */
function Countdown({ now }) {
  const left = OPENS_AT - now;
  const open = left <= 0;
  const t = breakdown(left);

  if (open) {
    return (
      <div>
        <div className="count">
          <div className="count__cell" style={{ minWidth: "auto", padding: "12px 18px" }}>
            <div className="count__n t-display">Doors are open</div>
          </div>
        </div>
        <p className="count__note count__live">The tour is on. See you at The Medallion Club.</p>
      </div>
    );
  }

  return (
    <div>
      <div className="count">
        <div className="count__cell">
          <div className="count__n t-display">{t.days}</div>
          <div className="count__l">Days</div>
        </div>
        <div className="count__cell">
          <div className="count__n t-display">{pad(t.hours)}</div>
          <div className="count__l">Hours</div>
        </div>
        <div className="count__cell">
          <div className="count__n t-display">{pad(t.minutes)}</div>
          <div className="count__l">Min</div>
        </div>
        <div className="count__cell">
          <div className="count__n t-display">{pad(t.seconds)}</div>
          <div className="count__l">Sec</div>
        </div>
      </div>
      <p className="count__note">Until showtime, Tuesday August 25.</p>
    </div>
  );
}

/* Stage pyro. Three gerbs, seven sparks and one candle each. Every position and
   timing lives in the CSS via nth-child, so this markup carries no numbers and
   flares.html can render the identical thing without duplicating a generator. */
function Gerb() {
  return (
    <span className="gerb">
      <i className="spark" /><i className="spark" /><i className="spark" />
      <i className="spark" /><i className="spark" /><i className="spark" />
      <i className="spark" />
      <i className="candle" />
    </span>
  );
}

function StagePyro() {
  return (
    <div className="band__pyro" aria-hidden="true">
      <Gerb /><Gerb /><Gerb />
    </div>
  );
}

/* The flier's four panel hero. Lights come up on each member in turn. */
function BandStrip() {
  return (
    <div className="band band--flares band--pyro">
      <img
        className="band__img"
        src="assets/brand/tour-band.jpg"
        alt="Four Century Golf team members in full rock tour costume"
      />
      <div className="band__grade"></div>
      {/* Ground flares at Standard strength, approved July 30. Retune with
          --flare-max, or drop band--flares to switch them off. */}
      <div className="band__flares" aria-hidden="true">
        <span style={{ "--x": "10%", "--dur": "4.3s", "--delay": "0s" }}></span>
        <span style={{ "--x": "31%", "--dur": "3.4s", "--delay": "-1.1s" }}></span>
        <span style={{ "--x": "50%", "--dur": "5.1s", "--delay": "-2.4s" }}></span>
        <span style={{ "--x": "69%", "--dur": "3.8s", "--delay": "-0.6s" }}></span>
        <span style={{ "--x": "90%", "--dur": "4.7s", "--delay": "-1.8s" }}></span>
      </div>
      <StagePyro />
      <div className="band__lights" aria-hidden="true">
        <span style={{ "--i": 0 }}></span>
        <span style={{ "--i": 1 }}></span>
        <span style={{ "--i": 2 }}></span>
        <span style={{ "--i": 3 }}></span>
      </div>
      <div className="band__lip" aria-hidden="true"></div>
    </div>
  );
}

/* `returning` is true when somebody taps the QR button in the header to pull
   this screen back up. They have already entered, so the button underneath
   sends them back rather than pretending to admit them again. */
function Welcome({ onEnter, now, returning }) {
  return (
    <div className="welcome">
      <BandStrip />
      <div className="welcome__body">
        <p className="welcome__kicker">Century Golf Partners</p>
        <h1 className="welcome__title t-display">
          2026 Private Clubs Meeting<span className="wall">The Live Wall</span>
        </h1>
        <div className="welcome__rule"></div>
        <p className="welcome__where">Columbus, Ohio. August 25 to 28, 2026.</p>

        <Countdown now={now} />

        <button className="enter" onClick={onEnter}>
          {returning ? "Back to the wall" : "Get your wristband"}
        </button>

        <div className="qr">
          <img src="assets/brand/qr-wall.svg" width="130" height="130"
               alt="QR code that opens this wall" />
        </div>
        <p className="qr__cap">Point a phone here to pass it on.</p>
      </div>
    </div>
  );
}

function TabBar({ tabs, active, onPick, isAdmin }) {
  const scroller = useRef(null);

  /* Keep the selected pill in view. On a 380px screen most of the ten tabs
     sit off the right edge, so tapping one near the edge should not leave it
     half cut off. */
  useEffect(() => {
    const box = scroller.current;
    if (!box) return;
    const el = box.querySelector('[aria-selected="true"]');
    if (el && el.scrollIntoView) {
      el.scrollIntoView({ inline: "nearest", block: "nearest" });
    }
  }, [active]);

  return (
    <nav className="tabs" aria-label="Sections">
      <div className="tabs__scroll" ref={scroller} role="tablist">
        {tabs.map((tab) => (
          <button
            key={tab.key}
            role="tab"
            aria-selected={active === tab.key}
            className="tab"
            onClick={() => onPick(tab.key)}
          >
            <span className="tab__icon" aria-hidden="true">{tab.icon}</span>
            <span>{tab.name}</span>
            {isAdmin && tab.phase !== "pre" ? (
              <span className="tab__lock" title="Hidden from the room">
                {"\u{1F512}"}
              </span>
            ) : null}
          </button>
        ))}
      </div>
    </nav>
  );
}

function MarqueeSlot({ item, onDismiss }) {
  if (!item) return null;
  return (
    <div className="marquee-slot">
      <div className="marquee">
        <div className="marquee__track">
          <span className="marquee__item">{item.text}</span>
          <span className="marquee__item">{item.text}</span>
        </div>
      </div>
      <button className="marquee-x" onClick={onDismiss} aria-label="Dismiss announcement">
        {"✕"}
      </button>
    </div>
  );
}

function PinGate({ onPass, onClose }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  const input = useRef(null);

  useEffect(() => { if (input.current) input.current.focus(); }, []);

  function submit(e) {
    e.preventDefault();
    if (value === ADMIN_PIN) {
      onPass();
    } else {
      setError("That is not the PIN.");
      setValue("");
    }
  }

  return (
    <div className="pinwrap" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <form className="pin" onSubmit={submit}>
        <h2 className="pin__t t-display">Crew only</h2>
        <input
          ref={input}
          className="pin__in t-data"
          inputMode="numeric"
          autoComplete="off"
          maxLength={4}
          placeholder="0000"
          value={value}
          onChange={(e) => { setValue(e.target.value.replace(/\D/g, "")); setError(""); }}
        />
        {error ? <p className="pin__err">{error}</p> : null}
        <div className="pin__row">
          <button type="button" className="pin__btn pin__btn--ghost" onClick={onClose}>Back</button>
          <button type="submit" className="pin__btn">Unlock</button>
        </div>
      </form>
    </div>
  );
}

/* ==========================================================================
   T0.6 TAB SCAFFOLD.
   Ten components, one per tab, each its own boundary to build into. Phase 1
   and Phase 2 fill these independently, so they do not share a body.

   Empty state copy is written to the flier's register: short, dry, a little
   irreverent, never precious. These are the words an attendee reads before
   any content exists, so they are real copy and not filler.
   ========================================================================== */

const PHASE_LINE = {
  pre: "Live before the meeting",
  during: "Opens during the meeting",
  post: "Opens after the Awards Show"
};

function TabFrame({ tabKey, children }) {
  const tab = TAB_BY_KEY[tabKey];
  return (
    <section aria-labelledby={"head-" + tabKey}>
      <h2 className="tabhead t-display" id={"head-" + tabKey}>{tab.name}</h2>
      <p className="tabhead__sub">{PHASE_LINE[tab.phase]}</p>
      {children}
    </section>
  );
}

function Empty({ children }) {
  return <div className="stubnote"><p style={{ margin: 0 }}>{children}</p></div>;
}

/* Crew only. Keeps "T1.1" out of an attendee's hands by construction rather
   than by remembering to strip it later. */
function BuildNote({ isAdmin, task, children }) {
  if (!isAdmin) return null;
  return (
    <div className="buildnote">
      <p className="buildnote__tag">{task}</p>
      <p className="buildnote__body">{children}</p>
    </div>
  );
}

function SetlistTab({ isAdmin }) {
  return (
    <TabFrame tabKey="setlist">
      <Empty>No setlist yet. The running order is still being argued about.</Empty>
      <BuildNote isAdmin={isAdmin} task="T1.1">
        Agenda from the flier into data/agenda.json. Four day pills, sessions as
        ticket stubs, ON AIR pulse, 30 minute countdown, four reactions per
        session, attire tag per day.
      </BuildNote>
    </TabFrame>
  );
}

function BandTab({ isAdmin }) {
  return (
    <TabFrame tabKey="band">
      <Empty>No lineup posted. Nobody has been handed a laminate yet.</Empty>
      <BuildNote isAdmin={isAdmin} task="T1.3">
        Roster grid against 20 placeholder records. Search by name, club, and
        title. FIRST TOUR guitar pick on newbies, visible in the grid. Real data
        loads at T3.1.
      </BuildNote>
    </TabFrame>
  );
}

function BackstageTab({ isAdmin }) {
  return (
    <TabFrame tabKey="backstage">
      <Empty>Where you sleep, where you play, who to call. Going up shortly.</Empty>
      <BuildNote isAdmin={isAdmin} task="T1.2">
        Six ticket stub panels. Venue cards for Embassy Suites, The Medallion
        Club, and Smash Park. Tappable phones, addresses that open maps, rental
        codes, attire by day.
      </BuildNote>
    </TabFrame>
  );
}

function SoundcheckTab({ isAdmin }) {
  return (
    <TabFrame tabKey="soundcheck">
      <Empty>No questions yet. Somebody has to go first.</Empty>
      <BuildNote isAdmin={isAdmin} task="T1.4">
        Submission panel with optional name and club, six categories, anonymous
        toggle. Top and New sorting, one upvote per device, Display Mode for the
        projector, CSV export.
      </BuildNote>
    </TabFrame>
  );
}

function VaultTab({ isAdmin }) {
  return (
    <TabFrame tabKey="vault">
      <Empty>The vault is shut. Two sections open on a clock during the meeting.</Empty>
      <BuildNote isAdmin={isAdmin} task="T2.1 to T2.3">
        Five sections. Club graph picker. Timed drops for Scenarios on Wednesday
        at 9:30 AM Eastern and Personas on Thursday at 10:30 AM, corrected
        against the server clock, with admin override both directions.
      </BuildNote>
    </TabFrame>
  );
}

function LinerNotesTab({ isAdmin }) {
  return (
    <TabFrame tabKey="liner">
      <Empty>No takeaways yet. Somebody write something down.</Empty>
      <BuildNote isAdmin={isAdmin} task="T1.5">
        Day filter pills, submission panel with auto day tag, reverse
        chronological cards, pinned items with a scarlet left border, Markdown
        export for the recap.
      </BuildNote>
    </TabFrame>
  );
}

function CrowdVoteTab({ isAdmin }) {
  return (
    <TabFrame tabKey="vote">
      <Empty>No polls open. Nothing to vote on until the room warms up.</Empty>
      <BuildNote isAdmin={isAdmin} task="T2.4">
        Four poll types: multiple choice, knowledge check that reveals the split
        on close, ranking by drag, and a live word cloud. One vote per device.
      </BuildNote>
    </TabFrame>
  );
}

function PitTab({ isAdmin }) {
  return (
    <TabFrame tabKey="pit">
      <Empty>No photos yet. Somebody go find the drummer.</Empty>
      <BuildNote isAdmin={isAdmin} task="T2.5">
        Both upload paths ship together, camera and library. Client side
        compression to roughly 800px. Square grid, likes that sync, lightbox
        with admin download and delete.
      </BuildNote>
    </TabFrame>
  );
}

function CaresCupTab({ isAdmin }) {
  return (
    <TabFrame tabKey="cares">
      <Empty>No scores posted. Nobody has shanked one yet.</Empty>
      <BuildNote isAdmin={isAdmin} task="T2.6">
        Leaderboard with position, team, score, thru. Gold, silver, bronze on the
        top three. Century Golf Cares fundraising total on top. Admin only score
        entry. Poster art use is still an open question, so build the solid
        color fallback first.
      </BuildNote>
    </TabFrame>
  );
}

function EncoreTab({ isAdmin }) {
  return (
    <TabFrame tabKey="encore">
      <Empty>The encore comes last. Awards go up after the Thursday show.</Empty>
      <BuildNote isAdmin={isAdmin} task="T2.7">
        Four independently unlockable sections: Award Winners on a vinyl label,
        Hall of Fame, Top Videos as embeds, Tenure by milestone. Full admin CRUD
        so winners can be posted from the room on Thursday night.
      </BuildNote>
    </TabFrame>
  );
}

const TAB_VIEWS = {
  setlist:    SetlistTab,
  band:       BandTab,
  backstage:  BackstageTab,
  soundcheck: SoundcheckTab,
  vault:      VaultTab,
  liner:      LinerNotesTab,
  vote:       CrowdVoteTab,
  pit:        PitTab,
  cares:      CaresCupTab,
  encore:     EncoreTab
};

function App() {
  const [entered, setEntered] = useState(() => readLS(LS.entered) === "1");
  const [active, setActive] = useState(TABS[0].key);
  const [displayMode, setDisplayMode] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [showPin, setShowPin] = useState(false);
  const [dismissed, setDismissed] = useState(null);
  /* Pulling the welcome screen back up does NOT clear mm26_entered. Somebody
     showing the QR to a colleague should not have their own state reset. */
  const [showWelcome, setShowWelcome] = useState(false);

  /* useServerNow also returns `synced` and `offset`. T2.3 needs them for the
     Vault drops. The welcome screen does not surface either one. */
  const { now } = useServerNow();
  const announcement = useAnnouncement();

  useEffect(() => {
    document.body.classList.toggle("display-mode", displayMode);
  }, [displayMode]);

  const enter = useCallback(() => {
    writeLS(LS.entered, "1");
    setEntered(true);
  }, []);

  const gear = useCallback(() => {
    if (isAdmin) { setIsAdmin(false); } else { setShowPin(true); }
  }, [isAdmin]);

  if (!entered) {
    return <Welcome onEnter={enter} now={now} />;
  }

  if (showWelcome) {
    return <Welcome onEnter={() => setShowWelcome(false)} now={now} returning />;
  }

  const tab = TAB_BY_KEY[active] || TABS[0];
  const TabView = TAB_VIEWS[tab.key];
  const liveAnnouncement =
    announcement && announcement.id !== dismissed ? announcement : null;

  return (
    <div>
      <header className="hdr">
        <div className="hdr__row">
          <BrandMark />
          <button
            className="iconbtn"
            onClick={() => setShowWelcome(true)}
            title="Pull up the QR code"
            aria-label="Show the QR code"
          >
            <QrGlyph />
          </button>
          <button
            className={"iconbtn" + (displayMode ? " iconbtn--on" : "")}
            onClick={() => setDisplayMode(!displayMode)}
            aria-pressed={displayMode}
            title="Display Mode, for the projector"
          >
            {"\u{1F4FA}"}
          </button>
          <button
            className={"iconbtn" + (isAdmin ? " iconbtn--on" : "")}
            onClick={gear}
            aria-pressed={isAdmin}
            title={isAdmin ? "Lock the crew panel" : "Crew panel"}
          >
            {"⚙"}
          </button>
        </div>
      </header>

      <TabBar tabs={TABS} active={active} onPick={setActive} isAdmin={isAdmin} />

      <main className="sheet">
        {!FB.ok ? (
          <p className="bootfail">
            Live updates are off. {FB.reason} The wall still works, but questions,
            polls, and photos will not sync until this is sorted.
          </p>
        ) : null}

        {isAdmin ? (
          <div className="adminbar">
            <p className="adminbar__t">Crew panel unlocked</p>
            <p className="adminbar__p">
              Tabs the room cannot see yet carry a padlock. The full panel arrives at T1.6.
            </p>
          </div>
        ) : null}

        <MarqueeSlot
          item={liveAnnouncement}
          onDismiss={() => setDismissed(liveAnnouncement.id)}
        />

        <TabView isAdmin={isAdmin} />
      </main>

      {showPin ? (
        <PinGate
          onPass={() => { setIsAdmin(true); setShowPin(false); }}
          onClose={() => setShowPin(false)}
        />
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
