<style id="wall-css">
/* ==========================================================================
   THE LIVE WALL. Design system.
   This block is the single source of truth. tokens.html and motifs.html read
   it straight out of this file rather than keeping a copy, so a proof sheet
   can never drift from what actually ships.
   ROADMAP T0.3 tokens, T0.4 motifs, T0.5 shell. Spec sections 2.1 to 2.3.
   ========================================================================== */

/* -------------------------------------------------------- T0.3 tokens */
:root {
  /* Palette. Twelve tokens, spec 2.1. */
  --stage:   #17161A;  /* page background, near black with a warm cast     */
  --riser:   #201E24;  /* card and panel background                        */
  --input:   #2A272E;  /* form fields, inactive pills                      */
  --scarlet: #C8102E;  /* primary accent, headers, active, primary buttons */
  --oxblood: #8A0E1F;  /* pressed and hover, deep borders, gradients       */
  --gold:    #D9A94C;  /* secondary accent, awards, trophies, posters      */
  --cream:   #F7F3EA;  /* body text                                       */
  --dim:     #A39B92;  /* secondary text, metadata                        */
  --mute:    #6E6862;  /* timestamps, disabled text, fine print           */
  --edge:    #332F38;  /* card borders, dividers                          */
  --danger:  #FF6B4A;  /* delete and destructive admin actions            */
  --glow:    rgba(200, 16, 46, 0.12); /* scarlet tint, hover and selected  */

  /* Type, spec 2.2. Alfa Slab One is rationed to awards and Encore cards.
     Anywhere else it reads as a novelty font. */
  --font-display: 'Anton', Impact, 'Haettenschweiler', sans-serif;
  --font-poster:  'Alfa Slab One', Georgia, serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* The two gradients that carry the stage feel, spec 2.1. */
  --grad-stage:   radial-gradient(62% 42% at 50% 20%, #2A1418 0%, var(--stage) 72%);
  --grad-primary: linear-gradient(180deg, var(--scarlet) 0%, var(--oxblood) 100%);

  /* Motif dials. Override per instance, not at the call site.
     These are not palette tokens. The palette is the twelve above and stays
     twelve, so tokens.html keeps telling the truth. Everything here is mixed
     from those twelve. */
  --ticket-stub-w: 84px;    /* width of the tear-off on a ticket stub card */
  --notch-bg: var(--stage); /* what shows through a ticket notch           */

  /* Chrome warmth. Oxblood laid over --input as a flat overlay rather than
     color-mix, which is not safe on every phone that will be in the room. */
  --warm-fill: rgba(138, 14, 31, 0.22);
  --warm-fill-strong: rgba(138, 14, 31, 0.40);
  --warm-edge: rgba(200, 16, 46, 0.38);
  --gold-rule: rgba(217, 169, 76, 0.42);

  /* Reading column on a wide screen. Mobile ignores it, the shell is already
     narrower than this. */
  --shell-max: 780px;

  /* Notch and home indicator. Zero on anything without a cutout. */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

/* ------------------------------------------------------------- baseline */
*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100svh;
  background: var(--stage);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font-family: inherit; }

/* Display faces are all caps and tight. Never italic. */
.t-display {
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  line-height: 0.94;
}

.t-poster { font-family: var(--font-poster); font-weight: 400; letter-spacing: 0.01em; }

/* Leaderboard scores and counts. Digits must not jitter as they update. */
.t-data { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0;
  margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   T0.4 MOTIF PRIMITIVES. Spec 2.3.
   Each one is a reusable class. No custom illustration, all CSS.
   ========================================================================== */

/* -------------------------------------------------- 1. ticket stub card */
/* Do not add overflow:hidden here. It would clip the notches. */
.ticket {
  position: relative;
  display: flex;
  align-items: stretch;
  background: var(--riser);
  border: 1px solid var(--edge);
  border-radius: 10px;
}

.ticket__stub {
  flex: 0 0 var(--ticket-stub-w);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  padding: 14px 8px;
  border-right: 2px dashed var(--edge);
  text-align: center;
}

.ticket__body {
  flex: 1 1 auto;
  min-width: 0;           /* lets long titles wrap instead of pushing wide */
  padding: 14px 16px;
}

.ticket::before, .ticket::after {
  content: '';
  position: absolute;
  left: var(--ticket-stub-w);
  width: 15px; height: 15px;
  background: var(--notch-bg);
  border-radius: 50%;
  transform: translateX(-50%);
}

.ticket::before { top: calc(-15px / 2 - 1px); }
.ticket::after  { bottom: calc(-15px / 2 - 1px); }

/* ------------------------------------------------- 2. guitar pick badge */
.pick {
  --pick-fill: var(--gold);
  display: grid; place-items: center;
  width: 68px; aspect-ratio: 1 / 0.96;
  background: var(--pick-fill);
  clip-path: polygon(
    15% 8%, 28% 2%, 50% 0%, 72% 2%, 85% 8%,
    95% 25%, 98% 42%,
    88% 68%, 68% 88%, 55% 98%, 50% 100%,
    45% 98%, 32% 88%, 12% 68%,
    2% 42%, 5% 25%
  );
}

.pick__text {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: 11px; line-height: 1;
  text-align: center; color: #2A1408;
  padding-bottom: 12%;      /* nudge off the tapered tip */
  letter-spacing: 0.02em;
}

/* ---------------------------------------------------- 3. amp grille texture */
.grille { position: relative; }
.grille > * { position: relative; z-index: 1; }

.grille::before {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none; border-radius: inherit;
  background-image:
    repeating-linear-gradient( 45deg, rgba(247,243,234,0.030) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(-45deg, rgba(247,243,234,0.030) 0 1px, transparent 1px 5px);
}

/* ------------------------------------------------------ 4. stage light glow */
.glow-stage {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background: var(--grad-stage);
}

.glow-card {
  position: relative;
  background:
    radial-gradient(80% 62% at 50% 0%, rgba(200,16,46,0.20) 0%, transparent 70%),
    var(--riser);
  border: 1px solid var(--edge);
  border-radius: 12px;
}

/* ------------------------------------------------------- 5. marquee strip */
.marquee {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--oxblood) 0%, #6B0A18 100%);
  border-radius: 6px;
  padding: 6px 0;
}

.marquee::before, .marquee::after {
  content: '';
  position: absolute; left: 0; right: 0; height: 7px;
  background-image: radial-gradient(circle, var(--gold) 0 1.6px, rgba(0,0,0,0.35) 2px);
  background-size: 13px 7px;
  background-repeat: repeat-x;
  background-position: center;
}

.marquee::before { top: 0; }
.marquee::after  { bottom: 0; }

.marquee__track {
  display: flex; width: max-content; padding: 5px 0;
  animation: marquee-slide 22s linear infinite;
}

.marquee__item {
  padding: 0 28px; white-space: nowrap;
  font-weight: 600; font-size: 14px; color: var(--cream);
}

@keyframes marquee-slide {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }   /* content is duplicated once */
}

/* A scrolling banner is exactly the thing that makes some people ill. */
@media (prefers-reduced-motion: reduce) {
  .marquee__track { animation: none; width: 100%; flex-wrap: wrap; }
  .marquee__item { white-space: normal; padding: 0 14px; }
  .marquee__item + .marquee__item { display: none; }  /* drop the duplicate */
}

/* ---------------------------------------------------------- 6. vinyl label */
.vinyl {
  position: relative; aspect-ratio: 1; width: 100%;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(247,243,234,0.055) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 50% 50%, var(--oxblood) 0 33%, #0C0B0E 33.5% 100%);
  display: grid; place-items: center;
}

.vinyl__photo {
  width: 56%; aspect-ratio: 1; border-radius: 50%;
  object-fit: cover; border: 3px solid var(--gold); background: var(--input);
}

/* ------------------------------------------------- 7. setlist strike-through */
.struck { position: relative; display: inline-block; }

.struck::after {
  content: '';
  position: absolute; left: -2%; right: -2%; top: 52%;
  height: 2px; background: var(--scarlet); border-radius: 2px;
  transform: rotate(-1.2deg);
}

.is-done { opacity: 0.55; }

/* ==========================================================================
   T0.5 APP SHELL
   ========================================================================== */

#root { position: relative; z-index: 1; }

/* --------------------------------------------------------- welcome hero */
.welcome {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

/* The band strip is full bleed at the top, so the welcome itself carries no
   padding. .welcome__body takes it instead. */
.welcome__body {
  flex: 1 1 auto;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 20px calc(20px + var(--safe-r))
           calc(36px + var(--safe-b)) calc(20px + var(--safe-l));
}

.welcome__text,
.welcome__aside {
  display: flex; flex-direction: column; align-items: center;
  min-width: 0;
}

/* ---------------------------------------------------------- band strip */
/* The flier's own hero, four panels wide. Treated as a lit stage: the lights
   come up on each band member in turn, the picture dissolves into the page,
   and gold footlights run along the bottom lip.
   Aspect ratio matches the source exactly, so nothing is cropped. */
.band {
  position: relative;
  flex: 0 0 auto;
  width: 100%;
  margin-top: var(--safe-t);
  aspect-ratio: 786 / 404;
  overflow: hidden;
}

.band__img {
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
  /* Lisa asked to pull the picture down so faces read better. A lower number
     shows more of the top of the source, which drops the subjects in frame and
     stops the crop cutting the tops of heads. */
  object-position: center 12%;
}

/* ------------------------------------------------------------- masthead */
/* Lisa asked for the banner on every page, with a scarlet title bar under it,
   which is the flier's own masthead. Compact on the tab pages so it does not
   eat a phone screen, full height on the welcome hero. Scrolls away. The
   controls and the tab bar stay stuck to the top. */
.masthead { position: relative; }

/* Scoped with :not so the compact rules can never leak onto the tall hero,
   which sits at equal specificity. */
.masthead:not(.masthead--tall) .band {
  height: 112px;
  aspect-ratio: auto;
  max-height: none;
}

/* Pyro needs vertical room to read as a fountain. In a 112px strip it is just
   flecks, so the compact masthead keeps the flares and drops the sparks. */
.masthead:not(.masthead--tall) .band__pyro { display: none; }

.masthead__banner {
  background: var(--grad-primary);
  border-top: 1px solid var(--gold-rule);
  border-bottom: 1px solid var(--gold-rule);
  padding: 7px calc(14px + var(--safe-r)) 8px calc(14px + var(--safe-l));
  text-align: center;
}

.masthead__banner span {
  display: block;
  font-size: clamp(15px, 4.4vw, 22px);
  letter-spacing: 0.05em;
  color: var(--cream);
  line-height: 1.06;
}

.masthead--tall .masthead__banner span {
  font-size: clamp(17px, 5.2vw, 30px);
}

/* Knocks the bright whites back so cream text below stays the loudest thing
   on the screen, and pulls the picture into the scarlet palette. */
.band__grade {
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(125% 85% at 50% 0%, rgba(200,16,46,0.26) 0%, transparent 68%),
    linear-gradient(180deg,
      rgba(23,22,26,0.45) 0%,
      rgba(23,22,26,0.05) 24%,
      rgba(23,22,26,0.26) 50%,
      rgba(23,22,26,0.72) 78%,
      rgba(23,22,26,0.95) 92%,
      var(--stage) 100%);
}

/* Four shutters over four panels. Each lifts in turn, left to right. */
.band__lights {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  pointer-events: none;
}

/* Base state is transparent on purpose. If the animation never runs, on an old
   browser or with animations disabled, the failure shows the picture rather
   than hiding it behind four solid panels. `both` fill holds the shutter
   opaque through its delay and lands it back at transparent. */
.band__lights span {
  background: var(--stage);
  opacity: 0;
  animation: band-lights-up 700ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc(var(--i) * 180ms);
}

@keyframes band-lights-up {
  from { opacity: 1; }
  to   { opacity: 0; }
}

/* ------------------------------------------- ground illumination flares */
/* Light blooming up off the stage floor. OFF by default. Add .band--flares to
   the .band element to switch it on. Preview at flares.html before committing
   this to the welcome screen.
   Uses mix-blend-mode screen so the blooms read as light rather than as paint
   laid over the picture. Animates opacity and transform only, no filters, so
   it stays cheap on an older phone. */
.band__flares { display: none; }

/* Peak brightness lives on .band--flares, not on the inner container. Put it
   on the container and it shadows any override set alongside .band--flares,
   because the span resolves the variable from its nearest ancestor. */
.band--flares { --flare-max: 0.70; }

.band--flares .band__flares {
  display: block;
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 62%;
  overflow: hidden;
  pointer-events: none;
}

/* Low haze sitting on the floor, so the flares have something to sit in. */
.band--flares .band__flares::before {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 36%;
  background: linear-gradient(0deg, rgba(217,169,76,0.17) 0%, transparent 100%);
  mix-blend-mode: screen;
  animation: flare-haze 6.5s ease-in-out infinite alternate;
}

.band__flares span {
  position: absolute;
  bottom: -12%;
  left: var(--x);
  width: 42%;
  aspect-ratio: 1 / 1.25;
  transform: translateX(-50%);
  transform-origin: 50% 100%;
  mix-blend-mode: screen;
  background: radial-gradient(48% 50% at 50% 100%,
    rgba(217,169,76,0.62) 0%,
    rgba(226,116,58,0.34) 26%,
    rgba(200,16,46,0.26) 52%,
    transparent 76%);
  animation: flare-breathe var(--dur) ease-in-out var(--delay) infinite alternate;
}

/* Negative delays start each flare mid cycle, so they never pulse in unison. */
@keyframes flare-breathe {
  from {
    opacity: calc(var(--flare-max, 0.7) * 0.42);
    transform: translateX(-50%) scale(0.90, 0.86);
  }
  to {
    opacity: var(--flare-max, 0.7);
    transform: translateX(-50%) scale(1.06, 1.14);
  }
}

@keyframes flare-haze {
  from { opacity: 0.5; }
  to   { opacity: 1; }
}

/* Hold a lit state, lose the pulsing. */
@media (prefers-reduced-motion: reduce) {
  .band__flares span,
  .band--flares .band__flares::before { animation: none; }
  .band__flares span { opacity: calc(var(--flare-max, 0.7) * 0.72); }
}

/* ---------------------------------------------------------- stage pyro */
/* Gerb fountains at the front of the stage. Fine sparks crackling upward, plus
   a Roman candle ball that climbs, drifts, and dies. OFF unless .band--pyro.
   Transform and opacity only. Screen blend so sparks read as light. */
.band__pyro { display: none; }

.band--pyro .band__pyro {
  display: block;
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* Every timing lives here rather than in JS, so the welcome screen and
   flares.html both write plain markup and cannot drift apart. Three gerbs,
   seven sparks and one candle each. */
.band__pyro .gerb {
  position: absolute;
  bottom: 5%;
  left: var(--x);
  width: 0; height: 0;
  --gerb-offset: 0s;
}

.band__pyro .gerb:nth-child(1) { --x: 18%; --gerb-offset: 0s;   }
.band__pyro .gerb:nth-child(2) { --x: 50%; --gerb-offset: 0.7s; }
.band__pyro .gerb:nth-child(3) { --x: 82%; --gerb-offset: 1.3s; }

.band__pyro .spark,
.band__pyro .candle {
  position: absolute;
  left: 0; bottom: 0;
  border-radius: 50%;
  mix-blend-mode: screen;
  transform: translate(-50%, 0);
  /* Deliberately no will-change. Two dozen promoted layers is a real cost on
     an older phone, and transform and opacity are already fast paths. */
}

.band__pyro .spark {
  width: var(--size); height: var(--size);
  background: radial-gradient(circle,
    #FFF7E4 0 30%, var(--gold) 58%, rgba(226,116,58,0) 100%);
  animation: pyro-spark var(--dur) linear
             calc(var(--delay) - var(--gerb-offset)) infinite;
}

/* Scatter. Uneven on purpose, so no two sparks trace the same arc. */
.band__pyro .spark:nth-child(1) { --drift:  -9px; --rise: 52px; --dur: 1.55s; --delay: -0.20s; --size: 3px; }
.band__pyro .spark:nth-child(2) { --drift:   7px; --rise: 41px; --dur: 1.90s; --delay: -0.75s; --size: 2px; }
.band__pyro .spark:nth-child(3) { --drift:  -4px; --rise: 66px; --dur: 1.40s; --delay: -1.10s; --size: 2px; }
.band__pyro .spark:nth-child(4) { --drift:  11px; --rise: 48px; --dur: 2.05s; --delay: -0.45s; --size: 3px; }
.band__pyro .spark:nth-child(5) { --drift:  -7px; --rise: 58px; --dur: 1.70s; --delay: -1.55s; --size: 2px; }
.band__pyro .spark:nth-child(6) { --drift:   4px; --rise: 37px; --dur: 1.30s; --delay: -0.95s; --size: 4px; }
.band__pyro .spark:nth-child(7) { --drift: -11px; --rise: 62px; --dur: 2.20s; --delay: -1.35s; --size: 2px; }

/* One glow allowance, on three elements only. Cheap enough, and the candle
   needs to read as brighter than the crackle around it. */
.band__pyro .candle {
  width: 7px; height: 7px;
  --dur: 5.4s; --rise: 112px; --drift: 0px; --delay: 0s;
  background: radial-gradient(circle,
    #FFFDF6 0 34%, var(--gold) 62%, rgba(200,16,46,0) 100%);
  box-shadow: 0 0 10px 2px rgba(217,169,76,0.65);
  animation: pyro-candle var(--dur) cubic-bezier(0.18, 0.62, 0.36, 1)
             var(--delay) infinite;
}

/* Offset so the three candles fire in rotation, never together. */
.band__pyro .gerb:nth-child(1) .candle { --delay:  0.0s; --drift:  -9px; }
.band__pyro .gerb:nth-child(2) .candle { --delay: -1.8s; --drift:   0px; --rise: 128px; }
.band__pyro .gerb:nth-child(3) .candle { --delay: -3.6s; --drift:   9px; }

/* Up fast, apex, then drift and fall back a little as it burns out. */
@keyframes pyro-spark {
  0%   { transform: translate(-50%, 0) scale(1); opacity: 0; }
  10%  { opacity: 1; }
  62%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1)) scale(0.7); opacity: 0.9; }
  100% { transform: translate(calc(-50% + var(--drift) * 1.4),
                              calc(var(--rise) * -0.7)) scale(0.2); opacity: 0; }
}

/* The action sits in the first half of the timeline. The dead second half is
   what makes it read as a candle firing in rotation instead of a hose. */
@keyframes pyro-candle {
  0%   { transform: translate(-50%, 0) scale(0.45); opacity: 0; }
  4%   { transform: translate(-50%, -4px) scale(1); opacity: 1; }
  30%  { opacity: 0.95; }
  42%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1)) scale(0.8); opacity: 0.45; }
  50%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1.06)) scale(0.22); opacity: 0; }
  100% { opacity: 0; }
}

/* Pyro is motion and nothing else. Frozen sparks read as dust on the lens, so
   for anyone who asked for less motion it goes away entirely. */
@media (prefers-reduced-motion: reduce) {
  .band--pyro .band__pyro { display: none; }
}

/* Footlights along the stage lip. Same bulb values as the marquee, so the
   motif reads as one language rather than two. */
.band__lip {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 7px;
  pointer-events: none;
  background-image: radial-gradient(circle, var(--gold) 0 1.6px, rgba(0,0,0,0.45) 2px);
  background-size: 13px 7px;
  background-repeat: repeat-x;
  background-position: center;
  opacity: 0.85;
}

/* Lights snap on with no sequence for anyone who asked for less motion. */
@media (prefers-reduced-motion: reduce) {
  .band__lights span { animation: none; opacity: 0; }
}

.welcome__kicker {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--dim); margin: 0 0 14px;
}

.welcome__title { font-size: clamp(34px, 13vw, 60px); margin: 0; max-width: 15ch; }

.welcome__rule {
  height: 3px; width: 56px; margin: 20px 0;
  background: var(--grad-primary); border-radius: 2px;
}

.welcome__where { margin: 0; color: var(--dim); }

/* countdown */
.count { display: flex; gap: 8px; margin: 26px 0 4px; }

.count__cell {
  background: var(--riser); border: 1px solid var(--edge);
  border-radius: 8px; padding: 9px 12px; min-width: 62px;
}

.count__n {
  font-family: var(--font-display); font-size: 26px; line-height: 1;
  font-variant-numeric: tabular-nums;
}

.count__l {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute); margin-top: 4px;
}

.count__note { font-size: 11px; color: var(--mute); margin: 0; }
.count__live { color: var(--gold); font-weight: 600; }

/* QR. Dark modules on a cream card. Never inverted, plenty of scanners
   refuse a light on dark code. */
.qr {
  margin: 26px 0 0; background: var(--cream);
  border-radius: 10px; padding: 10px; width: 150px;
}

.qr img { display: block; width: 100%; height: auto; }
.qr__cap { font-size: 11px; color: var(--mute); margin: 8px 0 0; }

.enter {
  margin-top: 26px; width: 100%; max-width: 320px;
  border: 0; border-radius: 10px; padding: 16px;
  background: var(--grad-primary); color: var(--cream);
  font-size: 17px; font-weight: 600; cursor: pointer;
}

.enter:active { background: var(--oxblood); }

/* -------------------------------------------------------------- header */
/* The header and the tab bar stick as one unit. They used to be two separate
   sticky elements both pinned to top: 0, which meant that the moment the
   masthead scrolled away they landed on top of each other and the brand mark
   sat over the first row of tab pills. Found while building T1.1, because The
   Setlist is the first tab with enough content to scroll. */
.stickytop { position: sticky; top: 0; z-index: 30; }

.hdr {
  position: relative; z-index: 2;
  background: rgba(23,22,26,0.92);
  backdrop-filter: saturate(1.4) blur(8px);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--warm-edge);
  padding-top: var(--safe-t);
}

.hdr__row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));
}

.hdr__mark { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
.hdr__pick { width: 26px; flex: 0 0 26px; }
.hdr__pick .pick__text { font-size: 6px; }

/* Three buttons sit to the right now. The brand text gives way before they do. */
.hdr__name {
  font-size: 15px; line-height: 1; margin: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Gold, not mute grey. Small enough that it warms the header without
   spending gold on anything that matters. */
.hdr__sub {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold); margin: 3px 0 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.iconbtn {
  flex: 0 0 auto;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 9px; color: var(--cream);
  font-size: 16px; cursor: pointer; padding: 0;
}

.iconbtn:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.iconbtn--on {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  color: var(--cream);
}

/* ------------------------------------------------------------- tab bar */
/* Group asked for more red and gold, and the tab bar is where it earns its
   keep, because it is on screen on every tab all week. Red does the work.
   Gold is a hairline and a badge, so the Encore award cards keep their claim
   on it. */
.tabs {
  position: relative; z-index: 1;
  background: rgba(23,22,26,0.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 0;
}

/* Scarlet rule under the whole bar with a gold hairline sitting on it. Reads
   as a poster rule, and ties the bar to the footlights on the welcome hero. */
.tabs::after {
  content: '';
  display: block;
  height: 2px;
  background:
    linear-gradient(180deg, var(--gold-rule) 0 1px, transparent 1px),
    var(--grad-primary);
}

.tabs__scroll {
  display: flex; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 9px calc(12px + var(--safe-r)) 9px calc(12px + var(--safe-l));
}

.tabs__scroll::-webkit-scrollbar { display: none; }

/* Resting tab is warm, not grey. Oxblood over --input so it still recedes
   behind the selected one but stops looking like a system control. */
.tab {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 7px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 999px; padding: 8px 14px;
  color: var(--cream); font-size: 13px; font-weight: 500;
  white-space: nowrap; cursor: pointer;
  transition: background-image 120ms ease, border-color 120ms ease;
}

.tab:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

/* Selected tab is a lit scarlet pill with a gold ring. This is the poster
   move: gold rule on scarlet, straight off the Shank Showdown art. */
.tab[aria-selected="true"] {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  color: var(--cream);
  font-weight: 600;
  box-shadow: 0 0 0 1px rgba(217,169,76,0.22), 0 3px 12px rgba(200,16,46,0.34);
}

.tab__icon { font-size: 14px; line-height: 1; }

/* Gold badge, dark text. Scarlet on a now scarlet pill would vanish. */
.tab__badge {
  background: var(--gold); color: #2A1408;
  border-radius: 999px; min-width: 19px; padding: 1px 6px;
  font-size: 11px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums;
}

.tab__lock { color: var(--gold); font-size: 11px; }

/* ------------------------------------------------------------- content */
.sheet {
  padding: 14px calc(16px + var(--safe-r)) calc(48px + var(--safe-b))
           calc(16px + var(--safe-l));
}

.marquee-slot { margin-bottom: 16px; display: flex; align-items: stretch; gap: 8px; }
.marquee-slot .marquee { flex: 1 1 auto; min-width: 0; }

.marquee-x {
  flex: 0 0 auto; width: 34px;
  background: var(--input); border: 1px solid var(--edge);
  border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 14px;
}

.tabhead { margin: 0 0 4px; font-size: clamp(26px, 8vw, 34px); }
.tabhead__sub { color: var(--dim); font-size: 14px; margin: 0 0 18px; }

.stubnote {
  background: var(--riser); border: 1px dashed var(--edge);
  border-radius: 10px; padding: 18px 16px; color: var(--dim);
}

.stubnote code { color: var(--gold); font-size: 13px; }

/* Build notes are crew only. Nothing that says "T1.1" should ever reach an
   attendee, so it is gated on the PIN rather than on my memory. */
.buildnote {
  margin-top: 12px;
  background: var(--input); border-left: 3px solid var(--scarlet);
  border-radius: 6px; padding: 11px 13px;
}

.buildnote__tag {
  font-family: var(--font-display); font-size: 10px;
  letter-spacing: 0.14em; color: var(--scarlet); margin: 0 0 4px;
}

.buildnote__body { font-size: 13px; color: var(--dim); margin: 0; }

/* Display Mode. The only place a viewport locked height is allowed. */
body.display-mode .tabs,
body.display-mode .marquee-slot { display: none; }

body.display-mode .sheet { padding-top: 20px; }
body.display-mode .tabhead { font-size: clamp(34px, 6vw, 60px); }
body.display-mode .stubnote { font-size: 20px; }

/* -------------------------------------------------------------- admin */
.adminbar {
  background: var(--glow); border: 1px solid var(--scarlet);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
}

.adminbar__t { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
.adminbar__p { font-size: 12px; color: var(--dim); margin: 0; }

.pinwrap {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,9,12,0.86);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

.pin {
  background: var(--riser); border: 1px solid var(--edge);
  border-radius: 12px; padding: 20px; width: 100%; max-width: 320px;
}

.pin__t { margin: 0 0 12px; font-size: 20px; }

.pin__in {
  width: 100%; background: var(--input); border: 1px solid var(--edge);
  border-radius: 8px; padding: 13px; color: var(--cream);
  font-family: var(--font-body); font-size: 20px;
  letter-spacing: 0.4em; text-align: center;
}

.pin__err { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
.pin__row { display: flex; gap: 8px; margin-top: 14px; }

.pin__btn {
  flex: 1 1 0; border: 0; border-radius: 8px; padding: 13px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  background: var(--grad-primary); color: var(--cream);
}

.pin__btn--ghost { background: var(--input); color: var(--dim); }

/* ==========================================================================
   DESKTOP AND LAPTOP
   The wall is mobile first and 380px stays the design baseline. This block
   exists because the regional team, Carol, Lisa, and Jeannette all review on a
   laptop, and because uncapped mobile layout is genuinely broken on a wide
   screen rather than merely plain.
   ========================================================================== */
@media (min-width: 700px) {

  /* The strip is a 2:1 image at 100% width, so at 1280px it stood 658px tall
     and pushed the countdown, the enter button, and the QR below the fold.
     Cap the height and let object-fit crop instead of scaling. */
  .masthead--tall .band { max-height: 32vh; }

  /* The compact masthead shares the reading column rather than going full
     bleed. At 1280px wide a full bleed strip scales the picture to 658px tall,
     so a 140px frame is a 9:1 slice of a 2:1 photo and you see foreheads.
     Held to 780px, the same 140px frame lands on the faces. */
  .masthead:not(.masthead--tall) {
    max-width: var(--shell-max);
    margin-left: auto;
    margin-right: auto;
  }

  .masthead:not(.masthead--tall) .band { height: 150px; }

  /* Bottom corners only. The top sits against the browser chrome. */
  .masthead:not(.masthead--tall) .masthead__banner {
    border-radius: 0 0 10px 10px;
  }

  /* One centred reading column. Header, tabs, and content all share an edge. */
  .hdr__row,
  .tabs__scroll,
  .sheet,
  .welcome__body {
    max-width: var(--shell-max);
    margin-left: auto;
    margin-right: auto;
  }

  /* QR beside the text rather than under it, which is what pushed it below the
     fold on a 1280 by 800 laptop. */
  .welcome__body {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 44px;
    text-align: left;
  }

  .welcome__text { align-items: flex-start; }
  .welcome__aside { flex: 0 0 auto; }
  .welcome__title { max-width: 20ch; }
  .welcome__rule { margin: 18px 0; }

  /* No touchscreen, so a swipe only tab bar is the wrong control. Let all ten
     pills wrap onto two rows where they can just be clicked. */
  .tabs__scroll {
    flex-wrap: wrap;
    overflow-x: visible;
    row-gap: 7px;
  }

  /* Display Mode is the projector view. It wants the whole screen, not a
     reading column. */
  body.display-mode .sheet { max-width: none; }
}

/* -------------------------------------------------------------- offline */
.bootfail {
  margin: 0 0 16px; background: var(--riser);
  border: 1px solid var(--danger); border-radius: 10px;
  padding: 12px 14px; font-size: 13px; color: var(--cream);
}

/* ==========================================================================
   T1.1 THE SETLIST
   Day pills, ticket stub session cards, ON AIR pulse, reactions.
   No new motifs. Ticket, grille, glow-card, struck and is-done all come from
   T0.4. Everything below is layout and chrome mixed from the same dials the
   tab bar uses, so the palette is still twelve tokens.
   ========================================================================== */

/* ---------------------------------------------------------- day pills */
/* Same warm chrome language as the tab bar, one notch quieter, because the tab
   bar has to stay the loudest control on the page. */
.dayrow {
  display: flex; gap: 7px; margin: 0 0 16px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}

.dayrow::-webkit-scrollbar { display: none; }

.daypill {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 999px; padding: 7px 14px;
  color: var(--cream); cursor: pointer; text-align: left;
  white-space: nowrap; font-family: inherit;
  transition: background-image 120ms ease, border-color 120ms ease;
}

.daypill:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.daypill[aria-selected="true"] {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(217,169,76,0.22), 0 3px 12px rgba(200,16,46,0.34);
}

.daypill__d { display: block; font-size: 11px; letter-spacing: 0.1em; color: var(--gold); }
.daypill[aria-selected="true"] .daypill__d { color: var(--cream); }
.daypill__n { display: block; font-size: 14px; line-height: 1.15; }

/* Today's dot. Scarlet on a resting pill reads fine, but the selected pill is
   itself a scarlet gradient, so the dot carries a cream ring and stays a
   scarlet dot in both states. */
.daypill__dot {
  flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;
  background: var(--scarlet);
  box-shadow: 0 0 0 2px rgba(247,243,234,0.88);
}

/* ------------------------------------------------------- day header card */
.dayhead { padding: 15px 16px; margin: 0 0 14px; }
.dayhead__t { margin: 0; font-size: clamp(22px, 6.6vw, 30px); }
.dayhead__note { margin: 9px 0 0; color: var(--dim); font-size: 14px; }

.dayhead__attire { margin: 13px 0 0; display: flex; flex-direction: column; gap: 7px; }

.attire { display: flex; gap: 9px; align-items: baseline; font-size: 13px; }

.attire__k {
  flex: 0 0 auto;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.attire__v { margin: 0; color: var(--cream); }

/* ---------------------------------------------------- session cards */
.set-list { display: flex; flex-direction: column; gap: 16px; }
.set-card { --ticket-stub-w: 78px; }

/* The whole ticket is the toggle, so it is a button. Strip the UA chrome and
   let .ticket keep the motif. Reactions and links sit outside it, because a
   button cannot hold another button. */
.set-ticket {
  width: 100%; padding: 0; margin: 0;
  font: inherit; color: inherit; text-align: left;
  -webkit-appearance: none; appearance: none;
  cursor: pointer;
}

.set-ticket:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.set-stub__t { font-family: var(--font-display); font-size: 20px; line-height: 1; }
.set-stub__m { font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }

.set-stub__lab {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 13px; line-height: 1.05; letter-spacing: 0.06em;
  color: var(--gold);
}

.set-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 0 7px;
}

.set-kicker {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--dim);
}

/* These are spans, not paragraphs, because their parent is a button. */
.set-title { display: block; margin: 0; font-size: 17px; font-weight: 600; line-height: 1.28; }
.set-meta { display: block; margin: 6px 0 0; font-size: 13px; color: var(--dim); }

.set-more {
  display: block; margin: 9px 0 0;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--mute);
}

/* ON AIR. Scarlet gradient, gold bulb, and a ring that breathes outward. */
.onair {
  display: inline-flex; align-items: center; gap: 6px;
  background-image: var(--grad-primary);
  border: 1px solid var(--gold-rule); border-radius: 999px;
  padding: 3px 10px; color: var(--cream);
  font-family: var(--font-display); font-size: 11px; letter-spacing: 0.14em;
  animation: onair-pulse 1.7s ease-in-out infinite;
}

.onair__dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
}

@keyframes onair-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,16,46,0.55); }
  55%      { box-shadow: 0 0 0 7px rgba(200,16,46,0); }
}

/* A badge that throbs on every card is exactly the thing to switch off for
   anyone who asked for less motion. It still reads as ON AIR standing still. */
@media (prefers-reduced-motion: reduce) {
  .onair { animation: none; }
}

/* Starts within 30 minutes. */
.soon {
  display: inline-flex; align-items: center; gap: 6px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; font-weight: 600; color: var(--gold);
}

/* ------------------------------------------------------------- detail */
/* Sits under the ticket with a gap rather than flush, because .ticket punches
   its notches half outside its own bottom edge and a flush panel would show a
   --stage circle sitting on top of it. */
.set-detail {
  margin: 11px 0 0 12px;
  background: var(--riser);
  border: 1px solid var(--edge); border-left: 3px solid var(--scarlet);
  border-radius: 8px; padding: 13px 15px;
}

.set-detail__d { margin: 0 0 12px; font-size: 14px; }
.set-detail__d:last-child { margin-bottom: 0; }

.set-dl {
  margin: 0; display: grid; grid-template-columns: auto 1fr;
  gap: 6px 12px; font-size: 13px; align-items: baseline;
}

.set-dl dt {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.set-dl dd { margin: 0; color: var(--cream); min-width: 0; }

.set-fine { margin: 12px 0 0; font-size: 11px; color: var(--mute); }

/* Sub items inside one session. The seven Core Fundamentals breakouts. */
.set-items { margin: 0 0 12px; }

.set-items__k {
  margin: 0 0 6px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.set-items__l { margin: 0; padding-left: 18px; font-size: 13px; }
.set-items__l li { margin: 0 0 3px; }
.set-items__l li::marker { color: var(--scarlet); }

/* Link chips. Maps, phones, mail, websites. Shared with T1.2. */
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }

.linkchip {
  display: inline-flex; align-items: center; gap: 7px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 8px 13px; color: var(--cream); font-size: 13px;
  text-decoration: none;
}

.linkchip:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.linkchip__i { font-size: 13px; line-height: 1; }

/* ---------------------------------------------------------- reactions */
.reacts { display: flex; flex-wrap: wrap; gap: 8px; margin: 11px 0 0 12px; }

.react {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--input); border: 1px solid var(--edge);
  border-radius: 999px; padding: 6px 12px;
  color: var(--dim); font-size: 14px; cursor: pointer;
}

.react__n { font-size: 12px; font-weight: 600; min-width: 1ch; }

.react.is-cast {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
  border-color: var(--warm-edge); color: var(--cream);
}

.react:disabled { cursor: default; opacity: 0.55; }

/* --------------------------------------------------------- placeholder */
/* The running order for Wednesday and Thursday is not on the flier. This card
   says so out loud rather than being quietly filled in with a guess. */
.set-card--tba .ticket { border-style: dashed; background: transparent; }
.set-card--tba .ticket__stub { border-right-style: dashed; }

/* ------------------------------------------------------------- notices */
.setnote {
  margin: 0 0 16px; background: var(--riser);
  border: 1px solid var(--gold-rule); border-radius: 10px;
  padding: 11px 13px; font-size: 12px; color: var(--dim);
}

/* ==========================================================================
   T1.2 BACKSTAGE PASS
   Seven ticket stub panels. Same ticket motif as The Setlist, same link chips.
   Nothing here is interactive except the links, so these are plain sections
   rather than buttons.
   ========================================================================== */

.bs-list { display: flex; flex-direction: column; gap: 18px; }
.bs-panel { --ticket-stub-w: 72px; }

.bs-stub {
  font-size: 14px; line-height: 1.05; color: var(--gold);
  letter-spacing: 0.04em;
}

.bs-h { margin: 0 0 10px; font-size: clamp(18px, 5.4vw, 22px); }

.bs-p { margin: 0 0 10px; font-size: 14px; }
.bs-p:last-child { margin-bottom: 0; }

.bs-fine { margin: 10px 0 0; font-size: 12px; color: var(--mute); }

.bs-ul { margin: 0; padding-left: 18px; font-size: 14px; }
.bs-ul li { margin: 0 0 5px; }
.bs-ul li::marker { color: var(--scarlet); }

/* One venue or one contact inside a panel. */
.venue + .venue {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--edge);
}

.venue__n { margin: 0; font-size: 15px; font-weight: 600; }
.venue__note { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
.venue .chiprow { margin-top: 10px; }

/* An address chip carries a whole line of text, so it wraps rather than
   pushing the panel wider than the phone. */
.venue .linkchip, .chiprow .linkchip { max-width: 100%; }
.linkchip > span:last-child { min-width: 0; overflow-wrap: anywhere; }

/* Rental codes. Tabular figures, because a mistyped code is a lost booking. */
.bs-codes {
  margin: 0; display: grid; grid-template-columns: auto 1fr;
  gap: 6px 14px; align-items: baseline;
}

.bs-codes dt {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 11px; letter-spacing: 0.14em; color: var(--gold);
}

.bs-codes dd {
  margin: 0; font-size: 16px; font-weight: 700;
  letter-spacing: 0.08em;
  -webkit-user-select: all; user-select: all;
}

/* Attire, day by day. A real table overflows at 380px, so this is a two column
   grid that collapses to stacked rows on a narrow phone. */
.bs-day { display: flex; gap: 12px; align-items: baseline; }

.bs-day + .bs-day {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--edge);
}

.bs-day__d {

/* ------------------------------------------------------------- helpers */

function readLS(key) {

}

function writeLS(key, value) {

}

/* Splits a millisecond span into whole days, hours, minutes, seconds. */
function breakdown(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return {
    days:    Math.floor(s / 86400),
    hours:   Math.floor((s % 86400) / 3600),
    minutes: Math.floor((s % 3600) / 60),
    seconds: s % 60
  };
}

function pad(n) { return n < 10 ? "0" + n : String(n); }

function readJSON(key) {
  const raw = readLS(key);
  if (!raw) return {};
  try {
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (e) {
    return {};
  }
}

function writeJSON(key, value) {
  try { writeLS(key, JSON.stringify(value)); } catch (e) { /* nothing to do */ }
}

/* ------------------------------------------------------- links out */

/* Strip a printed number down to a dialable one. The flier prints three
   different formats and none of them dial. */
function telHref(printed) {
  const digits = String(printed || "").replace(/\D/g, "");
  if (!digits) return null;
  return "tel:+1" + (digits.length === 11 && digits[0] === "1" ? digits.slice(1) : digits);
}

function mailHref(address) { return address ? "mailto:" + address : null; }

/* Apple platforms hand maps.apple.com straight to Maps. Android hands the
   Google search URL straight to the Maps app. Sending one link to both gets a
   web page on one of them, so the platform decides. */
const IS_APPLE = /iPhone|iPad|iPod|Macintosh/.test(
  (window.navigator && window.navigator.userAgent) || ""
);

function mapHref(query) {
  if (!query) return null;
  const q = encodeURIComponent(query);
  return IS_APPLE
    ? "https://maps.apple.com/?q=" + q
    : "https://www.google.com/maps/search/?api=1&query=" + q;
}

/* The whole address if there is one, the venue name if there is not. */
function venueMapQuery(v) {
  if (!v) return null;
  return v.addr ? v.name + ", " + v.addr : v.name;
}

/* ------------------------------------------------------- eastern clock */
/* The meeting is in Ohio and attendees fly in from several time zones, so every
   label the wall prints is Eastern regardless of where the phone thinks it is.
   Intl does the DST work rather than an offset constant. */
const ET = "America/New_York";

function etParts(ms) {
  try {
    const f = new Intl.DateTimeFormat("en-US", {
      timeZone: ET, hour: "numeric", minute: "2-digit", hour12: true
    });
    const out = { hhmm: "", ap: "" };
    f.formatToParts(ms).forEach((p) => {
      if (p.type === "hour") out.hhmm = p.value;
      if (p.type === "minute") out.hhmm += ":" + p.value;
      if (p.type === "dayPeriod") out.ap = p.value.toUpperCase();
    });
    return out;
  } catch (e) {
    const d = new Date(ms);
    return { hhmm: d.getHours() + ":" + pad(d.getMinutes()), ap: "" };
  }
}

/* Calendar date in Eastern, as YYYY-MM-DD, so it can be compared to the date
   strings in agenda.json without any timezone arithmetic. */
function etDate(ms) {
  try {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: ET, year: "numeric", month: "2-digit", day: "2-digit"
    }).format(ms);
  } catch (e) {
    const d = new Date(ms);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
}

/* mm:ss for a countdown under an hour, h:mm:ss over one. */
function clock(ms) {
  const t = breakdown(ms);
  const h = t.days * 24 + t.hours;
  return h > 0
    ? h + ":" + pad(t.minutes) + ":" + pad(t.seconds)
    : t.minutes + ":" + pad(t.seconds);
}

/* ------------------------------------------------------- firebase boot */
/* One place to fail. If Firebase cannot start, the shell still renders and

function bootFirebase() {
  try {
    if (!window.firebase || !firebase.database) {
      return { ok: false, reason: "The Firebase library did not load." };
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    return { ok: true, db: firebase.database() };
  } catch (err) {
    return { ok: false, reason: (err && err.message) || String(err) };
  }
}

   wall never trusts the device clock on its own. Firebase publishes the
   offset between this device and the server at .info/serverTimeOffset.
   T2.3 reuses this for the Vault drops, where getting it wrong means content
   lands on the wrong morning. */
/* Test hook, not a feature. `?clock=2026-08-26T09:15:00-04:00` makes this one
   device believe it is that moment, and the belief flows through the same
   corrected clock every timed thing on the wall already reads. That is how ON
   AIR, the dimming, the 30 minute countdown, and the Vault drops at T2.3 get
   tested on the live URL without touching a machine clock. It changes nothing
   for anyone who does not pass the parameter, and any device using it says so
   on screen so nobody is fooled by a card that is lying about the time. */
const SIM_CLOCK = (function () {
  try {
    const raw = new URLSearchParams(window.location.search).get("clock");
    if (!raw) return null;
    const at = Date.parse(raw);
    return isNaN(at) ? null : at;
  } catch (e) { return null; }
})();

function useServerNow() {
  const [offset, setOffset] = useState(() => (SIM_CLOCK ? SIM_CLOCK - Date.now() : 0));
  const [synced, setSynced] = useState(false);
  const [now, setNow] = useState(() => Date.now());

  useEffect(() => {
    if (!FB.ok || SIM_CLOCK) return;
    const ref = FB.db.ref(".info/serverTimeOffset");
    const handler = (snap) => {
      setOffset(snap.val() || 0);
      setSynced(true);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    const id = window.setInterval(() => setNow(Date.now()), 1000);
    return () => window.clearInterval(id);
  }, []);

  return { now: now + offset, offset, synced, simulated: SIM_CLOCK !== null };
}

function useAnnouncement() {
  const [item, setItem] = useState(null);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("announcements");
    const handler = (snap) => {
      const all = snap.val() || {};
      const live = Object.keys(all)
        .map((id) => Object.assign({ id: id }, all[id]))
        .filter((a) => a && a.on && a.text)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
      setItem(live.length ? live[0] : null);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

}

/* ==========================================================================
   T1.1 THE SETLIST. Spec 3.1.
   Four day pills, sessions as ticket stubs, ON AIR on the live one, completed
   ones dimmed and struck, a countdown inside 30 minutes, tap to expand, four
   reactions per session against Firebase.

   Every clock decision reads the server corrected `now` handed down from
   useServerNow. Nothing in here calls Date.now(). Attendees fly in from several
   time zones and a phone an hour out would otherwise put ON AIR on the wrong
   card in front of the whole room.
   ========================================================================== */

/* Four per session, counts at reactions/{eventKey}/{emoji}. One cast per emoji
   per session per device, held in mm26_reacted. Somebody determined can clear
   their own storage and cast again. That is fine. This is applause, not a
   ballot. */
const REACTIONS = [
  { key: "fire",      glyph: "\u{1F525}", label: "Fire" },
  { key: "horns",     glyph: "\u{1F918}", label: "Horns up" },
  { key: "lightbulb", glyph: "\u{1F4A1}", label: "Good idea" },
  { key: "bullseye",  glyph: "\u{1F3AF}", label: "Nailed it" }
];

const HALF_HOUR = 30 * 60 * 1000;

function useAgenda() {
  const [state, setState] = useState({ status: "loading", data: null, reason: "" });

  useEffect(() => {
    let live = true;
    fetch("data/agenda.json", { cache: "no-cache" })
      .then((res) => {
        if (!res.ok) throw new Error("The file returned " + res.status + ".");
        return res.json();
      })
      .then((data) => { if (live) setState({ status: "ready", data: data, reason: "" }); })
      .catch((err) => {
        if (live) setState({ status: "failed", data: null, reason: (err && err.message) || String(err) });
      });
    return () => { live = false; };
  }, []);

  return state;
}

/* One listener for the whole reactions node. Four counters across a dozen
   sessions is a few hundred bytes, so this is cheaper than a listener per
   session and it keeps every count live with no reload. */
function useReactions() {
  const [counts, setCounts] = useState({});

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("reactions");
    const handler = (snap) => setCounts(snap.val() || {});
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return counts;
}

/* A transaction rather than a set, because two people tapping the same button
   in the same second must both be counted. */
function castReaction(eventKey, emoji) {
  if (!FB.ok) return;
  FB.db.ref("reactions/" + eventKey + "/" + emoji)
    .transaction((current) => (current || 0) + 1);
}

/* Where a session sits against the corrected clock.
   `open` kind has a start and no end, so it runs until the day is out. Every
   day of this meeting falls in EDT, which is UTC-4, so the day boundary is
   written out rather than computed. */
function sessionState(sess, day, now) {
  /* `aside` is pinned at a time but is not a session. The Stop n Go break
     station is available across the whole breakout block, so it neither goes
     ON AIR nor strikes itself out at 10:31. */
  if (sess.kind === "placeholder" || sess.kind === "allday" || sess.kind === "aside") {
    return { phase: "static" };
  }

  const start = sess.start ? Date.parse(sess.start) : NaN;
  if (isNaN(start)) return { phase: "static" };

  if (now < start) {
    const left = start - now;
    return { phase: "next", left: left, soon: left <= HALF_HOUR };
  }

  if (sess.kind === "instant") return { phase: "done" };

  const end = sess.end
    ? Date.parse(sess.end)
    : Date.parse(day.date + "T23:59:59-04:00");

  return now < end ? { phase: "live" } : { phase: "done" };
}

function LinkChip({ href, glyph, children }) {
  if (!href) return null;
  const external = /^https?:/.test(href);
  return (
    <a
      className="linkchip"
      href={href}
      target={external ? "_blank" : undefined}
      rel={external ? "noopener noreferrer" : undefined}
    >
      <span className="linkchip__i" aria-hidden="true">{glyph}</span>
      <span>{children}</span>
    </a>
  );
}

/* Everything inside the ticket is a span, because the ticket itself is a
   button and a button may not hold a p or a div. Reactions and links sit
   outside it for the same reason. */
function SessionCard({ sess, day, now, counts, castMap, onCast, open, onToggle }) {
  const st = sessionState(sess, day, now);
  const venue = sess.venue ? VENUES[sess.venue] : null;
  const clocked = !!sess.start;
  const at = clocked ? etParts(Date.parse(sess.start)) : null;
  const panelId = "sess-" + sess.key;
  const where = [venue ? venue.name : "", sess.room].filter(Boolean).join(", ");
  const mine = counts[sess.key] || {};

  const badges = (
    <span className="set-row">
      {st.phase === "live" ? (
        <span className="onair">
          <span className="onair__dot" aria-hidden="true"></span>On Air
        </span>
      ) : null}
      {st.phase === "next" && st.soon ? (
        <span className="soon">
          Starts in <span className="t-data">{clock(st.left)}</span>
        </span>
      ) : null}
      {sess.subtitle ? <span className="set-kicker">{sess.subtitle}</span> : null}
    </span>
  );

  const showBadges = st.phase === "live" || (st.phase === "next" && st.soon) || sess.subtitle;

  const stub = clocked ? (
    <span className="ticket__stub">
      <span className="set-stub__t">{at.hhmm}</span>
      <span className="set-stub__m">{at.ap}</span>
    </span>
  ) : (
    <span className="ticket__stub">
      <span className="set-stub__lab">{sess.stubLabel}</span>
    </span>
  );

  const body = (
    <span className="ticket__body">
      {showBadges ? badges : null}
      <span className="set-title">
        {st.phase === "done" ? <span className="struck">{sess.title}</span> : sess.title}
      </span>
      {sess.presenter || where ? (
        <span className="set-meta">
          {[sess.presenter, where].filter(Boolean).join(" · ")}
        </span>
      ) : null}
      <span className="set-more">{open ? "Close ▴" : "Detail ▾"}</span>
    </span>
  );

  if (sess.kind === "placeholder") {
    return (
      <article className="set-card set-card--tba">
        <div className="ticket">
          {stub}
          <span className="ticket__body">
            <span className="set-row">
              <span className="set-kicker">Running order to come</span>
            </span>
            <span className="set-title">{sess.title}</span>
            <span className="set-meta">{sess.description}</span>
          </span>
        </div>
      </article>
    );
  }

  const anyDetail = sess.description || where || sess.presenter || sess.preread
    || (sess.items && sess.items.length);

  return (
    <article className={"set-card" + (st.phase === "done" ? " is-done" : "")}>
      <button
        className="ticket set-ticket"
        aria-expanded={open}
        aria-controls={panelId}
        onClick={onToggle}
      >
        {stub}
        {body}
      </button>

      {open ? (
        <div className="set-detail" id={panelId}>
          {sess.description ? (
            <p className="set-detail__d">{sess.description}</p>
          ) : null}

          {!anyDetail ? (
            <p className="set-detail__d">Nothing else on the agenda for this one.</p>
          ) : null}

          {/* The seven Core Fundamentals breakouts sit under one session, so
              they are a list inside that session rather than seven cards that
              would each claim their own start time. */}
          {sess.items && sess.items.length ? (
            <div className="set-items">
              <p className="set-items__k">{sess.itemsLabel || "Includes"}</p>
              <ul className="set-items__l">
                {sess.items.map((it) => <li key={it}>{it}</li>)}
              </ul>
            </div>
          ) : null}

          {where || sess.presenter || sess.preread ? (
            <dl className="set-dl">
              {sess.presenter ? (
                <React.Fragment><dt>Who</dt><dd>{sess.presenter}</dd></React.Fragment>
              ) : null}
              {where ? (
                <React.Fragment><dt>Where</dt><dd>{where}</dd></React.Fragment>
              ) : null}
              {sess.preread ? (
                <React.Fragment>
                  <dt>Pre-read</dt>
                  <dd>
                    <a href={sess.preread.url} target="_blank" rel="noopener noreferrer">
                      {sess.preread.label}
                    </a>
                  </dd>
                </React.Fragment>
              ) : null}
            </dl>
          ) : null}

          {venue || (sess.links && sess.links.length) ? (
            <div className="chiprow">
              {venue ? (
                <LinkChip href={mapHref(venueMapQuery(venue))} glyph={"\u{1F4CD}"}>
                  {venue.name}
                </LinkChip>
              ) : null}
              {venue && venue.phone ? (
                <LinkChip href={telHref(venue.phone)} glyph={"\u{1F4DE}"}>
                  {venue.phone}
                </LinkChip>
              ) : null}
              {(sess.links || []).map((l) => (
                <LinkChip
                  key={l.kind + l.value}
                  href={l.kind === "mail" ? mailHref(l.value)
                      : l.kind === "tel" ? telHref(l.value)
                      : l.value}
                  glyph={l.kind === "mail" ? "✉" : l.kind === "tel" ? "\u{1F4DE}" : "\u{1F517}"}
                >
                  {l.label}
                </LinkChip>
              ))}
            </div>
          ) : null}

          {sess.endSource === "next" ? (
            <p className="set-fine">
              The agenda gives a start time only. The end used here is the next
              item's start, so the live badge is a derivation.
            </p>
          ) : null}

          {sess.kind === "open" ? (
            <p className="set-fine">No end time on the agenda. It runs until the night is done.</p>
          ) : null}
        </div>
      ) : null}

      <div className="reacts">
        {REACTIONS.map((r) => {
          const n = mine[r.key] || 0;
          const cast = !!castMap[sess.key + ":" + r.key];
          return (
            <button
              key={r.key}
              className={"react" + (cast ? " is-cast" : "")}
              disabled={!FB.ok || cast}
              onClick={() => onCast(sess.key, r.key)}
              title={cast ? "Already counted" : r.label}
            >
              <span aria-hidden="true">{r.glyph}</span>
              <span className="react__n t-data">{FB.ok ? n : "–"}</span>
              <span className="sr-only">{r.label}</span>
            </button>
          );
        })}
      </div>
    </article>
  );
}

function SetlistTab({ isAdmin, now }) {
  const agenda = useAgenda();
  const counts = useReactions();
  const [castMap, setCastMap] = useState(() => readJSON(LS.reacted));
  const [dayKey, setDayKey] = useState(null);
  const [open, setOpen] = useState({});

  const days = (agenda.data && agenda.data.days) || [];
  const today = etDate(now);

  /* Land on today if the meeting is running, otherwise on the next day that
     has not happened yet. Runs once, when the file arrives. After that the
     pills belong to whoever is tapping them. */
  useEffect(() => {
    if (!days.length || dayKey) return;
    const onToday = days.filter((d) => d.date === today)[0];
    const ahead = days.filter((d) => d.date >= today)[0];
    setDayKey((onToday || ahead || days[0]).key);
  }, [agenda.status]);

  const onCast = useCallback((sessKey, emoji) => {
    const id = sessKey + ":" + emoji;
    /* Read storage rather than state, so a second tab on the same phone cannot
       double cast through a stale copy. */
    const held = readJSON(LS.reacted);
    if (held[id]) return;
    held[id] = 1;
    writeJSON(LS.reacted, held);
    setCastMap(held);
    castReaction(sessKey, emoji);
  }, []);

  const day = days.filter((d) => d.key === dayKey)[0] || days[0];

  return (
    <TabFrame tabKey="setlist">
      {agenda.status === "loading" ? (
        <Empty>Pulling the running order.</Empty>
      ) : null}

      {agenda.status === "failed" ? (
        <Empty>
          The running order did not load. {agenda.reason} Everything else on the
          wall still works.
        </Empty>
      ) : null}

      {day ? (
        <div>
          <div className="dayrow" role="tablist" aria-label="Days">
            {days.map((d) => (
              <button
                key={d.key}
                role="tab"
                className="daypill"
                aria-selected={d.key === dayKey}
                onClick={() => setDayKey(d.key)}
              >
                <span>
                  <span className="daypill__d t-display">{d.pillDate}</span>
                  <span className="daypill__n">{d.pill}</span>
                </span>
                {d.date === today ? (
                  <span className="daypill__dot" title="Today"></span>
                ) : null}
              </button>
            ))}
          </div>

          <div className="dayhead glow-card grille">
            <h3 className="dayhead__t t-display">{day.title}</h3>
            {day.note ? <p className="dayhead__note">{day.note}</p> : null}
            <div className="dayhead__attire">
              {day.attire.length ? (
                day.attire.map((a) => (
                  <div className="attire" key={a.k}>
                    <span className="attire__k">{a.k}</span>
                    <p className="attire__v">{a.v}</p>
                  </div>
                ))
              ) : (
                <div className="attire">
                  <span className="attire__k">Attire</span>
                  <p className="attire__v">Nothing specified for today.</p>
                </div>
              )}
            </div>
          </div>

          <div className="set-list">
            {day.sessions.map((sess) => (
              <SessionCard
                key={sess.key}
                sess={sess}
                day={day}
                now={now}
                counts={counts}
                castMap={castMap}
                onCast={onCast}
                open={!!open[sess.key]}
                onToggle={() => setOpen((prev) => {
                  const next = Object.assign({}, prev);
                  next[sess.key] = !prev[sess.key];
                  return next;
                })}
              />
            ))}
          </div>
        </div>
      ) : null}

      <BuildNote isAdmin={isAdmin} task="T1.1">
        Running order is the official agenda, which replaces the flier. Wednesday
        evening is at the hotel, not Smash Park, and that conflict is still open
        with Carol. No rooms, because the agenda names none. Append
        ?clock=2026-08-26T09:15:00-04:00 to any URL to test On Air, the dimming,
        and the 30 minute countdown.
      </BuildNote>
    </TabFrame>
  );
}

/* ==========================================================================
   T2.7, PART ONE. ENCORE, TENURE RECOGNITION ONLY.
   Award Winners, Hall of Fame, and Top Videos are still stubs and T2.7 stays
   open. Tenure is built early and on its own because the Tenure Awards are
   Wednesday at 8:20 AM, two days before the Thursday awards show, so it has to
   be able to go live without dragging the other three with it.

   The content is confidential until it is read out on stage. That has one hard
   consequence: while the section is locked and the viewer is not admin, the
   wall does not fetch the entries at all. The listener is never attached. A
   render guard would not be enough, because the data would already be sitting
   in the page for anyone who opened dev tools.

   Every name in here is a placeholder. The real list is handled outside this
   repo, which is public.
   ========================================================================== */

/* The unlock flag is a bare boolean, so it is safe to listen to always. */
function useTenureUnlocked() {
  const [unlocked, setUnlocked] = useState(false);
  const [ready, setReady] = useState(!FB.ok);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("encore/tenure/unlocked");
    const handler = (snap) => { setUnlocked(snap.val() === true); setReady(true); };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return { unlocked, ready };
}

/* `enabled` gates the read, not the render. Called with false, this never
   touches encore/tenure/entries. */
function useTenureEntries(enabled) {
  const [entries, setEntries] = useState([]);

  useEffect(() => {
    if (!FB.ok || !enabled) {
      setEntries([]);
      return;
    }
    const ref = FB.db.ref("encore/tenure/entries");
    const handler = (snap) => {
      const all = snap.val() || {};
      setEntries(Object.keys(all).map((id) => Object.assign({ id: id }, all[id])));
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, [enabled]);

  return entries;
}

/* Milestones sort by the number in them, longest tenure first, because that is
   the order they get read out in. Anything without a number falls to the end. */
function milestoneRank(label) {
  const m = String(label || "").match(/\d+/);
  return m ? -parseInt(m[0], 10) : 1e6;
}

function groupByMilestone(entries) {
  const groups = {};
  entries.forEach((e) => {
    const key = (e.milestone || "Unsorted").trim() || "Unsorted";
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  return Object.keys(groups)
    .sort((a, b) => {
      const d = milestoneRank(a) - milestoneRank(b);
      return d !== 0 ? d : a.localeCompare(b);
    })
    .map((k) => ({
      milestone: k,
      people: groups[k].slice().sort((a, b) =>
        String(a.name || "").localeCompare(String(b.name || "")))
    }));
}

const BLANK_ENTRY = { milestone: "", name: "", club: "", years: "", photo: "" };

/* Two fields and a button by default. Anything else is behind a disclosure,
   because this gets typed on a phone while somebody is walking to the stage.
   The milestone stays filled after a save so a whole group goes in as a list of
   names rather than as five identical forms. */
function TenureForm({ initial, onSave, onCancel, busy }) {
  const [form, setForm] = useState(() => Object.assign({}, BLANK_ENTRY, initial || {}));
  const [more, setMore] = useState(false);
  const nameRef = useRef(null);

  const editing = !!(initial && initial.id);

  function set(k, v) { setForm((prev) => Object.assign({}, prev, { [k]: v })); }

  function submit(e) {
    e.preventDefault();
    const clean = {
      milestone: form.milestone.trim(),
      name: form.name.trim(),
      club: form.club.trim(),
      years: form.years.trim(),
      photo: form.photo.trim()
    };
    if (!clean.name || !clean.milestone) return;
    onSave(clean);
    if (!editing) {
      setForm({ milestone: clean.milestone, name: "", club: "", years: "", photo: "" });
      if (nameRef.current) nameRef.current.focus();
    }
  }

  return (
    <form className="tf" onSubmit={submit}>
      <label className="tf__l">
        <span>Milestone</span>
        <input
          className="tf__in"
          value={form.milestone}
          placeholder="20 Years"
          onChange={(e) => set("milestone", e.target.value)}
        />
      </label>

      <label className="tf__l">
        <span>Name</span>
        <input
          ref={nameRef}
          className="tf__in"
          value={form.name}
          placeholder="Placeholder One"
          onChange={(e) => set("name", e.target.value)}
        />
      </label>

      {more ? (
        <div>
          <label className="tf__l">
            <span>Club, optional</span>
            <input className="tf__in" value={form.club}
                   onChange={(e) => set("club", e.target.value)} />
          </label>
          <label className="tf__l">
            <span>Years, optional</span>
            <input className="tf__in" value={form.years}
                   onChange={(e) => set("years", e.target.value)} />
          </label>
          <label className="tf__l">
            <span>Photo path, optional</span>
            <input className="tf__in" value={form.photo}
                   placeholder="assets/attendees/slug.jpg"
                   onChange={(e) => set("photo", e.target.value)} />
          </label>
        </div>
      ) : null}

      <div className="tf__row">
        <button type="submit" className="btn btn--go" disabled={busy}>
          {editing ? "Save" : "Add"}
        </button>
        {editing ? (
          <button type="button" className="btn" onClick={onCancel}>Cancel</button>
        ) : null}
        <button type="button" className="btn btn--quiet" onClick={() => setMore(!more)}>
          {more ? "Fewer fields" : "Club, years, photo"}
        </button>
      </div>
    </form>
  );
}

/* Names only, per Jim. Club and photo stay in the shape and render when they
   are there, and the row is built so that a name on its own is the normal case
   rather than a card with two holes in it. */
function TenureRow({ e, isAdmin, onEdit, onDelete }) {
  return (
    <li className="ten-row">
      {e.photo ? (
        <img className="ten-row__ph" src={e.photo} alt="" />
      ) : null}
      <span className="ten-row__n">{e.name}</span>
      {e.club ? <span className="ten-row__c">{e.club}</span> : null}
      {e.years ? <span className="ten-row__y t-data">{e.years}</span> : null}
      {isAdmin ? (
        <span className="ten-row__admin">
          <button className="btn btn--tiny" onClick={() => onEdit(e)}>Edit</button>
          <button className="btn btn--tiny btn--kill" onClick={() => onDelete(e)}>Delete</button>
        </span>
      ) : null}
    </li>
  );
}

function TenureSection({ isAdmin }) {
  const { unlocked, ready } = useTenureUnlocked();
  const canRead = unlocked || isAdmin;
  const entries = useTenureEntries(canRead);
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState(false);

  const groups = groupByMilestone(entries);

  const save = useCallback((clean) => {
    if (!FB.ok) return;
    setBusy(true);
    const ref = editing && editing.id
      ? FB.db.ref("encore/tenure/entries/" + editing.id)
      : FB.db.ref("encore/tenure/entries").push();
    ref.update(Object.assign({}, clean, { ts: Date.now() }))
      .then(() => { setBusy(false); setEditing(null); })
      .catch(() => setBusy(false));
  }, [editing]);

  const remove = useCallback((e) => {
    if (!FB.ok) return;
    if (!window.confirm("Delete " + e.name + " from tenure?")) return;
    FB.db.ref("encore/tenure/entries/" + e.id).remove();
  }, []);

  const setUnlocked = useCallback((next) => {
    if (!FB.ok) return;
    FB.db.ref("encore/tenure/unlocked").set(next);
  }, []);

  /* Locked and not crew. Render the message and nothing else. No headings, no
     names, no milestones, nothing in the DOM to dig out. */
  if (!canRead) {
    return (
      <section className="enc glow-card" aria-labelledby="enc-tenure">
        <h3 className="enc__h t-poster" id="enc-tenure">Tenure Recognition</h3>
        <p className="enc__locked">
          {ready
            ? "Locked until it is read out on stage. Wednesday morning, Opening Cowbell."
            : "Checking."}
        </p>
      </section>
    );
  }

  return (
    <section className="enc glow-card" aria-labelledby="enc-tenure">
      <div className="enc__head">
        <h3 className="enc__h t-poster" id="enc-tenure">Tenure Recognition</h3>
        {isAdmin && !unlocked ? (
          <span className="enc__hidden">{"\u{1F512}"} The room cannot see this yet</span>
        ) : null}
      </div>

      {isAdmin ? (
        <div className="enc__crew">
          <div className="tf__row">
            {unlocked ? (
              <button className="btn btn--kill" onClick={() => setUnlocked(false)}>
                Lock it again
              </button>
            ) : (
              <button className="btn btn--go" onClick={() => setUnlocked(true)}>
                Publish to the room
              </button>
            )}
          </div>
          <p className="enc__note">
            {unlocked
              ? "Live on every phone in the room right now."
              : "Only crew can see the list. Publishing reaches every phone in about a second."}
          </p>

          <TenureForm
            key={editing ? editing.id : "new"}
            initial={editing}
            onSave={save}
            onCancel={() => setEditing(null)}
            busy={busy}
          />
        </div>
      ) : null}

      {!groups.length ? (
        <p className="enc__locked">
          {isAdmin
            ? "Nothing typed in yet. Milestone, name, Add. Repeat."
            : "Nothing here yet."}
        </p>
      ) : null}

      {groups.map((g) => (
        <div className="ten-group" key={g.milestone}>
          <h4 className="ten-group__h t-poster">{g.milestone}</h4>
          <ul className="ten-list">
            {g.people.map((e) => (
              <TenureRow
                key={e.id}
                e={e}
                isAdmin={isAdmin}
                onEdit={setEditing}
                onDelete={remove}
              />
            ))}
          </ul>
        </div>
      ))}
    </section>
  );
}
