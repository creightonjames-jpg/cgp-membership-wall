<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161A">
<title>The Live Wall</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #17161A;
    color: #F7F3EA;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .glow {
    position: fixed;
    inset: 0;
    background: radial-gradient(60% 40% at 50% 22%, #2A1418 0%, #17161A 70%);
    z-index: 0;
  }
  main {
    position: relative;
    z-index: 1;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #A39B92;
    margin: 0 0 14px;
  }
  h1 {
    font-size: clamp(30px, 11vw, 46px);
    line-height: 0.94;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    font-weight: 800;
  }
  h1 .wall { color: #C8102E; display: block; }
  .rule {
    height: 3px;
    width: 56px;
    margin: 22px auto;
    background: linear-gradient(90deg, #C8102E, #8A0E1F);
  }
  p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; }
  .stub { color: #F7F3EA; }
  .where { color: #A39B92; }
  .fine {
    margin-top: 26px;
    font-size: 12px;
    color: #6E6862;
  }
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <p class="kicker">Century Golf Partners</p>
  <h1>2026 Private Clubs Meeting<span class="wall">The Live Wall</span></h1>
  <div class="rule"></div>
  <p class="stub">Load-in has started. Nothing to see yet.</p>
  <p class="where">Columbus, Ohio. August 25 to 28, 2026.</p>
  <p class="fine">Stub page. T0.1.</p>
</main>
</body>
</html>
