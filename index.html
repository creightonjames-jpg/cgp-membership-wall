<style id="wall-css">
/* ==========================================================================
   THE LIVE WALL. Design system.
   This block is the single source of truth. tokens.html and motifs.html read
   it straight out of this file rather than keeping a copy, so a proof sheet
   can never drift from what actually ships.
   ROADMAP T0.3 tokens, T0.4 motifs, T0.5 shell. Spec sections 2.1 to 2.3.
   ========================================================================== */

/* -------------------------------------------------------- T0.3 tokens */
:root {
  /* Palette. Twelve tokens, spec 2.1. */
  --stage:   #17161A;  /* page background, near black with a warm cast     */
  --riser:   #201E24;  /* card and panel background                        */
  --input:   #2A272E;  /* form fields, inactive pills                      */
  --scarlet: #C8102E;  /* primary accent, headers, active, primary buttons */
  --oxblood: #8A0E1F;  /* pressed and hover, deep borders, gradients       */
  --gold:    #D9A94C;  /* secondary accent, awards, trophies, posters      */
  --cream:   #F7F3EA;  /* body text                                       */
  --dim:     #A39B92;  /* secondary text, metadata                        */
  --mute:    #6E6862;  /* timestamps, disabled text, fine print           */
  --edge:    #332F38;  /* card borders, dividers                          */
  --danger:  #FF6B4A;  /* delete and destructive admin actions            */
  --glow:    rgba(200, 16, 46, 0.12); /* scarlet tint, hover and selected  */

  /* Type, spec 2.2. Alfa Slab One is rationed to awards and Encore cards.
     Anywhere else it reads as a novelty font. */
  --font-display: 'Anton', Impact, 'Haettenschweiler', sans-serif;
  --font-poster:  'Alfa Slab One', Georgia, serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* The two gradients that carry the stage feel, spec 2.1. */
  --grad-stage:   radial-gradient(62% 42% at 50% 20%, #2A1418 0%, var(--stage) 72%);
  --grad-primary: linear-gradient(180deg, var(--scarlet) 0%, var(--oxblood) 100%);

  /* Motif dials. Override per instance, not at the call site.
     These are not palette tokens. The palette is the twelve above and stays
     twelve, so tokens.html keeps telling the truth. Everything here is mixed
     from those twelve. */
  --ticket-stub-w: 84px;    /* width of the tear-off on a ticket stub card */
  --notch-bg: var(--stage); /* what shows through a ticket notch           */

  /* Chrome warmth. Oxblood laid over --input as a flat overlay rather than
     color-mix, which is not safe on every phone that will be in the room. */
  --warm-fill: rgba(138, 14, 31, 0.22);
  --warm-fill-strong: rgba(138, 14, 31, 0.40);
  --warm-edge: rgba(200, 16, 46, 0.38);
  --gold-rule: rgba(217, 169, 76, 0.42);

  /* Reading column on a wide screen. Mobile ignores it, the shell is already
     narrower than this. */
  /* The frame every page sits in on a wide screen. 780px was a prose measure and
     it starved the content: this wall is mostly card grids, ticket stubs, a
     143 person roster and 380px-wide graphs, none of which are paragraphs.
     Raise or lower this ONE value to change the whole app consistently. */
  --shell-max: 1120px;

  /* The masthead does NOT follow shell-max. It is a fixed height strip cut from
     a 786x404 photo, so widening the frame crops it tighter and you get
     foreheads instead of faces. Keep this near the width the 150px crop was
     tuned against. */
  --masthead-max: 820px;

  /* Comfortable line length for actual prose, so running text does not stretch
     to 1120px. Apply to paragraphs, never to grids. */
  --measure: 68ch;

  /* Notch and home indicator. Zero on anything without a cutout. */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

/* ------------------------------------------------------------- baseline */
*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100svh;
  background: var(--stage);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font-family: inherit; }

/* Display faces are all caps and tight. Never italic. */
.t-display {
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  line-height: 0.94;
}

.t-poster { font-family: var(--font-poster); font-weight: 400; letter-spacing: 0.01em; }

/* Leaderboard scores and counts. Digits must not jitter as they update. */
.t-data { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0;
  margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   T0.4 MOTIF PRIMITIVES. Spec 2.3.
   Each one is a reusable class. No custom illustration, all CSS.
   ========================================================================== */

/* -------------------------------------------------- 1. ticket stub card */
/* Do not add overflow:hidden here. It would clip the notches. */
.ticket {
  position: relative;
  display: flex;
  align-items: stretch;
  background: var(--riser);
  border: 1px solid var(--edge);
  border-radius: 10px;
}

.ticket__stub {
  flex: 0 0 var(--ticket-stub-w);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  padding: 14px 8px;
  border-right: 2px dashed var(--edge);
  text-align: center;
}

.ticket__body {
  flex: 1 1 auto;
  min-width: 0;           /* lets long titles wrap instead of pushing wide */
  padding: 14px 16px;
}

.ticket::before, .ticket::after {
  content: '';
  position: absolute;
  left: var(--ticket-stub-w);
  width: 15px; height: 15px;
  background: var(--notch-bg);
  border-radius: 50%;
  transform: translateX(-50%);
}

.ticket::before { top: calc(-15px / 2 - 1px); }
.ticket::after  { bottom: calc(-15px / 2 - 1px); }

/* ------------------------------------------------- 2. guitar pick badge */
.pick {
  --pick-fill: var(--gold);
  display: grid; place-items: center;
  width: 68px; aspect-ratio: 1 / 0.96;
  background: var(--pick-fill);
  clip-path: polygon(
    15% 8%, 28% 2%, 50% 0%, 72% 2%, 85% 8%,
    95% 25%, 98% 42%,
    88% 68%, 68% 88%, 55% 98%, 50% 100%,
    45% 98%, 32% 88%, 12% 68%,
    2% 42%, 5% 25%
  );
}

.pick__text {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: 11px; line-height: 1;
  text-align: center; color: #2A1408;
  padding-bottom: 12%;      /* nudge off the tapered tip */
  letter-spacing: 0.02em;
}

/* ---------------------------------------------------- 3. amp grille texture */
.grille { position: relative; }
.grille > * { position: relative; z-index: 1; }

.grille::before {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none; border-radius: inherit;
  background-image:
    repeating-linear-gradient( 45deg, rgba(247,243,234,0.030) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(-45deg, rgba(247,243,234,0.030) 0 1px, transparent 1px 5px);
}

/* ------------------------------------------------------ 4. stage light glow */
.glow-stage {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background: var(--grad-stage);
}

.glow-card {
  position: relative;
  background:
    radial-gradient(80% 62% at 50% 0%, rgba(200,16,46,0.20) 0%, transparent 70%),
    var(--riser);
  border: 1px solid var(--edge);
  border-radius: 12px;
}

/* ------------------------------------------------------- 5. marquee strip */
.marquee {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--oxblood) 0%, #6B0A18 100%);
  border-radius: 6px;
  padding: 6px 0;
}

.marquee::before, .marquee::after {
  content: '';
  position: absolute; left: 0; right: 0; height: 7px;
  background-image: radial-gradient(circle, var(--gold) 0 1.6px, rgba(0,0,0,0.35) 2px);
  background-size: 13px 7px;
  background-repeat: repeat-x;
  background-position: center;
}

.marquee::before { top: 0; }
.marquee::after  { bottom: 0; }

.marquee__track {
  display: flex; width: max-content; padding: 5px 0;
  animation: marquee-slide 22s linear infinite;
}

.marquee__item {
  padding: 0 28px; white-space: nowrap;
  font-weight: 600; font-size: 14px; color: var(--cream);
}

@keyframes marquee-slide {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }   /* content is duplicated once */
}

/* A scrolling banner is exactly the thing that makes some people ill. */
@media (prefers-reduced-motion: reduce) {
  .marquee__track { animation: none; width: 100%; flex-wrap: wrap; }
  .marquee__item { white-space: normal; padding: 0 14px; }
  .marquee__item + .marquee__item { display: none; }  /* drop the duplicate */
}

/* ---------------------------------------------------------- 6. vinyl label */
.vinyl {
  position: relative; aspect-ratio: 1; width: 100%;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(247,243,234,0.055) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 50% 50%, var(--oxblood) 0 33%, #0C0B0E 33.5% 100%);
  display: grid; place-items: center;
}

.vinyl__photo {
  width: 56%; aspect-ratio: 1; border-radius: 50%;
  object-fit: cover; border: 3px solid var(--gold); background: var(--input);
}

/* ------------------------------------------------- 7. setlist strike-through */
.struck { position: relative; display: inline-block; }

.struck::after {
  content: '';
  position: absolute; left: -2%; right: -2%; top: 52%;
  height: 2px; background: var(--scarlet); border-radius: 2px;
  transform: rotate(-1.2deg);
}

.is-done { opacity: 0.55; }

/* ==========================================================================
   T0.5 APP SHELL
   ========================================================================== */

#root { position: relative; z-index: 1; }

/* --------------------------------------------------------- welcome hero */
.welcome {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

/* The band strip is full bleed at the top, so the welcome itself carries no
   padding. .welcome__body takes it instead. */
.welcome__body {
  flex: 1 1 auto;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 20px calc(20px + var(--safe-r))
           calc(36px + var(--safe-b)) calc(20px + var(--safe-l));
}

.welcome__text,
.welcome__aside {
  display: flex; flex-direction: column; align-items: center;
  min-width: 0;
}

/* ---------------------------------------------------------- band strip */
/* The flier's own hero, four panels wide. Treated as a lit stage: the lights
   come up on each band member in turn, the picture dissolves into the page,
   and gold footlights run along the bottom lip.
   Aspect ratio matches the source exactly, so nothing is cropped. */
.band {
  position: relative;
  flex: 0 0 auto;
  width: 100%;
  margin-top: var(--safe-t);
  aspect-ratio: 786 / 404;
  overflow: hidden;
}

.band__img {
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
  /* Lisa asked to pull the picture down so faces read better. A lower number
     shows more of the top of the source, which drops the subjects in frame and
     stops the crop cutting the tops of heads. */
  object-position: center 12%;
}

/* ------------------------------------------------------------- masthead */
/* Lisa asked for the banner on every page, with a scarlet title bar under it,
   which is the flier's own masthead. Compact on the tab pages so it does not
   eat a phone screen, full height on the welcome hero. Scrolls away. The
   controls and the tab bar stay stuck to the top. */
.masthead { position: relative; }

/* Scoped with :not so the compact rules can never leak onto the tall hero,
   which sits at equal specificity. */
.masthead:not(.masthead--tall) .band {
  height: 112px;
  aspect-ratio: auto;
  max-height: none;
}

/* Pyro on the compact strip too, scaled down to fit.

   This used to be display:none, and that is why most people never saw the
   fireworks. The tall hero only renders on a first ever visit, because
   mm26_entered persists in localStorage and the app skips the welcome screen
   after that. So from the second visit onward every page had a 112px masthead
   with the pyro switched off, and the effect looked broken rather than absent.
   Jim's call, Aug 13: scale it rather than gate it.

   A 112px strip cannot hold a fountain, so it does not try to be one. Sparks
   rise about 40 percent as far and run slightly smaller, which reads as a
   crackle along the stage lip. The Roman candles are dropped here: their climb
   is 112px and up, and a glowing ball squeezed into this strip reads as a smudge.
   One set of timings still drives both sizes, so nothing can drift apart. */
.masthead:not(.masthead--tall) .band__pyro {
  --pyro-scale: 0.42;
  --pyro-size: 0.8;
}

.masthead:not(.masthead--tall) .band__pyro .candle { display: none; }

.masthead__banner {
  background: var(--grad-primary);
  border-top: 1px solid var(--gold-rule);
  border-bottom: 1px solid var(--gold-rule);
  padding: 7px calc(14px + var(--safe-r)) 8px calc(14px + var(--safe-l));
  text-align: center;
}

.masthead__banner span {
  display: block;
  font-size: clamp(15px, 4.4vw, 22px);
  letter-spacing: 0.05em;
  color: var(--cream);
  line-height: 1.06;
}

.masthead--tall .masthead__banner span {
  font-size: clamp(17px, 5.2vw, 30px);
}

/* Knocks the bright whites back so cream text below stays the loudest thing
   on the screen, and pulls the picture into the scarlet palette. */
.band__grade {
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(125% 85% at 50% 0%, rgba(200,16,46,0.26) 0%, transparent 68%),
    linear-gradient(180deg,
      rgba(23,22,26,0.45) 0%,
      rgba(23,22,26,0.05) 24%,
      rgba(23,22,26,0.26) 50%,
      rgba(23,22,26,0.72) 78%,
      rgba(23,22,26,0.95) 92%,
      var(--stage) 100%);
}

/* Four shutters over four panels. Each lifts in turn, left to right. */
.band__lights {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  pointer-events: none;
}

/* Base state is transparent on purpose. If the animation never runs, on an old
   browser or with animations disabled, the failure shows the picture rather
   than hiding it behind four solid panels. `both` fill holds the shutter
   opaque through its delay and lands it back at transparent. */
.band__lights span {
  background: var(--stage);
  opacity: 0;
  animation: band-lights-up 700ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc(var(--i) * 180ms);
}

@keyframes band-lights-up {
  from { opacity: 1; }
  to   { opacity: 0; }
}

/* ------------------------------------------- ground illumination flares */
/* Light blooming up off the stage floor. OFF by default. Add .band--flares to
   the .band element to switch it on. Preview at flares.html before committing
   this to the welcome screen.
   Uses mix-blend-mode screen so the blooms read as light rather than as paint
   laid over the picture. Animates opacity and transform only, no filters, so
   it stays cheap on an older phone. */
.band__flares { display: none; }

/* Peak brightness lives on .band--flares, not on the inner container. Put it
   on the container and it shadows any override set alongside .band--flares,
   because the span resolves the variable from its nearest ancestor. */
.band--flares { --flare-max: 0.70; }

.band--flares .band__flares {
  display: block;
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 62%;
  overflow: hidden;
  pointer-events: none;
}

/* Low haze sitting on the floor, so the flares have something to sit in. */
.band--flares .band__flares::before {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 36%;
  background: linear-gradient(0deg, rgba(217,169,76,0.17) 0%, transparent 100%);
  mix-blend-mode: screen;
  animation: flare-haze 6.5s ease-in-out infinite alternate;
}

.band__flares span {
  position: absolute;
  bottom: -12%;
  left: var(--x);
  width: 42%;
  aspect-ratio: 1 / 1.25;
  transform: translateX(-50%);
  transform-origin: 50% 100%;
  mix-blend-mode: screen;
  background: radial-gradient(48% 50% at 50% 100%,
    rgba(217,169,76,0.62) 0%,
    rgba(226,116,58,0.34) 26%,
    rgba(200,16,46,0.26) 52%,
    transparent 76%);
  animation: flare-breathe var(--dur) ease-in-out var(--delay) infinite alternate;
}

/* Negative delays start each flare mid cycle, so they never pulse in unison. */
@keyframes flare-breathe {
  from {
    opacity: calc(var(--flare-max, 0.7) * 0.42);
    transform: translateX(-50%) scale(0.90, 0.86);
  }
  to {
    opacity: var(--flare-max, 0.7);
    transform: translateX(-50%) scale(1.06, 1.14);
  }
}

@keyframes flare-haze {
  from { opacity: 0.5; }
  to   { opacity: 1; }
}

/* Hold a lit state, lose the pulsing. */
@media (prefers-reduced-motion: reduce) {
  .band__flares span,
  .band--flares .band__flares::before { animation: none; }
  .band__flares span { opacity: calc(var(--flare-max, 0.7) * 0.72); }
}

/* ---------------------------------------------------------- stage pyro */
/* Gerb fountains at the front of the stage. Fine sparks crackling upward, plus
   a Roman candle ball that climbs, drifts, and dies. OFF unless .band--pyro.
   Transform and opacity only. Screen blend so sparks read as light. */
.band__pyro { display: none; }

.band--pyro .band__pyro {
  display: block;
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* Every timing lives here rather than in JS, so the welcome screen and
   flares.html both write plain markup and cannot drift apart. Three gerbs,
   seven sparks and one candle each. */
.band__pyro .gerb {
  position: absolute;
  bottom: 5%;
  left: var(--x);
  width: 0; height: 0;
  --gerb-offset: 0s;
}

.band__pyro .gerb:nth-child(1) { --x: 18%; --gerb-offset: 0s;   }
.band__pyro .gerb:nth-child(2) { --x: 50%; --gerb-offset: 0.7s; }
.band__pyro .gerb:nth-child(3) { --x: 82%; --gerb-offset: 1.3s; }

.band__pyro .spark,
.band__pyro .candle {
  position: absolute;
  left: 0; bottom: 0;
  border-radius: 50%;
  mix-blend-mode: screen;
  transform: translate(-50%, 0);
  /* Deliberately no will-change. Two dozen promoted layers is a real cost on
     an older phone, and transform and opacity are already fast paths. */
}

/* --pyro-scale and --pyro-size default to 1 here and are turned down for the
   compact masthead. Both are read inside the keyframes, which resolve against
   the animated element, so they inherit from .band__pyro without any JS. */
.band__pyro .spark {
  width: calc(var(--size) * var(--pyro-size, 1));
  height: calc(var(--size) * var(--pyro-size, 1));
  background: radial-gradient(circle,
    #FFF7E4 0 30%, var(--gold) 58%, rgba(226,116,58,0) 100%);
  animation: pyro-spark var(--dur) linear
             calc(var(--delay) - var(--gerb-offset)) infinite;
}

/* Scatter. Uneven on purpose, so no two sparks trace the same arc. */
.band__pyro .spark:nth-child(1) { --drift:  -9px; --rise: 52px; --dur: 1.55s; --delay: -0.20s; --size: 3px; }
.band__pyro .spark:nth-child(2) { --drift:   7px; --rise: 41px; --dur: 1.90s; --delay: -0.75s; --size: 2px; }
.band__pyro .spark:nth-child(3) { --drift:  -4px; --rise: 66px; --dur: 1.40s; --delay: -1.10s; --size: 2px; }
.band__pyro .spark:nth-child(4) { --drift:  11px; --rise: 48px; --dur: 2.05s; --delay: -0.45s; --size: 3px; }
.band__pyro .spark:nth-child(5) { --drift:  -7px; --rise: 58px; --dur: 1.70s; --delay: -1.55s; --size: 2px; }
.band__pyro .spark:nth-child(6) { --drift:   4px; --rise: 37px; --dur: 1.30s; --delay: -0.95s; --size: 4px; }
.band__pyro .spark:nth-child(7) { --drift: -11px; --rise: 62px; --dur: 2.20s; --delay: -1.35s; --size: 2px; }

/* One glow allowance, on three elements only. Cheap enough, and the candle
   needs to read as brighter than the crackle around it. */
.band__pyro .candle {
  width: 7px; height: 7px;
  --dur: 5.4s; --rise: 112px; --drift: 0px; --delay: 0s;
  background: radial-gradient(circle,
    #FFFDF6 0 34%, var(--gold) 62%, rgba(200,16,46,0) 100%);
  box-shadow: 0 0 10px 2px rgba(217,169,76,0.65);
  animation: pyro-candle var(--dur) cubic-bezier(0.18, 0.62, 0.36, 1)
             var(--delay) infinite;
}

/* Offset so the three candles fire in rotation, never together. */
.band__pyro .gerb:nth-child(1) .candle { --delay:  0.0s; --drift:  -9px; }
.band__pyro .gerb:nth-child(2) .candle { --delay: -1.8s; --drift:   0px; --rise: 128px; }
.band__pyro .gerb:nth-child(3) .candle { --delay: -3.6s; --drift:   9px; }

/* Up fast, apex, then drift and fall back a little as it burns out. */
@keyframes pyro-spark {
  0%   { transform: translate(-50%, 0) scale(1); opacity: 0; }
  10%  { opacity: 1; }
  62%  { transform: translate(calc(-50% + var(--drift) * var(--pyro-scale, 1)),
                              calc(var(--rise) * -1 * var(--pyro-scale, 1)))
                    scale(0.7); opacity: 0.9; }
  100% { transform: translate(calc(-50% + var(--drift) * 1.4 * var(--pyro-scale, 1)),
                              calc(var(--rise) * -0.7 * var(--pyro-scale, 1)))
                    scale(0.2); opacity: 0; }
}

/* The action sits in the first half of the timeline. The dead second half is
   what makes it read as a candle firing in rotation instead of a hose. */
@keyframes pyro-candle {
  0%   { transform: translate(-50%, 0) scale(0.45); opacity: 0; }
  4%   { transform: translate(-50%, -4px) scale(1); opacity: 1; }
  30%  { opacity: 0.95; }
  42%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1)) scale(0.8); opacity: 0.45; }
  50%  { transform: translate(calc(-50% + var(--drift)),
                              calc(var(--rise) * -1.06)) scale(0.22); opacity: 0; }
  100% { opacity: 0; }
}

/* Reduced motion gets a FROZEN BURST, not an empty stage.

   This used to be display:none, on the theory that frozen sparks read as dust on
   the lens. That was wrong in practice. Jim reported the fireworks "don't work
   for all users" and this was why: anyone with Reduce Motion switched on at the
   OS level saw a plain photo with no pyro at all, which reads as broken rather
   than as considerate. Reduce Motion is common, people turn it on for motion
   sickness and iOS suggests it.

   So the sparks stay lit and stay put. Each one already carries its own --rise
   and --drift, so parking them part way up their own arc gives a spray rather
   than a row. No animation, so the preference is still honoured.

   Do not add a display declaration here. The base rule already shows the pyro,
   and the compact masthead rule above hides it with three classes to this
   block's two, so tab pages stay sparkless either way. */
@media (prefers-reduced-motion: reduce) {
  .band__pyro .spark,
  .band__pyro .candle { animation: none; }

  .band__pyro .spark {
    transform: translate(calc(-50% + var(--drift) * 0.75 * var(--pyro-scale, 1)),
                         calc(var(--rise) * -0.78 * var(--pyro-scale, 1)))
               scale(0.75);
    opacity: 0.85;
  }

  .band__pyro .candle {
    transform: translate(calc(-50% + var(--drift) * var(--pyro-scale, 1)),
                         calc(var(--rise) * -0.85 * var(--pyro-scale, 1)))
               scale(0.85);
    opacity: 0.8;
  }
}

/* Footlights along the stage lip. Same bulb values as the marquee, so the
   motif reads as one language rather than two. */
.band__lip {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 7px;
  pointer-events: none;
  background-image: radial-gradient(circle, var(--gold) 0 1.6px, rgba(0,0,0,0.45) 2px);
  background-size: 13px 7px;
  background-repeat: repeat-x;
  background-position: center;
  opacity: 0.85;
}

/* Lights snap on with no sequence for anyone who asked for less motion. */
@media (prefers-reduced-motion: reduce) {
  .band__lights span { animation: none; opacity: 0; }
}

.welcome__kicker {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--dim); margin: 0 0 14px;
}

.welcome__title { font-size: clamp(34px, 13vw, 60px); margin: 0; max-width: 15ch; }

.welcome__rule {
  height: 3px; width: 56px; margin: 20px 0;
  background: var(--grad-primary); border-radius: 2px;
}

.welcome__where { margin: 0; color: var(--dim); }

/* countdown */
.count { display: flex; gap: 8px; margin: 26px 0 4px; }

.count__cell {
  background: var(--riser); border: 1px solid var(--edge);
  border-radius: 8px; padding: 9px 12px; min-width: 62px;
}

.count__n {
  font-family: var(--font-display); font-size: 26px; line-height: 1;
  font-variant-numeric: tabular-nums;
}

.count__l {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute); margin-top: 4px;
}

.count__note { font-size: 11px; color: var(--mute); margin: 0; }
.count__live { color: var(--gold); font-weight: 600; }

/* QR. Dark modules on a cream card. Never inverted, plenty of scanners
   refuse a light on dark code. */
.qr {
  margin: 26px 0 0; background: var(--cream);
  border-radius: 10px; padding: 10px; width: 150px;
}

.qr img { display: block; width: 100%; height: auto; }
.qr__cap { font-size: 11px; color: var(--mute); margin: 8px 0 0; }

.enter {
  margin-top: 26px; width: 100%; max-width: 320px;
  border: 0; border-radius: 10px; padding: 16px;
  background: var(--grad-primary); color: var(--cream);
  font-size: 17px; font-weight: 600; cursor: pointer;
}

.enter:active { background: var(--oxblood); }

/* -------------------------------------------------------------- header */
/* The header and the tab bar stick as one unit. They used to be two separate
   sticky elements both pinned to top: 0, which meant that the moment the
   masthead scrolled away they landed on top of each other and the brand mark
   sat over the first row of tab pills. Found while building T1.1, because The
   Setlist is the first tab with enough content to scroll. */
.stickytop { position: sticky; top: 0; z-index: 30; }

.hdr {
  position: relative; z-index: 2;
  background: rgba(23,22,26,0.92);
  backdrop-filter: saturate(1.4) blur(8px);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--warm-edge);
  padding-top: var(--safe-t);
}

.hdr__row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));
}

.hdr__mark { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
.hdr__pick { width: 26px; flex: 0 0 26px; }
.hdr__pick .pick__text { font-size: 6px; }

/* Three buttons sit to the right now. The brand text gives way before they do. */
.hdr__name {
  font-size: 15px; line-height: 1; margin: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Gold, not mute grey. Small enough that it warms the header without
   spending gold on anything that matters. */
.hdr__sub {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold); margin: 3px 0 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.iconbtn {
  flex: 0 0 auto;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 9px; color: var(--cream);
  font-size: 16px; cursor: pointer; padding: 0;
}

.iconbtn:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.iconbtn--on {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  color: var(--cream);
}

/* ------------------------------------------------------------- tab bar */
/* Group asked for more red and gold, and the tab bar is where it earns its
   keep, because it is on screen on every tab all week. Red does the work.
   Gold is a hairline and a badge, so the Encore award cards keep their claim
   on it. */
.tabs {
  position: relative; z-index: 1;
  background: rgba(23,22,26,0.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 0;
}

/* Scarlet rule under the whole bar with a gold hairline sitting on it. Reads
   as a poster rule, and ties the bar to the footlights on the welcome hero. */
.tabs::after {
  content: '';
  display: block;
  height: 2px;
  background:
    linear-gradient(180deg, var(--gold-rule) 0 1px, transparent 1px),
    var(--grad-primary);
}

.tabs__scroll {
  display: flex; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 9px calc(12px + var(--safe-r)) 9px calc(12px + var(--safe-l));
}

.tabs__scroll::-webkit-scrollbar { display: none; }

/* Resting tab is warm, not grey. Oxblood over --input so it still recedes
   behind the selected one but stops looking like a system control. */
.tab {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 7px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 999px; padding: 8px 14px;
  color: var(--cream); font-size: 13px; font-weight: 500;
  white-space: nowrap; cursor: pointer;
  transition: background-image 120ms ease, border-color 120ms ease;
}

.tab:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

/* Selected tab is a lit scarlet pill with a gold ring. This is the poster
   move: gold rule on scarlet, straight off the Shank Showdown art. */
.tab[aria-selected="true"] {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  color: var(--cream);
  font-weight: 600;
  box-shadow: 0 0 0 1px rgba(217,169,76,0.22), 0 3px 12px rgba(200,16,46,0.34);
}

.tab__icon { font-size: 14px; line-height: 1; }

/* Gold badge, dark text. Scarlet on a now scarlet pill would vanish. */
.tab__badge {
  background: var(--gold); color: #2A1408;
  border-radius: 999px; min-width: 19px; padding: 1px 6px;
  font-size: 11px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums;
}

.tab__lock { color: var(--gold); font-size: 11px; }

/* ------------------------------------------------------------- content */
.sheet {
  padding: 14px calc(16px + var(--safe-r)) calc(48px + var(--safe-b))
           calc(16px + var(--safe-l));
}

.marquee-slot { margin-bottom: 16px; display: flex; align-items: stretch; gap: 8px; }
.marquee-slot .marquee { flex: 1 1 auto; min-width: 0; }

.marquee-x {
  flex: 0 0 auto; width: 34px;
  background: var(--input); border: 1px solid var(--edge);
  border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 14px;
}

.tabhead { margin: 0 0 4px; font-size: clamp(26px, 8vw, 34px); }
.tabhead__sub { color: var(--dim); font-size: 14px; margin: 0 0 18px; }

.stubnote {
  background: var(--riser); border: 1px dashed var(--edge);
  border-radius: 10px; padding: 18px 16px; color: var(--dim);
}

.stubnote code { color: var(--gold); font-size: 13px; }

/* Build notes are crew only. Nothing that says "T1.1" should ever reach an
   attendee, so it is gated on the PIN rather than on my memory. */
.buildnote {
  margin-top: 12px;
  background: var(--input); border-left: 3px solid var(--scarlet);
  border-radius: 6px; padding: 11px 13px;
}

.buildnote__tag {
  font-family: var(--font-display); font-size: 10px;
  letter-spacing: 0.14em; color: var(--scarlet); margin: 0 0 4px;
}

.buildnote__body { font-size: 13px; color: var(--dim); margin: 0; }

/* Display Mode. The only place a viewport locked height is allowed. */
body.display-mode .tabs,
body.display-mode .marquee-slot { display: none; }

body.display-mode .sheet { padding-top: 20px; }
body.display-mode .tabhead { font-size: clamp(34px, 6vw, 60px); }
body.display-mode .stubnote { font-size: 20px; }

/* -------------------------------------------------------------- admin */
.adminbar {
  background: var(--glow); border: 1px solid var(--scarlet);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
}

.adminbar__t { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
.adminbar__p { font-size: 12px; color: var(--dim); margin: 0; }

/* A font that silently fell back is worth shouting about, quietly, to the crew. */
.adminbar__p--warn { color: var(--danger); margin-top: 6px; }

.pinwrap {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,9,12,0.86);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

.pin {
  background: var(--riser); border: 1px solid var(--edge);
  border-radius: 12px; padding: 20px; width: 100%; max-width: 320px;
}

.pin__t { margin: 0 0 12px; font-size: 20px; }

.pin__in {
  width: 100%; background: var(--input); border: 1px solid var(--edge);
  border-radius: 8px; padding: 13px; color: var(--cream);
  font-family: var(--font-body); font-size: 20px;
  letter-spacing: 0.4em; text-align: center;
}

.pin__err { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
.pin__row { display: flex; gap: 8px; margin-top: 14px; }

.pin__btn {
  flex: 1 1 0; border: 0; border-radius: 8px; padding: 13px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  background: var(--grad-primary); color: var(--cream);
}

.pin__btn--ghost { background: var(--input); color: var(--dim); }

/* ==========================================================================
   DESKTOP AND LAPTOP
   The wall is mobile first and 380px stays the design baseline. This block
   exists because the regional team, Carol, Lisa, and Jeannette all review on a
   laptop, and because uncapped mobile layout is genuinely broken on a wide
   screen rather than merely plain.
   ========================================================================== */
@media (min-width: 700px) {

  /* The strip is a 2:1 image at 100% width, so at 1280px it stood 658px tall
     and pushed the countdown, the enter button, and the QR below the fold.
     Cap the height and let object-fit crop instead of scaling. */
  .masthead--tall .band { max-height: 32vh; }

  /* Deliberately NOT shell-max. A full bleed strip at 1280px scales the picture
     to 658px tall, so a 150px frame is a 9:1 slice of a 2:1 photo and you get
     foreheads. This width is what the 150px crop was tuned against, so it stays
     put when the content frame widens. */
  .masthead:not(.masthead--tall) {
    max-width: var(--masthead-max);
    margin-left: auto;
    margin-right: auto;
  }

  .masthead:not(.masthead--tall) .band { height: 150px; }

  /* Bottom corners only. The top sits against the browser chrome. */
  .masthead:not(.masthead--tall) .masthead__banner {
    border-radius: 0 0 10px 10px;
  }

  /* One centred reading column. Header, tabs, and content all share an edge. */
  .hdr__row,
  .tabs__scroll,
  .sheet,
  .welcome__body {
    max-width: var(--shell-max);
    margin-left: auto;
    margin-right: auto;
  }

  /* QR beside the text rather than under it, which is what pushed it below the
     fold on a 1280 by 800 laptop. */
  .welcome__body {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 44px;
    text-align: left;
  }

  .welcome__text { align-items: flex-start; }
  .welcome__aside { flex: 0 0 auto; }
  .welcome__title { max-width: 20ch; }
  .welcome__rule { margin: 18px 0; }

  /* No touchscreen, so a swipe only tab bar is the wrong control. Let all ten
     pills wrap onto two rows where they can just be clicked. */
  .tabs__scroll {
    flex-wrap: wrap;
    overflow-x: visible;
    row-gap: 7px;
  }

  /* Display Mode is the projector view. It wants the whole screen, not a
     reading column. */
  body.display-mode .sheet { max-width: none; }
}

/* -------------------------------------------------------------- offline */
.bootfail {
  margin: 0 0 16px; background: var(--riser);
  border: 1px solid var(--danger); border-radius: 10px;
  padding: 12px 14px; font-size: 13px; color: var(--cream);
}

/* ==========================================================================
   T1.1 THE SETLIST
   Day pills, ticket stub session cards, ON AIR pulse, reactions.
   No new motifs. Ticket, grille, glow-card, struck and is-done all come from
   T0.4. Everything below is layout and chrome mixed from the same dials the
   tab bar uses, so the palette is still twelve tokens.
   ========================================================================== */

/* ---------------------------------------------------------- day pills */
/* Same warm chrome language as the tab bar, one notch quieter, because the tab
   bar has to stay the loudest control on the page. */
.dayrow {
  display: flex; gap: 7px; margin: 0 0 16px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}

.dayrow::-webkit-scrollbar { display: none; }

.daypill {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge);
  border-radius: 999px; padding: 7px 14px;
  color: var(--cream); cursor: pointer; text-align: left;
  white-space: nowrap; font-family: inherit;
  transition: background-image 120ms ease, border-color 120ms ease;
}

.daypill:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.daypill[aria-selected="true"] {
  background-color: transparent;
  background-image: var(--grad-primary);
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(217,169,76,0.22), 0 3px 12px rgba(200,16,46,0.34);
}

.daypill__d { display: block; font-size: 11px; letter-spacing: 0.1em; color: var(--gold); }
.daypill[aria-selected="true"] .daypill__d { color: var(--cream); }
.daypill__n { display: block; font-size: 14px; line-height: 1.15; }

/* Today's dot. Scarlet on a resting pill reads fine, but the selected pill is
   itself a scarlet gradient, so the dot carries a cream ring and stays a
   scarlet dot in both states. */
.daypill__dot {
  flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;
  background: var(--scarlet);
  box-shadow: 0 0 0 2px rgba(247,243,234,0.88);
}

/* ------------------------------------------------------- day header card */
.dayhead { padding: 15px 16px; margin: 0 0 14px; }
.dayhead__t { margin: 0; font-size: clamp(22px, 6.6vw, 30px); }
.dayhead__note { margin: 9px 0 0; color: var(--dim); font-size: 14px; }

.dayhead__attire { margin: 13px 0 0; display: flex; flex-direction: column; gap: 7px; }

.attire { display: flex; gap: 9px; align-items: baseline; font-size: 13px; }

.attire__k {
  flex: 0 0 auto;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.attire__v { margin: 0; color: var(--cream); }

/* ------------------------------ Cares Cup matchup poster, top of tab */
/* The whole poster is the tap target, so it is a button. Strip the UA chrome and
   let the image be the whole control. */
.cares-hero {
  display: block; width: 100%; padding: 0; margin: 0 0 16px;
  background: none; border: 0; border-radius: 10px;
  -webkit-appearance: none; appearance: none;
  cursor: zoom-in; overflow: hidden;
}

.cares-hero:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* aspect-ratio is load bearing. A lazy image with no intrinsic size reserves no
   space, so the row collapses and the browser never decides it is in view. Same
   trap the Vault booklet pages hit. 1200 by 875 is the file. */
.cares-hero__img {
  display: block; width: 100%; height: auto;
  aspect-ratio: 1200 / 875;
  border: 1px solid var(--warm-edge); border-radius: 10px;
}

/* --------------------------------- vault caption and external links */
.vt-cap { margin: 0 0 16px; }

.vt-cap__p { margin: 0 0 9px; color: var(--cream); font-size: 14px; line-height: 1.55; }

.vt-cap__p:last-child { margin-bottom: 0; }

.vt-links { margin: 0 0 18px; display: flex; flex-direction: column; gap: 12px; }

.vt-link {
  padding: 12px;
  background: var(--warm-fill);
  border: 1px solid var(--warm-edge);
  border-left: 3px solid var(--gold-rule);
  border-radius: 8px;
}

/* Full width on a phone so it is a thumb target rather than a word to aim at. */
.vt-link__a { display: block; width: 100%; text-align: center; }

.vt-link__n { margin: 8px 0 0; color: var(--dim); font-size: 12px; text-align: center; }

/* ------------------------------------------ weather, one strip per day */
/* Sits between the day note and the attire lines, because attire is the reason
   anybody reads the weather. A warm fill and a gold rule so it reads as its own
   panel inside the header without introducing a second card. */
.wx {
  margin: 12px 0 0; padding: 9px 11px;
  display: flex; align-items: center; gap: 11px;
  background: var(--warm-fill);
  border: 1px solid var(--warm-edge);
  border-left: 3px solid var(--gold-rule);
  border-radius: 8px;
}

/* Emoji, not an icon font. It carries colour on every platform, needs no asset,
   and cannot fail to load on a phone in a ballroom. */
.wx__g { flex: 0 0 auto; font-size: 27px; line-height: 1; }

.wx__t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.wx__temps { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.wx__hi { font-size: 21px; color: var(--cream); line-height: 1; }

.wx__lo { font-size: 15px; color: var(--dim); line-height: 1; }

.wx__c {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

/* Chance of rain. Reads as metadata rather than as a headline number, because the
   high and the low are what people are actually deciding their shoes on. */
.wx__pop {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 13px; color: var(--dim);
}

.wx__n { color: var(--cream); font-size: 13px; }

.wx__est { color: var(--mute); font-size: 11px; font-style: italic; }

/* Crew only. Same field furniture as every other admin form on the wall. */
.wx-ed {
  margin: 11px 0 0; padding: 11px;
  border: 1px dashed var(--edge); border-radius: 8px;
}

.wx-ed__k {
  margin: 0 0 9px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--dim);
}

.wx-ed__said { align-self: center; color: var(--dim); font-size: 12px; }

/* ---------------------------------------------------- session cards */
.set-list { display: flex; flex-direction: column; gap: 16px; }
.set-card { --ticket-stub-w: 78px; }

/* The whole ticket is the toggle, so it is a button. Strip the UA chrome and
   let .ticket keep the motif. Reactions and links sit outside it, because a
   button cannot hold another button. */
.set-ticket {
  width: 100%; padding: 0; margin: 0;
  font: inherit; color: inherit; text-align: left;
  -webkit-appearance: none; appearance: none;
  cursor: pointer;
}

.set-ticket:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* A session with nothing to open renders as a div rather than a button, so the
   pointer must stop promising a dropdown that is not there. Everything else about
   the ticket stays identical: same stub, same title, same reactions underneath. */
.set-ticket--flat { cursor: default; }

/* ----------------------------------------- artwork on a session card */
/* One image belonging to one session, from agenda.json `graphic`. */
.set-art { margin: 12px 0 0; }

.set-art img {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--edge); border-radius: 10px;
  background: var(--input);
}

/* The place marker, shown while `pending` is true. Deliberately looks like a
   reserved frame rather than a failure: dashed gold on the amp grille, sized to a
   16:9 hole so the layout does not jump when the real artwork lands. */
.set-art--pending {
  border: 1px dashed var(--gold-rule);
  border-radius: 10px;
  background: var(--input);
  aspect-ratio: 16 / 9;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px; padding: 14px; text-align: center;
}

.set-art__k {
  font-family: var(--font-display); text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 13px; color: var(--gold);
}

.set-art__p { font-size: 12px; color: var(--dim); margin: 0; }

/* Crew only. Attendees have no use for a file path. */
.set-art__path {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; color: var(--mute); margin: 2px 0 0; word-break: break-all;
}

.set-stub__t { font-family: var(--font-display); font-size: 20px; line-height: 1; }
.set-stub__m { font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }

.set-stub__lab {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 13px; line-height: 1.05; letter-spacing: 0.06em;
  color: var(--gold);
}

.set-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 0 7px;
}

.set-kicker {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--dim);
}

/* These are spans, not paragraphs, because their parent is a button. */
.set-title { display: block; margin: 0; font-size: 17px; font-weight: 600; line-height: 1.28; }
.set-meta { display: block; margin: 6px 0 0; font-size: 13px; color: var(--dim); }

.set-more {
  display: block; margin: 9px 0 0;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.16em; color: var(--mute);
}

/* ON AIR. Scarlet gradient, gold bulb, and a ring that breathes outward. */
.onair {
  display: inline-flex; align-items: center; gap: 6px;
  background-image: var(--grad-primary);
  border: 1px solid var(--gold-rule); border-radius: 999px;
  padding: 3px 10px; color: var(--cream);
  font-family: var(--font-display); font-size: 11px; letter-spacing: 0.14em;
  animation: onair-pulse 1.7s ease-in-out infinite;
}

.onair__dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
}

@keyframes onair-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,16,46,0.55); }
  55%      { box-shadow: 0 0 0 7px rgba(200,16,46,0); }
}

/* A badge that throbs on every card is exactly the thing to switch off for
   anyone who asked for less motion. It still reads as ON AIR standing still. */
@media (prefers-reduced-motion: reduce) {
  .onair { animation: none; }
}

/* Starts within 30 minutes. */
.soon {
  display: inline-flex; align-items: center; gap: 6px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; font-weight: 600; color: var(--gold);
}

/* ------------------------------------------------------------- detail */
/* Sits under the ticket with a gap rather than flush, because .ticket punches
   its notches half outside its own bottom edge and a flush panel would show a
   --stage circle sitting on top of it. */
.set-detail {
  margin: 11px 0 0 12px;
  background: var(--riser);
  border: 1px solid var(--edge); border-left: 3px solid var(--scarlet);
  border-radius: 8px; padding: 13px 15px;
}

.set-detail__d { margin: 0 0 12px; font-size: 14px; }
.set-detail__d:last-child { margin-bottom: 0; }

.set-dl {
  margin: 0; display: grid; grid-template-columns: auto 1fr;
  gap: 6px 12px; font-size: 13px; align-items: baseline;
}

.set-dl dt {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.set-dl dd { margin: 0; color: var(--cream); min-width: 0; }

.set-fine { margin: 12px 0 0; font-size: 11px; color: var(--mute); }

/* Sub items inside one session. The seven Core Fundamentals breakouts. */
.set-items { margin: 0 0 12px; }

.set-items__k {
  margin: 0 0 6px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
}

.set-items__l { margin: 0; padding-left: 18px; font-size: 13px; }
.set-items__l li { margin: 0 0 3px; }
.set-items__l li::marker { color: var(--scarlet); }

/* Link chips. Maps, phones, mail, websites. Shared with T1.2. */
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }

.linkchip {
  display: inline-flex; align-items: center; gap: 7px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  border: 1px solid var(--warm-edge); border-radius: 999px;
  padding: 8px 13px; color: var(--cream); font-size: 13px;
  text-decoration: none;
}

.linkchip:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.linkchip__i { font-size: 13px; line-height: 1; }

/* ---------------------------------------------------------- reactions */
.reacts { display: flex; flex-wrap: wrap; gap: 8px; margin: 11px 0 0 12px; }

.react {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--input); border: 1px solid var(--edge);
  border-radius: 999px; padding: 6px 12px;
  color: var(--dim); font-size: 14px; cursor: pointer;
}

/* What the emoji means, on hover. The native title attribute is still there as
   a fallback, but it is slow and unstyled. Shown on :active as well because a
   phone has no hover, and that is most of the room. */
.react::after {
  content: attr(data-label);
  position: absolute;
  bottom: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%) translateY(3px);
  background: var(--stage);
  border: 1px solid var(--gold-rule);
  border-radius: 5px;
  padding: 5px 9px;
  color: var(--cream);
  font-size: 11px; font-weight: 600; line-height: 1;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 110ms ease, transform 110ms ease;
  z-index: 5;
}

.react:hover::after,
.react:focus-visible::after,
.react:active::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.react__n { font-size: 12px; font-weight: 600; min-width: 1ch; }

.react.is-cast {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
  border-color: var(--warm-edge); color: var(--cream);
}

.react:disabled { cursor: default; opacity: 0.55; }

/* --------------------------------------------------------- placeholder */
/* The running order for Wednesday and Thursday is not on the flier. This card
   says so out loud rather than being quietly filled in with a guess. */
.set-card--tba .ticket { border-style: dashed; background: transparent; }
.set-card--tba .ticket__stub { border-right-style: dashed; }

/* ------------------------------------------------------------- notices */
.setnote {
  margin: 0 0 16px; background: var(--riser);
  border: 1px solid var(--gold-rule); border-radius: 10px;
  padding: 11px 13px; font-size: 12px; color: var(--dim);
}

/* ==========================================================================
   T1.2 BACKSTAGE PASS
   Seven ticket stub panels. Same ticket motif as The Setlist, same link chips.
   Nothing here is interactive except the links, so these are plain sections
   rather than buttons.
   ========================================================================== */

.bs-list { display: flex; flex-direction: column; gap: 18px; }
.bs-panel { --ticket-stub-w: 72px; }

.bs-stub {
  font-size: 14px; line-height: 1.05; color: var(--gold);
  letter-spacing: 0.04em;
}

.bs-h { margin: 0 0 10px; font-size: clamp(18px, 5.4vw, 22px); }

.bs-p { margin: 0 0 10px; font-size: 14px; }
.bs-p:last-child { margin-bottom: 0; }

.bs-fine { margin: 10px 0 0; font-size: 12px; color: var(--mute); }

.bs-ul { margin: 0; padding-left: 18px; font-size: 14px; }
.bs-ul li { margin: 0 0 5px; }
.bs-ul li::marker { color: var(--scarlet); }

/* One venue or one contact inside a panel. */
.venue + .venue {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--edge);
}

.venue__n { margin: 0; font-size: 15px; font-weight: 600; }
.venue__note { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
.venue .chiprow { margin-top: 10px; }

/* An address chip carries a whole line of text, so it wraps rather than
   pushing the panel wider than the phone. */
.venue .linkchip, .chiprow .linkchip { max-width: 100%; }
.linkchip > span:last-child { min-width: 0; overflow-wrap: anywhere; }

/* Rental codes. Tabular figures, because a mistyped code is a lost booking. */
.bs-codes {
  margin: 0; display: grid; grid-template-columns: auto 1fr;
  gap: 6px 14px; align-items: baseline;
}

.bs-codes dt {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 11px; letter-spacing: 0.14em; color: var(--gold);
}

.bs-codes dd {
  margin: 0; font-size: 16px; font-weight: 700;
  letter-spacing: 0.08em;
  -webkit-user-select: all; user-select: all;
}

/* Attire, day by day. A real table overflows at 380px, so this is a two column
   grid that collapses to stacked rows on a narrow phone. */
.bs-day { display: flex; gap: 12px; align-items: baseline; }

.bs-day + .bs-day {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--edge);
}

.bs-day__d {
  flex: 0 0 58px; margin: 0;
  font-size: 12px; letter-spacing: 0.06em; color: var(--gold);
}

.bs-day__v { flex: 1 1 auto; min-width: 0; }
.bs-day__line { margin: 0 0 4px; font-size: 13px; }
.bs-day__line:last-child { margin-bottom: 0; }

.bs-day__k {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--dim);
}

/* ==========================================================================
   T2.7 ENCORE, TENURE ONLY
   Alfa Slab One earns its keep here and nowhere else. On a section heading and
   a milestone it reads as a trophy plate. CLAUDE.md rations it to exactly this.
   ========================================================================== */

.enc-list { display: flex; flex-direction: column; gap: 16px; }

.enc { padding: 16px 16px 18px; }
.enc--stub { background: var(--riser); border: 1px dashed var(--edge); border-radius: 12px; }

.enc__head {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; margin: 0 0 4px;
}

.enc__h { margin: 0; font-size: clamp(17px, 4.8vw, 21px); }
.enc__head .enc__h { margin: 0; }

/* Crew only. Says out loud that the room is not seeing this. */
.enc__hidden {
  display: inline-flex; align-items: center; gap: 6px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
  border: 1px solid var(--gold-rule); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; font-weight: 600; color: var(--gold);
}

.enc__locked { margin: 8px 0 0; font-size: 14px; color: var(--dim); }

.enc__crew {
  margin: 12px 0 6px; padding: 12px 13px;
  background: var(--input); border-left: 3px solid var(--scarlet);
  border-radius: 6px;
}

.enc__note { margin: 9px 0 0; font-size: 12px; color: var(--dim); }

/* ----------------------------------------------------------- milestones */
.ten-group { margin-top: 18px; }

.ten-group__h {
  margin: 0 0 8px; padding-bottom: 6px;
  font-size: 15px; color: var(--gold);
  border-bottom: 1px solid var(--gold-rule);
}

/* Names only is the normal case, so the row is a name with nothing missing
   rather than a card with two empty holes in it. Club and years appear inline
   after the name when they exist. */
.ten-list { list-style: none; margin: 0; padding: 0; }

.ten-row {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 8px 0;
}

.ten-row + .ten-row { border-top: 1px solid var(--edge); }

.ten-row__ph {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--gold); background: var(--input);
}

.ten-row__n { font-size: 16px; font-weight: 600; }
.ten-row__c { font-size: 13px; color: var(--dim); }
.ten-row__y { font-size: 13px; color: var(--mute); }
.ten-row__admin { margin-left: auto; display: flex; gap: 6px; }

/* --------------------------------------------------------- admin form */
.tf { margin: 12px 0 0; }

.tf__l { display: block; margin: 0 0 9px; }

.tf__l > span {
  display: block; margin-bottom: 4px;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--dim);
}

.tf__in {
  width: 100%; background: var(--riser); border: 1px solid var(--edge);
  border-radius: 8px; padding: 11px 12px;
  color: var(--cream); font-family: var(--font-body); font-size: 16px;
}

.tf__in:focus { outline: none; border-color: var(--warm-edge); }

.tf__row { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  border: 1px solid var(--warm-edge); border-radius: 8px;
  padding: 10px 14px; cursor: pointer;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill), var(--warm-fill));
  color: var(--cream); font-family: inherit; font-size: 14px; font-weight: 600;
}

.btn:active {
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
}

.btn--go { background-color: transparent; background-image: var(--grad-primary); border-color: var(--gold); }
.btn--kill { border-color: var(--danger); color: var(--danger); background-image: none; }
.btn--quiet { color: var(--dim); font-weight: 500; }
.btn--tiny { padding: 6px 10px; font-size: 12px; font-weight: 500; }
.btn:disabled { opacity: 0.55; cursor: default; }

@media (min-width: 700px) {
  .dayrow { flex-wrap: wrap; overflow-x: visible; row-gap: 7px; }
  .set-card { --ticket-stub-w: 96px; }
  .set-stub__t { font-size: 23px; }
  .set-title { font-size: 19px; }
  .dayhead { padding: 18px 20px; }

  .bs-panel { --ticket-stub-w: 96px; }
  .bs-stub { font-size: 16px; }
  .bs-day__d { flex-basis: 72px; }
}

/* ==========================================================================
   T1.6 ADMIN PANEL, v1. Spec 4.1.
   Marquee, tab visibility, reset by section, clear this device, reset
   everything. The PIN gate is T0.5 and is not restyled here.

   Every selector is ap- prefixed so it cannot collide with another tab's work.
   Fields and buttons reuse .tf__l, .tf__in, .tf__row and .btn. The section
   cards are .glow-card plus .grille, the same composition as .dayhead.
   No new palette token. The palette is still twelve.
   ========================================================================== */

.ap { display: flex; flex-direction: column; gap: 16px; }

/* Stacked on a phone, with the button full width the way .enter is. A right
   aligned button hanging under the lede on a 380px screen reads like it fell
   off the row it wanted. */
.ap__top { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.ap__h { margin: 0; font-size: clamp(26px, 8vw, 34px); }
.ap__lede { margin: 5px 0 0; color: var(--dim); font-size: 14px; }

/* Display Mode is on, or Firebase is not. Both are things to say loudly. */
.ap-warn {
  margin: 0; padding: 11px 13px;
  background: var(--riser); border: 1px solid var(--danger);
  border-radius: 10px; color: var(--cream); font-size: 13px;
}

.ap-sec { padding: 15px 16px 17px; }
.ap-sec__h { margin: 0; font-size: clamp(17px, 5vw, 20px); }
.ap-sec__p { margin: 8px 0 0; color: var(--dim); font-size: 13px; }
.ap-sec__note { margin: 11px 0 0; color: var(--mute); font-size: 12px; }

/* Two-state pill. .soon and .enc__hidden are gold only, and this one has to
   read as off without reading as broken. */
.ap-state {
  display: inline-flex; align-items: center; flex: 0 0 auto;
  border-radius: 999px; padding: 2px 9px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
}

.ap-state--on {
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
  border: 1px solid var(--gold-rule); color: var(--gold);
}

.ap-state--off {
  background: var(--input);
  border: 1px solid var(--edge); color: var(--mute);
}

/* --------------------------------------------------------- tab visibility */
.ap-tabs { display: grid; grid-template-columns: 1fr; margin: 13px 0 0; }

.ap-tab {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-top: 1px solid var(--edge);
}

.ap-tab__icon { flex: 0 0 auto; font-size: 15px; line-height: 1; }
.ap-tab__n { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600; }
.ap-tab .btn { flex: 0 0 auto; }

/* -------------------------------------------------------------- marquee */
.ap-anns { list-style: none; margin: 13px 0 0; padding: 0; }
.ap-ann { padding: 12px 0; border-top: 1px solid var(--edge); }
.ap-ann__t { margin: 0; font-size: 14px; overflow-wrap: anywhere; }

.ap-ann__m {
  margin: 6px 0 0; display: flex; align-items: center; gap: 9px;
  flex-wrap: wrap; font-size: 12px; color: var(--mute);
}

.ap-ann .tf__row { margin-top: 9px; }

/* ------------------------------------------------------ reset by section */
.ap-nodes { display: grid; grid-template-columns: 1fr; margin: 13px 0 0; }

.ap-node {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 0; border-top: 1px solid var(--edge);
}

.ap-node__v { flex: 1 1 180px; min-width: 0; }
.ap-node__n { margin: 0; font-size: 14px; font-weight: 600; }
.ap-node__p { margin: 3px 0 0; font-size: 12px; color: var(--dim); }
.ap-node__path { color: var(--gold); }

.ap-node__b {
  flex: 0 0 auto; margin-left: auto;
  display: flex; align-items: center; gap: 8px;
}

.ap-node .btn { flex: 0 0 auto; }

/* ----------------------------------------------------------- this device */
/* The keys are enumerated out of storage, so this list is whatever is really
   there rather than whatever the source remembers. */
.ap-keys {
  list-style: none; margin: 12px 0 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: 6px;
}

.ap-key {
  font-size: 12px; color: var(--gold);
  background: var(--input); border: 1px solid var(--edge);
  border-radius: 6px; padding: 3px 8px;
  overflow-wrap: anywhere;
}

.ap-said { margin: 11px 0 0; font-size: 13px; color: var(--gold); }

/* ------------------------------------------------------ reset everything */
/* This one is meant to look like what it is. */
.ap-sec.ap-nuke {
  border-color: var(--danger);
  background:
    radial-gradient(80% 62% at 50% 0%, rgba(255,107,74,0.10) 0%, transparent 70%),
    var(--riser);
}

.ap-nuke__h { color: var(--danger); }

.ap-arm {
  margin: 13px 0 0; padding: 12px 13px;
  background: var(--input);
  border-left: 3px solid var(--danger); border-radius: 6px;
}

.ap-arm__p { margin: 0 0 10px; font-size: 13px; }

/* Row of buttons inside the crew bar on a tab page. */
.ap-open { margin-top: 10px; }

@media (min-width: 700px) {
  .ap-sec { padding: 18px 20px 20px; }

  /* Heading and the way out share a row once there is room for both. */
  .ap__top { flex-direction: row; align-items: flex-start; gap: 10px; }
  .ap__top > .btn { margin-left: auto; flex: 0 0 auto; }

  /* Ten switches and eight nodes read as a very long list in one column on a
     laptop, and Jim reviews on a laptop. */
  .ap-tabs { grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .ap-nodes { grid-template-columns: 1fr 1fr; column-gap: 24px; }
}

/* --------------------------------------------------------- T3.1 roster */
/* 147 rows in the page flow. No inner scroller, per CLAUDE.md, so the list
   pages out in batches and exactly one row is open at a time. */
.rst-count { margin: 13px 0 0; font-size: 14px; }
.rst-count__n { color: var(--gold); font-weight: 700; }

.rst-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 14px 0 0; }
.rst-bar .tf__l { flex: 1 1 190px; margin: 0; min-width: 0; }
.rst-bar .btn { flex: 0 0 auto; }
.rst-bar .tf__in::-webkit-search-decoration,
.rst-bar .tf__in::-webkit-search-cancel-button { -webkit-appearance: none; }

.rst-list { list-style: none; margin: 14px 0 0; padding: 0; }
.rst-row { padding: 10px 0; border-top: 1px solid var(--edge); }
.rst-row__top { display: flex; align-items: flex-start; gap: 10px; }
.rst-row__v { flex: 1 1 auto; min-width: 0; }
.rst-row__n { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.rst-row__c { margin: 2px 0 0; font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.rst-row__tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0 0; }
.rst-row__top > .btn { flex: 0 0 auto; }

/* Same square as a headshot, small. No overflow:hidden, the radius is on the
   element, same reasoning as .bnd-shot__img. */
.rst-thumb {
  flex: 0 0 auto; display: block; width: 42px; height: 42px;
  border-radius: 8px; background: var(--input); object-fit: cover;
}
.rst-thumb--init { display: grid; place-items: center; border: 1px solid var(--edge); }
.rst-thumb__i { font-size: 13px; line-height: 1; color: var(--mute); letter-spacing: 0.04em; }

.rst-edit {
  margin: 12px 0 2px; padding: 13px;
  background: var(--input); border-left: 3px solid var(--gold-rule);
  border-radius: 6px;
}

.rst-grid { display: grid; grid-template-columns: 1fr; column-gap: 16px; }
.rst-grid .tf__l { margin-bottom: 11px; }

/* What the file says, and the button that puts it back. */
.rst-was {
  display: block; margin-top: 5px; font-size: 11px; color: var(--dim);
  overflow-wrap: anywhere;
}
.rst-was--bad { color: var(--danger); }
.rst-was__b { margin-left: 7px; vertical-align: baseline; }

.rst-toggle {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 0 0 12px;
}
.rst-toggle__l {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--dim);
}

.rst-shot { display: flex; align-items: flex-start; gap: 11px; margin: 0 0 12px; }
.rst-shot__img {
  flex: 0 0 auto; display: block; width: 84px; height: 84px;
  border-radius: 8px; background: var(--input); object-fit: cover;
}
.rst-shot__b { flex: 1 1 auto; min-width: 0; }

.rst-hint { margin: 9px 0 0; font-size: 12px; color: var(--mute); }
.rst-bad { margin: 9px 0 0; font-size: 13px; color: var(--danger); }

.rst-add {
  margin: 13px 0 0; padding: 13px;
  background: var(--input); border-left: 3px solid var(--warm-edge);
  border-radius: 6px;
}
.rst-add__h { margin: 0 0 11px; font-size: 16px; }

@media (min-width: 700px) {
  /* Four fields in one column is a lot of scrolling on the laptop where the
     124 flagged names actually get worked through. */
  .rst-grid { grid-template-columns: 1fr 1fr; }
}

/* ==========================================================================
   T2.1 to T2.3 THE VAULT
   Five sections, club graph picker, timed drops.
   No new motifs and no thirteenth palette token. The section nav reuses .tab
   from the top tab bar, cards sit on .glow-card and .grille, and every chip is
   the existing .linkchip. Everything below is layout plus the same warm chrome
   recipe the tab bar and the day pills already use.
   ========================================================================== */

/* ------------------------------------------------------- section navigation */
/* Pills on a phone, left rail from 700px. Same control, one CSS rule apart. */
.vt-nav__scroll {
  display: flex; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin: 0 0 16px; padding: 0 0 3px;
}

.vt-nav__scroll::-webkit-scrollbar { display: none; }

/* Five long section names, so one notch down from the top bar. The top bar has
   to stay the loudest control on the page. */
.vt-nav .tab { font-size: 12px; padding: 7px 12px; }

/* ---------------------------------------------------------------- headings */
.vt-h { margin: 0 0 12px; font-size: clamp(20px, 6vw, 26px); }

/* Crew only. Says out loud that the room is not seeing this yet. */
.vt-badge {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 0 0 14px;
  background-color: var(--input);
  background-image: linear-gradient(var(--warm-fill-strong), var(--warm-fill-strong));
  border: 1px solid var(--gold-rule); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; font-weight: 600; color: var(--gold);
}

/* -------------------------------------------------------------- art cards */
.vt-cards { display: flex; flex-direction: column; gap: 16px; }

/* ----------------------------------- tenure names on the 8:20 Setlist card */
/* An awards moment, so it gets the poster font and a gold rule, not the plain
   list treatment the rest of the detail panel uses. */
.set-tenure {
  margin: 12px 0 0; padding: 12px 0 0;
  border-top: 1px solid var(--gold-rule);
  display: flex; flex-direction: column; gap: 12px;
}

.set-tenure__k {
  margin: 0 0 6px; font-size: 12px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gold);
}

.set-tenure__l {
  margin: 0; padding: 0; list-style: none;
  display: flex; flex-direction: column; gap: 4px;
}

.set-tenure__l li {
  font-family: var(--font-poster); font-size: 15px; line-height: 1.25;
  color: var(--cream);
}

/* ------------------------------------------------- the Cares Cup card */
.cc { margin: 20px 0 0; }
.cc__h { margin: 0 0 4px; font-size: clamp(18px, 5vw, 22px); }
.cc__sub { margin: 0 0 12px; font-size: 12px; color: var(--dim); }
.cc__fine { margin: 10px 0 0; font-size: 11px; color: var(--mute); }

.cc-teams {
  display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 14px;
}
.cc-team { margin: 0; display: flex; flex-direction: column; gap: 1px; }
.cc-team__n { font-size: 14px; color: var(--gold); }
.cc-team__c { font-size: 11px; color: var(--mute); }

.cc-m { padding: 12px; margin: 0 0 10px; }

.cc-m__k {
  margin: 0 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
}
.cc-m__n { font-size: 14px; color: var(--cream); }
.cc-m__f {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold);
}

/* One column on a phone, two side by side once there is room. The "vs" is a
   divider in both, a rule between the sides rather than a word in a gap. */
.cc-m__sides { display: grid; gap: 8px; grid-template-columns: 1fr; }

.cc-side { list-style: none; margin: 0; padding: 0; display: flex;
           flex-direction: column; gap: 8px; }

.cc-vs {
  margin: 0; text-align: center; font-size: 12px; color: var(--scarlet);
  border-top: 1px solid var(--gold-rule); padding-top: 8px;
}

@media (min-width: 620px) {
  .cc-m__sides { grid-template-columns: 1fr auto 1fr; align-items: start; gap: 14px; }
  .cc-vs { border-top: 0; padding-top: 0; align-self: center; }
}

.cc-p { display: flex; align-items: center; gap: 9px; min-width: 0; }

.cc-p__img {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
  object-fit: cover; background: var(--input); border: 1px solid var(--edge);
}
.cc-p__img--none { display: block; }

.cc-p__t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cc-p__n { font-size: 13px; color: var(--cream); }
.cc-p__m { font-size: 11px; color: var(--dim); }

/* ------------------------------------------- year by year under a graph */
/* Sales and attrition percentages. Narrow columns and small figures, because it
   sits under a 380px chart and has to stay readable without sideways scrolling. */
.vt-tbl {
  width: 100%; margin: 12px 0 0; border-collapse: collapse; font-size: 12px;
}

.vt-tbl__cap {
  caption-side: top; text-align: left;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 10px; letter-spacing: 0.14em; color: var(--gold);
  padding: 0 0 6px;
}

.vt-tbl th, .vt-tbl td {
  padding: 5px 6px; text-align: right;
  border-bottom: 1px solid var(--edge);
}

.vt-tbl thead th {
  color: var(--dim); font-weight: 600;
  font-size: 11px; letter-spacing: 0.04em;
  border-bottom-color: var(--gold-rule);
}

/* The year is the row's own label, so it reads as a heading and sits left. */
.vt-tbl tbody th { text-align: left; color: var(--dim); font-weight: 600; }
.vt-tbl tbody td { color: var(--cream); }
.vt-tbl tbody tr:last-child th,
.vt-tbl tbody tr:last-child td { border-bottom: 0; }

/* ------------------------------------------------- invitation personas */
/* Reading matter, so it gets a measure and real paragraph rhythm rather than the
   card grid the image sections use. */
.pv { display: flex; flex-direction: column; gap: 14px; }

.pv__lede {
  margin: 0; color: var(--gold); font-size: 14px; letter-spacing: 0.04em;
}

.pv__p { margin: 0; max-width: var(--measure); line-height: 1.6; color: var(--cream); }

.pv__mission { padding: 14px; }
.pv__k { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.14em; color: var(--gold); }
.pv__ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.pv__ul li { line-height: 1.5; }

.pv-card { padding: 0; overflow: hidden; }

.pv-card__head {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 14px; text-align: left; font: inherit; color: inherit;
  background: none; border: 0; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}

.pv-card__head:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }

/* The number reads as a track listing, which is the joke the whole wall runs on. */
.pv-card__n {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--scarlet); color: var(--cream);
  font-size: 17px; line-height: 1;
}

.pv-card__t { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pv-card__src { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.pv-card__name { font-size: 17px; line-height: 1.15; }
.pv-card__more { flex: 0 0 auto; font-size: 12px; color: var(--gold); }

.pv-card__hook {
  margin: 0; padding: 0 14px 14px; color: var(--dim);
  font-style: italic; line-height: 1.5; max-width: var(--measure);
}

.pv-card__body {
  padding: 0 14px 16px; display: flex; flex-direction: column; gap: 12px;
  border-top: 1px solid var(--edge); padding-top: 14px;
}

.pv-card__pull {
  margin: 0; padding-left: 12px; border-left: 3px solid var(--gold);
  color: var(--gold); font-style: italic; line-height: 1.5;
}

/* The discussion question is the point of the whole card, so it is the one thing
   that stays loud when somebody skims. */
.pv-card__q {
  margin: 0; padding: 12px 14px; border-radius: 8px;
  background: var(--glow); border: 1px solid var(--gold-rule);
  color: var(--cream); line-height: 1.5; max-width: var(--measure);
}

/* ------------------------------------------------ a document as pages */
/* A booklet split into page images. Reads as one continuous document rather than
   a stack of cards, so the gap is tight and there is no chrome between pages. */
.vt-pages { display: flex; flex-direction: column; gap: 10px; }

.vt-page {
  display: block; width: 100%; padding: 0; margin: 0;
  background: none; border: 0; cursor: zoom-in;
  -webkit-appearance: none; appearance: none;
}

.vt-page img {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--edge); border-radius: 8px;
  background: var(--cream);   /* paper, so a page shows its shape before it loads */

  /* RESERVE THE SPACE. Without this the whole thing is broken, not merely jumpy.
     A lazy image with no intrinsic size lays out at zero height, so all 28 pages
     collapsed into a 2px stack, none of them ever came far enough into view to
     trigger loading, and the section rendered as an empty strip. US Letter, which
     every page in this booklet is, measured rather than assumed: 1100x1423. */
  aspect-ratio: 1100 / 1423;
}

.vt-page:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* The whole document, above the pages. */
.vt-doc { margin: 0 0 6px; }
.vt-doc__a { display: inline-block; }
.vt-doc__n { margin: 6px 0 0; font-size: 12px; color: var(--mute); }

figure.vt-card { margin: 0; padding: 14px; }

.vt-card__k {
  margin: 0 0 4px; font-size: 13px; letter-spacing: 0.14em; color: var(--gold);
}

.vt-card__note { margin: 0 0 10px; font-size: 12px; color: var(--dim); }
.vt-card__k + .vt-art { margin-top: 10px; }

/* A type this club does not have. Dashed, like the TBA session card, because it
   is a hole in the pack rather than a thing that failed. */
.vt-card--none {
  background: var(--riser); border: 1px dashed var(--edge);
  border-radius: 12px; padding: 14px;
}

.vt-card__none { margin: 0; font-size: 13px; color: var(--dim); }

.vt-art { margin: 0 0 12px; }

/* The graphs are 380x240 SVGs with a viewBox, so CSS width wins over the width
   attribute and the aspect ratio comes off the viewBox. */
.vt-svg svg, .vt-img {
  display: block; width: 100%; height: auto; max-width: 100%;
  border-radius: 8px; background: var(--riser);
}

/* This is the whole reason the SVGs are inlined rather than dropped in an img
   tag. font-family on the element is a presentation attribute, so any author
   rule beats it and the graphs pick up Inter with the rest of the wall. */
.vt-svg svg text { font-family: var(--font-body); }

.vt-card .chiprow { margin-top: 0; }

/* Two of the chips are buttons, not links. .linkchip carries no anchor-only
   properties, so they only need the UA button chrome stripped. */
.vt button.linkchip, .vt-zoom button.linkchip {
  font-family: inherit; cursor: pointer;
}

/* ------------------------------------------------------------ locked panel */
/* Greyed, padlocked, and counting. Visible but shut builds anticipation and
   stops anybody asking where the section went. */
.vt-locked { padding: 24px 18px; text-align: center; opacity: 0.82; }

.vt-locked__lock { margin: 0 0 10px; font-size: 26px; line-height: 1; }
.vt-locked__p { margin: 0 0 12px; font-size: 14px; color: var(--cream); }

.vt-locked__t {
  margin: 0; font-size: clamp(28px, 9vw, 40px); line-height: 1;
  color: var(--gold);
}

.vt-locked__f { margin: 12px 0 0; font-size: 12px; color: var(--mute); }

/* -------------------------------------------------------- crew drop panel */
.vt-crew { padding: 14px; margin: 0 0 18px; }
.vt-crew__h { margin: 0 0 5px; font-size: 16px; }
.vt-crew__clock { margin: 0; font-size: 12px; color: var(--dim); }
.vt-crew__off { margin: 12px 0 0; font-size: 12px; color: var(--danger); }

.vt-drop { margin-top: 14px; }
.vt-drop + .vt-drop { padding-top: 14px; border-top: 1px solid var(--edge); }

.vt-drop__top {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 0 0 6px;
}

.vt-drop__n { margin: 0; font-size: 15px; font-weight: 600; }
.vt-drop__room { margin: 0 0 4px; font-size: 13px; color: var(--cream); }
.vt-drop__at { margin: 0 0 10px; font-size: 12px; color: var(--dim); }
.vt-drop__ts { margin: 8px 0 0; font-size: 11px; color: var(--mute); }

/* Which state is in force, at a glance, under time pressure. */
.vt-state {
  display: inline-flex; align-items: center;
  border: 1px solid var(--edge); border-radius: 999px;
  background-color: var(--input);
  padding: 3px 10px; font-size: 11px; font-weight: 600;
}

.vt-state--scheduled { color: var(--dim); }

.vt-state--open {
  background-color: transparent; background-image: var(--grad-primary);
  border-color: var(--gold); color: var(--cream);
}

.vt-state--shut { border-color: var(--danger); color: var(--danger); }

/* A test time is a lie told to the whole room on purpose, so it is the loudest
   thing in the crew panel until somebody clears it. */
.vt-drop__warn {
  margin: 0 0 10px; padding: 9px 11px;
