/* The wall walks upward at a fixed pixels per second, so a long list moves at
   the same reading speed as a short one. The list is duplicated once and the
   track travels exactly half its height, which loops with no seam. It only
   moves when the content is taller than the screen: a wall of three questions
   sliding around for no reason looks broken. */
function ScWall({ items, now }) {
  const boxRef = useRef(null);
  const copyRef = useRef(null);
  const [box, setBox] = useState({ h: 0, content: 0, lift: 0 });

  useEffect(() => {
    function measure() {
      const b = boxRef.current;
      const c = copyRef.current;
      if (!b || !c) return;

      const scrolled = window.pageYOffset || document.documentElement.scrollTop || 0;

      /* The masthead sits above the sticky header on every page, per Lisa, and
         Display Mode keeps it. Measured raw, that left the wall 282px of an
         800px laptop screen, which is two questions on a ballroom projector.
         So the wall is sized as if the masthead were scrolled off, and the
         effect below scrolls it off. `lift` is the masthead's height: the
         document offset of .stickytop, which is the first thing under it.
         Hiding the masthead outright would be a change to every tab in
         Display Mode, which is not this feature's call to make. */
      const sticky = document.querySelector(".stickytop");
      const lift = sticky
        ? Math.max(0, Math.round(sticky.getBoundingClientRect().top + scrolled))
        : 0;

      /* The sheet's own bottom padding is read rather than guessed, because
         guessing it left the page a few pixels too short to park the masthead
         cleanly and a sliver of it stayed on screen above the header. Read, the
         page comes out exactly one masthead taller than the viewport. */
      const sheet = b.closest ? b.closest(".sheet") : null;
      const pad = sheet
        ? Math.ceil(parseFloat(window.getComputedStyle(sheet).paddingBottom) || 48)
        : 48;

      /* Document coordinates, so the answer does not move when the page
         scrolls. */
      const top = Math.round(b.getBoundingClientRect().top + scrolled);
      const h = Math.max(260, Math.round(window.innerHeight - (top - lift) - pad));
      const content = Math.round(c.getBoundingClientRect().height);

      setBox((prev) =>
        prev.h === h && prev.content === content && prev.lift === lift
          ? prev
          : { h: h, content: content, lift: lift }
      );
    }

    measure();
    /* Anton and Inter land after first paint and change the height. */
    const late = window.setTimeout(measure, 600);
    window.addEventListener("resize", measure);
    return () => {
      window.clearTimeout(late);
      window.removeEventListener("resize", measure);
    };
  }, [items.length]);

  /* Park the masthead just off the top so the wall fills the screen. Only
     while the projector view is up, only once per measurement, and the sticky
     header stays pinned, so the Display Mode button is still there to turn
     this off. */
  useEffect(() => {
    if (!box.lift || !box.h) return;
    const max = Math.max(
      0,
      document.documentElement.scrollHeight - window.innerHeight
    );
    window.scrollTo(0, Math.min(box.lift, max));
  }, [box.lift, box.h]);

  const rolls = box.h > 0 && box.content > box.h + 8;
  const dur = Math.max(24, Math.round(box.content / SC_WALL_SPEED));

  const copy = (dupe) => (
    <div
      className="sc-wall__copy"
      ref={dupe ? null : copyRef}
      aria-hidden={dupe ? "true" : undefined}
    >
      {items.map((q) => (
        <ScBigCard key={(dupe ? "dupe-" : "") + q.id} q={q} now={now} />
      ))}
    </div>
  );

  return (
    <div
      className={"sc-wall" + (rolls ? "" : " sc-wall--still")}
      ref={boxRef}
      style={{ "--sc-h": box.h ? box.h + "px" : "auto" }}
    >
      <div
        className="sc-wall__track"
        style={rolls ? { animationDuration: dur + "s" } : undefined}
      >
        {copy(false)}
        {rolls ? copy(true) : null}
      </div>
    </div>
  );
}

/* --------------------------------------------------------------- tab */
/* An empty list has three different reasons behind it, and telling somebody
   "nothing here yet" when the only question in that category is answered is a
   lie they can catch. */
function scEmptyLine(items, cat, showAnswered, ready) {
  if (!ready) return "Checking the wall.";
  if (!items.length) return "No questions yet. Somebody has to go first.";

  const hidden = !showAnswered && items.some(
    (q) => q.answered && (cat === "all" || q.category === cat)
  );
  if (hidden) return "Everything here is answered. Turn Show answered on to read it back.";

  if (cat !== "all") return "Nothing under " + cat + " yet. Ask the first one.";
  return "Nothing to show.";
}

function SoundcheckTab({ isAdmin, now }) {
  const { items, ready } = useScQuestions();
  const displayMode = useScDisplayMode();
  const [votedMap, setVotedMap] = useState(() => readJSON(LS.voted));
  const [sort, setSort] = useState("top");
  const [cat, setCat] = useState("all");
  const [showAnswered, setShowAnswered] = useState(false);

  /* Two tools, one tab, since Aug 13 2026. Questions and takeaways stay separate
     lists on separate Firebase nodes, because they are separate things: a question
     is asked, voted on and answered, a takeaway is shared and pinned. The pills
     just decide which one you are looking at.

     Display Mode is deliberately NOT part of this. It is the one feature a
     presenter drives live in front of the room, its job is surfacing top voted
     questions, and it has no business changing during a layout tidy. When Display
     Mode is on the pills are gone and this is the questions wall, full stop.

     THIS HOOK BELONGS UP HERE WITH THE OTHERS, above the `if (displayMode)` early
     return further down. I first put it just before the main return, which is after
     that early return, so switching Display Mode on rendered one fewer hook than
     the previous pass and React threw error #300 and blanked the whole wall. It
     only reproduced from the Liner Notes pill, which is exactly the sort of path a
     quick click-through misses. */
  const [pane, setPane] = useState("questions");

  const post = useCallback((clean) => {
    if (!FB.ok) return Promise.resolve(false);
    return FB.db.ref("questions").push().set({
      text: clean.text,
      name: clean.name,
      club: clean.club,
      category: clean.category,
      anonymous: clean.anonymous,
      votes: 0,
      answered: false,
      pinned: false,
      ts: scServerStamp()
    }).then(() => true).catch(() => false);
  }, []);

  /* Storage is read at cast time rather than trusting state, so a second tab
     open on the same phone cannot double vote through a stale copy. The same
     call The Setlist makes for reactions. */
  const onVote = useCallback((q) => {
    if (!FB.ok) return;
    const held = readJSON(LS.voted);
    if (held[q.id]) { setVotedMap(held); return; }
    held[q.id] = 1;
    writeJSON(LS.voted, held);
    setVotedMap(held);
    FB.db.ref("questions/" + q.id + "/votes")
      .transaction((cur) => (typeof cur === "number" ? cur : 0) + 1);
  }, []);

  const onAnswer = useCallback((q) => {
    if (!FB.ok) return;
    FB.db.ref("questions/" + q.id + "/answered").set(!q.answered);
  }, []);

  const onPin = useCallback((q) => {
    if (!FB.ok) return;
    FB.db.ref("questions/" + q.id + "/pinned").set(!q.pinned);
  }, []);

  const onDelete = useCallback((q) => {
    if (!FB.ok) return;
    if (!window.confirm("Delete this question for good?\n\n" + q.text.slice(0, 140))) return;
    FB.db.ref("questions/" + q.id).remove();
  }, []);

  const exportCsv = useCallback(() => {
    if (!items.length) return;
    const stamp = scEtStamp(now).replace(" ", "-").replace(":", "");
    scSaveCsv(scBuildCsv(items), "soundcheck-questions-" + stamp + ".csv");
  }, [items, now]);

  /* Display Mode deliberately ignores the sort and category pills. Nobody can
     change them from the projector, and a wall quietly showing one category
     because somebody tapped a pill an hour ago is worse than a wall that
     always shows the same thing: the top unanswered questions in the room. */
  const wall = scSort(items.filter((q) => !q.answered), "top")
    .slice(0, SC_WALL_COUNT);

  if (displayMode) {
    return (
      <section aria-labelledby="head-soundcheck">
        <div className="sc-dhead">
          <h2 className="tabhead t-display" id="head-soundcheck">Soundcheck</h2>
          {wall.length ? (
            <span className="sc-dcount t-data">{wall.length} live</span>
          ) : null}
        </div>
        <p className="sc-dsub">Top questions from the room. Add yours on Soundcheck.</p>

        {wall.length ? (
          <ScWall items={wall} now={now} />
        ) : (
          <p className="sc-dempty">
            {!ready
              ? "Checking the wall."
              : items.length
                ? "Every question is answered. Ask a harder one."
                : "Nothing on the wall yet. Somebody has to go first."}
          </p>
        )}
      </section>
    );
  }

  const visible = items.filter((q) =>
    (showAnswered || !q.answered) && (cat === "all" || q.category === cat)
  );
  const sorted = scSort(visible, sort);

  const pool = items.filter((q) => showAnswered || !q.answered);
  const counts = {};
  pool.forEach((q) => { counts[q.category] = (counts[q.category] || 0) + 1; });
  const answeredCount = items.filter((q) => q.answered).length;

  const onQuestions = displayMode || pane === "questions";

  return (
    <TabFrame tabKey="soundcheck">
      {!displayMode ? (
        <div className="dayrow" role="tablist" aria-label="Soundcheck tools">
          {[["questions", "Questions"], ["liner", "Liner Notes"]].map(([k, label]) => (
            <button
              key={k}
              role="tab"
              aria-selected={pane === k}
              className={"daypill" + (pane === k ? " is-on" : "")}
              onClick={() => setPane(k)}
            >
              {label}
            </button>
          ))}
        </div>
      ) : null}

      {!onQuestions ? <LinerNotesPanel isAdmin={isAdmin} now={now} /> : (
      <React.Fragment>
      {FB.ok ? (
        <ScAsk onPost={post} live={FB.ok} />
      ) : (
        <Empty>Questions need the live connection, and it is off right now.</Empty>
      )}

      <div className="sc-rows">
        <div className="sc-pills" role="group" aria-label="Sort">
          <span className="sc-pills__k">Sort</span>
          <button
            className="sc-pill"
            aria-pressed={sort === "top"}
            onClick={() => setSort("top")}
          >Top</button>
          <button
            className="sc-pill"
            aria-pressed={sort === "new"}
            onClick={() => setSort("new")}
          >New</button>
          <button
            className="sc-pill"
            aria-pressed={showAnswered}
            onClick={() => setShowAnswered(!showAnswered)}
          >
            Show answered
            {answeredCount ? <span className="sc-pill__n t-data">{answeredCount}</span> : null}
          </button>
        </div>

        <div className="sc-pills" role="group" aria-label="Category">
          <span className="sc-pills__k">Filter</span>
          <button
            className="sc-pill"
            aria-pressed={cat === "all"}
            onClick={() => setCat("all")}
          >
            All
            {pool.length ? <span className="sc-pill__n t-data">{pool.length}</span> : null}
          </button>
          {SC_CATEGORIES.map((c) => (
            <button
              key={c}
              className="sc-pill"
              aria-pressed={cat === c}
              onClick={() => setCat(c)}
            >
              {c}
              {counts[c] ? <span className="sc-pill__n t-data">{counts[c]}</span> : null}
            </button>
          ))}
        </div>
      </div>

      <p className="sc-tally t-data">
        {items.length} {items.length === 1 ? "question" : "questions"}
        {answeredCount ? ", " + answeredCount + " answered" : ""}.
      </p>

      {isAdmin ? (
        <div className="sc-crew">
          <div className="tf__row">
            <button className="btn" onClick={exportCsv} disabled={!items.length}>
              Export CSV
            </button>
          </div>
          <p className="sc-ask__note">
            The CSV comes out grouped by category with one header row, and Excel
            opens it as is. Answered questions sink to the bottom. Pinned ones ride
            the top, on phones and on the projector.
          </p>
        </div>
      ) : null}

      {sorted.length ? (
        <div className="sc-list">
          {sorted.map((q) => (
            <ScCard
              key={q.id}
              q={q}
              now={now}
              voted={!!votedMap[q.id]}
              onVote={onVote}
              isAdmin={isAdmin}
              onAnswer={onAnswer}
              onPin={onPin}
              onDelete={onDelete}
            />
          ))}
        </div>
      ) : (
        <Empty>{scEmptyLine(items, cat, showAnswered, ready)}</Empty>
      )}

      <BuildNote isAdmin={isAdmin} task="T1.4">
        Questions live at questions/{"{id}"}. One upvote per device in mm26_voted, so
        anybody who clears their own storage buys one more vote. That is fine, this
        orders a list, it is not a ballot. Display Mode shows the top 12 unanswered,
        ignores the sort and filter pills on purpose, and only auto scrolls when the
        list is taller than the screen. ts is written by the server, not by the
        phone. Liner Notes shares this tab since Aug 13 and keeps its own node,
        takeaways/, untouched.
      </BuildNote>
      </React.Fragment>
      )}
    </TabFrame>
  );
}

/* ==========================================================================
   T2.1 to T2.3 THE VAULT. Spec 3.5.
   Five sections, a club graph picker, and the timed drop engine.

   The drop engine is the highest risk feature in the build, so three rules run
   through all of it.

   1. Nothing in here calls Date.now() in a timing path. Every lock decision is
      a pure function of the server corrected `now` that App ticks once a
      second and hands down as a prop. That is also why it fires with no
      refresh: there is no mount-time snapshot of the lock state to go stale.
   2. Locked is the default. Until this device has proved it talked to the
      server, and until the override state has arrived, a timed section stays
      shut. A phone six hours out would otherwise drop Wednesday's content on
      Tuesday night.
   3. The crew override beats the clock in both directions and says which state
      is in force, because it gets used with a room watching.
   ========================================================================== */

/* Five sections in the order the meeting uses them. `drop` names the child
   under settings/vaultDrops for the two that open on a clock. */
const VAULT_SECTIONS = [
  { key: "fundamentals", name: "Core Fundamentals",          icon: "\u{1F4D8}", kind: "images" },
  /* Lisa renamed this on Aug 12. The display name is "Invitation Sources".
     The key stays `buckets` on purpose: it is the child name in
     data/vault.json, the value stored in mm26_vaultsection on every phone
     that has already opened the tab, and the id on the nav button. Renaming
     the key would mean editing a data file somebody else owns and stranding
     the stored value. The name is what the room reads. The key is plumbing. */
  { key: "buckets",      name: "Invitation Sources",         icon: "\u{1F5C2}", kind: "images" },
  { key: "graphs",       name: "Club Graphs",                icon: "\u{1F4C8}", kind: "graphs" },
  /* Jim, Aug 17 2026: the breakout scenarios ARE the six personas. He sent the
     personas document a second time to say so. So this section reads the same
     data/personas.json rather than waiting on artwork that was never coming.

     `kind: "personas"` on both means one file, one component, no second copy of
     the prose to drift.

     Two sections is deliberate, decided by Jim on Aug 17. The room meets the same
     six personas twice under two headings: Wednesday 9:30 as the breakout material,
     Thursday 10:30 as the reference. Anybody following the agenda finds it where the
     agenda says it is. Do not "fix" this by collapsing them. */
  { key: "scenarios",    name: "Core Fundamental Scenarios",  icon: "\u{1F3AD}", kind: "personas", drop: "scenarios" },
  { key: "personas",     name: "Invitation Source Personas",  icon: "\u{1F465}", kind: "personas", drop: "personas" },

  /* Jim, Aug 17 2026. Sets up the Wednesday afternoon segment The Missing Chapter.
     No `drop`, so it is open the moment the wall goes live: the caption tells people
     to read it before they arrive, and a padlock would defeat the point. */
  { key: "story",        name: "The Medallion Club Story",    icon: "\u{1F4D6}", kind: "images" }
];

/* These are the two times CLAUDE.md and the spec both give. August in Ohio is
   EDT, so both stamps are anchored at -04:00 and the device's own zone never
   enters into it.
   NOT yet confirmed in writing by the organizers. ROADMAP records that gate as
   passed on August 5 with no confirmation received, and T4.5 is the task that
   closes it. If either time moves, it is these two constants and nothing else.
   The override buttons cover the drift on the day either way. */
const VAULT_DROP_SCHEDULE = {
  scenarios: Date.parse("2026-08-26T09:30:00-04:00"),
  personas:  Date.parse("2026-08-27T10:30:00-04:00")
};

/* If the server clock and the override state have not both arrived inside this
   window, stop waiting and run on what this device has, and say so. A section
   that never opens is a worse failure in front of the room than one that opens
   on a phone's own clock. */
const VAULT_GRACE_MS = 8000;

/* Empty state copy, per section. No artwork has been delivered for any of the
   four image sections, so these are the words an attendee reads. They say the
   shelf is empty rather than pretending something is loading forever. */
const VAULT_EMPTY = {
  fundamentals: "Empty shelf. The Core Fundamentals artwork has not turned up yet.",
  buckets:      "Empty shelf. Tyler is sending the Invitation Sources artwork.",
  /* Unreachable while scenarios renders as personas. Kept because it is the copy
     that ships the moment that section goes back to being artwork. */
  scenarios:    "Open and empty. The scenarios have not turned up yet.",
  personas:     "Open and empty. The personas have not turned up yet."
};

/* The types every club is meant to have. A club missing one gets a "not in the
   pack" card rather than a broken image. Anything else in graphs.json renders
   after these.

   Jim, Aug 13 2026: Dues and Palmer are off the wall entirely, so they are no
   longer generated and no longer listed here. Rates is now labelled
   Sales/Attrition, which is what the chart has always plotted: the workbook's only
   two named series across all 95 charts are "Sales" and "Attrition".

   The KEY stays `rates`. It is the filename on 27 SVGs and the child name in
   data/graphs.json. Only the label changed. Renaming keys to match labels is how
   you break every stored path at once. */
const VAULT_GRAPH_TYPES = ["members", "rates"];

const VAULT_GRAPH_LABELS = {
  members: "Members", rates: "Sales/Attrition", other: "Other"
};

const VAULT_LS = { section: "mm26_vaultsection", club: "mm26_vaultclub" };

/* Inlined SVG text, keyed by path. Switching back to a club you already looked
   at is then instant instead of three more requests. */
const VAULT_SVG_CACHE = {};

/* ---------------------------------------------------------------- helpers */

/* Plain language, always Eastern, whatever the phone thinks. "Wednesday,
   August 26, 9:30 AM Eastern". */
function vaultWhen(ms) {
  try {
    const day = new Intl.DateTimeFormat("en-US", {
      timeZone: ET, weekday: "long", month: "long", day: "numeric"
    }).format(ms);
    const t = etParts(ms);
    return day + ", " + t.hhmm + " " + t.ap + " Eastern";
  } catch (e) {
    return new Date(ms).toString();
  }
}

/* Days out early in the week, h:mm:ss inside a day, m:ss inside an hour. */
function vaultCountdownText(ms) {
  if (ms <= 0) return "0:00";
  const t = breakdown(ms);
  if (t.days > 0) {
    return t.days + (t.days === 1 ? " day " : " days ")
      + pad(t.hours) + ":" + pad(t.minutes) + ":" + pad(t.seconds);
  }
  return clock(ms);
}

/* Crew readout. How far off this device's own clock is, in words, so the six
   hour test is a sentence somebody can read out rather than a number to
   subtract. `now` is already corrected, so the gap is the correction. */
function vaultClockLine(now) {
  const secs = Math.round((now - Date.now()) / 1000);
  const a = Math.abs(secs);
  if (a < 5) return "This device agrees with the server, inside five seconds.";
  const d = Math.floor(a / 86400);
  const h = Math.floor((a % 86400) / 3600);
  const m = Math.floor((a % 3600) / 60);
  const s = a % 60;
  const parts = [];
  if (d) parts.push(d + (d === 1 ? " day" : " days"));
  if (h) parts.push(h + (h === 1 ? " hour" : " hours"));
  if (m) parts.push(m + (m === 1 ? " minute" : " minutes"));
  if (!d && !h && s) parts.push(s + (s === 1 ? " second" : " seconds"));
  return "This device's own clock runs " + parts.join(" ")
    + (secs > 0 ? " slow." : " fast.")
    + " The wall is using the server clock.";
}

/* Search normaliser. Strips case, spaces, and punctuation, so "eagles",
   "pga west", "pgawest" and "toledo cc" all find their club. */
function vaultNorm(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function vaultMatch(entry, query) {
  const q = vaultNorm(query);
  if (!q) return true;
  return vaultNorm(entry.name).indexOf(q) >= 0 || vaultNorm(entry.slug).indexOf(q) >= 0;
}

/* The three canonical types first, present or not, then anything else the file
   carries for this club. */
function vaultGraphSlots(club) {
  const have = (club && club.graphs) || {};
  /* Year by year numbers for the graphs that have more than one line, which is
     every Sales/Attrition chart. Jim, Aug 13: the percentages were missing. */
  const tables = (club && club.tables) || {};
  const slots = VAULT_GRAPH_TYPES.map((key) => ({
    key: key, label: VAULT_GRAPH_LABELS[key] || key,
    file: have[key] || null, table: tables[key] || null
  }));

  Object.keys(have).forEach((key) => {
    if (VAULT_GRAPH_TYPES.indexOf(key) >= 0) return;
    slots.push({
      key: key,
      label: VAULT_GRAPH_LABELS[key] || (key.charAt(0).toUpperCase() + key.slice(1)),
      file: have[key],
      table: tables[key] || null
    });
  });

  return slots;
}

/* These SVGs are generated by tools/ in this repo, so this is not a sanitiser
   fighting hostile input. It drops the XML prolog, any script, any comment, and
   any inline handler, because injecting markup by hand deserves at least that
   much. */
function vaultCleanSvg(text) {
  const at = text.indexOf("<svg");
  const body = at > 0 ? text.slice(at) : text;
  return body
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<!--[\s\S]*?-->/g, "")
    .replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, "")
    .replace(/\son[a-z]+\s*=\s*'[^']*'/gi, "");
}

/* Server stamp, not a device stamp. "Last changed" on a clock sensitive
   feature must not come off a crew phone that is six hours out. */
function vaultStampValue() {
  try {
    if (window.firebase && firebase.database && firebase.database.ServerValue) {
      return firebase.database.ServerValue.TIMESTAMP;
    }
  } catch (e) { /* fall through to null */ }
  return null;
}

function vaultWriteDrop(sectionKey, patch) {
  if (!FB.ok) return;
  const body = Object.assign({}, patch);
  const stamp = vaultStampValue();
  if (stamp !== null) body.ts = stamp;
  /* update, not set, so the two sections and the fields inside one section
     never clobber each other. A null value removes that child. */
  FB.db.ref("settings/vaultDrops/" + sectionKey).update(body);
}

/* Normalise whatever is at settings/vaultDrops/{section} into one shape.
   Missing, unreadable, or unrecognised all mean "scheduled", which is the safe
   direction: the schedule stays in force. */
function vaultDropState(node, scheduledAt) {
  let mode = "scheduled";
  let at = scheduledAt;
  let ts = 0;

  if (typeof node === "string") {
    mode = node;
  } else if (node && typeof node === "object") {
    if (typeof node.mode === "string") mode = node.mode;
    if (typeof node.unlockAt === "number" && isFinite(node.unlockAt)) at = node.unlockAt;
    if (typeof node.ts === "number") ts = node.ts;
  }

  if (mode !== "open" && mode !== "shut") mode = "scheduled";

  return {
    mode: mode,
    at: at,
    scheduledAt: scheduledAt,
    isTestTime: at !== scheduledAt,
    ts: ts
  };
}

/* The one decision the whole feature turns on. The override wins in both
   directions and does not wait for the clock. Only the scheduled branch needs
   a clock it can trust. */
function vaultRoomSees(st, now, ready) {
  if (st.mode === "open") return true;
  if (st.mode === "shut") return false;
  if (!ready) return false;
  return now >= st.at;
}

function vaultClampScale(s) {
  if (!isFinite(s)) return 1;
  return Math.min(6, Math.max(1, s));
}

function vaultTouchGap(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

/* ------------------------------------------------------------------ hooks */

/* One static JSON file. Same shape of state as useAgenda, so a failed fetch is
   a sentence on screen and not a blank tab. */
function useVaultJSON(path) {
  const [state, setState] = useState({ status: "loading", data: null, reason: "" });

  useEffect(() => {
    let live = true;
    fetch(path, { cache: "no-cache" })
      .then((res) => {
        if (!res.ok) throw new Error("The file returned " + res.status + ".");
        return res.json();
      })
      .then((data) => { if (live) setState({ status: "ready", data: data, reason: "" }); })
      .catch((err) => {
        if (live) {
          setState({
            status: "failed", data: null,
            reason: (err && err.message) || String(err)
          });
        }
      });
    return () => { live = false; };
  }, [path]);

  return state;
}

/* Fetch an SVG and hand back its markup so it can be inlined and pick up the
   wall's fonts. Any failure returns status "img", and the caller falls back to
   an img tag. That is the file:// case and the offline case both covered. */
function useVaultInlineSvg(src) {
  const [state, setState] = useState({ status: "idle", markup: "", src: "" });

  useEffect(() => {
    if (!src) { setState({ status: "idle", markup: "", src: "" }); return; }

    if (VAULT_SVG_CACHE[src]) {
      setState({ status: "ready", markup: VAULT_SVG_CACHE[src], src: src });
      return;
    }

    let live = true;
    setState({ status: "loading", markup: "", src: src });

    fetch(src)
      .then((res) => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then((text) => {
        if (text.indexOf("<svg") < 0) throw new Error("Not an SVG.");
        const clean = vaultCleanSvg(text);
        VAULT_SVG_CACHE[src] = clean;
        if (live) setState({ status: "ready", markup: clean, src: src });
      })
      .catch(() => {
        if (live) setState({ status: "img", markup: "", src: src });
      });

    return () => { live = false; };
  }, [src]);

  return state;
}

/* One listener for both sections. Three scalars each, nothing confidential, so
   it is safe to listen to whether or not the viewer is crew. `loaded` matters:
   until the snapshot arrives the wall does not know whether a section has been
   held shut, so a timed section stays locked. Without that, a phone opening the
   wall at 9:35 on Wednesday would flash the content for a moment even though
   crew had held it shut because the session was running late. */
function useVaultDrops() {
  const [state, setState] = useState({ node: null, loaded: false });

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("settings/vaultDrops");
    const handler = (snap) => setState({ node: snap.val() || {}, loaded: true });
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return state;
}

/* Can this device's clock be trusted for a drop decision.

   useServerNow already corrects `now` against .info/serverTimeOffset. What it
   cannot tell a caller is whether that correction is real or still zero,
   because the offset reads zero both when the device is right and when nothing
   has been heard from the server yet. .info/connected answers that: it goes
   true only after a handshake, and the handshake is where the offset comes
   from. The extra quarter second is there so the offset has certainly landed in
   App's state before this says yes, rather than resting on the order two
   internal listeners happen to fire in. */
function useVaultClock() {
  const [connected, setConnected] = useState(false);
  const [settled, setSettled] = useState(false);
  const [graced, setGraced] = useState(false);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref(".info/connected");
    const handler = (snap) => { if (snap.val() === true) setConnected(true); };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  useEffect(() => {
    if (!connected) return;
    const id = window.setTimeout(() => setSettled(true), 250);
    return () => window.clearTimeout(id);
  }, [connected]);

  useEffect(() => {
    const id = window.setTimeout(() => setGraced(true), VAULT_GRACE_MS);
    return () => window.clearTimeout(id);
  }, []);

  /* The clock override is a deliberate lie for testing and the App already
     says so on screen, so it counts as trusted. */
  if (SIM_CLOCK !== null) return { trusted: true, graced: graced, source: "override" };
  if (!FB.ok) return { trusted: true, graced: graced, source: "device" };
  if (connected && settled) return { trusted: true, graced: graced, source: "server" };
  if (graced) return { trusted: true, graced: true, source: "device" };
  return { trusted: false, graced: false, source: "waiting" };
}

/* ------------------------------------------------------------- components */

/* Full screen zoom. Pinch with two fingers, drag with one, double tap to snap
   back, and buttons for a laptop with no touchscreen.

   touch-action: none on the stage is what makes the pinch work: it stops the
   browser claiming the gesture, which also means no preventDefault is needed.
   React registers touchmove as a passive listener, so preventDefault would
   have done nothing anyway. */
function VaultZoom({ view, onClose }) {
  const [z, setZ] = useState({ s: 1, x: 0, y: 0 });
  const pinch = useRef(null);
  const drag = useRef(null);
  const lastTap = useRef(0);

  useEffect(() => { setZ({ s: 1, x: 0, y: 0 }); }, [view.src]);

  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  function bump(mult) {
    setZ((p) => {
      const s = vaultClampScale(p.s * mult);
      return s <= 1 ? { s: 1, x: 0, y: 0 } : { s: s, x: p.x, y: p.y };
    });
  }

  function onTouchStart(e) {
    const t = e.touches;
    if (t.length >= 2) {
      pinch.current = { gap: vaultTouchGap(t), s: z.s };
      drag.current = null;
    } else if (t.length === 1) {
      pinch.current = null;
      drag.current = { px: t[0].clientX, py: t[0].clientY, x: z.x, y: z.y };
    }
  }

  function onTouchMove(e) {
    const t = e.touches;
    if (t.length >= 2 && pinch.current && pinch.current.gap > 0) {
      const gap = vaultTouchGap(t);
      const s = vaultClampScale(pinch.current.s * (gap / pinch.current.gap));
      setZ((p) => ({ s: s, x: p.x, y: p.y }));
    } else if (t.length === 1 && drag.current) {
      const d = drag.current;
      setZ((p) => ({
        s: p.s,
        x: d.x + (t[0].clientX - d.px),
        y: d.y + (t[0].clientY - d.py)
      }));
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length > 0) return;
    pinch.current = null;
    drag.current = null;

    /* performance.now(), because this is elapsed input timing rather than an
       event clock. Nothing in the Vault reads Date.now() for a decision about
       when something happens. */
    const t = window.performance && window.performance.now
      ? window.performance.now() : 0;

    if (t && lastTap.current && t - lastTap.current < 320) {
      lastTap.current = 0;
      setZ((p) => (p.s > 1.05 ? { s: 1, x: 0, y: 0 } : { s: 2.5, x: 0, y: 0 }));
    } else {
      lastTap.current = t;
    }
  }

  function onMouseDown(e) {
    if (z.s <= 1.01) return;
    drag.current = { px: e.clientX, py: e.clientY, x: z.x, y: z.y };
  }

  function onMouseMove(e) {
    if (!drag.current || e.buttons === 0) return;
    const d = drag.current;
    setZ((p) => ({ s: p.s, x: d.x + (e.clientX - d.px), y: d.y + (e.clientY - d.py) }));
  }

  function endDrag() { drag.current = null; }

  return (
    <div className="vt-zoom" role="dialog" aria-modal="true" aria-label={view.title}>
      <div className="vt-zoom__bar">
        <p className="vt-zoom__t">{view.title}</p>
        <button type="button" className="btn btn--tiny" onClick={() => bump(1 / 1.4)}
                aria-label="Zoom out">{"−"}</button>
        <button type="button" className="btn btn--tiny"
                onClick={() => setZ({ s: 1, x: 0, y: 0 })}>Fit</button>
        <button type="button" className="btn btn--tiny" onClick={() => bump(1.4)}
                aria-label="Zoom in">{"+"}</button>
        <a className="btn btn--tiny" href={view.src} download={view.download || ""}>
          Download
        </a>
        <button type="button" className="btn btn--tiny btn--go" onClick={onClose}>
          Close
        </button>
      </div>

      <div
        className="vt-zoom__stage"
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onTouchCancel={onTouchEnd}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={endDrag}
        onMouseLeave={endDrag}
      >
        <div
          className="vt-zoom__inner"
          style={{
            transform: "translate(" + z.x + "px, " + z.y + "px) scale(" + z.s + ")"
          }}
        >
          {view.markup ? (
            <div className="vt-svg" dangerouslySetInnerHTML={{ __html: view.markup }} />
          ) : (
            <img src={view.src} alt={view.title} />
          )}
        </div>
      </div>

      <p className="vt-zoom__foot">
        Pinch to zoom. Drag to move. Double tap to snap back.
      </p>
    </div>
  );
}

/* One picture plus its two chips. Shared by the graph cards and the artwork
   cards, so zoom and download behave identically everywhere. */
function VaultArt({ src, title, download, onZoom }) {
  const wantsInline = /\.svg(\?|$)/i.test(src);
  const svg = useVaultInlineSvg(wantsInline ? src : null);
  const inline = svg.status === "ready" && svg.src === src;

  return (
    <div>
      <div className="vt-art">
        {inline ? (
          <div className="vt-svg" dangerouslySetInnerHTML={{ __html: svg.markup }} />
        ) : svg.status === "loading" ? (
          <p className="vt-card__none">Loading.</p>
        ) : (
          <img className="vt-img" src={src} alt={title} loading="lazy" />
        )}
      </div>

      <div className="chiprow">
        <button
          type="button"
          className="linkchip"
          onClick={() => onZoom({
            title: title, src: src, download: download,
            markup: inline ? svg.markup : null
          })}
        >
          <span className="linkchip__i" aria-hidden="true">{"\u{1F50D}"}</span>
          <span>Bigger</span>
        </button>
        <a className="linkchip" href={src} download={download}>
          <span className="linkchip__i" aria-hidden="true">{"↓"}</span>
          <span>Download</span>
        </a>
      </div>
    </div>
  );
}

/* One graph type for one club. A type this club does not have is a dashed card
   that says so, never a broken image. */
function VaultGraphCard({ club, slot, onZoom }) {
  if (!slot.file) {
    return (
      <div className="vt-card--none">
        <p className="vt-card__k t-display">{slot.label}</p>
        <p className="vt-card__none">Not in the pack for this club. Nothing to show.</p>
      </div>
    );
  }

  return (
    <figure className="vt-card glow-card grille">
      <figcaption className="vt-card__k t-display">{slot.label}</figcaption>
      <VaultArt
        src={"assets/graphs/" + slot.file}
        title={club.name + ", " + slot.label}
        download={slot.file}
        onZoom={onZoom}
      />
      {/* The numbers behind the lines. The chart itself now prints each series'
          latest value beside the legend, which answers "where are we", and this
          answers "what happened". Twelve years times two series is twenty four
          labels, which is unreadable on a 380px plot, so they live here as a real
          table that reflows and that a screen reader can read out. */}
      {slot.table && slot.table.rows && slot.table.rows.length ? (
        <table className="vt-tbl">
          <caption className="vt-tbl__cap">Year by year</caption>
          <thead>
            <tr>
              {slot.table.columns.map((c) => <th key={c} scope="col">{c}</th>)}
            </tr>
          </thead>
          <tbody>
            {slot.table.rows.map((row) => (
              <tr key={row[0]}>
                {row.map((cell, i) => (
                  i === 0
                    ? <th key={i} scope="row" className="t-data">{cell}</th>
                    : <td key={i} className="t-data">{cell}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      ) : null}
    </figure>
  );
}

/* T2.2. Search, then one club's graphs. Never a stack of everyone's. */
function VaultGraphPicker({ onZoom }) {
  const file = useVaultJSON("data/graphs.json");
  const [query, setQuery] = useState("");
  const [slug, setSlug] = useState(() => readLS(VAULT_LS.club) || "");
  const [browse, setBrowse] = useState(false);

  const clubs = (file.data && file.data.clubs) || [];
  const rollups = (file.data && file.data.rollups) || [];
  const all = clubs.concat(rollups);
  const club = all.filter((c) => c.slug === slug)[0] || null;

  const pick = useCallback((next) => {
    setSlug(next);
    writeLS(VAULT_LS.club, next);
    setQuery("");
    setBrowse(false);
  }, []);

  if (file.status === "loading") return <Empty>Finding the graphs.</Empty>;

  if (file.status === "failed") {
    return (
      <Empty>
        The graph index did not load. {file.reason} Everything else on the wall
        still works.
      </Empty>
    );
  }

  if (!all.length) {
    return <Empty>No graphs in the index yet. Nothing to pick from.</Empty>;
  }

  /* The list is open until a club is chosen, and it comes back the moment
     somebody types or asks for it. Leaving 31 rows above the graphs would push
     the graphs off a phone screen. */
  const listOpen = !club || query.length > 0 || browse;
  const hits = all.filter((c) => vaultMatch(c, query));
  const clubHits = hits.filter((c) => rollups.indexOf(c) < 0);
  const rollupHits = hits.filter((c) => rollups.indexOf(c) >= 0);

  function row(c) {
    const have = vaultGraphSlots(c).filter((s) => s.file).map((s) => s.label);
    return (
      <button
        type="button"
        key={c.slug}
        className="vt-club"
        onClick={() => pick(c.slug)}
      >
        <span className="vt-club__n">{c.name}</span>
        <span className="vt-club__have">{have.length ? have.join(", ") : "Nothing yet"}</span>
      </button>
    );
  }

  return (
    <div>
      <label className="tf__l vt-search">
        <span>Find a club</span>
        <input
          className="tf__in"
          type="search"
          value={query}
          placeholder="Type part of the name"
          onChange={(e) => setQuery(e.target.value)}
        />
      </label>

      {club && !listOpen ? (
        <div className="vt-chosen">
          <h4 className="vt-chosen__n t-display">{club.name}</h4>
          <button type="button" className="btn btn--quiet" onClick={() => setBrowse(true)}>
            Change club
          </button>
        </div>
      ) : null}

      {listOpen ? (
        <div>
          {clubHits.length ? (
            <div>
              <p className="vt-group">Clubs</p>
              <div className="vt-clublist">{clubHits.map(row)}</div>
            </div>
          ) : null}

          {rollupHits.length ? (
            <div>
              <p className="vt-group">Rollups</p>
              <div className="vt-clublist">{rollupHits.map(row)}</div>
            </div>
          ) : null}

          {!hits.length ? (
            <Empty>No club by that name. Check the spelling and try less of it.</Empty>
          ) : null}
        </div>
      ) : null}

      {club && !listOpen ? (
        <div className="vt-cards">
          {vaultGraphSlots(club).map((slot) => (
            <VaultGraphCard key={slot.key} club={club} slot={slot} onZoom={onZoom} />
          ))}
        </div>
      ) : null}
    </div>
  );
}

/* An artwork section, driven by data/vault.json. Empty today for all four,
   because nothing has been delivered. T3.3 adds entries and touches no code. */
function VaultImageSection({ section, manifest, onZoom }) {
  if (manifest.status === "loading") return <Empty>Checking the shelf.</Empty>;

  if (manifest.status === "failed") {
    return (
      <Empty>
        The vault index did not load. {manifest.reason} Everything else on the
        wall still works.
      </Empty>
    );
  }

  const data = manifest.data || {};
  const dir = String(data.dir || "assets/resources").replace(/\/+$/, "");
  const sec = (data.sections && data.sections[section.key]) || null;
  const items = (sec && sec.items) || [];

  const doc = sec && sec.document;
  const links = (sec && sec.links) || [];
  const caption = (sec && sec.caption) || [];

  if (!items.length && !doc && !links.length) {
    return <Empty>{VAULT_EMPTY[section.key] || "Nothing here yet."}</Empty>;
  }

  /* The client's own words, printed as sent. Sits above everything else, because it
     is the reason somebody opens the section at all. */
  const captionRows = caption.length ? (
    <div className="vt-cap">
      {caption.map((t, i) => <p className="vt-cap__p" key={i}>{t}</p>)}
    </div>
  ) : null;

  /* Somebody else's site, so `rel` is not optional and the button says out loud
     that it leaves the wall. Nothing is mirrored into the repo, which means the club
     can publish a new version of its own booklet without a commit here. */
  const linkRows = links.length ? (
    <div className="vt-links">
      {links.map((l, i) => (
        <div className="vt-link" key={l.url || i}>
          <a className="btn btn--go vt-link__a"
             href={l.url}
             target="_blank" rel="noopener noreferrer">
            {"\u2197"} {l.label || "Open the link"}
          </a>
          {l.note ? <p className="vt-link__n">{l.note}</p> : null}
        </div>
      ))}
    </div>
  ) : null;

  /* The original document the pages came from, offered whole. Rendered above the
     pages so somebody who just wants the file does not scroll 28 images to find
     it. `download` is deliberately NOT set: on a phone, opening the PDF in the
     native viewer is the useful thing, and iOS ignores the download attribute on
     a cross-document link anyway. Long press still saves it. */
  const docRow = doc ? (
    <div className="vt-doc">
      <a className="btn btn--go vt-doc__a"
         href={dir + "/" + doc.file}
         target="_blank" rel="noopener noreferrer">
        {"↓"} {doc.label || "Download the PDF"}
      </a>
      {doc.note ? <p className="vt-doc__n">{doc.note}</p> : null}
    </div>
  ) : null;

  /* A document split into page images. One continuous flow, no card chrome and no
     per page title, because "Page 7" over every image is noise when you are
     reading a booklet. Tap any page to open it in the same zoom viewer the rest of
     the Vault uses. Lazy loading matters here: 28 pages is 4.4MB and almost nobody
     reads to the end, so pages are paid for as they are reached. */
  if (sec && sec.layout === "pages") {
    return (
      <div className="vt-pages">
        {captionRows}
        {linkRows}
        {docRow}
        {items.map((item, i) => {
          const src = dir + "/" + item.file;
          const title = item.title || item.file;
          return (
            <button
              type="button"
              className="vt-page"
              key={item.file || i}
              onClick={() => onZoom({ title: title, src: src, download: item.file })}
            >
              <img src={src} alt={title} loading="lazy" decoding="async" />
              <span className="sr-only">{title}, open bigger</span>
            </button>
          );
        })}
      </div>
    );
  }

  return (
    <div className="vt-cards">
      {captionRows}
      {linkRows}
      {docRow}
      {items.map((item, i) => {
        const title = item.title || item.file;
        return (
          <figure className="vt-card glow-card grille" key={item.file || i}>
            <figcaption className="vt-card__k t-display">{title}</figcaption>
            {item.note ? <p className="vt-card__note">{item.note}</p> : null}
            <VaultArt
              src={dir + "/" + item.file}
              title={title}
              download={item.file}
              onZoom={onZoom}
            />
          </figure>
        );
      })}
    </div>
  );
}

/* The six invitation source personas, from data/personas.json.

   TEXT, not page images. The booklet next door is rendered as pictures of pages
   because it is a designed document and its layout is the point. This is prose
   somebody reads on a phone in a breakout room and then argues about, so it wants
   to reflow, scale with the reader's own type size, and be selectable. A picture of
   a paragraph does none of that.

   The client's wording is reproduced exactly, em-dashes and all. The no-em-dash
   rule is for copy we write. */
function useJsonFile(path) {
  const [state, setState] = useState({ status: "loading", data: null, reason: "" });
  useEffect(() => {
    let alive = true;
    fetch(path, { cache: "no-cache" })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then((d) => { if (alive) setState({ status: "ready", data: d, reason: "" }); })
      .catch((e) => {
        if (alive) setState({ status: "failed", data: null, reason: String(e.message || e) });
      });
    return () => { alive = false; };
  }, [path]);
  return state;
}

/* What an attendee sees on a section that has not opened. Greyed, padlocked,
   the time in plain language, and a countdown that moves. It does not repeat
   the section name: the heading directly above it already says it. */
function VaultLocked({ st, now, trusted, clockNote }) {

  return (
    <div className="vt-locked glow-card grille">
      <p className="vt-locked__lock" aria-hidden="true">{"\u{1F512}"}</p>

/* One section's crew controls. Which state is in force, what the room is
   seeing, and the override in both directions. */
function VaultDropRow({ section, st, roomSees, now, trusted }) {
  const label = st.mode === "open" ? "Forced open"
    : st.mode === "shut" ? "Forced shut"
    : "Scheduled";

  return (
    <div className="vt-drop">
      <div className="vt-drop__top">
        <p className="vt-drop__n">{section.name}</p>
        <span className={"vt-state vt-state--" + st.mode}>{label}</span>
      </div>

      <p className="vt-drop__room">
        {roomSees
          ? "The room sees it."
          : st.mode === "shut"
            ? "The room sees a padlock and no countdown."
            : "The room sees a padlock and a countdown."}
      </p>

      <p className="vt-drop__at">
        {st.mode !== "scheduled"
          ? "The schedule says " + vaultWhen(st.scheduledAt)
            + ". The override is what counts right now."
          : !trusted
            ? "Opens " + vaultWhen(st.at) + ". Clock not confirmed yet."
            : now >= st.at
              ? "Opened " + vaultWhen(st.at) + ", on the schedule."
              : "Opens " + vaultWhen(st.at) + ". "
                + vaultCountdownText(st.at - now) + " to go."}
      </p>

      {st.isTestTime ? (
        <p className="vt-drop__warn">
          Test time in force. The room is being told {vaultWhen(st.at)}. The real
          time is {vaultWhen(st.scheduledAt)}. Restore it before anybody reads it
          as the truth.
        </p>
      ) : null}

      <div className="tf__row">
        <button
          type="button"
          className="btn btn--go"
          disabled={!FB.ok || st.mode === "open"}
          onClick={() => vaultWriteDrop(section.drop, { mode: "open" })}
        >
          Open it now
        </button>
        <button
          type="button"
          className="btn btn--kill"
          disabled={!FB.ok || st.mode === "shut"}
          onClick={() => vaultWriteDrop(section.drop, { mode: "shut" })}
        >
          Hold it shut
        </button>
        <button
          type="button"
          className="btn"
          disabled={!FB.ok || st.mode === "scheduled"}
          onClick={() => vaultWriteDrop(section.drop, { mode: "scheduled" })}
        >
          Back to the schedule
        </button>
      </div>

      <div className="tf__row">
        <button
          type="button"
          className="btn btn--tiny"
          disabled={!FB.ok}
          onClick={() => vaultWriteDrop(section.drop, {
            mode: "scheduled", unlockAt: now + 2 * 60 * 1000
          })}
        >
          Test, 2 minutes out
        </button>
        <button
          type="button"
          className="btn btn--tiny"
          disabled={!FB.ok}
          onClick={() => vaultWriteDrop(section.drop, {
            mode: "scheduled", unlockAt: now + 5 * 60 * 1000
          })}
        >
          Test, 5 minutes out
        </button>
        <button
          type="button"
          className="btn btn--tiny btn--quiet"
          disabled={!FB.ok || !st.isTestTime}

          Restore the real time
        </button>
      </div>

      {st.ts ? (
        <p className="vt-drop__ts">
          Last changed {etParts(st.ts).hhmm} {etParts(st.ts).ap} Eastern.
        </p>
      ) : null}
    </div>
  );
}

/* The crew block. Both sections in one place at the top of the tab, because

function VaultSectionNav({ active, onPick, locked }) {
  return (

function VaultTab({ isAdmin, now }) {
  const manifest = useVaultJSON("data/vault.json");
  const drops = useVaultDrops();
  const clock = useVaultClock();
  const [zoom, setZoom] = useState(null);
  const [active, setActive] = useState(() => {
    const held = readLS(VAULT_LS.section);
    return VAULT_SECTIONS.filter((s) => s.key === held).length
      ? held : VAULT_SECTIONS[0].key;
  });

  const pick = useCallback((key) => {
    setActive(key);
    writeLS(VAULT_LS.section, key);
  }, []);

  const onZoom = useCallback((view) => setZoom(view), []);
  const closeZoom = useCallback(() => setZoom(null), []);

  /* Ready means this device can be trusted to decide. The clock has to be
     trusted and the override state has to have arrived. If neither happens
     inside the grace window, go anyway on what is here, because a section that
     never opens is the worse failure. */
  const ready = (clock.trusted && drops.loaded) || clock.graced || !FB.ok;

  const states = {};
  const seen = {};
  VAULT_SECTIONS.forEach((s) => {
    if (!s.drop) return;
    const st = vaultDropState(
      drops.node ? drops.node[s.drop] : null,
      VAULT_DROP_SCHEDULE[s.drop]
    );
    states[s.drop] = st;
    seen[s.drop] = vaultRoomSees(st, now, ready);
  });

  const locked = {};
  Object.keys(seen).forEach((k) => { locked[k] = !seen[k]; });

  const section = VAULT_SECTIONS.filter((s) => s.key === active)[0] || VAULT_SECTIONS[0];
  const st = section.drop ? states[section.drop] : null;
  const roomSees = section.drop ? seen[section.drop] : true;
  const canSee = roomSees || isAdmin;

  const clockNote = clock.source === "device"
    ? "Could not reach the server clock, so this countdown is running on this phone's own clock."
    : "";

  return (
    <TabFrame tabKey="vault">
      {isAdmin ? (
        <VaultDropControls states={states} seen={seen} now={now} clock={clock} />
      ) : null}

      <div className="vt">
        <VaultSectionNav active={active} onPick={pick} locked={locked} />

        <div className="vt-body" id="vt-panel" role="tabpanel"
             aria-labelledby={"vt-tab-" + section.key}>
          <h3 className="vt-h t-display">{section.name}</h3>

          {section.drop && isAdmin && !roomSees ? (
            <p className="vt-badge">
              {"\u{1F512}"} The room cannot see this yet
            </p>
          ) : null}

          {!canSee ? (
            <VaultLocked
              st={st}
              now={now}
              trusted={ready}
              clockNote={clockNote}
            />
          ) : section.kind === "graphs" ? (
            <VaultGraphPicker onZoom={onZoom} />
          ) : section.kind === "personas" ? (
            <VaultPersonas />
          ) : (
            <VaultImageSection section={section} manifest={manifest} onZoom={onZoom} />
          )}
        </div>
      </div>

      {zoom ? <VaultZoom view={zoom} onClose={closeZoom} /> : null}

      <BuildNote isAdmin={isAdmin} task="T2.1 to T2.3">
        Drops live at settings/vaultDrops/scenarios and /personas. Scheduled,
        forced open, or forced shut, and the override beats the clock both ways.
        Lock state is derived from the server corrected clock on every tick, so
        it fires with no refresh. A section stays shut until this device has
        talked to the server and the override state has arrived, with an eight
        second grace before it gives up and uses this phone's clock. Artwork
        comes from data/vault.json, which is empty for all four image sections
        until T3.3. Graphs come from data/graphs.json, 29 clubs and 2 rollups.
        The two unlock times are not yet confirmed in writing. T4.5 closes that.
        Membership Buckets reads Invitation Sources since Aug 12, per Lisa. The
        key in data/vault.json is still buckets, so drop Tyler's files there.
      </BuildNote>
    </TabFrame>
  );
}

/* ==========================================================================
   T1.5 LINER NOTES. Spec 3.6.
   Three day pills, a post panel, cards newest first, pinned on top with a
   scarlet left border, and a Markdown export that is meant to be pasted
   straight into the follow up note. Last year's equivalent became the raw
   material for that communication, so the export is the point of the tab and
   not a bolt on.

   Every clock decision reads the server corrected `now` handed down from
   useServerNow. Nothing in here calls Date.now(). Somebody posting at 11:50 PM
   on a phone still set to Pacific has to land on the right meeting day.
   ========================================================================== */

const LN_MAX = 300;
const LN_NAME_MAX = 40;
const LN_CLUB_MAX = 60;

/* Who is typing, so a second takeaway does not mean typing the name again.
   Cleared by Clear This Device in T1.6 along with every other mm26_ key. */
const LN_WHO_KEY = "mm26_liner_who";

/* Mirrors the dates in data/agenda.json. Held here rather than fetched, because
   the day tag has to work even when that file does not load. A takeaway with no
   day is a takeaway that never reaches the recap. */
const LN_DAYS = [
  { key: "tue", date: "2026-08-25" },
  { key: "wed", date: "2026-08-26" },
  { key: "thu", date: "2026-08-27" },
  { key: "fri", date: "2026-08-28" }
];

/* `tag` is the chip on a card. `head` is the Markdown heading. `order` is the
   order the export walks, which is the order the meeting happened in. */
const LN_DAY_META = {
  pre:     { tag: "Pre",    name: "Before the show", head: "Before the meeting",   order: 0 },
  tue:     { tag: "Tue",    name: "Tuesday",         head: "Tuesday, August 25",   order: 1 },
  wed:     { tag: "Wed",    name: "Wednesday",       head: "Wednesday, August 26", order: 2 },
  thu:     { tag: "Thu",    name: "Thursday",        head: "Thursday, August 27",  order: 3 },
  fri:     { tag: "Fri",    name: "Friday",          head: "Friday, August 28",    order: 4 },
  post:    { tag: "After",  name: "After the show",  head: "After the meeting",    order: 5 },
  unknown: { tag: "No tag", name: "Untagged",        head: "Untagged",             order: 6 }
};

/* Three pills, per the roadmap. Wednesday and Thursday are the two days the
   sessions run, so they are the two anybody filters by. A takeaway posted on
   any other day still shows under All, which is where the tab opens. */
const LN_FILTERS = [
  { key: "all", kicker: "All",      name: "Everything", date: "" },
  { key: "wed", kicker: "Wed 8/26", name: "Wednesday",  date: "2026-08-26" },
  { key: "thu", kicker: "Thu 8/27", name: "Thursday",   date: "2026-08-27" }
];

/* Which meeting day a moment belongs to, off the corrected clock. */
function lnDayKey(ms) {
  const d = etDate(ms);
  const hit = LN_DAYS.filter((x) => x.date === d)[0];
  if (hit) return hit.key;
  return d < LN_DAYS[0].date ? "pre" : "post";
}

function lnMeta(key) { return LN_DAY_META[key] || LN_DAY_META.unknown; }

function lnCount(n) { return n + (n === 1 ? " takeaway" : " takeaways"); }

function lnEtFormat(ms, opts) {
  try {
    return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: ET }, opts)).format(ms);
  } catch (e) {
    return "";
  }
}

/* Full Eastern stamp. Sits in the title attribute of a card and in the export
   header, where the exact minute is worth having. */
function lnStamp(ms) {
  const t = etParts(ms);
  return lnEtFormat(ms, { month: "short", day: "numeric" }) +
    ", " + t.hhmm + " " + t.ap + " Eastern";
}

/* Relative time against the corrected clock. Anything older than a day prints
   the weekday and the time, because "yesterday" is ambiguous inside a meeting
   that runs four days. A negative span means this device is a moment behind the
   server, which reads as just now rather than as the future. The first minute
   is "Just now" so that the minute count can never print zero. */
function lnAgo(ts, now) {
  if (!ts) return "";
  const diff = now - ts;
  if (diff < 60 * 1000) return "Just now";
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return mins + " min ago";
  const hrs = Math.floor(diff / 3600000);
  if (hrs < 24) return hrs === 1 ? "1 hour ago" : hrs + " hours ago";
  if (diff < 7 * 86400000) {
    const t = etParts(ts);
    return lnEtFormat(ts, { weekday: "short" }) + ", " + t.hhmm + " " + t.ap;
  }
  return lnEtFormat(ts, { month: "short", day: "numeric" });
}

/* Server time when the server is reachable, which is what keeps ordering
   honest across a room full of phones. A device running the ?clock test hook
   writes its own simulated time instead, so a test post carries a day tag and a
   timestamp that agree with each other. */
function lnTs(corrected) {
  if (SIM_CLOCK !== null) return corrected;
  try {
    return firebase.database.ServerValue.TIMESTAMP;
  } catch (e) {
    return corrected;
  }
}

/* One listener for the whole node. Pinned first, then newest first. */
function useTakeaways() {
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(!FB.ok);

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("takeaways");
    const handler = (snap) => {
      const all = snap.val() || {};
      setItems(
        Object.keys(all)
          .map((id) => Object.assign({ id: id }, all[id]))
          .filter((t) => t && typeof t.text === "string" && t.text.trim())
      );
      setReady(true);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return { items: items, ready: ready };
}

function lnSort(items) {
  return items.slice().sort((a, b) => {
    const p = (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    return p !== 0 ? p : (b.ts || 0) - (a.ts || 0);
  });
}

/* ------------------------------------------------------- markdown export */

/* One bullet has to survive being pasted into a Markdown viewer. Line breaks
   collapse to spaces, and a leading character that would start a block gets
   escaped so a takeaway cannot turn itself into a heading or a table. */
function lnClean(text) {
  const one = String(text || "").replace(/\s+/g, " ").trim();
  return /^[#>\-*+|=]/.test(one) ? "\\" + one : one;
}

/* Attribution in parentheses. No em-dash, per the voice rules, and nothing at
   all when both fields are blank. */
function lnCredit(t) {
  const bits = [String(t.name || "").trim(), String(t.club || "").trim()].filter(Boolean);
  return bits.length ? " (" + bits.join(", ") + ")" : "";
}

/* The whole board, whatever the active filter is. A heading per day in the
   order the meeting happened, pinned first inside each day, then oldest first,
   because a recap reads forwards. */
function lnMarkdown(items, now) {
  const groups = {};
  items.forEach((t) => {
    const k = LN_DAY_META[t.day] ? t.day : "unknown";
    if (!groups[k]) groups[k] = [];
    groups[k].push(t);
  });

  const lines = [];
  lines.push("# Liner Notes");
  lines.push("");
  lines.push("Century Golf Partners 2026 Private Clubs Membership Meeting. Columbus, Ohio.");
  lines.push("");
  lines.push(lnCount(items.length) + " off the board. Exported " + lnStamp(now) + ".");

  Object.keys(groups)
    .sort((a, b) => lnMeta(a).order - lnMeta(b).order)
    .forEach((k) => {
      const day = groups[k].slice().sort((a, b) => {
        const p = (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
        return p !== 0 ? p : (a.ts || 0) - (b.ts || 0);
      });
      lines.push("");
      lines.push("## " + lnMeta(k).head);
      lines.push("");
      day.forEach((t) => {
        lines.push("- " + (t.pinned ? "**Pinned.** " : "") + lnClean(t.text) + lnCredit(t));
      });
    });

  lines.push("");
  return lines.join("\n");
}

/* Selection and execCommand, for the phones and the desktop browsers where the
   async clipboard is not available or refuses without a user gesture it likes. */
function lnCopyFallback(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

function lnCopy(text) {
  return new Promise((resolve) => {
    try {
      if (window.navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          () => resolve(true),
          () => resolve(lnCopyFallback(text))
        );
        return;
      }
    } catch (e) { /* fall through */ }
    resolve(lnCopyFallback(text));
  });
}

function lnDownload(filename, text) {
  try {
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) {
    return false;
  }
}

/* A status line that clears itself. The nonce is what makes the same message
   twice in a row still reset the timer. */
function useLnSaid() {
  const [said, setSaid] = useState(null);
  const nonce = useRef(0);

  useEffect(() => {
    if (!said) return;
    const id = window.setTimeout(() => setSaid(null), 8000);
    return () => window.clearTimeout(id);
  }, [said]);

  const say = useCallback((msg, bad) => {
    nonce.current += 1;
    setSaid({ n: nonce.current, msg: msg, bad: !!bad });
  }, []);

  return { said: said, say: say };
}

function LnForm({ dayKey, offline, onPost }) {

  const [club, setClub] = useState(() => String(readJSON(LN_WHO_KEY).club || ""));

  const left = LN_MAX - text.length;

  /* Firebase writes locally in the same tick and syncs after, so the card is on
     this screen before the server has heard about it. The box clears now rather
     than on the server acknowledgement, because a weak ballroom connection would
     otherwise leave somebody staring at a dead button. A rejection puts the
     words back and says what happened. Clearing the box is also what stops a
     double tap posting twice: the button disables itself the moment it is
     empty. */
  function submit(e) {

function LnExport({ items, now }) {
  const { said, say } = useLnSaid();
  const empty = !items.length;

  function copy() {
    const md = lnMarkdown(items, now);
    lnCopy(md).then((ok) => {
      if (ok) {
        say("Copied. " + lnCount(items.length) + ", ready to paste.");
      } else {
        say("The clipboard said no. Use Download instead.", true);
      }
    });
  }

  function save() {
    const filename = "liner-notes-" + etDate(now) + ".md";
    const ok = lnDownload(filename, lnMarkdown(items, now));
    if (ok) {
      say("Saved as " + filename + ".");
    } else {
      say("The download did not start. Use Copy instead.", true);
    }
  }

  return (
    <div className="adminbar ln-tools">
      <p className="adminbar__t">Export the board</p>
      <p className="adminbar__p">
        Markdown. A heading per day, one bullet per takeaway with attribution. The whole
        board, whichever pill is selected. Paste it straight into the follow up note.
      </p>
      <div className="tf__row ln-tools__row">
        <button className="btn btn--go" onClick={copy} disabled={empty}>Copy Markdown</button>
        <button className="btn" onClick={save} disabled={empty}>Download .md</button>
      </div>
      {empty ? <p className="adminbar__p ln-tools__row">Nothing on the board to export yet.</p> : null}
      {said ? (
        <p className={"ln-said" + (said.bad ? " ln-said--bad" : "")}>{said.msg}</p>
      ) : null}
    </div>
  );
}

  const nowRef = useRef(now);
  useEffect(() => { nowRef.current = now; }, [now]);
