const TAB_VIEWS = {
  setlist:    SetlistTab,
  band:       BandTab,
  backstage:  BackstageTab,
  soundcheck: SoundcheckTab,
  vault:      VaultTab,
  liner:      LinerNotesTab,
  vote:       CrowdVoteTab,
  pit:        PitTab,
  cares:      CaresCupTab,
  encore:     EncoreTab
};

function App() {
  const [entered, setEntered] = useState(() => readLS(LS.entered) === "1");
  const [active, setActive] = useState(TABS[0].key);
  const [displayMode, setDisplayMode] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [showPin, setShowPin] = useState(false);
  const [dismissed, setDismissed] = useState(null);
  /* Pulling the welcome screen back up does NOT clear mm26_entered. Somebody
     showing the QR to a colleague should not have their own state reset. */
  const [showWelcome, setShowWelcome] = useState(false);

  /* useServerNow also returns `synced` and `offset`. T2.3 needs them for the
     Vault drops. The welcome screen does not surface either one. */
  const { now, simulated } = useServerNow();
  const announcement = useAnnouncement();

  useEffect(() => {
    document.body.classList.toggle("display-mode", displayMode);
  }, [displayMode]);

  const enter = useCallback(() => {
    writeLS(LS.entered, "1");
    setEntered(true);
  }, []);

  const gear = useCallback(() => {
    if (isAdmin) { setIsAdmin(false); } else { setShowPin(true); }
  }, [isAdmin]);

  if (!entered) {
    return <Welcome onEnter={enter} now={now} />;
  }

  if (showWelcome) {
    return <Welcome onEnter={() => setShowWelcome(false)} now={now} returning />;
  }

  const tab = TAB_BY_KEY[active] || TABS[0];
  const TabView = TAB_VIEWS[tab.key];
  const liveAnnouncement =
    announcement && announcement.id !== dismissed ? announcement : null;

  return (
    <div>
      {/* Masthead on every page, per Lisa. Scrolls away. The controls and the
          tab bar below it stay stuck to the top. */}
      <Masthead />

      {/* Header and tab bar stick together. Two separate sticky elements both
          pinned to the top overlapped once the masthead scrolled off. */}
      <div className="stickytop">
      <header className="hdr">
        <div className="hdr__row">
          <BrandMark />
          <button
            className="iconbtn"
            onClick={() => setShowWelcome(true)}
            title="Pull up the QR code"
            aria-label="Show the QR code"
          >
            <QrGlyph />
          </button>
          <button
            className={"iconbtn" + (displayMode ? " iconbtn--on" : "")}
            onClick={() => setDisplayMode(!displayMode)}
            aria-pressed={displayMode}
            title="Display Mode, for the projector"
          >
            {"\u{1F4FA}"}
          </button>
          <button
            className={"iconbtn" + (isAdmin ? " iconbtn--on" : "")}
            onClick={gear}
            aria-pressed={isAdmin}
            title={isAdmin ? "Lock the crew panel" : "Crew panel"}
          >
            {"⚙"}
          </button>
        </div>
      </header>

      <TabBar tabs={TABS} active={active} onPick={setActive} isAdmin={isAdmin} />
      </div>

      <main className="sheet">
        {!FB.ok ? (
          <p className="bootfail">
            Live updates are off. {FB.reason} The wall still works, but questions,
            polls, and photos will not sync until this is sorted.
          </p>
        ) : null}

        {isAdmin ? (
          <div className="adminbar">
            <p className="adminbar__t">Crew panel unlocked</p>
            <p className="adminbar__p">
              Tabs the room cannot see yet carry a padlock. The full panel arrives at T1.6.
            </p>
          </div>
        ) : null}

        {/* A device running the clock override is lying about the time on
            purpose. It says so, so nobody reads a test as the truth. */}
        {simulated ? (
          <p className="setnote">
            Clock override is on. This device is pretending it is{" "}
            {new Date(now).toLocaleString("en-US", { timeZone: ET })} Eastern.
            Drop the clock parameter from the URL to go back to the real time.
          </p>
        ) : null}

        <MarqueeSlot
          item={liveAnnouncement}
          onDismiss={() => setDismissed(liveAnnouncement.id)}
        />

        <TabView isAdmin={isAdmin} now={now} />
      </main>

      {showPin ? (
        <PinGate
          onPass={() => { setIsAdmin(true); setShowPin(false); }}
          onClose={() => setShowPin(false)}
        />
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
