      ) : null}

      {!FB.ok ? (
        <p className="ap-warn">
          Live updates are off, so nothing here reaches another phone. Clear This
          Device still works.
        </p>
      ) : null}

      {/* T2.8. Vault Drops is the first thing in the panel and is never behind a
          disclosure, an accordion or a scroll. Two taps from the gear is an
          acceptance criterion, not a preference: gear, then the control. */}
      <AdminV2 isAdmin={true} now={now} onGoTab={onGoTab} />

      {/* T3.1. Second, because 124 names need checking before the meeting and
          the crew should not have to hunt for the list. */}
      <ApRoster />

      <ApMarquee now={now} />
      <ApTabs vis={vis} />
      <ApResets />
      <ApDevice />
      <ApNuke />

      <div className="tf__row">
        <button className="btn btn--quiet" onClick={onLock}>
          Lock the crew panel
        </button>
      </div>
    </div>
  );
}

const TAB_VIEWS = {
  setlist:    SetlistTab,
  band:       BandTab,
  backstage:  BackstageTab,
  soundcheck: SoundcheckTab,
  vault:      VaultTab,
  vote:       CrowdVoteTab,
  pit:        PitTab,
  cares:      CaresCupTab,
  encore:     EncoreTab
};

/* Did the three Google fonts actually arrive? Crew only.
 *
 * This is the one item on the "needs a real phone" list that fails INVISIBLY. A
 * missing camera intent or a dead tel: link announces itself the moment somebody
 * taps it. A font that never loaded just makes every heading look ordinary, and on
 * a rock poster wall that is a whole design gone without a single error anywhere.
 * Nobody would report it, they would just think it looked plain.
 *
 * So the crew get told. On a phone, on hotel wifi, at the venue, which is the only
 * place and time the answer actually matters.
 *
 * DO NOT USE document.fonts.check() FOR THIS. It answers "can this text be drawn
 * with this specification", and a fallback counts as yes, so it returns true for a
 * font that does not exist anywhere. I wrote it that way first and proved it by
 * pointing the Anton check at "AntonDefinitelyNotAFont". It cheerfully reported
 * every font loaded.
 *
 * Reading the FontFaceSet instead is the honest test. Each @font-face the
 * stylesheet declares appears as a FontFace with a status, so a family that is
 * absent has no entry at all and one that failed is not "loaded". load() runs first
 * because a face nothing has drawn with yet sits at "unloaded" quite legitimately.
 */
function FontCheck() {
  const [state, setState] = useState(null);

  useEffect(() => {
    if (!document.fonts || !document.fonts.load) return;
    let alive = true;
    const want = ["Anton", "Alfa Slab One", "Inter"];

    const loaded = (family) => {
      let seen = false;
      document.fonts.forEach((f) => {
        const fam = String(f.family || "").replace(/["']/g, "");
        if (fam === family && f.status === "loaded") seen = true;
      });
      return seen;
    };

    Promise.all(want.map((family) =>
      document.fonts.load('16px "' + family + '"', "Aa").catch(() => null)
    )).then(() => {
      if (alive) setState(want.map((f) => ({ name: f, ok: loaded(f) })));
    });
    return () => { alive = false; };
  }, []);

  if (!state) return null;
  const missing = state.filter((r) => !r.ok).map((r) => r.name);
  if (!missing.length) {
    return <p className="adminbar__p">Fonts loaded. Anton, Alfa Slab One, Inter.</p>;
  }
  return (
    <p className="adminbar__p adminbar__p--warn">
      {"⚠"} Font did not load: {missing.join(", ")}. Headings are showing a
      fallback. Check the connection, then reload.
    </p>
  );
}

function App() {
  const [entered, setEntered] = useState(() => readLS(LS.entered) === "1");
  const [active, setActive] = useState(TABS[0].key);
  const [displayMode, setDisplayMode] = useState(false);
  /* Survives a reload, per T1.6. Re-entering the PIN after every refresh during
     a four day event is the kind of friction that gets a panel left open. */
  const [isAdmin, setIsAdmin] = useState(() => readSS(SS.crew) === "1");
  const [showPin, setShowPin] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [dismissed, setDismissed] = useState(null);
  /* Pulling the welcome screen back up does NOT clear mm26_entered. Somebody
     showing the QR to a colleague should not have their own state reset. */
  const [showWelcome, setShowWelcome] = useState(false);

  /* useServerNow also returns `synced` and `offset`. T2.3 needs them for the
     Vault drops. The welcome screen does not surface either one. */
  const { now, simulated } = useServerNow();
  const announcement = useAnnouncement();

  /* T1.6 tab visibility. settings/tabs is a map of ten booleans. A tab with no
     stored value falls back to its phase, so the six pre tabs are on and the
     four during and post tabs are off until somebody says otherwise. That is
     the T4.4 launch state, so an empty database is already right. */
  const vis = useTabVisibility();

  /* Crew keep every tab, with a padlock on the hidden ones. Attendees do not
     get a padlock, they get nine tabs instead of ten. */
  const visibleTabs = TABS.filter((t) => isAdmin || isTabOn(vis, t));

  /* Derived, not corrected after the fact. If the tab under this viewer goes
     hidden, this same paint is already rendering the first visible one, so a
     hidden tab cannot flash its content on the way out. */
  const shownKey = visibleTabs.filter((t) => t.key === active).length
    ? active
    : (visibleTabs.length ? visibleTabs[0].key : null);

  useEffect(() => {
    document.body.classList.toggle("display-mode", displayMode);
  }, [displayMode]);

  /* Keep the stored tab honest after a redirect, so the pill highlight and the
     scroll-into-view in TabBar both follow. */
  useEffect(() => {
    if (shownKey && shownKey !== active) setActive(shownKey);
  }, [shownKey, active]);

  const enter = useCallback(() => {
    writeLS(LS.entered, "1");
    setEntered(true);
  }, []);

  /* Spec 4: the PIN unlocks, and after that the gear opens the panel. Locking
     is a deliberate button inside the panel rather than a stray tap out here,
     because the gear sits next to Display Mode. */
  const gear = useCallback(() => {
    if (!isAdmin) { setShowPin(true); return; }
    setShowAdmin((prev) => !prev);
  }, [isAdmin]);

  if (!entered) {
    return <Welcome onEnter={enter} now={now} />;
  }

  if (showWelcome) {
    return <Welcome onEnter={() => setShowWelcome(false)} now={now} returning />;
  }

  const shownTab = shownKey ? TAB_BY_KEY[shownKey] : null;
  const TabView = shownTab ? TAB_VIEWS[shownTab.key] : null;
  const liveAnnouncement =
    announcement && announcement.id !== dismissed ? announcement : null;

  return (
    <div>
      {/* Masthead on every page, per Lisa. Scrolls away. The controls and the
          tab bar below it stay stuck to the top. */}
      <Masthead />

      {/* Header and tab bar stick together. Two separate sticky elements both
          pinned to the top overlapped once the masthead scrolled off. */}
      <div className="stickytop">
      <header className="hdr">
        <div className="hdr__row">
          <BrandMark />
          <button
            className="iconbtn"
            onClick={() => setShowWelcome(true)}
            title="Pull up the QR code"
            aria-label="Show the QR code"
          >
            <QrGlyph />
          </button>
          <button
            className={"iconbtn" + (displayMode ? " iconbtn--on" : "")}
            onClick={() => setDisplayMode(!displayMode)}
            aria-pressed={displayMode}
            title="Display Mode, for the projector"
          >
            {"\u{1F4FA}"}
          </button>
          <button
            className={"iconbtn" + (isAdmin ? " iconbtn--on" : "")}
            onClick={gear}
            aria-pressed={isAdmin}
            title={isAdmin ? (showAdmin ? "Back to the wall" : "Open the crew panel") : "Crew panel"}
          >
            {"⚙"}
          </button>
        </div>
      </header>

      <TabBar
        tabs={visibleTabs}
        vis={vis}
        active={shownKey}
        onPick={(key) => { setShowAdmin(false); setActive(key); }}
        isAdmin={isAdmin}
      />
      </div>

      <main className="sheet">
        {!FB.ok ? (
          <p className="bootfail">
            Live updates are off. {FB.reason} The wall still works, but questions,
            polls, and photos will not sync until this is sorted.
          </p>
        ) : null}

        {isAdmin && !showAdmin ? (
          <div className="adminbar">
            <p className="adminbar__t">Crew panel unlocked</p>
            <p className="adminbar__p">
              Tabs the room cannot see carry a gold padlock. The gear opens the
              panel.
            </p>
            <FontCheck />
            <div className="tf__row ap-open">
              <button className="btn btn--tiny" onClick={() => setShowAdmin(true)}>
                Open the crew panel
              </button>
            </div>
          </div>
        ) : null}

        {/* A device running the clock override is lying about the time on
            purpose. It says so, so nobody reads a test as the truth. */}
        {simulated ? (
          <p className="setnote">
            Clock override is on. This device is pretending it is{" "}
            {new Date(now).toLocaleString("en-US", { timeZone: ET })} Eastern.
            Drop the clock parameter from the URL to go back to the real time.
          </p>
        ) : null}

        <MarqueeSlot
          item={liveAnnouncement}
          onDismiss={() => setDismissed(liveAnnouncement.id)}
        />

        {showAdmin && isAdmin ? (
          <AdminPanel
            now={now}
            vis={vis}
            displayMode={displayMode}
            onClose={() => setShowAdmin(false)}
            onLock={() => { setShowAdmin(false); setIsAdmin(false); dropSS(SS.crew); }}
            onGoTab={(key) => { setShowAdmin(false); setActive(key); }}
          />
        ) : TabView ? (
          <TabView isAdmin={isAdmin} now={now} onGoTab={setActive} />
        ) : (
          <Empty>Every tab is switched off. The crew is between songs.</Empty>
        )}
      </main>

      {showPin ? (
        <PinGate
          onPass={() => { setIsAdmin(true); writeSS(SS.crew, "1"); setShowPin(false); }}
          onClose={() => setShowPin(false)}
        />
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
