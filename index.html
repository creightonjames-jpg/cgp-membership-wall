/* ==========================================================================
   T2.4 CROWD VOTE. Spec 3.7.
   Four poll types, all live: multiple choice, knowledge check, ranking, word
   cloud. Poll state lives in Firebase at polls/{id}. The starter question
   library at data/polls.json is read only, and it is only fetched when a crew
   member opens the picker, so an attendee's phone never pulls it.

   One vote per device per poll, held in mm26_pollvotes. Storage is re-read at
   the moment of the tap rather than trusted from state, so a second tab on the
   same phone cannot double vote through a stale copy. Somebody determined can
   clear their own storage and vote again. Ninety GMs in a ballroom is not an
   election.

   Every clock read comes from the server corrected `now` handed down by
   useServerNow, and every timestamp written is ServerValue.TIMESTAMP, which is
   the server's own clock. Nothing in here calls Date.now().
   ========================================================================== */

const POLL_TYPES = [
  { key: "choice",    label: "Multiple choice",
    hint: "Opinion. No right answer." },
  { key: "knowledge", label: "Knowledge check",
    hint: "Carries a right answer. The room sees it when you close the poll." },
  { key: "ranking",   label: "Ranking",
    hint: "Drag to order. Results are an averaged rank, so keep the list short." },
  { key: "wordcloud", label: "Word cloud",
    hint: "One word each, sized by how often it comes up." }
];

const POLL_TYPE_BY_KEY = {};
POLL_TYPES.forEach(function (t) { POLL_TYPE_BY_KEY[t.key] = t; });

/* ServerValue.increment does the arithmetic on the server, so a whole ballroom
   tapping the same option inside one second all get counted with no read
   first. Older SDK builds do not carry it, so there is a transaction fallback
   and the feature cannot fail closed on a CDN pin. */
const CAN_INCREMENT = !!(
  window.firebase && firebase.database && firebase.database.ServerValue &&
  typeof firebase.database.ServerValue.increment === "function"
);

function serverStamp() {
  const SV = window.firebase && firebase.database && firebase.database.ServerValue;
  return SV ? SV.TIMESTAMP : 0;
}

/* One atomic write per ballot. `bumps` are counters to add to, `sets` are plain
   values. Every path is a disjoint leaf, which is what a multi-path update
   requires. */
function pollWrite(baseRef, bumps, sets) {
  if (CAN_INCREMENT) {
    const upd = {};
    Object.keys(sets || {}).forEach(function (p) { upd[p] = sets[p]; });
    Object.keys(bumps || {}).forEach(function (p) {
      upd[p] = firebase.database.ServerValue.increment(bumps[p]);
    });
    return baseRef.update(upd);
  }
  Object.keys(sets || {}).forEach(function (p) { baseRef.child(p).set(sets[p]); });
  Object.keys(bumps || {}).forEach(function (p) {
    baseRef.child(p).transaction(function (cur) { return (cur || 0) + bumps[p]; });
  });
  return Promise.resolve();
}

/* Firebase keys cannot hold . # $ / [ ] or control characters. Words fold to
   lower case so Family and family are one word in the cloud. Accents survive,
   because stripping to a-z would turn a real word into a stub. */
function wordKey(raw) {
  return String(raw || "")
    .toLowerCase()
    .trim()
    .replace(/[.#$\/\[\]\x00-\x1f\x7f]/g, "")
    .replace(/\s+/g, "-")
    .slice(0, 32);
}

function cleanWord(raw) {
  return String(raw || "").trim().replace(/\s+/g, " ").toLowerCase();
}

/* staged, live, closed. `on` alone cannot tell a poll nobody has shown yet from
   one that has finished, and the room must never see the first kind. */
function pollPhase(raw) {
  if (raw && raw.on) return "live";
  return raw && raw.openedTs ? "closed" : "staged";
}

/* The knowledge answer is stripped here rather than at the point of render, so
   correctIndex and explain are not in React state, not in props, and not in the
   DOM until the poll is closed or the viewer is crew. See OPEN ITEMS 8.1 for
   what this does and does not protect. */
function normalizePoll(id, raw, isAdmin) {
  const type = POLL_TYPE_BY_KEY[raw.type] ? raw.type : "choice";
  const phase = pollPhase(raw);
  const revealed = phase === "closed" || isAdmin;

  const rawOpts = raw.options || {};
  const options = Object.keys(rawOpts)
    .filter(function (k) { return rawOpts[k]; })
    .sort(function (a, b) { return Number(a) - Number(b); })
    .map(function (k) {
      const o = rawOpts[k];
      const isText = typeof o === "string";
      return {
        i: Number(k),
        label: isText ? o : String(o.label || ""),
        count: (!isText && o.count) || 0,
        rankSum: (!isText && o.rankSum) || 0,
        rankVotes: (!isText && o.rankVotes) || 0
      };
    });

  const rawWords = raw.words || {};
  const words = Object.keys(rawWords)
    .map(function (k) {
      const w = rawWords[k] || {};
      return { key: k, word: String(w.word || k), count: w.count || 0 };
    })
    .filter(function (w) { return w.count > 0; })
    .sort(function (a, b) {
      return (b.count - a.count) || a.word.localeCompare(b.word);
    });

  /* `votes` is authoritative, but a hand-made node in the console may not carry
     it, so derive a floor from whatever counters exist. */
  let ballots = raw.votes || 0;
  if (type === "choice" || type === "knowledge") {
    ballots = Math.max(ballots, options.reduce(function (s, o) { return s + o.count; }, 0));
  } else if (type === "ranking") {
    options.forEach(function (o) { ballots = Math.max(ballots, o.rankVotes); });
  } else {
    ballots = Math.max(ballots, words.reduce(function (s, w) { return s + w.count; }, 0));
  }

  return {
    id: id,
    type: type,
    phase: phase,
    question: String(raw.question || ""),
    options: options,
    words: words,
    ballots: ballots,
    wordLimit: raw.wordLimit || 1,
    correctIndex: revealed && typeof raw.correctIndex === "number" ? raw.correctIndex : -1,
    explain: revealed ? String(raw.explain || "") : "",
    libId: String(raw.libId || ""),
    ts: raw.ts || 0,
    openedTs: raw.openedTs || 0,
    closedTs: raw.closedTs || 0
  };
}

/* Live, then staged, then closed. The poll the room is voting on belongs at the
   top of the screen, because that is where a phone held at chest height is
   already pointing. */
const POLL_PHASE_RANK = { live: 0, staged: 1, closed: 2 };

function sortPolls(list) {
  return list.slice().sort(function (a, b) {
    const d = POLL_PHASE_RANK[a.phase] - POLL_PHASE_RANK[b.phase];
    if (d !== 0) return d;
    if (a.phase === "closed") return (b.closedTs || 0) - (a.closedTs || 0);
    return (b.ts || 0) - (a.ts || 0);
  });
}

function usePolls(isAdmin) {
  const [polls, setPolls] = useState([]);
  const [ready, setReady] = useState(!FB.ok);

  useEffect(function () {
    if (!FB.ok) return;
    const ref = FB.db.ref("polls");
    const handler = function (snap) {
      const all = snap.val() || {};
      setPolls(Object.keys(all)
        .filter(function (id) { return all[id]; })
        .map(function (id) { return normalizePoll(id, all[id], isAdmin); }));
      setReady(true);
    };
    ref.on("value", handler);
    return function () { ref.off("value", handler); };
  }, [isAdmin]);

  return { polls: polls, ready: ready };
}

/* The starter library. Fetched only once a crew member opens the picker, so an
   attendee's phone never pulls a file it has no use for. */
function useLibrary(open) {
  const [state, setState] = useState({ status: "idle", polls: [], reason: "" });

  useEffect(function () {
    if (!open || state.status !== "idle") return;
    let live = true;
    setState({ status: "loading", polls: [], reason: "" });
    fetch("data/polls.json", { cache: "no-cache" })
      .then(function (res) {
        if (!res.ok) throw new Error("The file returned " + res.status + ".");
        return res.json();
      })
      .then(function (data) {
        if (!live) return;
        setState({ status: "ready", polls: (data && data.polls) || [], reason: "" });
      })
      .catch(function (err) {
        if (!live) return;
        setState({
          status: "failed", polls: [],
          reason: (err && err.message) || String(err)
        });
      });
    return function () { live = false; };
  }, [open]);

  return state;
}

/* ------------------------------------------------------------- writes */

function castChoiceVote(poll, index) {
  const bumps = { votes: 1 };
  bumps["options/" + index + "/count"] = 1;
  return pollWrite(FB.db.ref("polls/" + poll.id), bumps, null);
}

/* One ballot adds its 1-based position to every option's rankSum and one to
   every option's rankVotes, so each option's average is self-consistent even if
   a write lands late. */
function castRankingVote(poll, order) {
  const bumps = { votes: 1 };
  order.forEach(function (optIndex, pos) {
    bumps["options/" + optIndex + "/rankSum"] = pos + 1;
    bumps["options/" + optIndex + "/rankVotes"] = 1;
  });
  return pollWrite(FB.db.ref("polls/" + poll.id), bumps, null);
}

function castWordVote(poll, display) {
  const key = wordKey(display);
  if (!key) return Promise.resolve();
  const bumps = { votes: 1 };
  bumps["words/" + key + "/count"] = 1;
  const sets = {};
  sets["words/" + key + "/word"] = display;
  return pollWrite(FB.db.ref("polls/" + poll.id), bumps, sets);
}

function createPoll(draft) {
  const body = {
    question: draft.question,
    type: draft.type,
    on: false,
    votes: 0,
    ts: serverStamp()
  };

  if (draft.type === "wordcloud") {
    body.wordLimit = draft.wordLimit || 1;
  } else {
    body.options = draft.options.map(function (label) {
      return draft.type === "ranking"
        ? { label: label, rankSum: 0, rankVotes: 0 }
        : { label: label, count: 0 };
    });
  }

  if (draft.type === "knowledge") {
    body.correctIndex = draft.correctIndex;
    if (draft.explain) body.explain = draft.explain;
  }

  if (draft.libId) body.libId = draft.libId;

  return FB.db.ref("polls").push().set(body);
}

function setPollOn(poll, on) {
  const upd = { on: on };
  if (on) {
    if (!poll.openedTs) upd.openedTs = serverStamp();
    upd.closedTs = null;
  } else {
    upd.closedTs = serverStamp();
  }
  return FB.db.ref("polls/" + poll.id).update(upd);
}

/* ------------------------------------------------------------ results */

/* One row shape for every type that has options, so the card body and the crew
   panel read the same numbers out of the same function.
   Choice and knowledge hold the order the crew typed, because the room just
   looked at those buttons in that order. Ranking sorts by average rank, since
   that ordering is the result. */
function resultRows(poll, mine) {
  if (poll.type === "ranking") {
    const n = poll.options.length || 1;
    const scored = poll.options.map(function (o) {
      return Object.assign({}, o, { avg: o.rankVotes ? o.rankSum / o.rankVotes : 0 });
    });
    scored.sort(function (a, b) {
      if (a.rankVotes && b.rankVotes) return (a.avg - b.avg) || (a.i - b.i);
      if (a.rankVotes) return -1;
      if (b.rankVotes) return 1;
      return a.i - b.i;
    });
    return scored.map(function (o) {
      return {
        key: o.i,
        label: o.label,
        /* An average of 1 is a full bar, an average of last place is one nth.
           Shorter average, longer bar, which is the way round people read it. */
        pct: o.rankVotes ? Math.round(((n + 1 - o.avg) / n) * 100) : 0,
        note: o.rankVotes ? "avg " + o.avg.toFixed(1) : "no votes",
        mine: !!(mine && mine.order && mine.order[0] === o.i),
        right: false
      };
    });
  }

  const total = poll.options.reduce(function (s, o) { return s + o.count; }, 0);
  return poll.options.map(function (o) {
    const pct = total ? Math.round((o.count / total) * 100) : 0;
    return {
      key: o.i,
      label: o.label,
      pct: pct,
      note: pct + "% · " + o.count,
      mine: !!(mine && typeof mine.i === "number" && mine.i === o.i),
      right: poll.type === "knowledge" && poll.correctIndex === o.i
    };
  });
}

function ResultBars({ rows }) {
  return (
    <div className="cv-res">
      {rows.map(function (r) {
        return (
          <div
            key={r.key}
            className={"cv-bar" + (r.mine ? " cv-bar--mine" : "") + (r.right ? " cv-bar--right" : "")}
          >
            <span className="cv-bar__fill" style={{ width: r.pct + "%" }} aria-hidden="true"></span>
            <span className="cv-bar__lab">
              {r.mine ? (
                <span className="cv-bar__mark" aria-hidden="true">{"✓"}</span>
              ) : null}
              {r.right ? (
                <span className="cv-bar__mark" aria-hidden="true">{"★"}</span>
              ) : null}
              <span>{r.label}</span>
              {r.mine ? <span className="sr-only">Your pick.</span> : null}
              {r.right ? <span className="sr-only">Right answer.</span> : null}
            </span>
            <span className="cv-bar__n t-data">{r.note}</span>
          </div>
        );
      })}
    </div>
  );
}

/* ------------------------------------------------------------- bodies */

function OptionButtons({ poll, onVote }) {
  return (
    <div className="cv-opts">
      {poll.options.map(function (o) {
        return (
          <button key={o.i} className="cv-opt" onClick={function () { onVote(o.i); }}>
            <span className="cv-opt__t">{o.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function ChoiceBody({ poll, mine, onVote }) {
  const showResults = !!mine || poll.phase === "closed";
  if (!showResults) return <OptionButtons poll={poll} onVote={onVote} />;
  return <ResultBars rows={resultRows(poll, mine)} />;
}

/* The split stays under wraps until the crew closes the poll. Before that a
   voter sees their own pick filled scarlet and nothing else, because a bar
   chart with one option at 80% gives the answer away as surely as a gold star
   would. */
function KnowledgeBody({ poll, mine, onVote }) {
  const closed = poll.phase === "closed";

  if (!mine && !closed) return <OptionButtons poll={poll} onVote={onVote} />;

  if (!closed) {
    return (
      <div>
        <div className="cv-opts">
          {poll.options.map(function (o) {
            const isMine = mine.i === o.i;
            return (
              <div
                key={o.i}
                className={"cv-opt cv-opt--flat" + (isMine ? " cv-opt--mine" : "")}
              >
                {isMine ? (
                  <span className="cv-opt__tick" aria-hidden="true">{"✓"}</span>
                ) : null}
                <span className="cv-opt__t">{o.label}</span>
              </div>
            );
          })}
        </div>
        <p className="cv-note">Locked in. The answer lands when the crew closes it.</p>
      </div>
    );
  }

  const rows = resultRows(poll, mine);
  const total = poll.options.reduce(function (s, o) { return s + o.count; }, 0);
  const right = poll.options.filter(function (o) { return o.i === poll.correctIndex; })[0];
  const rightN = right ? right.count : 0;
  const pct = total ? Math.round((rightN / total) * 100) : 0;
  const gotIt = !!(mine && mine.i === poll.correctIndex);

  return (
    <div>
      <ResultBars rows={rows} />
      {right ? (
        <p className="cv-score">
          <span className="cv-score__k">The answer</span>
          <span className="cv-score__n">{right.label}.</span>{" "}
          <span className="t-data">{rightN}</span> of{" "}
          <span className="t-data">{total}</span> got it, {pct}%.
          {mine ? (gotIt ? " You had it." : " You missed this one.") : ""}
        </p>
      ) : (
        <p className="cv-score">
          <span className="cv-score__k">The answer</span>
          Nobody recorded one on this poll, so there is nothing to grade against.
        </p>
      )}
      {poll.explain ? <p className="cv-note">{poll.explain}</p> : null}
    </div>
  );
}

/* Fisher-Yates. The list is shuffled once per device so a ballot cast without
   dragging anything cannot quietly agree with the order the crew typed. See
   OPEN ITEMS 8.4. */
function shuffled(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const swap = out[i];
    out[i] = out[j];
    out[j] = swap;
  }
  return out;
}

function moveItem(arr, from, to) {
  const next = arr.slice();
  const held = next.splice(from, 1)[0];
  next.splice(to, 0, held);
  return next;
}

/* Drag to order, by pointer events, which is the one input model iOS Safari,
   Android Chrome and a desktop mouse all agree on. HTML5 drag and drop does
   not fire on a touchscreen at all, which is why it is not used here.

   Up and down buttons ship alongside the grip, and they are not a fallback for
   old browsers. Some people will not work out that a row can be dragged, and
   the buttons are the only part of this control a keyboard can reach.

   The row centres are measured once, on pointer down. Slots are found by
   nearest centre rather than by dividing by a row height, so an option that
   wraps onto two lines does not throw the arithmetic out. */
function RankList({ options, onSubmit, busy }) {
  const [order, setOrder] = useState(function () {
    return shuffled(options.map(function (o) { return o.i; }));
  });
  const [drag, setDrag] = useState(null);
  const listRef = useRef(null);
  const centres = useRef(null);

  const byIndex = {};
  options.forEach(function (o) { byIndex[o.i] = o; });

  /* Defensive: if the crew edits the options while somebody is mid-order, keep
     what still exists and put anything new on the end. */
  const safe = order.filter(function (i) { return byIndex[i]; });
  options.forEach(function (o) { if (safe.indexOf(o.i) < 0) safe.push(o.i); });

  const shown = drag ? moveItem(safe, drag.from, drag.target) : safe;

  function onDown(e, pos) {
    if (busy) return;
    const list = listRef.current;
    if (!list) return;
    centres.current = Array.prototype.map.call(list.children, function (el) {
      const r = el.getBoundingClientRect();
      return r.top + r.height / 2;
    });
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* no capture */ }
    setDrag({ from: pos, target: pos, y0: e.clientY, dy: 0 });
  }

  function onMove(e) {
    if (!drag || !centres.current) return;
    const list = centres.current;
    let target = 0;
    let best = Infinity;
    for (let i = 0; i < list.length; i++) {
      const d = Math.abs(list[i] - e.clientY);
      if (d < best) { best = d; target = i; }
    }
    setDrag(function (prev) {
      if (!prev) return prev;
      return Object.assign({}, prev, {
        target: target,
        /* What the finger has travelled, less the distance the row has already
           been carried by the list reordering under it. */
        dy: (e.clientY - prev.y0) - (list[target] - list[prev.from])
      });
    });
  }

  function onUp(e) {
    if (!drag) return;
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) { /* fine */ }
    setOrder(moveItem(safe, drag.from, drag.target));
    setDrag(null);
    centres.current = null;
  }

  function nudge(pos, dir) {
    const to = pos + dir;
    if (to < 0 || to >= safe.length) return;
    setOrder(moveItem(safe, pos, to));
  }

  return (
    <div>
      <ol className={"cv-rank" + (drag ? " cv-rank--dragging" : "")} ref={listRef}>
        {shown.map(function (optIndex, pos) {
          const o = byIndex[optIndex];
          const lifted = !!drag && pos === drag.target;
          return (
            <li
              key={optIndex}
              className={"cv-rank__row" + (lifted ? " is-lifted" : "")}
              style={lifted ? { "--cv-dy": drag.dy + "px" } : null}
            >
              <span className="cv-rank__pos t-data" aria-hidden="true">{pos + 1}</span>
              <span className="cv-rank__t">{o.label}</span>
              <span className="cv-rank__ctl">
                <button
                  type="button"
                  className="btn btn--tiny cv-nudge"
                  onClick={function () { nudge(pos, -1); }}
                  disabled={pos === 0 || busy}
                  aria-label={"Move " + o.label + " up"}
                >
                  {"▲"}
                </button>
                <button
                  type="button"
                  className="btn btn--tiny cv-nudge"
                  onClick={function () { nudge(pos, 1); }}
                  disabled={pos === shown.length - 1 || busy}
                  aria-label={"Move " + o.label + " down"}
                >
                  {"▼"}
                </button>
                <button
                  type="button"
                  className="cv-grip"
                  onPointerDown={function (e) { onDown(e, pos); }}
                  onPointerMove={onMove}
                  onPointerUp={onUp}
                  onPointerCancel={onUp}
                  aria-label={"Drag " + o.label + " to reorder"}
                >
                  <span aria-hidden="true">{"≡"}</span>
                </button>
              </span>
            </li>
          );
        })}
      </ol>
      <div className="tf__row">
        <button
          type="button"
          className="btn btn--go"
          disabled={busy}
          onClick={function () { onSubmit(shown.slice()); }}
        >
          Lock in this order
        </button>
      </div>
      <p className="cv-note">
        Drag the handle, or use the arrows. One order per phone, so get it how you want it.
      </p>
    </div>
  );
}

function RankingBody({ poll, mine, onVote, busy }) {
  const showResults = !!mine || poll.phase === "closed";
  if (!showResults) return <RankList options={poll.options} onSubmit={onVote} busy={busy} />;

  const rows = resultRows(poll, mine);
  const top = mine && mine.order
    ? poll.options.filter(function (o) { return o.i === mine.order[0]; })[0]
    : null;

  return (
    <div>
      <ResultBars rows={rows} />
      {top ? <p className="cv-note">You put <strong>{top.label}</strong> first.</p> : null}
    </div>
  );
}

function WordForm({ limit, onSubmit, busy }) {
  const [text, setText] = useState("");
  const [err, setErr] = useState("");

  function submit(e) {
    e.preventDefault();
    const clean = cleanWord(text);
    if (!clean) { setErr("Type something first."); return; }
    if (clean.split(" ").length > limit) {
      setErr(limit === 1 ? "One word. Pick the best one." : "Keep it to " + limit + " words.");
      return;
    }
    if (!wordKey(clean)) { setErr("That will not travel. Try letters and numbers."); return; }
    onSubmit(clean);
  }

  return (
    <form className="tf" onSubmit={submit}>
      <label className="tf__l">
        <span>{limit === 1 ? "One word" : limit + " words at most"}</span>
        <input
          className="tf__in"
          value={text}
          maxLength={28}
          autoComplete="off"
          autoCapitalize="none"
          spellCheck={false}
          placeholder={limit === 1 ? "loud" : ""}
          onChange={function (e) { setText(e.target.value); setErr(""); }}
        />
      </label>
      {err ? <p className="cv-err">{err}</p> : null}
      <div className="tf__row">
        <button type="submit" className="btn btn--go" disabled={busy}>Send it up</button>
      </div>
    </form>
  );
}

/* Sized by frequency against the loudest word, in em, so Display Mode scales
   the whole cloud from one variable. Three colour tiers only: gold for the top
   third, cream for the middle, dim for the tail. */
function WordCloud({ words, mineKey }) {
  if (!words.length) {
    return <p className="cv-note">Nothing up yet. First word sets the tone.</p>;
  }
  const top = words[0].count || 1;
  return (
    <div className="cv-cloud">
      {words.map(function (w) {
        const share = w.count / top;
        const tier = share > 0.66 ? " cv-word--hot" : share > 0.33 ? " cv-word--warm" : "";
        const mine = mineKey && w.key === mineKey;
        return (
          <span
            key={w.key}
            className={"cv-word" + tier + (mine ? " cv-word--mine" : "")}
            style={{ fontSize: (0.95 + share * 1.45).toFixed(2) + "em" }}
            title={w.count + (w.count === 1 ? " vote" : " votes")}
          >
            {w.word}
            {w.count > 1 ? <span className="cv-word__n t-data">{w.count}</span> : null}
          </span>
        );
      })}
    </div>
  );
}

/* The cloud is the point, so it is on screen whether or not this phone has
   voted. There is no right answer to spoil. */
function CloudBody({ poll, mine, onVote, busy }) {
  return (
    <div>
      {!mine && poll.phase === "live" ? (
        <WordForm limit={poll.wordLimit} onSubmit={onVote} busy={busy} />
      ) : null}
      {mine ? <p className="cv-note">You said <strong>{mine.w}</strong>.</p> : null}
      <WordCloud words={poll.words} mineKey={mine ? wordKey(mine.w) : null} />
    </div>
  );
}

/* ---------------------------------------------------------- poll card */

const CREW_LINE = {
  staged: "Only crew can see this one. Putting it on air reaches every phone in about a second.",
  live: "On air. Closing it stops the voting and shows the room the result.",
  closed: "Closed. The room sees the final result. Opening it again keeps the votes already in."
};

function PollCard({ poll, now, isAdmin, mine, onVote, onSetOn, onDelete, busy }) {
  const type = POLL_TYPE_BY_KEY[poll.type];
  const phase = poll.phase;
  const Body = poll.type === "knowledge" ? KnowledgeBody
    : poll.type === "ranking" ? RankingBody
    : poll.type === "wordcloud" ? CloudBody
    : ChoiceBody;

  const right = poll.correctIndex >= 0
    ? poll.options.filter(function (o) { return o.i === poll.correctIndex; })[0]
    : null;

  const closedAt = poll.closedTs ? etParts(poll.closedTs) : null;

  return (
    <article
      className={
        "cv-card glow-card grille" +
        (phase === "closed" ? " is-done" : "") +
        (phase === "staged" ? " cv-card--staged" : "")
      }
    >
      <div className="cv-head">
        {phase === "live" ? (
          <span className="onair">
            <span className="onair__dot" aria-hidden="true"></span>On Air
          </span>
        ) : null}
        {phase === "closed" ? <span className="cv-flag">Closed</span> : null}
        {phase === "staged" ? (
          <span className="cv-flag cv-flag--staged">
            {"\u{1F512}"} Not on air yet
          </span>
        ) : null}
        <span className="cv-kicker">{type.label}</span>
      </div>

      <h3 className="cv-q t-display">{poll.question}</h3>

      <Body poll={poll} mine={mine} onVote={onVote} busy={busy} />

      <p className="cv-foot">
        <span>
          {poll.ballots === 0 ? "No votes yet." : (
            <React.Fragment>
              <span className="cv-count t-data">{poll.ballots}</span>{" "}
              {poll.ballots === 1 ? "vote" : "votes"}
            </React.Fragment>
          )}
        </span>
        {phase === "closed" && closedAt ? (
          <span>Closed {closedAt.hhmm} {closedAt.ap}</span>
        ) : null}
        {isAdmin && phase === "live" && poll.openedTs ? (
          <span>
            On air for{" "}
            <span className="t-data">{clock(Math.max(0, now - poll.openedTs))}</span>
          </span>
        ) : null}
      </p>

      {isAdmin ? (
        <div className="cv-crew">
          <p className="cv-crew__k">Crew only</p>

          {poll.type === "knowledge" ? (
            <p className="cv-note">
              Right answer: <strong>{right ? right.label : "not set"}</strong>. The room
              cannot see this line. Keep the crew panel off the projector.
            </p>
          ) : null}

          {poll.type === "wordcloud" ? null : <ResultBars rows={resultRows(poll, mine)} />}

          <div className="tf__row">
            {phase === "live" ? (
              <button
                className="btn btn--kill"
                disabled={busy}
                onClick={function () { onSetOn(poll, false); }}
              >
                Close voting
              </button>
            ) : (
              <button
                className="btn btn--go"
                disabled={busy}
                onClick={function () { onSetOn(poll, true); }}
              >
                {phase === "staged" ? "Put it on air" : "Open it again"}
              </button>
            )}
            <button
              className="btn btn--tiny btn--kill"
              disabled={busy}
              onClick={function () { onDelete(poll); }}
            >
              Delete
            </button>
          </div>

          <p className="cv-note">{CREW_LINE[phase]}</p>
        </div>
      ) : null}
    </article>
  );
}

/* --------------------------------------------------------- crew: create */

const BLANK_DRAFT = {
  type: "choice",
  question: "",
  optionsText: "",
  correctIndex: -1,
  explain: "",
  wordLimit: 1,
  libId: ""
};

function parseOptions(text) {
  return String(text || "")
    .split("\n")
    .map(function (line) { return line.trim(); })
    .filter(function (line) { return line.length > 0; });
}

function LibraryList({ onPick }) {
  const lib = useLibrary(true);
  const [filter, setFilter] = useState("");

  if (lib.status === "loading") return <p className="cv-note">Fetching the library.</p>;

  if (lib.status === "failed") {
    return (
      <p className="cv-note">
        The library did not load. {lib.reason} Type the question in instead, it all
        works the same.
      </p>
    );
  }

  const needle = filter.trim().toLowerCase();
  const rows = lib.polls.filter(function (p) {
    if (!needle) return true;
    return (String(p.question || "") + " " + String(p.session || "") + " " + String(p.type || ""))
      .toLowerCase().indexOf(needle) >= 0;
  });

  return (
    <div>
      <p className="setnote">
        Every question in the library is a draft. Nobody has approved one. Check with
        Carol, Lisa, or whoever is running the session before you put it on air.
      </p>

      <label className="tf__l">
        <span>Filter</span>
        <input
          className="tf__in"
          value={filter}
          placeholder="breakout, culture, thu"
          onChange={function (e) { setFilter(e.target.value); }}
        />
      </label>

      {!rows.length ? <p className="cv-note">Nothing matches that.</p> : null}

      <ul className="cv-libl">
        {rows.map(function (p) {
          const t = POLL_TYPE_BY_KEY[p.type];
          return (
            <li key={p.id}>
              <button className="cv-lib" onClick={function () { onPick(p); }}>
                <span className="cv-lib__k">
                  {(t ? t.label : p.type) + (p.session ? " · " + p.session : "")}
                </span>
                {p.question}
              </button>
            </li>
          );
        })}
      </ul>
    </div>
  );
}

function PollForm({ onCreate, busy }) {
  const [draft, setDraft] = useState(BLANK_DRAFT);
  const [picked, setPicked] = useState(null);
  const [libOpen, setLibOpen] = useState(false);
  const [err, setErr] = useState("");

  function set(k, v) {
    setDraft(function (prev) { return Object.assign({}, prev, { [k]: v }); });
    setErr("");
  }

  const opts = parseOptions(draft.optionsText);
  const needsOptions = draft.type !== "wordcloud";

  function pick(item) {
    setDraft({
      type: POLL_TYPE_BY_KEY[item.type] ? item.type : "choice",
      question: String(item.question || ""),
      optionsText: (item.options || []).join("\n"),
      correctIndex: typeof item.correctIndex === "number" ? item.correctIndex : -1,
      explain: String(item.explain || ""),
      wordLimit: item.wordLimit || 1,
      libId: String(item.id || "")
    });
    setPicked(item);
    setLibOpen(false);
    setErr("");
  }

  function submit(e) {
    e.preventDefault();
    const question = draft.question.trim();
    if (!question) { setErr("It needs a question."); return; }
    if (needsOptions && opts.length < 2) { setErr("Two answers at least, one per line."); return; }
    if (draft.type === "knowledge" && (draft.correctIndex < 0 || draft.correctIndex >= opts.length)) {
      setErr("Mark which answer is the right one.");
      return;
    }

    onCreate({
      type: draft.type,
      question: question,
      options: opts,
      correctIndex: draft.type === "knowledge" ? draft.correctIndex : -1,
      explain: draft.explain.trim(),
      wordLimit: draft.wordLimit,
      libId: draft.libId
    });

    setDraft(BLANK_DRAFT);
    setPicked(null);
  }

  return (
    <section className="cv-new glow-card">
      <h3 className="cv-new__h t-display">New poll</h3>
      <p className="cv-new__hint">
        It starts off air. Put it up when the presenter asks for it.
      </p>

      <div className="tf__row" style={{ marginTop: "12px" }}>
        <button
          type="button"
          className={"btn" + (libOpen ? " btn--go" : "")}
          onClick={function () { setLibOpen(!libOpen); }}
        >
          {libOpen ? "Hide the library" : "Load one from the library"}
        </button>
      </div>

      {libOpen ? <LibraryList onPick={pick} /> : null}

      <form className="tf" onSubmit={submit}>
        <div className="dayrow" role="tablist" aria-label="Poll type">
          {POLL_TYPES.map(function (t) {
            return (
              <button
                key={t.key}
                type="button"
                role="tab"
                className="daypill"
                aria-selected={draft.type === t.key}
                onClick={function () { set("type", t.key); }}
              >
                <span className="daypill__n">{t.label}</span>
              </button>
            );
          })}
        </div>

        <p className="cv-new__hint">{POLL_TYPE_BY_KEY[draft.type].hint}</p>

        <label className="tf__l" style={{ marginTop: "10px" }}>
          <span>Question</span>
          <input
            className="tf__in"
            value={draft.question}
            placeholder="What does the room think?"
            onChange={function (e) { set("question", e.target.value); }}
          />
        </label>

        {needsOptions ? (
          <label className="tf__l">
            <span>{draft.type === "ranking" ? "Items to order, one per line" : "Answers, one per line"}</span>
            <textarea
              className="tf__in cv-ta"
              value={draft.optionsText}
              rows={4}
              placeholder={"First answer\nSecond answer"}
              onChange={function (e) { set("optionsText", e.target.value); }}
            />
          </label>
        ) : (
          <label className="tf__l">
            <span>Words allowed in one answer</span>
            <input
              className="tf__in t-data"
              inputMode="numeric"
              value={String(draft.wordLimit)}
              onChange={function (e) {
                const n = parseInt(e.target.value.replace(/\D/g, ""), 10);
                set("wordLimit", n > 0 && n < 6 ? n : 1);
              }}
            />
          </label>
        )}

        {draft.type === "knowledge" ? (
          <div>
            <p className="cv-new__hint">
              Which one is right. The room sees this the moment you close the poll,
              and not one second before.
            </p>
            {!opts.length ? (
              <p className="cv-note">Type the answers first.</p>
            ) : (
              <div className="dayrow" role="tablist" aria-label="Right answer">
                {opts.map(function (label, i) {
                  return (
                    <button
                      key={label + i}
                      type="button"
                      role="tab"
                      className="daypill"
                      aria-selected={draft.correctIndex === i}
                      onClick={function () { set("correctIndex", i); }}
                    >
                      <span className="daypill__d t-display">{"#" + (i + 1)}</span>
                      <span className="daypill__n">{label}</span>
                    </button>
                  );
                })}
              </div>
            )}
            <label className="tf__l" style={{ marginTop: "10px" }}>
              <span>Why, optional. Shown on close</span>
              <input
                className="tf__in"
                value={draft.explain}
                onChange={function (e) { set("explain", e.target.value); }}
              />
            </label>
          </div>
        ) : null}

        {picked && picked.crewNote ? (
          <p className="cv-note">
            <strong>From the library.</strong> {picked.crewNote}
          </p>
        ) : null}

        {err ? <p className="cv-err">{err}</p> : null}

        <div className="tf__row">
          <button type="submit" className="btn btn--go" disabled={busy}>Create it</button>
          <button
            type="button"
            className="btn btn--quiet"
            onClick={function () { setDraft(BLANK_DRAFT); setPicked(null); setErr(""); }}
          >
            Clear
          </button>
        </div>
      </form>
    </section>
  );
}

/* ------------------------------------------------------------- the tab */

function CrowdVoteTab({ isAdmin, now }) {
  const { polls, ready } = usePolls(isAdmin);
  const [mine, setMine] = useState(function () { return readJSON(LS.pollvotes); });
  const [busy, setBusy] = useState(false);

  /* A staged poll is crew only, so it is filtered out before it renders rather
     than hidden with CSS. */
  const visible = sortPolls(
    isAdmin ? polls : polls.filter(function (p) { return p.phase !== "staged"; })
  );

  const vote = useCallback(function (poll, payload) {
    if (!FB.ok || poll.phase !== "live") return;

    /* Read storage rather than state, so a second tab on the same phone cannot
       double vote through a stale copy. */
    const held = readJSON(LS.pollvotes);
    if (held[poll.id]) return;

    let record = null;
    if (poll.type === "ranking") {
      if (!payload || !payload.length) return;
      record = { t: "ranking", order: payload };
    } else if (poll.type === "wordcloud") {
      if (!payload) return;
      record = { t: "wordcloud", w: payload };
    } else {
      if (typeof payload !== "number") return;
      record = { t: poll.type, i: payload };
    }

    /* Lock first, then write. A vote that fails to reach Firebase is a lost
       vote. A lock that fails to land is a second vote from the same phone,
       which is worse, and it is the one thing the acceptance test checks. */
    held[poll.id] = record;
    writeJSON(LS.pollvotes, held);
    setMine(held);

    if (poll.type === "ranking") castRankingVote(poll, payload);
    else if (poll.type === "wordcloud") castWordVote(poll, payload);
    else castChoiceVote(poll, payload);
  }, []);

  const create = useCallback(function (draft) {
    if (!FB.ok) return;
    setBusy(true);
    createPoll(draft)
      .then(function () { setBusy(false); })
      .catch(function () { setBusy(false); });
  }, []);

  const setOn = useCallback(function (poll, on) {
    if (!FB.ok) return;
    setBusy(true);
    setPollOn(poll, on)
      .then(function () { setBusy(false); })
      .catch(function () { setBusy(false); });
  }, []);

  const remove = useCallback(function (poll) {
    if (!FB.ok) return;
    const label = poll.question.length > 48 ? poll.question.slice(0, 48) + "…" : poll.question;
    if (!window.confirm("Delete this poll and every vote in it?\n\n" + label)) return;
    FB.db.ref("polls/" + poll.id).remove();
  }, []);

  return (
    <TabFrame tabKey="vote">
      {isAdmin ? <PollForm onCreate={create} busy={busy} /> : null}

      {!FB.ok ? (
        <Empty>
          Live updates are off, so voting is off with them. Nothing to do here until that
          is sorted.
        </Empty>
      ) : null}

      {FB.ok && !ready ? <Empty>Checking the desk for polls.</Empty> : null}

      {FB.ok && ready && !visible.length ? (
        <Empty>No polls open. Nothing to vote on until the room warms up.</Empty>
      ) : null}

      {visible.length ? (
        <div className="cv-list">
          {visible.map(function (p) {
            return (
              <PollCard
                key={p.id}
                poll={p}
                now={now}
                isAdmin={isAdmin}
                mine={mine[p.id] || null}
                busy={busy}
                onVote={function (payload) { vote(p, payload); }}
                onSetOn={setOn}
                onDelete={remove}
              />
            );
          })}
        </div>
      ) : null}

      <BuildNote isAdmin={isAdmin} task="T2.4">
        Polls live at polls/&#123;id&#125; in Firebase. A new poll starts off air and only crew
        can see it. Ranking drags by touch and by the arrow buttons, and the list is shuffled
        per device so a ballot cast without dragging does not just agree with the order you
        typed. A knowledge check's right answer is stripped out of the data an attendee's phone
        holds until you close the poll. Every question in data/polls.json is a draft nobody has
        approved. One vote per phone, held in mm26_pollvotes.
      </BuildNote>
    </TabFrame>
  );
}

/* ==========================================================================
   T2.5 THE PIT. Spec 3.8.
   Wednesday is Rock N' Roll Team Dress-Up Day, the most photographed hour of
   the week, so this tab gets used hard and on hotel Wi-Fi.

   Three things in here are the whole task.

   1. Both upload paths ship together. Take Photo is an input with
      capture="environment". Choose from Library is a SECOND input with no
      capture attribute. Camera only was a real limitation on the prior build
      and CLAUDE.md forbids repeating it.
   2. Compression happens on the phone, before the upload. Roughly 800px on the
      long edge, and the JPEG is re-encoded down a quality ladder until the
      string that lands in Firebase is under the cap. Orientation is applied by
      hand when the browser has not already applied it, because phone photos
      carry EXIF rotation and getting it wrong shows every Dress-Up Day photo
      sideways.
   3. The lightbox does not trap scroll. Nothing here touches body overflow,
      nothing calls preventDefault on a touch, and there is no overscroll lock.

   Every clock reading comes from the server corrected `now` handed down from
   useServerNow. The stored timestamp is Firebase's own server value, so two
   phones with two wrong clocks still sort into the same order.
   ========================================================================== */

/* Long edge first, then quality. A real photo lands on the first rung. The
   lower rungs exist for the pathological case, a photo of static. */
const PIT_EDGES = [800, 700, 600];
const PIT_QUALITIES = [0.72, 0.6, 0.5, 0.42];

/* The cap is measured on the base64 string that gets written, not on the JPEG
   bytes inside it, because the string is what crosses the wire and what sits in
   the database. 190000 leaves headroom under the 200KB the ROADMAP asks for. */
const PIT_MAX_B64 = 190000;

/* A sanity ceiling on the source. Anything past this is not a phone photo and
   decoding it would take the tab down with it. */
const PIT_MAX_SOURCE = 32 * 1024 * 1024;

/* Photos are stored as base64 inside their own records, so the grid pulls a
   page at a time rather than every photo taken all week. */
const PIT_PAGE = 24;

/* A 1 by 2 pixel JPEG carrying EXIF orientation 6. If the browser applies EXIF
   rotation on decode, it reports 2 by 1 and the wall must NOT rotate again. If
   it reports 1 by 2, the wall applies the rotation itself. This is a feature
   test rather than a user agent sniff, because the behaviour changed browser by
   browser and version by version. */
const PIT_PROBE = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4QAiRXhpZgAATU0AKgAAAAgAAQESAAMAAAABAAYAAAAAAAD/2wBDABsSFBcUERsXFhceHBsgKEIrKCUlKFE6PTBCYFVlZF9VXVtqeJmBanGQc1tdhbWGkJ6jq62rZ4C8ybqmx5moq6T/2wBDARweHigjKE4rK06kbl1upKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKT/wAARCAACAAEDASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAX/xAAZEAEAAgMAAAAAAAAAAAAAAAAAAQISUpH/xAAUAQEAAAAAAAAAAAAAAAAAAAAE/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8Aj5W2noBhb//Z";

/* ------------------------------------------------------- compression */

function pitBuffer(file) {
  if (file.arrayBuffer) return file.arrayBuffer();
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = function () { reject(new Error("The file did not read.")); };
    r.readAsArrayBuffer(file);
  });
}

/* Walks the JPEG markers to APP1, then the first IFD, and returns the
   orientation tag. Returns 1 for anything that is not a JPEG with an
   orientation tag, which covers PNG, screenshots, and anything already
   stripped of EXIF. */
function pitOrientation(buf) {
  const view = new DataView(buf);
  if (view.byteLength < 4) return 1;
  if (view.getUint16(0, false) !== 0xFFD8) return 1;

  let off = 2;
  while (off + 4 <= view.byteLength) {
    const marker = view.getUint16(off, false);
    if ((marker & 0xFF00) !== 0xFF00) return 1;
    if (marker === 0xFFDA || marker === 0xFFD9) return 1;

    const size = view.getUint16(off + 2, false);
    if (size < 2) return 1;

    /* APP1 starting with "Exif". 0x45786966 is those four bytes. */
    if (marker === 0xFFE1 && off + 10 <= view.byteLength
        && view.getUint32(off + 4, false) === 0x45786966) {
      const tiff = off + 10;
      if (tiff + 8 <= view.byteLength) {
        const little = view.getUint16(tiff, false) === 0x4949;
        const ifd0 = tiff + view.getUint32(tiff + 4, little);
        if (ifd0 + 2 <= view.byteLength) {
          const count = view.getUint16(ifd0, little);
          for (let i = 0; i < count; i++) {
            const entry = ifd0 + 2 + i * 12;
            if (entry + 12 > view.byteLength) break;
            if (view.getUint16(entry, little) === 0x0112) {
              const v = view.getUint16(entry + 8, little);
              return v >= 1 && v <= 8 ? v : 1;
            }
          }
        }
      }
    }

    off += 2 + size;
  }
  return 1;
}

let pitProbeRun = null;

function pitAutoOrients() {
  if (pitProbeRun) return pitProbeRun;
  pitProbeRun = new Promise(function (resolve) {
    const img = new Image();
    img.onload = function () {
      resolve(img.naturalWidth === 2 && img.naturalHeight === 1);
    };
    img.onerror = function () { resolve(false); };
    img.src = PIT_PROBE;
  });
  return pitProbeRun;
}

function pitLoadImage(url) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error("That file did not open as a photo.")); };
    img.src = url;
  });
}

function pitCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  return c;
}

/* Applies the EXIF transform to the canvas before the draw. `cw` and `ch` are
   the finished canvas size, already swapped for the quarter turns. Verified
   corner by corner against the EXIF definitions for all eight values. */
function pitOrient(g, ori, cw, ch) {
  if (ori === 2) { g.translate(cw, 0); g.scale(-1, 1); }
  else if (ori === 3) { g.translate(cw, ch); g.rotate(Math.PI); }
  else if (ori === 4) { g.translate(0, ch); g.scale(1, -1); }
  else if (ori === 5) { g.scale(1, -1); g.rotate(-Math.PI / 2); }
  else if (ori === 6) { g.translate(cw, 0); g.rotate(Math.PI / 2); }
  else if (ori === 7) { g.translate(cw, ch); g.scale(1, -1); g.rotate(Math.PI / 2); }
  else if (ori === 8) { g.translate(0, ch); g.rotate(-Math.PI / 2); }
}

/* Halve until within one step of the target. A single 12 times downscale in one
   drawImage aliases badly on every browser, and a Dress-Up Day group shot is
   exactly the picture where that shows. */
function pitHalve(src, sw, sh, tw, th) {
  let cur = src;
  let cw = sw;
  let ch = sh;
  while (cw >= tw * 2 && ch >= th * 2 && cw > 1 && ch > 1) {
    const nw = Math.max(1, Math.floor(cw / 2));
    const nh = Math.max(1, Math.floor(ch / 2));
    const c = pitCanvas(nw, nh);
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = "high";
    g.drawImage(cur, 0, 0, nw, nh);
    cur = c;
    cw = nw;
    ch = nh;
  }
  return { src: cur, w: cw, h: ch };
}

/* Returns a data URL under the cap, plus the numbers to show the person who
   just took the photo. Throws with a sentence that can go straight on screen.

   `opts` is how T3.1 borrows this whole path instead of writing a second one.
   It changes the dials and nothing else: the EXIF probe, the orientation
   transform, the halving, and the quality ladder are the same code for a
   ballroom snapshot and for a headshot. Defaults are The Pit's, so calling this
   with one argument behaves exactly as it did before.
     edges     long edge rungs to try, largest first
     qualities JPEG quality rungs to try at each edge
     maxB64    cap measured on the base64 string, not the JPEG bytes
     square    centre crop to a square first, which is what the asset pipeline
               does to every headshot in assets/attendees */
async function pitCompress(file, opts) {
  const o = opts || {};
  const edges = o.edges || PIT_EDGES;
  const qualities = o.qualities || PIT_QUALITIES;
  const maxB64 = o.maxB64 || PIT_MAX_B64;

  if (!file) throw new Error("Nothing came back from that.");
  if (file.type && file.type.indexOf("image/") !== 0) {
    throw new Error("That is not a photo.");
  }
  if (file.size > PIT_MAX_SOURCE) {
    throw new Error("That file is too big for this. Try another one.");
  }

  let ori = 1;
  try {
    ori = pitOrientation(await pitBuffer(file));
  } catch (e) {
    ori = 1;
  }
  /* The browser already turned it, so leave it alone. */
  if (await pitAutoOrients()) ori = 1;

  const url = URL.createObjectURL(file);
  let img;
  try {
    img = await pitLoadImage(url);
  } catch (err) {
    URL.revokeObjectURL(url);
    throw err;
  }

  let sw = img.naturalWidth || img.width;
  let sh = img.naturalHeight || img.height;
  if (!sw || !sh) {
    URL.revokeObjectURL(url);
    throw new Error("That photo came through with no size to it.");
  }

  /* The centre square, taken at full resolution before anything is scaled. It
     is done here rather than after the orientation transform because the centre
     of a picture is still the centre under all eight EXIF values, so the crop
     and the rotation do not have to know about each other. */
  let source = img;
  if (o.square && sw !== sh) {
    const m = Math.min(sw, sh);
    const crop = pitCanvas(m, m);
    const cg = crop.getContext("2d");
    cg.drawImage(img, Math.round((sw - m) / 2), Math.round((sh - m) / 2), m, m, 0, 0, m, m);
    source = crop;
    sw = m;
    sh = m;
  }

  let out = null;

  for (let ei = 0; ei < edges.length && !out; ei++) {
    const k = Math.min(1, edges[ei] / Math.max(sw, sh));
    const dw = Math.max(1, Math.round(sw * k));
    const dh = Math.max(1, Math.round(sh * k));
    const swap = ori >= 5;
    const cw = swap ? dh : dw;
    const ch = swap ? dw : dh;

    const step = pitHalve(source, sw, sh, dw, dh);
    const canvas = pitCanvas(cw, ch);
    const g = canvas.getContext("2d");
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = "high";
    pitOrient(g, ori, cw, ch);
    g.drawImage(step.src, 0, 0, step.w, step.h, 0, 0, dw, dh);

    const lastEdge = ei === edges.length - 1;
    for (let qi = 0; qi < qualities.length; qi++) {
      const data = canvas.toDataURL("image/jpeg", qualities[qi]);
      const lastQ = qi === qualities.length - 1;
      if (data.length <= maxB64 || (lastEdge && lastQ)) {
        out = { data: data, w: cw, h: ch };
        break;
      }
    }
  }

  URL.revokeObjectURL(url);

  return {
    data: out.data,
    w: out.w,
    h: out.h,
    inBytes: file.size,
    outBytes: out.data.length
  };
}

/* ------------------------------------------------------------ helpers */

function pitBytes(n) {
  if (!n && n !== 0) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

/* `now` is the server corrected clock. `ts` is Firebase's own server
   timestamp, so this comparison holds even on a phone with a wrong clock. */
function pitWhen(ts, now) {
  if (!ts) return "just now";
  const diff = now - ts;
  if (diff < 60000) return "just now";
  if (diff < 3600000) return Math.floor(diff / 60000) + " min ago";
  if (diff < 6 * 3600000) return Math.floor(diff / 3600000) + " hr ago";
  const at = etParts(ts);
  return (at.hhmm + " " + at.ap).trim();
}

function pitWho(p) {
  const parts = [];
  const name = String(p.name || "").trim();
  const club = String(p.club || "").trim();
  if (name) parts.push(name);
  if (club) parts.push(club);
  return parts.join(" · ");
}

function pitTrim(s, max) {
  return String(s || "").trim().slice(0, max);
}

/* ---------------------------------------------------------- firebase */

function usePitPhotos(limit) {
  const [state, setState] = useState({ ready: !FB.ok, items: [] });

  useEffect(() => {
    if (!FB.ok) return;
    /* orderByKey, not orderByChild("ts"). Push keys already sort
       chronologically and ordering by key needs no index, so the server sends
       one page. Ordering by a child with no .indexOn would ship the whole node
       to the phone and sort it here, which is the opposite of the point. The
       database rules are fixed by CLAUDE.md and carry no index. */
    const q = FB.db.ref("photos").orderByKey().limitToLast(limit);
    const handler = (snap) => {
      const all = snap.val() || {};
      const items = Object.keys(all)
        .map((id) => Object.assign({ id: id }, all[id]))
        .filter((p) => p && p.data)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0) || (a.id < b.id ? 1 : -1));
      setState({ ready: true, items: items });
    };
    q.on("value", handler);
    return () => q.off("value", handler);
  }, [limit]);

  return state;
}

function pitPost(fields) {
  return FB.db.ref("photos").push({
    data: fields.data,
    caption: fields.caption,
    name: fields.name,
    club: fields.club,
    likes: 0,
    ts: firebase.database.ServerValue.TIMESTAMP
  });
}

/* ------------------------------------------------------ comments, T2.5b
 *
 * Comments live at photoComments/{photoId}/{id}, NOT inside the photo record, and
 * that is the whole design decision. Every photo carries its own image as base64,
 * roughly 80KB, and the grid pulls 24 at a time. Nesting comments would drag every
 * comment on every photo into a payload that never renders one. The lightbox reads a
 * single photo's comments when it opens, and nothing else ever reads them.
 *
 * The COUNT is denormalised onto the photo as `comments`, a plain number, exactly
 * the way `likes` already works, so the grid can say "3 comments" without loading
 * any. Both are transactions, because two people posting in the same second must both
 * count, and both clamp at zero so a stale device cannot drive the number negative.
 *
 * The name is remembered in the same place Liner Notes keeps it, mm26_liner_who, so
 * somebody who has already posted a takeaway never types their name twice. A blank
 * name still posts and simply reads as unattributed.
 */
const PIT_COMMENT_MAX = 300;

function usePhotoComments(photoId, enabled) {
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!FB.ok || !enabled || !photoId) {
      setItems([]);
      setReady(!FB.ok);
      return;
    }
    const ref = FB.db.ref("photoComments/" + photoId);
    const handler = (snap) => {
      const all = snap.val() || {};
      setItems(Object.keys(all)
        .map((id) => Object.assign({ id: id }, all[id]))
        .sort((a, b) => (a.ts || 0) - (b.ts || 0)));
      setReady(true);
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, [photoId, enabled]);

  return { items, ready };
}

function pitComment(photoId, text, name) {
  if (!FB.ok || !photoId) return Promise.resolve();
  const clean = String(text || "").replace(/\s+/g, " ").trim().slice(0, PIT_COMMENT_MAX);
  if (!clean) return Promise.resolve();
  return FB.db.ref("photoComments/" + photoId).push({
    text: clean,
    name: String(name || "").trim().slice(0, LN_NAME_MAX),
    ts: firebase.database.ServerValue.TIMESTAMP
  }).then(() => pitCommentCount(photoId, 1));
}

function pitCommentRemove(photoId, id) {
  if (!FB.ok) return Promise.resolve();
  return FB.db.ref("photoComments/" + photoId + "/" + id).remove()
    .then(() => pitCommentCount(photoId, -1));
}

function pitCommentCount(photoId, delta) {
  return FB.db.ref("photos/" + photoId + "/comments").transaction((cur) => {
    const n = typeof cur === "number" ? cur : 0;
    return Math.max(0, n + delta);
  });
}

/* A transaction, because two people liking the same photo in the same second
   must both count. Clamped at zero so a stale device cannot drive it negative. */
function pitLike(id, on) {
  if (!FB.ok) return;
  FB.db.ref("photos/" + id + "/likes").transaction((cur) => {
    const n = typeof cur === "number" ? cur : 0;
    return on ? n + 1 : Math.max(0, n - 1);
  });
}

/* Base64 back to bytes, then a blob URL. A data URL straight on an anchor is
   refused or silently ignored by some mobile browsers. */
function pitDownload(p) {
  const parts = String(p.data || "").split(",");
  if (parts.length < 2) return;
  let bin;
  try {
    bin = window.atob(parts[1]);
  } catch (e) {
    return;
  }
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "pit-" + String(p.id).replace(/^-+/, "") + ".jpg";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* -------------------------------------------------------- components */

/* One button, one input. The input covers the label at zero opacity, so the tap
   lands on the input itself. That is the one pattern that opens the picker on
   every phone in the room. Take Photo passes capture, Choose from Library does
   not, and both ship. */
function PitPicker({ label, glyph, capture, onFile, disabled }) {
  return (
    <label className={"btn pit-pick" + (disabled ? " is-off" : "")}>
      <span aria-hidden="true">{glyph}</span>
      <span>{label}</span>
      <input
        className="pit-pick__in"
        type="file"
        accept="image/*"

function PitUpload({ onPosted }) {
  /* The name and club stick, so the second photo of the day takes two taps. */
  const [name, setName] = useState(() => String(readJSON(LS.pitWho).name || ""));
  const [club, setClub] = useState(() => String(readJSON(LS.pitWho).club || ""));
  const [caption, setCaption] = useState("");
  const [staged, setStaged] = useState(null);
  const [working, setWorking] = useState(false);
  const [posting, setPosting] = useState(false);
  const [msg, setMsg] = useState("");
  const [bad, setBad] = useState("");

  const pick = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    /* Clear it, so picking the same photo twice still fires a change. */
    e.target.value = "";
    if (!file) return;
    setMsg("");
    setBad("");
    setStaged(null);
    setWorking(true);
    pitCompress(file)
      .then((shot) => { setStaged(shot); setWorking(false); })
      .catch((err) => {
        setBad((err && err.message) || "That photo did not go through.");
        setWorking(false);
      });
  }, []);

  const post = useCallback(() => {
    if (!staged || !FB.ok) return;
    setPosting(true);
    setBad("");
    const fields = {
      data: staged.data,
      caption: pitTrim(caption, 140),
      name: pitTrim(name, 40),
      club: pitTrim(club, 40)
    };
    pitPost(fields)
      .then(() => {
        writeJSON(LS.pitWho, { name: fields.name, club: fields.club });
        setStaged(null);
        setCaption("");
        setPosting(false);
        setMsg("Up on the wall.");
        if (onPosted) onPosted();
      })
      .catch(() => {
        setPosting(false);
        setBad("That did not post. Try it again.");
      });
  }, [staged, caption, name, club, onPosted]);

  return (
    <section className="pit-panel glow-card grille" aria-labelledby="pit-add">
      <h3 className="pit-panel__h t-display" id="pit-add">Get it on the wall</h3>

      <label className="tf__l">
        <span>Your name, optional</span>
        <input
          className="tf__in"
          value={name}
          maxLength={40}
          onChange={(e) => setName(e.target.value)}
        />
      </label>

      <label className="tf__l">
        <span>Club or team, optional</span>
        <input
          className="tf__in"
          value={club}
          maxLength={40}
          onChange={(e) => setClub(e.target.value)}
        />
      </label>

      <label className="tf__l">
        <span>Caption, optional</span>
        <input
          className="tf__in"
          value={caption}
          maxLength={140}
          placeholder="Who is that supposed to be"
          onChange={(e) => setCaption(e.target.value)}
        />
      </label>

      {!FB.ok ? (
        <p className="pit-msg pit-msg--bad">
          Live updates are off, so nothing can post right now.
        </p>
      ) : null}

      {working ? (
        <p className="pit-msg">Squeezing it down.</p>
      ) : null}

      {!working && !staged ? (
        <div className="tf__row">
          <PitPicker
            label="Take Photo"
            glyph={"\u{1F4F7}"}
            capture
            onFile={pick}
            disabled={!FB.ok}
          />
          <PitPicker
            label="Choose from Library"
            glyph={"\u{1F5BC}"}
            onFile={pick}
            disabled={!FB.ok}
          />
        </div>
      ) : null}

      {staged ? (
        <div className="pit-stage">
          <img className="pit-stage__img" src={staged.data} alt="The photo you just picked" />
          <p className="pit-stage__meta t-data">
            {pitBytes(staged.inBytes)} in. {pitBytes(staged.outBytes)} out.{" "}
            {staged.w} by {staged.h}.
          </p>
          <div className="tf__row">
            <button className="btn btn--go" onClick={post} disabled={posting || !FB.ok}>
              {posting ? "Posting" : "Post it"}
            </button>
            <button
              className="btn btn--quiet"
              onClick={() => { setStaged(null); setBad(""); }}
              disabled={posting}
            >
              Start over
            </button>
          </div>
        </div>
      ) : null}

      {bad ? <p className="pit-msg pit-msg--bad">{bad}</p> : null}
      {msg ? <p className="pit-msg">{msg}</p> : null}

      <p className="pit-hint">
        Take Photo opens the camera. Choose from Library picks one you already
        have. Photos get shrunk on your phone before they go up, so this works on

      </p>
    </section>
  );
}

/* Comments on one photo. Only mounted inside the open lightbox, which is what keeps

function PitTab({ isAdmin, now }) {
  const [limit, setLimit] = useState(PIT_PAGE);
  const { ready, items } = usePitPhotos(limit);
  const [liked, setLiked] = useState(() => readJSON(LS.liked));
  const [filter, setFilter] = useState("");
  const [openId, setOpenId] = useState(null);
  const backTo = useRef(null);

  /* One like per photo per device, held in mm26_liked. Storage is read rather
     than trusted from state, so a second tab on the same phone cannot double
     count through a stale copy. */
  const onLike = useCallback((id) => {
    const held = readJSON(LS.liked);
    const on = !held[id];
    if (on) held[id] = 1; else delete held[id];
    writeJSON(LS.liked, held);
    setLiked(held);
    pitLike(id, on);
  }, []);

  const close = useCallback(() => {
    setOpenId(null);
    const el = backTo.current;
    if (el && el.focus && document.body.contains(el)) {
      el.focus({ preventScroll: true });
    }
  }, []);

  const remove = useCallback((p) => {
    if (!FB.ok) return;
    if (!window.confirm("Delete this photo? It does not come back.")) return;
    FB.db.ref("photos/" + p.id).remove();
    /* Comments live in their own node, so removing the photo does not take them
       with it. Without this, deleting a photo would leave its comments behind
       forever, invisible and unreachable. */
    FB.db.ref("photoComments/" + p.id).remove();
    close();
  }, [close]);

  /* Filter values are whatever people actually typed in. Nothing is invented
     and no club list is hard coded. */
  const clubs = [];
  items.forEach((p) => {
    const c = String(p.club || "").trim();
    if (c && clubs.indexOf(c) === -1) clubs.push(c);
  });
  clubs.sort((a, b) => a.localeCompare(b));

  const active = filter && clubs.indexOf(filter) >= 0 ? filter : "";
  const shown = active
    ? items.filter((p) => String(p.club || "").trim() === active)
    : items;

  const open = openId ? shown.filter((p) => p.id === openId)[0] || null : null;

  return (
    <TabFrame tabKey="pit">
      <PitUpload onPosted={() => { setFilter(""); }} />

      {!ready ? <Empty>Pulling the photos.</Empty> : null}

      {ready && !items.length ? (
        <Empty>No photos yet. Somebody go find the drummer.</Empty>
      ) : null}

      {clubs.length > 1 ? (
        <div className="dayrow" role="tablist" aria-label="Filter by club or team">
          <button
            role="tab"
            className="daypill"
            aria-selected={!active}
            onClick={() => setFilter("")}
          >
            <span className="daypill__n">All</span>
          </button>
          {clubs.map((c) => (
            <button
              key={c}
              role="tab"
              className="daypill"
              aria-selected={active === c}
              onClick={() => setFilter(c)}
            >
              <span className="daypill__n">{c}</span>
            </button>
          ))}
        </div>
      ) : null}

      {ready && items.length ? (
        <p className="pit-note">
          {shown.length === 1 ? "One photo." : shown.length + " photos."}{" "}
          {active ? "Filtered to " + active + "." : "Newest first."}
        </p>
      ) : null}

      {ready && items.length && !shown.length ? (
        <Empty>Nothing filed under that yet.</Empty>
      ) : null}

      {shown.length ? (
        <ul className="pit-grid">
          {shown.map((p) => (
            <PitCell
              key={p.id}
              p={p}
              now={now}
              mine={!!liked[p.id]}
              onLike={onLike}
              onOpen={(id, el) => { backTo.current = el; setOpenId(id); }}
            />
          ))}
        </ul>
      ) : null}

      {items.length >= limit ? (
        <div className="pit-more">
          <button className="btn" onClick={() => setLimit(limit + PIT_PAGE)}>
            Load {PIT_PAGE} older
          </button>
        </div>
      ) : null}

      {open ? (
        <PitBox
          p={open}
          now={now}
          mine={!!liked[open.id]}
          onLike={onLike}
          onClose={close}
          isAdmin={isAdmin}
          onDelete={remove}
        />
      ) : null}

      {/* The T2.5 build note was removed on Jim's instruction, Aug 13. It described
          the two upload paths, the on-phone compression ladder, the EXIF probe, the
          like transaction and the 24 photo page size. All of that is still true and
          still documented in ROADMAP T2.5, which is where it belongs. It was crew
          only, so no attendee ever saw it. */}
    </TabFrame>
  );
}

/* ==========================================================================
   T2.6 THE CARES CUP. Spec 3.9.
   The Shank Showdown II leaderboard, benefiting Century Golf Cares. The
   fundraising total is the top of the tab because it is the actual point of the
   tournament, and the leaderboard is the joke that gets people to look at it.

   Score entry is crew only. Players do not enter their own scores, which is
   both what the spec says and the only way a leaderboard survives a golf
   tournament. Every write on this tab is behind isAdmin.

   Scores are to par and lower is better. Ties share a position and print as
   T2. Teams with nothing posted are not ranked last, they sit under "Not in
   yet", because a blank card is not a bad round.
   ========================================================================== */

/* Both names are already public in the flier's poster art, so they are safe to
   seed. No player names. Pairings arrive from the organizers at T3.5 and get
   typed into the crew block, not into this file. */
const CARES_SEED = ["Team Total Consciousness", "Spalding's Revenge Team"];

/* Server stamp, not a device clock. Nothing is gated on it, but Awards sort on
   the equivalent field and a phone an hour out would reorder the show. */
function wallStamp() {
  try {
    return firebase.database.ServerValue.TIMESTAMP;
  } catch (e) {
    return Date.now();
  }
}

/* One place for the two single value writes, so a failed Firebase boot cannot
   turn a tap on Lock the board into an exception in a full ballroom. */
function caresWrite(field, value) {
  if (!FB.ok) return;
  FB.db.ref("caresCup/" + field).set(value);
}

/* "E", "-3", "+2", "" all valid. Anything else is rejected out loud rather
   than quietly stored as NaN. */
function caresParseScore(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return { ok: true, value: null };
  if (/^e$/i.test(s)) return { ok: true, value: 0 };
  if (!/^[+-]?\d{1,3}$/.test(s)) return { ok: false, value: null };
  return { ok: true, value: parseInt(s, 10) };
}

function caresFmtScore(n) {
  if (typeof n !== "number") return "--";
  if (n === 0) return "E";
  return n > 0 ? "+" + n : String(n);
}

/* Thru is 1 to 18 or F. Blank and 0 both mean not started. */
function caresParseThru(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return { ok: true, value: 0 };
  if (/^f$/i.test(s)) return { ok: true, value: 18 };
  if (!/^\d{1,2}$/.test(s)) return { ok: false, value: 0 };
  const n = parseInt(s, 10);
  if (n < 0 || n > 18) return { ok: false, value: 0 };
  return { ok: true, value: n };
}

function caresFmtThru(n) {
  if (typeof n !== "number" || n <= 0) return "--";
  return n >= 18 ? "F" : String(n);
}

function caresThruField(n) {
  if (typeof n !== "number" || n <= 0) return "";
  return n >= 18 ? "F" : String(n);
}

function caresFmtMoney(n) {
  if (typeof n !== "number" || !isFinite(n)) return null;
  try {
    return "$" + Math.round(n).toLocaleString("en-US");
  } catch (e) {
    return "$" + Math.round(n);
  }
}

function caresParseMoney(raw) {
  const s = String(raw == null ? "" : raw).replace(/[$,\s]/g, "").trim();
  if (!s) return { ok: true, value: null };
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return { ok: false, value: null };
  return { ok: true, value: Math.round(parseFloat(s)) };
}

/* Standard golf ranking. Equal scores share a position and the next team skips
   to its true count: 1, 2, 2, 4. Inside a tie the order is alphabetical, so it
   is stable and it is nobody's thumb on the scale. Unscored teams come back
   separately rather than being sorted to the bottom of the ranking. */
function caresRank(teams) {
  const scored = teams.filter((t) => typeof t.score === "number");
  const waiting = teams.filter((t) => typeof t.score !== "number");

  scored.sort((a, b) => {
    if (a.score !== b.score) return a.score - b.score;
    return String(a.name || "").localeCompare(String(b.name || ""));
  });

  const ranked = [];
  let pos = 0;
  let prev = null;
  scored.forEach((t, i) => {
    if (prev === null || t.score !== prev) pos = i + 1;
    prev = t.score;
    ranked.push(Object.assign({}, t, { pos: pos }));
  });

  ranked.forEach((t) => {
    t.tied = ranked.filter((o) => o.pos === t.pos).length > 1;
  });

  waiting.sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));

  return { ranked: ranked, waiting: waiting };
}

/* One listener for the whole tab. Teams, total, lock and the art switch are a
   few hundred bytes together, so a listener per branch would cost more than it
   saves. */
function useCaresCup() {
  const [state, setState] = useState({
    ready: !FB.ok, teams: [], total: null, goal: null,
    updated: null, locked: false, art: false
  });

  useEffect(() => {
    if (!FB.ok) return;
    const ref = FB.db.ref("caresCup");
    const handler = (snap) => {
      const v = snap.val() || {};
      const t = v.teams || {};
      const f = v.fundraising || {};
      setState({
        ready: true,
        teams: Object.keys(t).map((id) => Object.assign({ id: id }, t[id])),
        total: typeof f.total === "number" ? f.total : null,
        goal: typeof f.goal === "number" && f.goal > 0 ? f.goal : null,
        updated: typeof f.ts === "number" ? f.ts : null,
        locked: v.locked === true,
        art: v.art === true
      });
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  return state;
}

function CaresFund({ total, goal, updated }) {
  const money = caresFmtMoney(total);
  const pct = money !== null && goal ? Math.min(100, Math.round((total / goal) * 100)) : null;
  const at = updated ? etParts(updated) : null;

  return (
    <div className="cares-fund glow-card grille">
      <span className="cares-fund__k">Century Golf Cares</span>
      {money !== null ? (
        <p className="cares-fund__n t-display t-data">{money}</p>
      ) : (
        <p className="cares-fund__sub" style={{ margin: 0 }}>
          The total posts when the money is counted.
        </p>
      )}
      {pct !== null ? (
        <div>
          <div className="cares-fund__bar">
            <div className="cares-fund__fill" style={{ width: pct + "%" }}></div>
          </div>
          <p className="cares-fund__sub">
            {pct} percent of {caresFmtMoney(goal)}. Raised by people who cannot putt.
          </p>
        </div>
      ) : money !== null ? (
        <p className="cares-fund__sub">Raised by people who cannot putt.</p>
      ) : null}
      {at ? (
        <p className="cares-fund__fine">Updated {at.hhmm} {at.ap} Eastern.</p>
      ) : null}
    </div>
  );
}

/* One team, one card. The ticket stub carries the position, which is what a
   stub is for. Poster art is a background layer under a scrim and it is off
   until crew switches it on. */
function CaresRow({ t, artOn, isAdmin, locked, onEdit, onDelete, onScore }) {
  const medal = t.pos === 1 ? " cares-row--m1"
    : t.pos === 2 ? " cares-row--m2"
    : t.pos === 3 ? " cares-row--m3" : "";
  const waiting = typeof t.score !== "number";
  const artFile = artOn && t.art ? String(t.art).replace(/["'\\]/g, "") : "";

  return (
    <article className={"cares-row" + medal + (waiting ? " cares-row--waiting" : "")}>
      <div className="ticket">
        {artFile ? (
          <div
            className="cares-art"
            aria-hidden="true"
            style={{ "--cares-art": 'url("assets/cares/' + artFile + '")' }}
          ></div>
        ) : null}

/* Two boxes and a button, on the card, in the order somebody reads a score off
   a card: number then holes. This is the control that gets used standing on a
   cart path, so it is not behind a disclosure and not in a modal. */
function CaresScoreEntry({ team, onSet }) {
  const [score, setScore] = useState(() => (typeof team.score === "number" ? caresFmtScore(team.score) : ""));
  const [thru, setThru] = useState(() => caresThruField(team.thru));
  const [err, setErr] = useState("");

  function submit(e) {
    e.preventDefault();
    const s = caresParseScore(score);
    if (!s.ok) { setErr("Score reads E, -3 or +2."); return; }
    const th = caresParseThru(thru);
    if (!th.ok) { setErr("Thru is 1 to 18, or F."); return; }
    setErr("");
    onSet(team, s.value, th.value);
  }

  return (
    <form className="cares-entry" onSubmit={submit}>
      <label className="tf__l">
        <span>Score</span>
        <input
          className="tf__in t-data"
          value={score}
          placeholder="E"
          inputMode="text"
          autoComplete="off"
          onChange={(e) => { setScore(e.target.value); setErr(""); }}
        />
      </label>
      <label className="tf__l">
        <span>Thru</span>
        <input
          className="tf__in t-data"
          value={thru}
          placeholder="F"
          inputMode="text"
          autoComplete="off"
          onChange={(e) => { setThru(e.target.value); setErr(""); }}
        />
      </label>
      <button type="submit" className="btn btn--go">Post</button>
      {err ? <p className="cares-err" style={{ flex: "1 1 100%" }}>{err}</p> : null}
    </form>
  );
}
